],"hook":"100 kg 넘는 짐엔 「반장」이 붙는다. 반장은 그 자리에서 「순서·연장·출입·로프」를 챙기는 사람이지, 미리 교육하는 선생이 아니다.","why":"","mix":""},{"name":"정격하중·하중 용어","facts":["정격하중 = 최대하중(권상하중) − 달기구 중량","권상하중: 들어 올릴 수 있는 최대 하중, 달기구 포함","적재하중: 승강기·리프트에 실을 수 있는 최대 하중","임계하중: 좌굴이 일어나는 하중"],"hook":"훅과 로프도 무게가 있으니 그만큼은 짐을 못 싣는다. 그 몫을 뺀 「진짜 실을 수 있는 무게」가 정격하중이다.","why":"","mix":""},{"name":"중량물 운반의 자세","facts":["허리를 펴고 무릎을 굽혀 다리 힘으로 든다","물건은 몸에 가까이 붙인다","긴 물건은 앞쪽을 높게","운반 중량은 남자 체중의 40%, 여자 24% 이하"],"hook":"「허리 펴고, 붙이고, 앞은 높게」다. 앞이 낮으면 앞사람 발을 찌른다. 남자는 몸무게의 40%, 여자는 24%까지만.","why":"","mix":"60%는 틀린 값이다."},{"name":"취급·운반의 5원칙","facts":["직선운반","연속운반","운반작업의 집중화","생산을 최고로 하는 운반","시간과 경비를 최대한 절약"],"hook":"「곧게·끊이지 않게·모아서·많이·싸게」 다섯이다. 「곡선운반」만 이 흐름을 거스른다.","why":"","mix":""},{"name":"하역장 통로·선창·승강설비","facts":["부두·안벽 선을 따라 통로 폭 90 cm 이상","선창 깊이가 갑판에서 1.5 m 초과 시 통행설비","화물자동차 짐 윗면까지 2 m 이상이면 승강설비","이삿짐운반용 리프트는 적재하중 0.1톤 이상"],"hook":"부두 통로 「구십(90)」은 짐 든 사람 하나가 지나는 폭이다. 「가설계단 폭 1 m, 계단참 1.2 m」와 나란히 놓고 외운다. 선창 1.5 m는 뛰어내리기엔 이미 깊다.","why":"","mix":"통로 폭 50 cm는 틀린 값이다."}],"n":17,"rounds":7},{"id":"6-13","subject":"건설안전기술","chapter":"가시설물","big":"계단·통로","title":"가설통로와 계단","topic3d":"ramp","items":[{"name":"가설통로의 구조","facts":["견고한 구조","경사 30° 이하(계단이나 높이 2 m 미만에 튼튼한 손잡이가 있으면 예외)","경사 15° 초과 시 미끄러지지 않는 구조","추락 위험 장소에 안전난간"],"hook":"「삼십(30) 오르고 십오(15) 미끄럼」이다. 30°까지는 경사로로 올라가되, 15°만 넘어도 발이 미끄러지니 미끄럼막이를 붙인다.","why":"","mix":"미끄럼막이 기준은 10°나 12°가 아니라 15° 초과다."},{"name":"가설통로의 계단참","facts":["수직갱 통로 길이 15 m 이상이면 10 m 이내마다 계단참","비계다리 높이 8 m 이상이면 7 m 이내마다 계단참"],"hook":"「수직갱 15/10, 비계다리 8/7」이다. 앞 숫자가 「이 길이를 넘으면」, 뒤 숫자가 「이만큼마다」. 뒤가 앞보다 조금 작은 모양이 같다.","why":"","mix":"비계다리 5 m마다, 수직갱 7 m마다는 틀린 값이다."},{"name":"계단의 강도·폭·계단참","facts":["강도: 매 ㎡당 500 kg 이상, 안전율 4 이상","계단 폭 1 m 이상","높이 3 m 초과 시 3 m 이내마다 너비 1.2 m 이상 계단참","높이 1 m 이상 개방된 쪽에 난간","계단 위 2 m 이내에 장애물 없을 것"],"hook":"「오백·사·일·삼-일점이·이」 다섯 숫자다. 500 kg/㎡는 어른 예닐곱이 1 ㎡에 서는 무게, 계단참(1.2 m)은 쉬어 가는 자리라 폭(1 m)보다 조금 넓다.","why":"","mix":""},{"name":"굴착작업의 승강설비","facts":["굴착깊이 1.5 m 이상이면 사다리·계단 등 승강설비","흙막이 지보공 설치도 깊이 1.5 m 이상"],"hook":"1.5 m는 어른 키보다 살짝 낮은 깊이다. 그 아래는 뛰어 오르내리다 다친다. 흙막이 지보공 기준과 같은 1.5로 짝짓는다.","why":"","mix":""},{"name":"작업장 출입구","facts":["하역운반기계용 출입구에는 보행자용 출입구를 따로 설치","보행자용에는 비상등·경보장치"],"hook":"지게차가 드나드는 문과 사람 문은 따로 낸다. 「따로 설치하지 않는다」는 오답이다.","why":"","mix":""}],"n":16,"rounds":13},{"id":"6-14","subject":"건설안전기술","chapter":"가시설물","big":"거푸집·동바리","title":"거푸집 측압과 동바리","topic3d":"shore","items":[{"name":"거푸집 측압이 커지는 조건","facts":["슬럼프가 클수록(묽을수록)","타설속도가 빠를수록, 타설높이가 높을수록","콘크리트 온도가 낮을수록(늦게 굳는다)","단위중량이 클수록, 다짐이 충분할수록, 철근량이 적을수록","거푸집 투수성이 낮을수록"],"hook":"굳기 전 콘크리트가 「물처럼 굴수록」 측압이 크다. 묽고·차갑고·빨리·높이 부으면 벽을 미는 힘이 커진다. 따뜻하면 빨리 굳어 얌전해진다.","why":"굳지 않은 채 오래 있을수록 액체처럼 옆을 민다.","mix":"「온도가 높을수록 크다」, 「슬럼프가 클수록 작다」는 방향을 뒤집은 오답이다."},{"name":"파이프서포트 동바리 조립","facts":["3개 이상 이어 쓰기 금지","이을 때 볼트·전용철물 4개 이상","높이 3.5 m 초과 시 2 m 이내마다 수평연결재 2방향","깔판·받침목 2단 이상 끼우기 금지","맞댄이음·장부이음은 피한다"],"hook":"「3개 금지, 4개 조임」이 한 짝이다. 3.5 m 넘으면 2 m마다 허리띠(수평연결재)를 두 방향으로 두른다.","why":"이을수록 좌굴에 약해진다.","mix":""},{"name":"콘크리트 타설 안전·점검","facts":["진동기는 적절히, 「최대한 많이」는 오답","타설 전 거푸집동바리의 변형·변위·지반 침하 점검","겨울철 거푸집 터짐은 타설속도가 빨라서","구조검토는 하중·외력의 종류와 크기 산정이 먼저"],"hook":"안전 문제에서 「최대한 많이·최대한 빨리」는 거의 늘 오답이다. 점검 세 낱말은 「변형·변위·침하」, 모양이 바뀌었나·자리가 옮겨졌나·바닥이 내려앉았나.","why":"","mix":""},{"name":"슬라이딩폼·거푸집 종류","facts":["슬라이딩폼: 유압잭으로 연속 이동하며 타설, 사일로·굴뚝·교각","갱폼: 외벽 거푸집과 발판을 하나로, 고층 아파트 외벽","터널폼: 벽과 슬래브를 한꺼번에","콘크리트 강도는 물–시멘트비가 좌우, 거푸집 모양은 무관"],"hook":"슬라이딩폼은 거푸집이 「미끄러지듯」 올라가며 쉬지 않고 붓는다. 이음매 없이 매끈해야 하는 사일로·굴뚝 전용이다.","why":"","mix":""},{"name":"좌굴하중","facts":["좌굴하중 = nπ²EI / l², 양단 힌지는 n = 1","cm⁴를 mm⁴로 바꿀 때 10⁴를 곱한다"],"hook":"양단 힌지면 계수 1이라 공식 그대로다. 유일한 함정은 단위, 1 cm = 10 mm를 네 제곱하면 10⁴다.","why":"","mix":""}],"n":16,"rounds":13},{"id":"6-15","subject":"건설안전기술","chapter":"가시설물","big":"흙막이","title":"흙막이·터널 지보공 점검","topic3d":"","items":[{"name":"흙막이 지보공의 정기점검","facts":["부재의 손상·변형·부식·변위·탈락","버팀대의 긴압 정도","부재의 접속부·부착부·교차부 상태","침하의 정도","지표수 흐름·경보장치·굴착 깊이는 점검사항이 아니다"],"hook":"「손·긴·접·침」(손상, 긴압, 접속부, 침하)이다. 지보공이 「제자리에서 제 힘을 내고 있나」만 본다. 물길이나 경보장치는 남의 집 일이다.","why":"","mix":"경보장치는 터널 자동경보장치 쪽 점검이다."},{"name":"터널 지보공: 조립도와 점검","facts":["조립도: 재료의 재질·단면규격·설치간격·이음방법","수시 점검: 손상·변형·부식·변위·탈락, 긴압 정도, 접속부·교차부, 기둥침하","재질 확인·계측기 설치상태·재료 구입처는 점검사항이 아니다"],"hook":"조립도는 「짓기 전 도면」, 점검은 「짓고 나서 살피기」다. 긴압은 조여 봐야 아니 도면에 못 적고, 재질은 세우기 전에 정하니 점검 대상이 아니다.","why":"","mix":""},{"name":"터널 굴착 시공계획","facts":["굴착 방법","터널 지보공과 복공의 시공방법","환기 또는 조명시설 설치","계기 점검은 계획이 아니라 실행 단계"],"hook":"「파는 법·받치는 법·숨 쉬는 법」 셋뿐이다. 「점검」이라는 낱말이 나오면 계획이 아니라 실행이다.","why":"","mix":""},{"name":"흙막이 공법의 분류","facts":["지지방식: 자립식·수평 버팀대식·어스앵커식·타이로드식","구조방식: H-Pile·강널말뚝·지하연속벽·슬러리월·톱다운"],"hook":"지지방식은 「벽을 무엇으로 버티나」, 구조방식은 「벽을 어떻게 만드나」다. 버팀대·앵커·타이로드는 버티는 쪽이다.","why":"","mix":""}],"n":16,"rounds":10},{"id":"6-16","subject":"건설안전기술","chapter":"건설공구·장비","big":"굴착기계","title":"굴착기계 고르기","topic3d":"","items":[{"name":"굴착기계의 종류와 용도","facts":["백호(드래그 셔블): 기계보다 낮은 곳, 수중굴착 가능","파워셔블: 기계보다 높은 곳","드래그라인: 낮고 넓은 곳, 연약지반·수중","클램셸: 좁고 깊은 수직 굴착, 우물통·잠함"],"hook":"백호(back hoe)는 괭이(hoe)를 「뒤로(back)」 긁어 발밑을 판다. 파워셔블은 삽을 앞으로 내밀어 위를 퍼내고, 클램셸은 조개(clam)처럼 물어 깊이 판다.","why":"","mix":"백호우가 「높은 곳」을 판다는 문장은 뒤집힌 오답이다."},{"name":"토공기계의 분류","facts":["굴착: 파워셔블·백호·드래그라인·클램셸","적재: 셔블로더·트랙터셔블","다짐: 로드롤러·탬핑롤러·진동롤러·타이어롤러","운반: 벨트컨베이어·덤프트럭","굴착과 싣기를 동시에: 모터 그레이더는 아니다"],"hook":"「파고·싣고·다지고·나른다」 네 갈래다. 그레이더는 땅을 「고르는」 기계라 파지도 싣지도 않는다.","why":"","mix":""},{"name":"굴착기계 작업안전·해체용 기구","facts":["주차 시 버킷은 지면에 내려놓는다","운전반경 내에 사람이 있으면 회전을 멈춘다","스크레이퍼는 해체용 기구가 아니라 깎아 나르는 건설기계"],"hook":"모든 중장비의 공통 원칙은 「세울 땐 팔을 땅에 내린다」다. 떠 있는 것은 언젠가 내려온다. 「사람 있어도 느리게 회전」은 오답이다.","why":"","mix":""},{"name":"가설구조물의 재해","facts":["추락·낙하·도괴 셋","굴착기계 재해는 가설구조물과 무관"],"hook":"가설구조물은 사람이 올라가 일하는 임시 구조물이라 「떨어지고·떨어뜨리고·무너진다」가 전부다.","why":"","mix":""}],"n":14,"rounds":10},{"id":"6-17","subject":"건설안전기술","chapter":"건설재해 대책","big":"낙하·비래·붕괴","title":"낙하물방지망 세 숫자","topic3d":"net","items":[{"name":"낙하물방지망·방호선반 설치","facts":["높이 10 m 이내마다 설치","내민 길이 벽면에서 2 m 이상","수평면과의 각도 20° 이상 30° 이하"],"hook":"「십·이·이십~삼십」이다. 10 m마다, 2 m 내밀고, 20~30°로 눕힌다. 너무 눕히면 물건이 튕겨 나가고 너무 세우면 못 받는 「골디락스 각도」다.","why":"각도를 줘야 떨어진 물건이 안쪽으로 굴러든다.","mix":"추락방호망은 「10 m·3 m·12%」라 내밀기 숫자가 다르다."},{"name":"낙하·비래 위험 방지 조치","facts":["낙하물방지망·방호선반 설치","출입금지구역 설정","보호구(안전모) 착용","작업지휘자 선정은 조치 항목이 아니다"],"hook":"「막고(방지망)·못 들어오게 하고(출입금지)·머리를 지킨다(안전모)」 셋이다. 위에서 공구에 맞았다면 낙하물 방지시설의 결함이다.","why":"","mix":""}],"n":10,"rounds":8},{"id":"6-18","subject":"건설안전기술","chapter":"","big":"","title":"현장 관리 잡동사니","topic3d":"confined","items":[{"name":"산소결핍과 적정공기","facts":["산소 18% 미만이면 산소결핍","적정공기: 산소 18% 이상 23.5% 미만, 탄산가스 1.5% 미만, 황화수소 10 ppm 미만, 일산화탄소 30 ppm 미만","보통 공기의 산소는 21%","16% 아래 호흡·맥박 증가, 10% 아래 의식 상실, 6% 아래 순간 쓰러짐"],"hook":"「십팔에서 이십삼점오, 일점오, 십, 삼십」 한 덩어리다. 산소는 위쪽 한계(23.5%)도 있는데, 너무 많으면 불이 잘 붙기 때문이다.","why":"","mix":""},{"name":"안전관리자의 수(건설업)","facts":["공사금액 50억 이상 800억 미만: 1명 이상","800억 이상 1,500억 미만: 2명 이상","1,500억 이상 2,200억 미만: 3명 이상","2,200억 이상 3,000억 미만: 4명 이상"],"hook":"「팔백부터 둘」이다. 800·1,500·2,200이 경계이고 700억씩 벌어진다. 850억 공사는 800을 넘었으니 2명.","why":"","mix":""},{"name":"건설물 등과의 사이 통로","facts":["크레인 통로 끝과 건설물 벽체 간격 0.3 m 이하","통로 폭은 0.6 m 이상"],"hook":"틈은 「영점삼 이하」로 좁혀 몸이 안 끼게, 통로는 「영점육 이상」으로 넓혀 다닐 수 있게. 좁게·넓게가 정반대 논리다.","why":"","mix":""},{"name":"안전관리 순환·단계별 관리","facts":["Plan → Do → Check → Action","시공단계의 문제는 감독 소홀","크레인 방호장치에 공기정화장치는 없다","지하매설물 인접작업은 사전조사·파악·방호조치"],"hook":"「세우고→하고→살피고→고친다」다. 살펴본 뒤라야 고칠 것을 아니 Check가 Action보다 앞선다. 크레인이 공기를 맑게 할 리 없다.","why":"","mix":""}],"n":8,"rounds":8},{"id":"6-19","subject":"건설안전기술","chapter":"건설공사 안전개요","big":"안전율·응력","title":"안전계수 한눈에","topic3d":"","items":[{"name":"달비계의 안전계수","facts":["달기 와이어로프·달기 강선 10 이상","달기 체인·달기 훅 5 이상","달기 강대와 상·하부 지점: 강재 2.5 이상, 목재 5 이상"],"hook":"「줄은 열(10), 사슬·훅·나무는 다섯(5), 강재만 이점오(2.5)」다. 사람이 매달린 줄이 제일 겁이 많다.","why":"사람이 매달리는 부재일수록 크게, 성질이 고른 강재는 작게 잡는다.","mix":"강재 3 이상은 틀린 값이다."},{"name":"양중기 와이어로프의 안전계수","facts":["근로자가 탑승하는 운반구를 지지하는 로프·체인 10 이상","화물의 하중을 직접 지지하는 달기 와이어로프·체인 5 이상","훅·섀클·링 등 철구 3 이상","그 밖의 경우 4 이상"],"hook":"「사람 10·화물 5·부속 3·그 밖 4」다. 사람이 제일 크고 쇳덩이 부속이 제일 작다.","why":"","mix":"항타기 권상용 와이어로프도 5 이상으로 화물 로프와 같은 값이다."},{"name":"고소작업대·드럼 감김","facts":["고소작업대 와이어로프·체인의 안전율 5 이상","이동 시 작업대를 가장 낮게, 사람을 태우지 않는다","드럼에 남는 감김 수 2회 이상"],"hook":"사람이 타는 바구니(고소작업대) 줄은 「다섯」 배로 잡는다. 「3 이상」은 부속(훅·섀클)의 값이라 함정이다.","why":"","mix":""}],"n":8,"rounds":7},{"id":"6-20","subject":"건설안전기술","chapter":"건설공구·장비","big":"차량계 건설기계","title":"작업계획서와 울타리","topic3d":"rail","items":[{"name":"차량계 건설기계 작업계획서","facts":["사용하는 건설기계의 종류와 성능","운행경로","작업방법","유도자 배치·유지보수방법은 항목이 아니다"],"hook":"「무엇으로·어디로·어떻게」 셋뿐이다. 유도자는 실제로 세우되 계획서 칸엔 없다. 넷째 보기가 무엇이든 그것이 답이다.","why":"","mix":""},{"name":"전락 방지 울타리","facts":["케틀·호퍼·피트 등에는 높이 90 cm 이상 울타리","안전난간 상부난간대 90~120 cm와 같은 아래 한계","로봇 울타리는 1.8 m 이상"],"hook":"끓는 솥(케틀)이나 구덩이(피트) 앞 울타리는 「구십(90)」, 허리 위까지 막아야 빠지지 않는다. 로봇 울타리 1.8 m는 사람 키다.","why":"","mix":""},{"name":"해체 작업계획서·단관비계 벽이음","facts":["해체 계획서: 해체 방법·순서, 방호설비, 사전 알림, 잔재물 처리","민원 처리계획은 항목이 아니다","단관비계 벽이음 수직 5 m·수평 5 m 이하"],"hook":"해체 계획서는 「어떻게 헐고·무엇으로 막고·어디에 알리고·어디에 버리나」다. 민원은 이웃 일이지 안전 일이 아니다. 단관은 「오오」.","why":"","mix":""}],"n":7,"rounds":7},{"id":"6-21","subject":"건설안전기술","chapter":"건설공구·장비","big":"다짐·항타","title":"항타기 도르래와 로프","topic3d":"wirerope","items":[{"name":"항타기·항발기 권상장치","facts":["드럼축과 첫 번째 도르래 축 간 거리는 드럼폭의 15배 이상","도르래 축은 드럼 중심을 지나는 수직면 위에","권상용 와이어로프 안전계수 5 이상","드럼에 남는 감김 수 2회 이상"],"hook":"드럼과 도르래가 가까우면 로프가 비스듬히 들어와 겹쳐 감긴다. 「드럼폭 열다섯 배」 떨어뜨리고, 「두 바퀴」는 남겨 끝이 안 풀리게 한다.","why":"멀리 떨어져야 로프가 곧게 들어와 가지런히 감긴다.","mix":"절단하중 100 t에 안전계수 5면 최대하중 20 t이다."},{"name":"와이어로프 사용 금지(양중기)","facts":["이음매가 「있는」 것이 금지","이음매가 없는 것은 사용 가능"],"hook":"「있는」과 「없는」 한 글자 뒤집기 문항이다. 이음매는 그 자리에서 끊어지니 있으면 버린다.","why":"","mix":""},{"name":"다짐기계·해체용 기계","facts":["탬핑롤러: 돌기가 풍화암을 파쇄하고 간극수압 제거","진동롤러는 다짐기계라 해체용이 아니다"],"hook":"탬핑은 「콕콕 찍기」, 돌기가 곧 이름이다. 진동롤러가 해체 문제에 나오면 「눌러 다지는 놈」이라 오답이다.","why":"","mix":""}],"n":7,"rounds":7},{"id":"6-22","subject":"건설안전기술","chapter":"구조물공사","big":"터널·교량·댐","title":"터널 경보와 개착","topic3d":"","items":[{"name":"터널 자동경보장치 점검","facts":["계기의 이상 유무","검지부의 이상 유무","경보장치의 작동상태","발열·환기·조명은 점검사항이 아니다"],"hook":"「재고(검지부)→판단(계기)→알림(경보)」 경보의 흐름 그대로 셋이다. 등불(조명)은 다른 조문 일이다.","why":"","mix":""},{"name":"개착식 터널공법","facts":["파고 → 구조물 축조 → 되메우기(cut and cover)","얕은 곳에 싸고 빠르지만 지상 교통을 막는다"],"hook":"「파고·짓고·덮는다」가 곧 개착식이다. 뚜껑 열고 요리하는 식이라 위 교통이 막힌다.","why":"","mix":""},{"name":"건설현장 작업환경측정 대상","facts":["산소결핍작업, 탱크 내 도장작업, 터널 내 천공작업","건물 외부 도장작업은 대상이 아니다"],"hook":"「닫힌 곳에서 하는 일」만 잰다. 바깥 페인트칠은 바람이 다 걷어 간다.","why":"","mix":""},{"name":"계획서 대상(냉동창고)","facts":["냉동·냉장 창고시설은 연면적 5천 ㎡ 이상이 대상","연면적 3,000 ㎡ 냉동창고는 대상이 아니다"],"hook":"냉동창고는 「오천」부터다. 3천은 두 칸 모자란다.","why":"","mix":""}],"n":6,"rounds":5},{"id":"6-23","subject":"건설안전기술","chapter":"건설공구·장비","big":"작업시작 전 점검","title":"작업 전 점검 셋","topic3d":"","items":[{"name":"크레인 작업시작 전 점검","facts":["권과방지장치·브레이크·클러치·운전장치의 기능","주행로 상측·트롤리 주행 레일 상태","와이어로프가 통하는 곳의 상태","두루뭉술한 「방호장치의 이상 유무」는 아니다"],"hook":"「멈추는 것·다니는 길·매다는 줄」 셋이다. 브레이크·레일·로프. 「방호장치」라고 뭉뚱그린 보기는 다른 기계 조문이다.","why":"","mix":""},{"name":"터널 자동경보장치·지보공 점검","facts":["경보장치: 계기·검지부·경보장치 셋","지보공 점검에 경보장치 작동상태는 없다"],"hook":"경보장치 점검은 「재고·판단·알림」 셋, 지보공 점검은 「손상·긴압·접속·침하」 넷이다. 서로 자리를 바꿔 놓은 것이 함정이다.","why":"","mix":""}],"n":5,"rounds":4},{"id":"6-24","subject":"건설안전기술","chapter":"운반·양중기","big":"크레인","title":"크레인 방호장치 이름풀이","topic3d":"","items":[{"name":"방호장치 이름의 뜻","facts":["해지장치: 와이어로프가 훅에서 벗겨지는 것을 막는다","권과방지장치: 과다감기를 막는다","과부하방지장치: 정격하중 초과를 막는다"],"hook":"한자를 풀면 답이 된다. 권과(捲過)는 「지나치게 감김」, 해지(解止)는 「풀림을 멈춤」이다. 훅에서 빠지면 짐이 곧장 떨어지니 작아도 꼭 있어야 한다.","why":"","mix":""}],"n":2,"rounds":2},{"id":"6-25","subject":"건설안전기술","chapter":"산업용 기계","big":"롤러기·원심기","title":"방호조치 대상 기계","topic3d":"","items":[{"name":"방호조치 없이 양도·대여 금지 기계","facts":["예초기·원심기·공기압축기·금속절단기·지게차·포장기계 여섯","덤프트럭은 차량계 건설기계라 해당 없음","헤드가드는 지게차의 방호장치, 포장기계에는 없다"],"hook":"「예·원·공·금·지·포」(예초기, 원심기, 공기압축기, 금속절단기, 지게차, 포장기계) 여섯이다. 헤드가드는 머리 위 지붕이라 사람이 타는 지게차 것이다.","why":"","mix":""}],"n":2,"rounds":2},{"id":"6-26","subject":"건설안전기술","chapter":"기계 일반","big":"동력전달·통로","title":"크레인 점검에 없는 것","topic3d":"","items":[{"name":"크레인 점검 vs 보일러","facts":["크레인 작업 전 점검: 운전장치·레일·와이어로프","압력방출장치 기능은 보일러 점검"],"hook":"「압력·수위·밸브」가 나오면 크레인이 아니라 보일러다. 크레인엔 김이 안 난다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"6-27","subject":"건설안전기술","chapter":"안전점검·인증","big":"안전인증·검사","title":"설치·이전 시 안전인증","topic3d":"","items":[{"name":"설치·이전 시 안전인증 대상","facts":["크레인·리프트·곤돌라 셋","고소작업대는 설치·이전 인증 대상이 아니다"],"hook":"「크·리·곤」(크레인, 리프트, 곤돌라) 셋뿐이다. 셋 다 현장에서 조립해 세우는 양중기라 세우는 일 자체가 위험하다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"6-28","subject":"건설안전기술","chapter":"가시설물","big":"굴착 준수사항","title":"트렌치 굴착 폭","topic3d":"","items":[{"name":"트렌치 굴착","facts":["깊이 2 m 이상이면 굴착 폭 1 m 이상","깊이 1.5 m 이상이면 흙막이 지보공"],"hook":"좁고 깊은 도랑(트렌치)은 무너지면 못 나온다. 「2 m 깊으면 1 m 넓게」, 몸을 돌려 도망칠 폭이다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"6-29","subject":"건설안전기술","chapter":"안전보건관리 체제","big":"선임·자격","title":"안전관리자 수","topic3d":"","items":[{"name":"건설업 안전관리자 수","facts":["50억 이상 800억 미만 1명","800억 이상 1,500억 미만 2명","1,500억 이상 2,200억 미만 3명","2,200억 이상 3,000억 미만 4명","3,000억 초과는 700억마다 1명 추가"],"hook":"「팔백부터 둘」이고 경계가 700억씩 벌어진다(800→1,500→2,200). 850억은 800을 넘었으니 2명이다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"6-30","subject":"건설안전기술","chapter":"감전재해","big":"인체 영향","title":"감전은 전류가 정한다","topic3d":"","items":[{"name":"감전 위험도의 결정 요인","facts":["통전 전류의 크기, 통전 시간, 통전 경로, 전원의 종류가 직접 요인","통전 전압은 직접 요인이 아니다"],"hook":"전압은 재료일 뿐이고 몸에 실제로 흐른 「전류」가 사람을 다치게 한다. 젖으면 저항이 1/25로 떨어져 같은 전압에도 전류가 훨씬 커진다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"6-31","subject":"건설안전기술","chapter":"정보입력표시","big":"시각","title":"작업면 조도 네 단계","topic3d":"lux","items":[{"name":"작업면 조도 기준","facts":["초정밀작업 750 lux 이상","정밀작업 300 lux 이상","보통작업 150 lux 이상","그 밖의 작업 75 lux 이상","갱내·감광재료 취급 작업장은 제외"],"hook":"「칠오·백오십·삼백·칠백오십」, 75에서 두 배씩 오르다 마지막만 750으로 껑충이다. 초정밀 600은 틀린 값.","why":"","mix":""}],"n":1,"rounds":1},{"id":"6-32","subject":"건설안전기술","chapter":"기계 일반","big":"위험점·방호","title":"크레인 방호장치 넷","topic3d":"","items":[{"name":"크레인의 방호장치","facts":["과부하방지장치·권과방지장치·비상정지장치·제동장치 넷","공기정화장치는 없다","파이널 리미트 스위치는 승강기 것"],"hook":"「과·권·비·제」(과부하, 권과, 비상정지, 제동) 넷이다. 크레인이 공기청정기를 달 리 없다.","why":"","mix":""}],"n":1,"rounds":1}]}</script>

<script>
(function(){
  const BANK = JSON.parse(document.getElementById('bank').textContent);
  const el = id => document.getElementById(id);
  const LAB = 'lab.html', MEMO = 'memo.html';
  const SUBJ = ['안전관리론','인간공학 및 시스템안전공학','기계위험방지기술','전기위험방지기술','화학설비위험방지기술','건설안전기술'];
  const SUBJ_SHORT = ['안전관리론','인간공학','기계위험방지','전기위험방지','화학설비','건설안전'];
  const SUBJ_HEX = [0x7FA6E0, 0xB58FE0, 0xF0A35B, 0xE3B54D, 0x6BC3C9, 0x5CC08A];
  const ZONE_NAME = ['안전관리 사무동', '인간공학 실험실', '기계 가공장', '전기실·변전 구역', '화학 플랜트', '건설 현장'];
  const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const col = h => new THREE.Color(h).convertSRGBToLinear();
  const P3 = (x,y,z)=> new THREE.Vector3(x,y,z);
  const UP = new THREE.Vector3(0,1,0);
  const hi = s => esc(s).replace(/(\d+(?:[.,]\d+)?(?:\s*(?:mm|cm|km\/h|km|m\/s|m\/min|㎡|㎥|㎜|㎝|m|kgf|kg|㎏|톤|t|N|kN|kPa|MPa|lux|dB|℃|°|도|%|ppm|kV|V|A|mA|kW|Ω|Hz|ms|초|분|시간|일|주|개월|년|명|인|회|배|개|단|층|세|점))?)/g, '<span class="v">$1</span>');
  const maskNums = s => s.replace(/\d+(?:[.,]\d+)?/g, '▢');
  // 사실이 「항목: 값」 꼴이면 표로, 아니면 칩으로
  const KV_RE = /^(.{1,26}?)\s*[:：]\s*(.+)$/;
  function factsHtml(facts){ const rows = facts.map(f=>{ const m = f.match(KV_RE); return m ? [m[1], m[2]] : null; }); const kv = rows.filter(Boolean).length;
    if(facts.length >= 2 && kv >= Math.ceil(facts.length*0.6)) return `<table class="ft">${facts.map((f, i)=> rows[i] ? `<tr><th>${esc(rows[i][0])}</th><td>${hi(rows[i][1])}</td></tr>` : `<tr><td colspan="2">${hi(f)}</td></tr>`).join('')}</table>`;
    return `<ul class="facts">${facts.map(f=> `<li>${hi(f)}</li>`).join('')}</ul>`; }

    const num = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.3), std({map: t, roughness: .8})); num.position.set(-2.9, 0.55, 1.9); grp.add(num); cyl(0.03, 0.03, 0.5, M.post, grp, -2.9, 0.25, 1.88, 6);
    setDone(s, !!done[s.g.id], true); });
  function setDone(s, v, silent){ s.lampMat.color.copy(col(v ? 0xFFE9A8 : 0x3A4252)); s.lampMat.emissive.copy(col(v ? 0xFFD060 : 0x000000)); s.lampMat.emissiveIntensity = v ? 1.2 : 0; s.glow.visible = v; if(!silent) drawMap(); }

  /* ---------- 안전관리자 ---------- */
  const manager = worker(0x2E8B57, scene, 0xF2F5F8); const band = cyl(0.075, 0.07, 0.14, std({color: col(0xE3B54D), roughness: .7}), manager.userData.limbs.arms[0], 0, -0.15, 0); const clip = box(0.22, 0.3, 0.02, std({color: col(0xE8EEF8), roughness: .9}), manager.userData.limbs.arms[0], 0, -0.55, 0.12); clip.rotation.x = -0.5; manager.userData.limbs.arms[0].rotation.x = -1.1;
  const mgr = {walkT: 0, from: null, to: null, phase: 0, talkT: 0};
  // 말풍선 (HTML, 머리 위)
  const labelRoot = el('labels'); let bubble = null, nameTag = null;
  function say(text, cls){ if(bubble) bubble.remove(); bubble = document.createElement('div'); bubble.className = 'lbl ' + cls; bubble.innerHTML = `<b>${esc(text)}</b>`; labelRoot.appendChild(bubble); }
  const tmpV = new THREE.Vector3();
  function placeBubble(){ if(!bubble) return; manager.userData.head.getWorldPosition(tmpV); tmpV.y += 0.42; tmpV.project(camera); if(tmpV.z > 1){ bubble.style.display = 'none'; return; } bubble.style.display = ''; const x = (tmpV.x + 1)/2*innerWidth, y = (1 - tmpV.y)/2*innerHeight; bubble.style.transform = `translate(${(x - bubble.offsetWidth/2).toFixed(1)}px, ${(y - bubble.offsetHeight - 10).toFixed(1)}px)`; }

  /* ---------- 카메라: 정거장 둘레 궤도 + 이동 트윈 ---------- */
  const cam = {target: P3(0, 1.3, 0), az: -0.38, el: 0.34, dist: 10.5, fromT: null, toT: null, t: 1, drag: null};
  function camPos(){ return P3(cam.target.x + cam.dist*Math.cos(cam.el)*Math.sin(cam.az), cam.target.y + cam.dist*Math.sin(cam.el), cam.target.z + cam.dist*Math.cos(cam.el)*Math.cos(cam.az)); }
  function applyCamera(){ camera.position.copy(camPos()); camera.lookAt(cam.target); }
  const dom = renderer.domElement;
  dom.addEventListener('pointerdown', e=>{ cam.drag = {x: e.clientX, y: e.clientY, az: cam.az, el: cam.el}; dom.setPointerCapture(e.pointerId); });
  dom.addEventListener('pointermove', e=>{ if(!cam.drag) return; cam.az = cam.drag.az - (e.clientX - cam.drag.x)*0.006; cam.el = clamp(cam.drag.el + (e.clientY - cam.drag.y)*0.004, 0.08, 1.2); });
  dom.addEventListener('pointerup', ()=>{ cam.drag = null; }); dom.addEventListener('pointercancel', ()=>{ cam.drag = null; });
  dom.addEventListener('wheel', e=>{ cam.dist = clamp(cam.dist*(1 + Math.sign(e.deltaY)*0.12), 5, 30); e.preventDefault(); }, {passive: false});
  let pinch = null; dom.addEventListener('touchstart', e=>{ if(e.touches.length === 2){ pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); cam.drag = null; } }, {passive: true});
  dom.addEventListener('touchmove', e=>{ if(e.touches.length === 2 && pinch){ const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); cam.dist = clamp(cam.dist*pinch/d, 5, 30); pinch = d; } }, {passive: true});
  dom.addEventListener('touchend', ()=>{ pinch = null; });

  /* ---------- 상태: 현재 정거장·항목 ---------- */
  let cur = 0, item = 0, quiz = false;
  const idFromHash = (location.hash.match(/g=([\d-]+)/) || [])[1]; if(idFromHash){ const i = stations.findIndex(s=> s.g.id === idFromHash); if(i >= 0) cur = i; }
  function goStation(i, keepItem){ i = clamp(i, 0, stations.length - 1); const prev = stations[cur]; if(prev && prev.boardMat.map === bigTex){ prev.boardMat.map = prev.titleTex; prev.boardMat.needsUpdate = true; }
    cur = i; if(!keepItem) item = 0; const s = stations[cur]; history.replaceState(null, '', '#g=' + s.g.id);
    cam.fromT = cam.target.clone(); cam.toT = s.pos.clone().add(P3(0.2, 1.4, -0.4)); cam.t = 0; cam.az = -0.38; cam.el = 0.34; cam.dist = Math.min(cam.dist, 12);
    sun.target.position.copy(s.pos); sun.position.copy(s.pos).add(P3(20, 40, 30));
    // 관리자: 앞 정거장 쪽에서 걸어 들어온다
    mgr.from = manager.position.clone(); if(mgr.from.distanceTo(s.pos) > 30) mgr.from = s.pos.clone().add(P3(-4, 0, 3.5)); mgr.to = s.pos.clone().add(P3(-3.9, 0.14, 1.1)); mgr.walkT = 0; if(bubble){ bubble.remove(); bubble = null; }
    s.boardMat.map = bigTex; s.boardMat.needsUpdate = true; showItem(); }
  function showItem(){ const s = stations[cur], g = s.g, it = g.items[item]; drawBig(g, item, quiz); mgr.talkT = 0.9;
    el('cPath').innerHTML = `<span>${esc(SUBJ_SHORT[s.si])} › ${esc(g.chapter || '기타')} › ${esc(g.big || '종합')}</span><span>${esc(g.id)}</span><span>정거장 ${cur + 1}/${stations.length}</span>`;
    el('cTitle').textContent = g.title;
    el('cBody').innerHTML = `<div class="itHd"><span class="k">${String(item + 1).padStart(2, '0')}</span><h3>${esc(it.name)}</h3><span class="muted mono" style="margin-left:auto;font-size:11.5px">${item + 1}/${g.items.length}</span></div>
      <div class="r"><span class="lb">사실</span><div>${factsHtml(it.facts)}</div></div>
      <div class="r hook"><span class="lb">훅</span><p>${esc(it.hook)}</p></div>${it.why ? `<div class="r why"><span class="lb">왜</span><p>${esc(it.why)}</p></div>` : ''}${it.mix ? `<div class="r mix"><span class="lb">구분</span><p>${esc(it.mix)}</p></div>` : ''}`;
    el('cBody').querySelectorAll('.facts li, table.ft td').forEach(li=> li.addEventListener('click', ()=> li.classList.toggle('show'))); el('cBody').scrollTop = 0;
    const isDone = !!done[g.id];
    el('cFt').innerHTML = `<button class="b" id="bPrevI" type="button" ${item === 0 ? 'disabled' : ''}>↑ 이전 항목</button><button class="b primary" id="bNextI" type="button">${item < g.items.length - 1 ? '↓ 다음 항목' : '다음 정거장 →'}</button>
      <div class="wide"><button class="b" id="bPrevS" type="button" ${cur === 0 ? 'disabled' : ''}>← 이전 정거장</button><button class="b ${isDone ? 'done' : ''}" id="bDone" type="button">${isDone ? '✓ 학습 완료' : '학습 완료'}</button><button class="b" id="bNextS" type="button" ${cur === stations.length - 1 ? 'disabled' : ''}>다음 정거장 →</button></div>
      <div class="wide"><a class="b" href="${MEMO}#g=${esc(g.id)}">노트에서 보기</a>${g.topic3d ? `<a class="b" href="${LAB}#topic=${esc(g.topic3d)}" target="_blank" rel="noopener">3D 현장 →</a>` : ''}</div>`;
    el('bPrevI').addEventListener('click', ()=>{ if(item > 0){ item--; showItem(); } });
    el('bNextI').addEventListener('click', nextItem);
    el('bPrevS').addEventListener('click', ()=> goStation(cur - 1)); el('bNextS').addEventListener('click', ()=> goStation(cur + 1));
    el('bDone').addEventListener('click', ()=>{ if(done[g.id]) delete done[g.id]; else done[g.id] = Date.now(); saveDone(); setDone(s, !!done[g.id]); showItem(); });
    drawMap(); }
  function nextItem(){ const g = stations[cur].g; if(item < g.items.length - 1){ item++; showItem(); } else goStation(cur + 1); }
  document.addEventListener('keydown', e=>{ if(e.target.tagName === 'INPUT') return; if(e.key === 'ArrowRight'){ goStation(cur + 1); } else if(e.key === 'ArrowLeft'){ goStation(cur - 1); } else if(e.key === 'ArrowDown' || e.key === ' '){ e.preventDefault(); nextItem(); } else if(e.key === 'ArrowUp'){ if(item > 0){ item--; showItem(); } } });
  el('bQuiz').addEventListener('click', ()=>{ quiz = !quiz; document.body.classList.toggle('quiz', quiz); el('bQuiz').setAttribute('aria-pressed', quiz); showItem(); });
  el('bMap').addEventListener('click', ()=> document.body.classList.toggle('showMap')); el('bCard').addEventListener('click', ()=> document.body.classList.toggle('hideCard'));

  /* ---------- 지도 ---------- */
  const mapC = el('mapC'), mg = mapC.getContext('2d');
  const MAPW = 500, MAPH = 352, WX = 300, WZ = 160; const mx = x => MAPW/2 + x/WX*MAPW*0.98, mz = z => MAPH/2 + z/WZ*MAPH*0.92;
  function drawMap(){ mg.clearRect(0, 0, MAPW, MAPH); mg.fillStyle = '#0F1622'; mg.fillRect(0, 0, MAPW, MAPH);
    SUBJ.forEach((s, si)=>{ const zc = zoneCenter(si); mg.fillStyle = '#' + SUBJ_HEX[si].toString(16).padStart(6, '0') + '22'; mg.strokeStyle = '#' + SUBJ_HEX[si].toString(16).padStart(6, '0') + '88'; mg.lineWidth = 1.5; const x = mx(zc.x - ZW/2), y = mz(zc.z - ZD/2), w = mx(zc.x + ZW/2) - x, h = mz(zc.z + ZD/2) - y; mg.fillRect(x, y, w, h); mg.strokeRect(x, y, w, h); mg.fillStyle = '#' + SUBJ_HEX[si].toString(16).padStart(6, '0'); mg.font = '600 15px "IBM Plex Sans KR", sans-serif'; mg.fillText(SUBJ_SHORT[si], x + 6, y + h - 8); });
    mg.strokeStyle = 'rgba(140,160,190,.35)'; mg.lineWidth = 1.2; mg.beginPath(); stations.forEach((s, i)=>{ const x = mx(s.pos.x), y = mz(s.pos.z); if(i === 0) mg.moveTo(x, y); else mg.lineTo(x, y); }); mg.stroke();
    stations.forEach((s, i)=>{ const x = mx(s.pos.x), y = mz(s.pos.z), d = !!done[s.g.id]; mg.beginPath(); mg.arc(x, y, i === cur ? 6 : 3.2, 0, Math.PI*2); mg.fillStyle = i === cur ? '#E3B54D' : d ? '#5CC08A' : '#3B4658'; mg.fill(); if(i === cur){ mg.strokeStyle = '#FFF'; mg.lineWidth = 1.5; mg.stroke(); } });
    const s = stations[cur]; el('mapZone').textContent = ZONE_NAME[s.si] + ' · ' + s.g.id; const dn = stations.filter(x=> done[x.g.id]).length; el('mapProg').textContent = `완료 ${dn}/${stations.length}`; }
  mapC.addEventListener('click', e=>{ const r = mapC.getBoundingClientRect(); const px = (e.clientX - r.left)/r.width*MAPW, py = (e.clientY - r.top)/r.height*MAPH; let best = -1, bd = 1e9; stations.forEach((s, i)=>{ const d = Math.hypot(mx(s.pos.x) - px, mz(s.pos.z) - py); if(d < bd){ bd = d; best = i; } }); if(best >= 0 && bd < 14) goStation(best); });

  /* ---------- 루프 ---------- */
  function resize(){ const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w/h; camera.updateProjectionMatrix(); }
  addEventListener('resize', resize); resize();
  const ease = t => t < .5 ? 2*t*t : 1 - Math.pow(-2*t + 2, 2)/2;
  let last = performance.now();
  function frame(now){ const dt = Math.min(0.05, (now - last)/1000); last = now;
    if(cam.t < 1){ cam.t = Math.min(1, cam.t + dt/0.9); cam.target.copy(cam.fromT).lerp(cam.toT, ease(cam.t)); }
    applyCamera();
    // 관리자 걸어오기 → 도착하면 카메라 쪽을 보고 훅을 말한다
    if(mgr.to){ if(mgr.walkT < 1){ mgr.walkT = Math.min(1, mgr.walkT + dt/1.1); manager.position.copy(mgr.from).lerp(mgr.to, ease(mgr.walkT)); const dir = mgr.to.clone().sub(mgr.from); if(dir.length() > 0.01) manager.rotation.y = Math.atan2(dir.x, dir.z); mgr.phase += dt*9; walkPose(manager, mgr.phase, 0.55); manager.userData.limbs.arms[0].rotation.x = -1.1; }
      else { const look = camPos(); manager.rotation.y = Math.atan2(look.x - manager.position.x, look.z - manager.position.z) ; walkPose(manager, 0, 0); manager.userData.limbs.arms[0].rotation.x = -1.1; manager.userData.limbs.arms[1].rotation.x = -0.9 + Math.sin(now*0.004)*0.12; manager.userData.limbs.arms[1].rotation.y = 0.9;
        if(mgr.talkT > 0){ mgr.talkT -= dt; if(mgr.talkT <= 0){ const g = stations[cur].g; say(g.items[item].hook, 'boss'); } } } }
    placeBubble(); renderer.render(scene, camera); requestAnimationFrame(frame); }
  goStation(cur); manager.position.copy(stations[cur].pos).add(P3(-3.9, 0.14, 1.1)); mgr.from = manager.position.clone(); mgr.walkT = 1; cam.t = 1; cam.target.copy(cam.toT);
  addEventListener('hashchange', ()=>{ const id = (location.hash.match(/g=([\d-]+)/) || [])[1]; const i = stations.findIndex(s=> s.g.id === id); if(i >= 0 && i !== cur) goStation(i); });
  document.fonts && document.fonts.ready.then(()=>{ stations.forEach(s=>{ s.titleTex.dispose(); s.titleTex = titleBoard(s.g); if(s.boardMat.map !== bigTex){ s.boardMat.map = s.titleTex; s.boardMat.needsUpdate = true; } }); showItem(); });
  el('load').remove(); requestAnimationFrame(frame);
})();
</script>
