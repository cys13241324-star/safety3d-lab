<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산업안전기사 암기 순찰로</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Gothic+A1:wght@800&display=swap">
<style>
:root{color-scheme:dark;--bg:#0A1018;--panel:#0F1622;--panel2:#182234;--line:#263248;--line-soft:#1B2536;--text:#E8EEF8;--muted:#8C99B0;--dim:#5D6A82;--accent:#7FA6E0;--ok:#5CC08A;--warn:#E3B54D;--warn-soft:rgba(227,181,77,.12);--warn-line:rgba(227,181,77,.5);
  --sans:"IBM Plex Sans KR","Pretendard","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;--display:'Gothic A1',var(--sans)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14.5px;line-height:1.5}
a{color:var(--accent)}
#stage{position:fixed;inset:0} #stage canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;transform-origin:50% 100%}
.lbl b{position:relative;display:block;background:#FFF7D6;border:2px solid #1A1A1A;border-radius:12px;padding:6px 12px 7px;font-size:15px;font-weight:700;letter-spacing:-.02em;color:#1A1A1A;line-height:1.3;max-width:min(520px,80vw);white-space:normal;text-align:left;transform-origin:50% 100%;animation:pop .28s cubic-bezier(.2,1.5,.4,1)}
.lbl.boss b{background:#E3F2E8;border-color:#2E8B57;color:#1F6B41}
.lbl.name b{background:rgba(8,13,22,.8);border:1px solid rgba(140,160,190,.3);color:#E8EEF8;font-weight:600;font-size:13px;padding:3px 9px;border-radius:5px;animation:none}
.lbl b::before{content:'';position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:inherit;border-right:2px solid;border-bottom:2px solid;border-color:inherit;transform:translateX(-50%) rotate(45deg)} .lbl.name b::before{display:none}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.b{font:inherit;font-size:13.5px;padding:6px 11px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.b:hover{border-color:var(--accent)} .b.primary{background:var(--warn);color:#1A1200;border-color:var(--warn);font-weight:600} .b[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)} .b.done{border-color:var(--ok);color:var(--ok)} .b:disabled{opacity:.4;cursor:default}
/* 상단 바 */
#top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(15,22,34,.86);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
#top .crumb{font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.01em;white-space:nowrap;display:flex;gap:8px;align-items:center} #top .crumb a{color:var(--muted);text-decoration:none} #top .crumb .sep{color:var(--dim);font-weight:400}
#top .sp{flex:1}
/* 지도 */
#map{position:fixed;left:14px;top:56px;z-index:15;background:rgba(15,22,34,.86);border:1px solid var(--line);border-radius:10px;padding:8px;backdrop-filter:blur(6px)}
#map canvas{display:block;width:250px;height:176px;cursor:pointer} #map .cap{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:4px;display:flex;justify-content:space-between}
/* 오른쪽 카드 */
#card{position:fixed;right:14px;top:56px;bottom:14px;width:380px;z-index:15;display:flex;flex-direction:column;background:rgba(15,22,34,.9);border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(8px);overflow:hidden}
#card .hd{padding:12px 16px 8px;border-bottom:1px solid var(--line)} #card .path{font-family:var(--mono);font-size:11.5px;color:var(--dim);display:flex;gap:8px;flex-wrap:wrap} #card h2{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.02em;margin:4px 0 0;text-wrap:balance}
#card .bd{flex:1;overflow-y:auto;padding:12px 16px;scrollbar-width:thin}
#card .itHd{display:flex;align-items:baseline;gap:8px;margin-bottom:8px} #card .itHd .k{font-family:var(--display);font-weight:800;font-size:22px;color:var(--warn);line-height:1} #card .itHd h3{margin:0;font-size:15.5px;font-weight:600}
.r{display:grid;grid-template-columns:38px 1fr;gap:8px;align-items:start;margin-top:8px} .r .lb{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;padding:3px 0;border-radius:4px;text-align:center;margin-top:2px;border:1px solid var(--line);color:var(--dim)} .r p{margin:0}
.facts{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:5px} .facts li{font-size:13px;padding:3px 8px;border-radius:5px;background:var(--panel2);border:1px solid var(--line-soft)} .facts li .v{color:var(--warn);font-family:var(--mono)}
.r.hook .lb{background:var(--warn);color:#1A1200;border-color:var(--warn);font-weight:600} .r.hook p{padding:9px 12px;border-radius:8px;background:var(--warn-soft);border:1px solid var(--warn-line);font-size:14.5px}
.r.why .lb{color:var(--accent)} .r.mix .lb{color:var(--ok)} .r.why p,.r.mix p{font-size:13px;color:var(--muted)}
body.quiz .facts li{color:transparent;background:var(--line-soft);cursor:pointer;user-select:none} body.quiz .facts li .v{color:transparent} body.quiz .facts li.show{color:inherit;background:var(--panel2)} body.quiz .facts li.show .v{color:var(--warn)}
table.ft{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel2);border:1px solid var(--line-soft);border-radius:6px;overflow:hidden} table.ft th,table.ft td{padding:5px 9px;border-top:1px solid var(--line-soft);text-align:left;vertical-align:top} table.ft tr:first-child th,table.ft tr:first-child td{border-top:0} table.ft th{width:34%;font-weight:600;color:var(--muted);background:rgba(0,0,0,.18)} table.ft td .v{color:var(--warn);font-family:var(--mono)}
body.quiz table.ft td{color:transparent;background:var(--line-soft);cursor:pointer;user-select:none} body.quiz table.ft td .v{color:transparent} body.quiz table.ft td.show{color:inherit;background:transparent} body.quiz table.ft td.show .v{color:var(--warn)}
#card .ft{padding:10px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:6px} #card .ft .wide{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between}
#card .ft .b{justify-content:center}
#card .ft .b small{color:var(--muted);font-weight:400;font-size:11.5px}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:12;font-family:var(--mono);font-size:11.5px;color:var(--dim);background:rgba(15,22,34,.7);padding:4px 10px;border-radius:6px;white-space:nowrap}
#bMap,#bCard{display:none}
#load{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--muted)} #load small{display:block;text-align:center;font-family:var(--mono);font-weight:400;font-size:12px;margin-top:8px;color:var(--dim)}
@media (max-width:820px){
  #top{padding:6px 10px;gap:6px} #top .crumb{font-size:14px} #top .crumb .home,#top .crumb .sep1{display:none} #top .lab{display:none} #bMap,#bCard{display:inline-flex}
  #map{display:none;left:10px;top:48px} body.showMap #map{display:block}
  #card{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:46vh} body.hideCard #card{display:none}
  #hint{display:none}
}
</style>
</head>

<script id="bank" type="application/json">{"methods":[{"id":"1-01","subject":"안전관리론","chapter":"","big":"","title":"분류 밖 종합 묶음","topic3d":"caisson","items":[{"name":"의식수준의 단계","facts":["Phase 0 = 무의식 상태(수면)","Phase Ⅰ = 몽롱·졸림, 신뢰성 0.9 이하","Phase Ⅲ = 가장 좋은 상태","Phase Ⅳ = 당황·과긴장, 신뢰성 0.9 이하"],"hook":"산(∧) 모양으로 그린다. 꼭대기가 Ⅲ, 왼쪽 골짜기 Ⅰ은 졸음, 오른쪽 골짜기 Ⅳ는 놀람. 0은 아예 잠든 바닥이다.","why":"","mix":"Ⅰ과 Ⅳ 둘 다 0.9 이하로 뚝 떨어진다. 졸려도 놀라도 못 믿는다."},{"name":"인간관계의 메커니즘","facts":["동일화 · 투사 · 커뮤니케이션 · 모방 · 암시 다섯 가지","남에게서 자기와 닮은 것을 찾으면 동일화","분열·강박은 메커니즘이 아니다"],"hook":"「동투커모암」: 동네 투수가 커피 모으다 암시에 걸렸다(동일화·투사·커뮤니케이션·모방·암시).","why":"","mix":"방어기제·도피기제와 다른 목록이다. 분열·강박이 보이면 오답이다."},{"name":"방어기제와 도피기제","facts":["고립은 방어기제가 아니다(도피기제)","판단과정의 착오요인에 정서불안정은 없다"],"hook":"고립은 혼자 방구석으로 도망친 것, 곧 도피다. 방어는 맞서서 꾸미고 둘러대는 쪽이다.","why":"","mix":""},{"name":"일반건강진단 주기","facts":["사무직 근로자 2년에 1회 이상","그 밖의 근로자 1년에 1회 이상"],"hook":"책상 앞 사무직은 「2」년, 땀 흘리는 현장은 「1」년. 몸을 쓸수록 자주 들여다본다.","why":"","mix":""},{"name":"유해·위험작업 근로시간","facts":["잠함·잠수 등 고기압 작업은 1일 6시간 · 1주 34시간(법 제139조)","일반 근로시간은 1일 8시간 · 1주 40시간","유해·위험작업은 연장근로 불가"],"hook":"잠수부는 8·40에서 2시간·6시간 깎여 6·34. 물속에서 「육삼사!」 하고 올라온다.","why":"기압이 높은 곳은 몸에 무리가 커서 시간을 줄인다.","mix":"일반은 합의로 1주 12시간 연장, 유해·위험작업은 연장 자체가 없다."},{"name":"안전보건표지의 색채","facts":["빨간색 = 금지(정지신호·소화설비·유해행위 금지)","노란색 = 경고","파란색 = 지시","녹색 = 안내"],"hook":"신호등이다. 빨강 멈춰(금지), 노랑 조심(경고), 파랑 시키는 대로(지시), 초록 가도 됨(안내).","why":"","mix":"「노란색이 정지신호·소화설비」로 적힌 보기는 빨강 자리를 훔친 오답이다."},{"name":"Y·G 성격검사","facts":["D형 = 안정·적응·적극, 가장 바람직","B형 = 불안정·부적응·적극"],"hook":"D는 Dream팀, 안정·적응·적극 셋 다 좋은 쪽. B는 Bad인데 「적극」 하나만 D와 같아서 미끼가 된다.","why":"","mix":""},{"name":"그 밖에","facts":["설계불량은 기술적 원인(간접원인)","에너지 소비수준의 인자에 작업관리는 없다","사고예방대책 기본원리 1단계는 안전관리조직"],"hook":"5단계 「조발분선적」: 조기 발견하면 분석해서 선정하고 적용한다(조직·발견·분석·선정·적용). 첫 단추는 사람 모으기, 조직이다.","why":"","mix":"「물건을 어떻게 만들었나」는 기술적, 「일을 어떻게 시켰나」는 관리적 원인이다."}],"n":52,"rounds":22},{"id":"1-02","subject":"안전관리론","chapter":"안전보건교육","big":"교육계획·평가","title":"교육 4단계와 시간 배분","topic3d":"","items":[{"name":"안전교육의 4단계","facts":["도입 → 제시 → 적용 → 확인","제시 = 설명하고 이해시키는 단계","도입과 확인은 언제나 5분"],"hook":"「도제적확」: 도둑이 제 발 저려 적발되어 확정. 도입·제시·적용·확인 순서다.","why":"","mix":""},{"name":"강의식·토의식 시간 배분(1시간)","facts":["강의식: 도입 5 · 제시 40 · 적용 10 · 확인 5분","토의식: 도입 5 · 제시 10 · 적용 40 · 확인 5분","실기교육 표준: 도입 5 · 제시 25 · 적용 20 · 확인 5분"],"hook":"앞뒤 5분은 인사와 작별. 가운데 50분을 강의는 「말하기(제시)」에 40, 토의는 「해 보기(적용)」에 40 몰아 준다.","why":"강의는 강사가 말하는 시간이 길고, 토의는 참가자가 해 보는 시간이 길다.","mix":"제시 40이면 강의식, 적용 40이면 토의식. 숫자 자리가 바뀐 보기가 함정이다."},{"name":"학습정도의 4단계","facts":["인지 → 지각 → 이해 → 적용","인지가 지각보다 얕다"],"hook":"「인지이적」: 인간 지능이 이적(移籍)했다. 있는 줄 알고(인지) → 알아보고(지각) → 까닭 알고(이해) → 써먹는다(적용).","why":"","mix":"인지와 지각이 헷갈리면 「인지」가 더 얕은 첫 단계라고 잡는다."},{"name":"브레인스토밍의 4원칙","facts":["비판금지 · 자유분방 · 대량발언 · 수정발언","주제와 관련 없는 발언도 할 수 있다(자유분방)","타인 의견을 수정하여 발표할 수 있다(수정발언)"],"hook":"「비자대수」: 비자 없이 대수롭지 않게 떠들어라. 비판 말고, 자유롭게, 많이, 남의 말 고쳐 말해도 된다.","why":"","mix":"발언을 막거나 줄이는 쪽으로 쓰인 보기는 무조건 오답이다."},{"name":"안전보건교육 계획","facts":["현장의 의견을 반영한다","교육지도안은 계획에 포함할 사항이 아니다"],"hook":"지도안은 「수업 준비물」이지 계획서 항목이 아니다. 계획은 현장 목소리를 담는 큰 그림이다.","why":"","mix":""},{"name":"하인리히 비율과 사망만인율","facts":["하인리히 1 : 29 : 300, 합계 330","사망만인율 = 사망자 수 ÷ 근로자 수 × 10,000"],"hook":"「하나 다치면 스물아홉 긁히고 삼백 번 아찔」. 만인율은 만(萬) 명당이니 곱하는 수도 10,000이다.","why":"","mix":"합계 330에 끌려 답을 고르면 틀린다. 29는 29의 두 배 58, 300은 600처럼 배수로 움직인다."},{"name":"그 밖에","facts":["터치 앤 콜 = 손을 맞대고 함께 외쳐 일체감","무재해운동 3원칙 중 「무의 원칙」","평면에서 넘어지면 전도"],"hook":"터치(손 맞대고) 앤 콜(함께 외침), 이름이 곧 동작이다. 전도(顚倒)는 바닥에서 그냥 자빠진 것이다.","why":"","mix":""}],"n":37,"rounds":23},{"id":"1-03","subject":"안전관리론","chapter":"안전보건관리 체제","big":"선임·자격","title":"위원회 구성과 교육 대상","topic3d":"","items":[{"name":"산업안전보건위원회 구성","facts":["근로자위원: 근로자대표 + 명예산업안전감독관 1명 이상 + 근로자대표가 지명하는 9명 이내 근로자","사용자위원: 대표자 + 안전관리자 1명 + 보건관리자 1명 + 산업보건의 1명 + 부서의 장 9명 이내","상시근로자 50명 이상 100명 미만은 부서의 장을 빼고 구성 가능","그 밖의 사업은 상시근로자 100명 이상이 설치 대상"],"hook":"양쪽 다 「9」명 자리가 있다. 노측은 대표+명예감독관+9, 사측은 대표+안전+보건+보건의+부서장 9. 작은 회사(50~100명)는 부서장 빼도 된다.","why":"","mix":""},{"name":"안전보건관리책임자 등의 교육시간","facts":["안전보건관리책임자 신규 6시간 · 보수 6시간","안전관리자·보건관리자 등 전문가 신규 34시간 · 보수 24시간"],"hook":"책임자는 「육육(6·6)」 가볍게, 전문가는 「삼사·이사(34·24)」 무겁게. 관리자는 짧고 실무자는 길다.","why":"책임자는 결정하는 사람이고, 전문가는 실무를 직접 하니 배울 것이 많다.","mix":""},{"name":"교육대상별 교육내용","facts":["관리감독자 정기교육: 작업공정 유해·위험, 표준안전작업방법, 지도 요령, 작업환경 관리, 법령, 산업보건·직업병 예방","채용 시 교육: 정리정돈·청소, 작업개시 전 점검","작업개시 전 점검은 관리감독자 정기교육 내용이 아니다"],"hook":"관리감독자는 「시키는 사람」 낱말(공정·지도·관리·법령), 신입은 「빗자루(정리정돈·청소)」와 「시동 전 점검」이다.","why":"","mix":"「작업환경 관리」처럼 두고두고 볼 것은 정기교육, 「오늘 당장」은 채용 시 교육이다."},{"name":"무재해운동의 3기둥과 3원칙","facts":["3기둥: 경영층의 방침 · 관리감독자의 라인화 · 근로자의 자주활동","3원칙: 무의 원칙 · 참가의 원칙 · 선취의 원칙","전 종업원의 안전요원화는 기둥이 아니다"],"hook":"기둥은 사람 층(위·가운데·아래), 원칙은 마음가짐. 「무참선」: 없애고(無), 함께하고(참가), 미리 한다(선취).","why":"","mix":"「없애고·함께하고·미리」가 나오면 원칙, 「경영층·라인·자주」가 나오면 기둥이다."},{"name":"TWI 교육 내용","facts":["JIT 작업지도 · JMT 작업방법 · JRT 인간관계 · JST 작업안전","Job Standardization Training은 TWI 내용이 아니다"],"hook":"TWI 넷은 모두 J로 시작: 지도(JI)·방법(JM)·관계(JR)·안전(JS). 「표준화」의 S는 없다. S는 Safety다.","why":"","mix":""},{"name":"그 밖에","facts":["안전보건총괄책임자 직무: 안전인증 대상 기계의 사용 여부 확인, 작업 중지, 도급 시 예방조치, 관리비 조정","자율검사프로그램 검사장비 관리 주체는 사업주","중대재해 연 2건이면 안전보건개선계획 수립"],"hook":"총괄책임자는 도급 준 사업장 전체를 아우르는 「큰 결정」 담당. 검사장비 이력카드는 스스로 검사하니 스스로(사업주) 챙긴다.","why":"","mix":""}],"n":30,"rounds":20},{"id":"1-04","subject":"안전관리론","chapter":"재해조사 및 분석","big":"상해 분류","title":"근로손실일수와 상해 등급","topic3d":"","items":[{"name":"근로손실일수의 산정","facts":["사망·영구 전노동불능(1~3급) = 7,500일","7,500일 = 연 300일 × 25년","사망·영구 전노동불능은 300/365를 곱하지 않는다","휴업일수는 × 300/365로 환산"],"hook":"일 년에 300일 일하는 사람이 25년을 더 일할 수 있었다. 300 × 25 = 7,500. 「칠천오백 데이즈」는 이미 근로일이라 300/365를 또 곱하지 않는다.","why":"7,500일 자체가 근로일 기준이라 환산이 끝난 값이다.","mix":"휴업일수만 300/365를 곱한다. 사망에 곱하면 틀린다."},{"name":"ILO 재해 정도구분","facts":["영구 전노동불능 = 1~3급","영구 일부노동불능 = 4~14급(12급도 여기)","일시 전노동불능 = 일정 기간 정규 노동을 못 함"],"hook":"1~3급은 「전부」, 4~14급은 「일부」. 12급은 손가락 몇 개 잃은 정도라 일부다. 「영구인가 일시인가 × 전부인가 일부인가」 네 칸이다.","why":"","mix":""},{"name":"버드의 재해구성비율","facts":["버드 1 : 10 : 30 : 600","경상 20건이면 무상해·무사고는 1,200건"],"hook":"하나 크게, 열 작게, 서른 물건 부수고, 육백 번 아찔. 경상이 두 배(20)면 무상해도 두 배(1,200)다.","why":"","mix":"하인리히는 셋(1:29:300), 버드는 넷(1:10:30:600). 물적 손해 30이 버드에만 있다."},{"name":"무재해의 기준","facts":["업무에 기인한 사망 또는 4일 이상의 요양이 아니면 무재해","「2일」이 아니다"],"hook":"산재 신고도 4일, 무재해도 4일. 「사(4)일 넘으면 사고」다.","why":"","mix":"2일로 낮춘 보기는 더 엄격해 보여 그럴듯하지만 규정과 다르다."},{"name":"종합재해지수와 강도율","facts":["종합재해지수 FSI = √(도수율 × 강도율)","강도율은 1,000시간당 근로손실일수","영구 일부노동불능은 등급별 근로손실일수를 그대로 쓴다(300/365 안 곱함)"],"hook":"FSI는 「몇 번(F)」과 「며칠(S)」을 곱해 루트 씌운 것. 둘을 반반 섞은 평균이다.","why":"","mix":""},{"name":"특별안전보건교육(밀폐장소 용접)","facts":["밀폐장소 용접: 환기·질식·전격에 관한 사항","폭발한계점·발화점·인화점은 인화성 물질 교육","안전기(역화방지기)는 아세틸렌 용접 교육"],"hook":"좁고 막힌 데서 용접하면 숨 막히고(질식) 감전된다(전격). 「폭발·인화점」은 화학물질 창고 낱말이다.","why":"","mix":""},{"name":"그 밖에","facts":["시몬즈 비보험코스트에서 사망·영구 전노동불능은 제외","재해조사 단계에서는 잠재재해 위험요인의 색출"],"hook":"영구 전노동불능은 사실상 사망급이라 보험이 맡는다. 시몬즈의 비보험 셈에서는 빠진다.","why":"","mix":""}],"n":29,"rounds":19},{"id":"1-05","subject":"안전관리론","chapter":"안전보건교육","big":"교육 이론","title":"OJT·Off JT와 정형교육","topic3d":"","items":[{"name":"OJT와 Off JT","facts":["OJT = 현장에서 상사가 개별로, 현장 실정에 맞음","Off JT = 다수를 일괄, 외부 전문가, 체계적, 훈련에만 전념","「다수·일괄·조직적·전문 강사」가 보이면 Off JT"],"hook":"Off는 「일을 놓고(off)」 밖에서 떼로 배우는 것. 우리 현장·우리 상사·나 혼자면 OJT다.","why":"","mix":"「외부·전문가·다수·체계적」 낱말 하나라도 붙으면 Off JT다."},{"name":"안전교육의 3단계","facts":["지식교육 → 기능교육 → 태도교육","기능교육 = 스스로 행함으로써 습득","태도교육이 가장 어렵고 오래 걸린다"],"hook":"알고(지식) → 할 줄 알고(기능) → 늘 그렇게(태도). 「지기태」: 지기 싫으면 태도부터.","why":"","mix":""},{"name":"TWI","facts":["제일선 감독자 대상","10시간, 하루 2시간씩 5일","작업지도·작업방법·인간관계·작업안전"],"hook":"TWI = Ten hours. 하루 2시간씩 5일이면 딱 10시간. 일선(一線) 반장님 교육이다.","why":"","mix":"TWI 10시간, ATT·MTP 40시간, CCS 1주 4일 4시간씩."},{"name":"정형교육의 종류","facts":["TWI: 제일선 감독자, 10시간","MTP: 중간 관리층, 40시간","ATT: 대상 제한 없음, 1차 40시간","CCS: 최고경영층, 1주 4일 4시간씩"],"hook":"아래(TWI 10) → 가운데(MTP 40) → 누구나(ATT 40) → 꼭대기(CCS 4×4). 위로 갈수록 짧고 굵게 듣는다.","why":"","mix":""},{"name":"학습지도의 원리","facts":["자발성 · 개별화 · 사회화 · 통합 · 직관 · 목적","각자의 요구와 능력에 맞추면 개별화","계속성·계열성은 교육과정 조직의 원리(학습지도 원리 아님)"],"hook":"「스스로·저마다·함께·통째로·직접 보고·목표 알고」 여섯. 「계속·계열」은 커리큘럼 짜는 사람 말이라 여기 없다.","why":"","mix":"두 목록은 「통합성」에서만 겹친다."},{"name":"안전태도 형성의 요령","facts":["청취 · 이해 · 모범 · 평가 · 장려","금전적 보상은 요령이 아니다"],"hook":"「청이모평장」: 청소하는 이모, 평가하고 장려금. 돈(금전 보상)은 목록에 없다.","why":"태도는 마음의 문제라 듣고·알게 하고·보여 주고·인정해 주는 것으로 만든다.","mix":""}],"n":28,"rounds":19},{"id":"1-06","subject":"안전관리론","chapter":"안전보건교육","big":"학습이론","title":"학습이론과 동기부여","topic3d":"","items":[{"name":"프로그램 학습법","facts":["자신의 학습속도로 단독 학습","여러 수업 매체를 동시에 다양하게 활용하는 것은 장점이 아니다"],"hook":"혼자, 제 속도로, 문제집 넘기듯 배우는 것. 「매체 다양·교사 필요」가 보이면 다른 방법이다.","why":"","mix":""},{"name":"학습이론의 갈래","facts":["S-R 이론(자극-반응): 시행착오설, 조건반사설","인지이론: 장설 · 통찰설 · 기호형태설","파블로프 조건반사설에 「준비성의 원리」는 없다"],"hook":"자극(S)에 반응(R)이 붙는 건 시행착오와 개(조건반사). 「장·통찰·기호」는 머리로 깨닫는 인지파다.","why":"","mix":"보기 셋이 인지이론이면 남는 하나가 S-R이다."},{"name":"데이비스의 동기부여 이론","facts":["능력 = 지식 × 기능","동기유발 = 상황 × 태도","인간의 성과 = 능력 × 동기유발"],"hook":"곱하기 사다리다. 아래 두 칸(지식×기능, 상황×태도)을 또 곱하면 성과. 곱하기라 하나가 0이면 다 0이다.","why":"","mix":""},{"name":"동기유발의 방법","facts":["내적 동기유발: 요구 수준에 맞춘 교재","외적 동기유발: 경쟁·상벌·결과 알려주기","동기유발 수준을 과도하게 높이면 안 된다","자세는 동기유발요인이 아니다"],"hook":"밖에서 찌르는 것(경쟁·상벌·성적표)은 외적, 그 사람 안쪽에 맞춰 주는 것은 내적. 너무 세게 찌르면 역효과다.","why":"","mix":""},{"name":"안전교육의 단계(태도)","facts":["습관화·가치관 형성은 태도교육","지식 → 기능 → 태도 순서"],"hook":"「습관·가치관」이 나오면 태도교육. 늘 그렇게 하도록 마음에 새기는 마지막 단계다.","why":"","mix":""},{"name":"그 밖에","facts":["특성요인도(생선뼈)의 등뼈는 왼쪽에서 오른쪽으로"],"hook":"생선 머리(결과)는 오른쪽. 원인들이 왼쪽에서 흘러들어 오른쪽 머리로 모인다.","why":"","mix":""}],"n":26,"rounds":17},{"id":"1-07","subject":"안전관리론","chapter":"무재해운동","big":"무재해·위험예지","title":"위험예지 4라운드","topic3d":"","items":[{"name":"위험예지훈련 4라운드","facts":["1R 현상파악 → 2R 본질추구 → 3R 대책수립 → 4R 목표설정","원인결정은 4라운드에 없다(재해조사 낱말)"],"hook":"「현본대목」: 현장 본 대로 목표. 보고(현상) → 짚고(본질) → 세우고(대책) → 다짐한다(목표).","why":"","mix":"대책이 목표보다 앞이다. 순서를 뒤집은 보기가 함정이다."},{"name":"브레인스토밍의 4원칙","facts":["비판금지 · 자유분방 · 대량발언 · 수정발언","타인의 의견을 수정하여 발표할 수 있다"],"hook":"「비자대수」: 비자 없이 대수롭지 않게 떠든다. 비판 말고, 자유롭게, 많이, 고쳐 말해도 된다.","why":"","mix":""},{"name":"무재해운동 3원칙·3기둥","facts":["3원칙: 무의 원칙 · 참가의 원칙 · 선취의 원칙(대책선정 아님)","3기둥: 경영층 방침 · 라인화 · 자주활동(전 종업원 안전요원화 아님)"],"hook":"원칙은 「무참선」(없애고·함께·미리), 기둥은 「위·가운데·아래」 세 층. 「대책선정」은 재해예방 4원칙 것이다.","why":"","mix":""},{"name":"위험예지훈련의 종류","facts":["TBM 위험예지: 작업 직전 그 자리에서 5~15분, 5~6명","1인 위험예지: 삼각 + 원포인트를 혼자, 감수성 향상","원포인트 위험예지: 4라운드 중 한 가지만 2~3분","기본 4라운드는 팀 단위 10분 안팎"],"hook":"TBM은 연장통(Tool Box) 앞에서 대여섯이 5~15분. 삼각형 하나, 점(원포인트) 하나를 혼자 그리면 1인 위험예지다.","why":"","mix":"「삼각」과 「원포인트」 두 낱말이 같이 나오면 1인 위험예지다."},{"name":"무재해 판정","facts":["업무에 기인한 4일 이상의 요양이면 재해","정리정돈 중의 재해도 업무 마무리라 재해로 센다"],"hook":"「업무에 기인했나」 한 줄이 갈림선. 청소도 일의 끝이라 청소하다 다치면 무재해가 깨진다.","why":"","mix":""},{"name":"역할연기법","facts":["일정한 역할을 맡아 연기시켜 자기 역할을 인식","태도교육에 효과적"],"hook":"남의 자리에 서 보면 그 자리 마음을 안다. 「역할·연기」가 보이면 롤 플레잉이다.","why":"","mix":""}],"n":25,"rounds":24},{"id":"1-08","subject":"안전관리론","chapter":"산업심리","big":"부주의·착오","title":"바이오리듬과 부주의","topic3d":"","items":[{"name":"생체리듬(바이오리듬)","facts":["육체적 리듬 P = 23일, 청색 실선","감성적 리듬 S = 28일, 적색 점선","지성적 리듬 I = 33일, 녹색 일점쇄선","위험일은 (+)와 (−)의 교차점, 한 달에 약 6일"],"hook":"23·28·33, 5일씩 계단. 몸(P)이 제일 급하고 머리(I)가 제일 느리다. 「이삼·이팔·삼삼」 리듬으로 왼다.","why":"","mix":"감성 28과 지성 33을 바꿔 놓은 보기가 단골 함정이다."},{"name":"리듬의 색과 선","facts":["P 청색 실선","S 적색 점선","I 녹색 일점쇄선"],"hook":"몸(P)은 파란 힘줄 실선, 감정(S)은 붉게 콩닥콩닥 점선, 지성(I)은 초록 형광펜 일점쇄선.","why":"","mix":""},{"name":"야간의 생체 변화","facts":["야간에 체온·혈압·맥박은 내려간다","야간에 혈액의 수분·염분량은 올라간다","야간에 말초운동 기능은 저하된다(증가 아님)"],"hook":"밤엔 「돌아가는 것(체온·혈압·맥박)」은 꺼지고 「고여 있는 것(수분·염분)」은 찬다. 그래서 야간작업 사고가 잦다.","why":"","mix":""},{"name":"부주의의 현상","facts":["의식의 과잉 = 돌발사태에 순간 긴장, 판단 정지","감각차단현상 = 단조로운 업무의 감각 마비","의식수준 저하 = 피로·단조로움, Phase Ⅰ","억측판단 = 정보는 받았는데 「괜찮겠지」로 해석"],"hook":"「괜찮겠지」가 입에서 나오면 억측판단. 깜짝 놀라 얼어붙으면 의식의 과잉. 지루해서 멍하면 감각차단.","why":"","mix":"과잉은 「모자란」 것이 아니라 한 곳에 「몰린」 것이다."},{"name":"자동운동과 학습의 전이","facts":["자동운동: 빛이 약하고 기준이 없을 때 광점이 움직여 보임","학습의 전이: 앞의 학습이 뒤의 학습에 영향(긍정·부정)","플리커 검사 = 피로의 정도 측정"],"hook":"깜깜한 방에 작은 불빛 하나. 견줄 기준이 없으니 눈 떨림이 불빛 움직임으로 보인다. 전이(轉移)는 옛 습관이 새 방법에 옮겨 붙는 것이다.","why":"","mix":""},{"name":"피로의 회복","facts":["휴식과 수면이 으뜸","피로는 쓴 것을 되돌려 놓는 일"],"hook":"피로 회복 1등은 잠. 나머지는 거들 뿐이다.","why":"","mix":""}],"n":20,"rounds":15},{"id":"1-09","subject":"안전관리론","chapter":"재해조사 및 분석","big":"재해율 계산","title":"도수율·강도율 셈법","topic3d":"","items":[{"name":"연천인율과 도수율","facts":["연천인율 = 도수율 × 2.4","2.4는 1인 연간 2,400시간(8시간 × 300일)에서 나온다","연천인율이 도수율보다 크다"],"hook":"하루 8시간 × 300일 = 2,400시간, 그래서 2.4. 천 명당 사람 수(연천인율)가 백만 시간당 건수(도수율)보다 크니 곱한다.","why":"","mix":"도수율 → 연천인율은 ×2.4, 반대는 ÷2.4."},{"name":"도수율과 강도율","facts":["도수율 = 100만 시간당 재해 건수","강도율 = 1,000시간당 근로손실일수","강도율 2.0 = 1,000시간당 2.0일 손실"],"hook":"도수율은 「몇 번」(백만), 강도율은 「며칠」(천). 강한 놈(강도율)이 분모가 작다.","why":"","mix":"강도율이 「건」으로 적힌 보기는 그것만으로 오답이다."},{"name":"환산도수율·환산강도율","facts":["평생 근로시간 10만 시간 기준","환산도수율 = 도수율 ÷ 10","환산강도율 = 강도율 × 100"],"hook":"「도십 강백」: 도수율은 백만→십만이라 ÷10, 강도율은 천→십만이라 ×100.","why":"기준 시간을 평생 10만 시간으로 바꾸는 비율이다.","mix":""},{"name":"근로손실일수와 분모","facts":["근로손실일수 = 강도율 × 연근로시간 ÷ 1,000","결근시간은 총근로시간에서 뺀다","종합재해지수 = √(도수율 × 강도율)"],"hook":"240만 시간은 1,000시간짜리 2,400묶음. 강도율 0.4면 0.4 × 2,400 = 960일. 결근한 3%는 일 안 했으니 뺀다.","why":"","mix":""}],"n":20,"rounds":16},{"id":"1-10","subject":"안전관리론","chapter":"산업심리","big":"인간의 행동","title":"레빈·매슬로·맥그리거","topic3d":"","items":[{"name":"레빈의 법칙","facts":["B = f(P · E)","B = 행동(Behavior)","P = 소질·개체(연령·성격·지능)","E = 환경(작업환경)"],"hook":"「비(B)는 피(P)와 이(E)의 함수」. 사람 P는 못 바꾸니 안전관리는 환경 E를 손본다.","why":"행동은 사람 탓만도 환경 탓만도 아니다.","mix":"보기 셋이 사람 속성이면 남는 하나가 E(환경)다."},{"name":"매슬로우의 욕구단계","facts":["1 생리 → 2 안전 → 3 사회적 → 4 존경 → 5 자아실현","제2단계 = 안전에 대한 욕구","자아실현: 편견 없이 수용, 사생활 즐김, 창의적"],"hook":"「생안사존자」: 생존부터 자아까지 1층에서 5층으로 올라간다. 배부르면(생리) 안전을, 그다음 친구를, 인정을, 마지막에 나 자신을 찾는다.","why":"","mix":""},{"name":"맥그리거의 X·Y 이론","facts":["X이론: 권위 · 명령 · 통제 · 감독 · 상부책임","Y이론: 목표에 의한 관리 · 분권 · 위임 · 자율"],"hook":"X는 팔짱 끼고 감시(권위·명령·통제), Y는 Yes 하고 믿고 맡김(목표·위임·자율).","why":"","mix":""},{"name":"안전교육의 8원칙","facts":["쉬운 것에서 어려운 것으로","아는 것에서 모르는 것으로","가까운 것에서 먼 것으로","오감 활용: 시각 60% · 청각 20% · 촉각 15%"],"hook":"눈 60, 귀 20, 손 15. 「육이일오」. 가르치는 차례는 늘 쉬운→어려운, 아는→모르는이고 뒤집으면 함정이다.","why":"","mix":""}],"n":20,"rounds":14},{"id":"1-11","subject":"안전관리론","chapter":"산업심리","big":"적성·검사","title":"재해 누발자와 적성","topic3d":"","items":[{"name":"재해 누발자의 유형","facts":["상황성 누발자 = 설비의 결함 등 밖의 조건","소질성 누발자 = 도덕성 결여 등 그 사람의 성질","도덕성 결여는 상황성이 아니라 소질성"],"hook":"「상밖소안」: 상황은 밖(설비·환경), 소질은 안(성격·도덕). 기계가 고장이면 상황, 사람이 문제면 소질.","why":"","mix":""},{"name":"적성의 기본요소","facts":["직업적성 · 지능 · 흥미 · 인간성","연령은 적성의 요인이 아니다","직업적성검사 항목에 촉각 적응력은 없다"],"hook":"적성은 「그 사람 안」에 있는 것. 나이(연령)는 시간이 주는 것이라 적성이 아니다. 만져 보는 촉각도 목록에 없다.","why":"","mix":""},{"name":"감각기별 반응시간","facts":["청각 0.17초 < 촉각 0.18초 < 시각 0.20초 < 미각 0.29초 < 통각 0.70초"],"hook":"귀가 제일 빠르고(0.17) 아픔이 제일 느리다(0.70). 「귀·손·눈·혀·아야」 순서.","why":"","mix":""},{"name":"재해손실비의 직접비·간접비","facts":["직접비 = 산재보험 급여","채용급여는 직접비가 아니다(간접비, 인적손실)","간접비 = 인적·물적·생산·특수·기타 손실, 직접비의 4배"],"hook":"보험에서 나오면 직접비, 회사가 따로 무는 돈이면 간접비. 새 사람 뽑는 돈은 보험이 안 준다.","why":"","mix":""},{"name":"그 밖에","facts":["채용 시 교육은 오늘 당장 알 것, 작업환경 관리는 정기교육","인사관리의 목적은 적재적소(사람과 일의 관계)","안전점검보고서에 안전관리 스텝 인적사항은 없다"],"hook":"인사(人事)는 글자 그대로 「사람과 일」. 맞는 사람을 맞는 자리에 앉히는 것이다.","why":"","mix":""}],"n":19,"rounds":14},{"id":"1-12","subject":"안전관리론","chapter":"보호구","big":"호흡·눈·귀","title":"방독마스크 등급과 색","topic3d":"","items":[{"name":"방독마스크의 등급","facts":["고농도: 100분의 2(2%) 이하, 전면형","중농도: 100분의 1(1%) 이하, 전면형 또는 반면형","저농도·최저농도: 100분의 0.1(0.1%) 이하, 긴급용 아님"],"hook":"2 · 1 · 0.1. 고농도 2, 중농도 1, 저농도는 소수점 한 칸 뚝(0.1). 0.5로 고르게 놓은 보기가 함정이다.","why":"","mix":""},{"name":"산소결핍 작업의 보호구","facts":["산소결핍 장소에는 송기마스크","방독마스크·방진마스크는 산소결핍에 금물"],"hook":"산소가 없는 데서 걸러(정화) 봐야 남는 게 없다. 그러니 밖에서 공기를 보내 준다(송기).","why":"정화식은 거르는 것, 송기식은 보내 주는 것이다.","mix":""},{"name":"방독마스크의 종류와 시험가스","facts":["할로겐용 시험가스 = 염소(Cl₂), 수소가 아니다","유기화합물용 시험가스에 염소는 없다","정화통 색: 유기 갈색 · 암모니아 녹색 · 아황산 노랑 · 나머지 회색"],"hook":"할로겐 가족 대표선수는 염소. 정화통 색은 「유갈·암녹·아황노」, 기름때는 갈색, 풀(암모니아)은 녹색, 유황은 노랑.","why":"","mix":""},{"name":"방진마스크의 선정기준","facts":["여과효율은 높게","흡·배기저항, 사용적, 중량은 낮게","시야는 넓게, 하방시야 60° 이상"],"hook":"「높을 것」은 여과효율 하나뿐. 나머지는 다 작고 가볍고 편해야 한다. 「사용적이 크다」는 유일하게 커지는 쪽이라 눈에 걸린다.","why":"","mix":""},{"name":"재해원인의 4M과 3E","facts":["4M = Man · Machine · Media · Management","5M은 Mission을 더한다","3E = Engineering(기술) · Education(교육) · Enforcement(관리·독려)"],"hook":"Machine을 Mechanism으로 바꿔치기하는 것이 함정. 3E는 「기술로 막고, 가르치고, 지키게 한다」.","why":"","mix":""},{"name":"그 밖에","facts":["차광용 보안경: 자외선용 · 적외선용 · 복합용 · 용접용","선반작업에 장갑 착용은 오답"],"hook":"차광 보안경 넷은 「자·적·복·용」. 선반은 회전체라 장갑이 말려 들어간다.","why":"","mix":""}],"n":17,"rounds":16},{"id":"1-13","subject":"안전관리론","chapter":"재해조사 및 분석","big":"재해 발생 이론","title":"4원칙과 도미노 이론","topic3d":"","items":[{"name":"재해예방의 4원칙","facts":["손실우연 · 원인계기 · 예방가능 · 대책선정","손실은 우연, 원인은 필연","연쇄성·사전준비의 원칙은 4원칙이 아니다"],"hook":"「손원예대」: 손이 원래 예쁜 대학생. 손실은 우연히, 원인은 반드시, 예방은 되고, 대책은 있다.","why":"","mix":"「연쇄성」은 도미노 이론 낱말이라 4원칙에 끼면 오답이다."},{"name":"하인리히의 도미노 이론","facts":["사회적 환경 → 개인적 결함 → 불안전 행동·상태 → 사고 → 재해","3단계(불안전 행동·상태)를 제거하면 재해를 막는다","재해 이론의 α = 잠재된 위험의 상태"],"hook":"「사개불사재」: 사과 든 개가 불 속으로, 사고, 재해. 셋째 골패(불안전)를 빼면 넘어지지 않는다.","why":"","mix":""},{"name":"버드의 신 도미노 이론","facts":["제어(관리)부족 → 기본원인(기원) → 직접원인(징후) → 사고(접촉) → 상해(손실)","1단계(관리의 부족)를 제거해야 한다","간접원인(평가)은 버드의 5단계에 없다"],"hook":"「제기직사상」: 제기차기 직전 사상 최고. 하인리히는 셋째를, 버드는 첫째(관리)를 빼라 한다.","why":"버드는 더 근본(관리)까지 거슬러 올라갔다.","mix":"하인리히 3단계 제거, 버드 1단계 제거. 둘의 결정적 차이다."},{"name":"아담스의 사고연쇄 반응이론","facts":["관리자·감독자의 관리적 잘못 = 작전적 에러","작업자의 잘못 = 전술적 에러"],"hook":"작전은 지휘관(관리자·감독자)이 짜고, 전술은 병사(작업자)가 편다.","why":"","mix":""}],"n":17,"rounds":14},{"id":"1-14","subject":"안전관리론","chapter":"재해조사 및 분석","big":"재해 손실비","title":"하인리히 1:4와 시몬즈","topic3d":"","items":[{"name":"하인리히의 재해손실비","facts":["직접비 : 간접비 = 1 : 4","총 손실 = 직접비의 5배","간접비 = 설비 수리·생산 중단·신규 채용·시간 손실"],"hook":"빙산이다. 물 위 1(직접비), 물밑 4(간접비), 합쳐 5배. 간접비만 물으면 4배, 총액이면 5배다.","why":"","mix":"직접비 8,000만원이면 간접비 32,000만원, 총 40,000만원. 4배 보기가 함정이다."},{"name":"시몬즈의 재해손실비","facts":["총 재해코스트 = 보험코스트 + 비보험코스트","비보험코스트는 4가지 재해(휴업·통원·응급조치·무상해)로 나눠 계수를 곱한다","산재보험으로 보상된 금액은 비보험코스트가 아니다"],"hook":"시몬즈는 보험쟁이라 「보험 + 비보험」. 하인리히는 「직접 + 간접」 어림셈.","why":"","mix":""},{"name":"하인리히 재해구성비율의 %","facts":["1 : 29 : 300, 합계 330","29 ÷ 330 = 8.8%","1 = 0.3%, 300 = 90.9%"],"hook":"분모는 330(합). 29를 300으로 나누면 9.7%가 나와 함정에 빠진다. 660건이면 ×2로 2 · 58 · 600.","why":"","mix":"버드 1:10:30:600도 짝으로 잡아 둔다."},{"name":"강의법의 특징","facts":["많이·빨리·싸게 가르친다","개개인의 학습진도를 조절할 수 없다"],"hook":"한 사람이 여럿에게 말하는 방식이라 「개개인」이라는 낱말이 나오면 강의법이 아니다.","why":"","mix":"개인차를 살리는 것은 프로그램 학습법이나 OJT다."}],"n":15,"rounds":10},{"id":"1-15","subject":"안전관리론","chapter":"재해조사 및 분석","big":"재해조사·통계","title":"재해조사 절차와 통계 기법","topic3d":"","items":[{"name":"재해조사의 목적","facts":["원인을 찾아 재발을 막는 것","책임 추궁·담당자 평가 자료로 쓰지 않는다"],"hook":"사람을 탓하면 다음부터 사고를 숨긴다. 「책임·평가·문책」 낱말이 보이면 오답이다.","why":"","mix":""},{"name":"산업재해 기록·보존과 보고","facts":["기록 4항목: 개요·인적사항, 일시·장소, 원인·과정, 재발방지 계획","보존기간 3년","4일 이상 요양 재해는 발생일부터 1개월 이내 산업재해조사표 제출"],"hook":"「누가·언제어디·왜·다음엔」 넷을 적어 3년 보관. 신고는 한 달 안에.","why":"","mix":""},{"name":"재해 발생 시 조치 순서","facts":["긴급처리 → 재해조사 → 원인분석 → 대책수립 → 실시계획 → 실시 → 평가"],"hook":"사람 먼저 살린다. 긴급처리가 언제나 1번. 조사보다 원인이 앞서면 말이 안 된다.","why":"","mix":""},{"name":"재해통계 분석기법","facts":["파레토도 = 큰 순서대로 막대","특성요인도 = 생선뼈, 왼쪽에서 오른쪽으로","크로스(클로즈)분석 = 두 요인의 관계를 표로","관리도 = 추이에 한계선을 설정","분포도는 네 기법에 없다"],"hook":"그림 모양으로 왼다. 막대는 파레토, 뼈다귀는 특성요인, 바둑판 표는 크로스, 꺾은선에 한계선은 관리도.","why":"","mix":""},{"name":"산업재해 통계의 활용","facts":["통계는 제도를 고치는 데 쓴다","관리자 평가·인책에 쓰면 통계가 감춰진다"],"hook":"통계로 사람을 때리면 다음 통계는 거짓말이 된다.","why":"","mix":""}],"n":15,"rounds":12},{"id":"1-16","subject":"안전관리론","chapter":"산업심리","big":"집단·리더십","title":"헤드십·리더십과 관리그리드","topic3d":"","items":[{"name":"헤드십과 리더십","facts":["헤드십: 임명된 자리의 힘, 권한 근거는 공식적, 상사·부하 간격 넓음, 권위적","리더십: 따르게 만든 사람의 힘, 개인적 영향, 간격 좁음, 민주적"],"hook":"헤드십은 머리(head) 위에서 꽂아 준 자리, 리더십은 사람이 따라와서 생긴 힘. 그래서 헤드십은 멀고 딱딱하다.","why":"","mix":"「개인적 영향」·「비공식」이 헤드십 특성으로 적혀 있으면 오답이다."},{"name":"관리그리드 이론","facts":["앞 숫자 = 생산(과업) 관심, 뒤 숫자 = 인간 관심","9.1 = 과업형, 1.9 = 인기형","5.5 = 타협형(가운데), 9.9 = 이상형","3.3은 타협형이 아니다"],"hook":"(생산, 인간). 9.1은 일만 시키는 과업형, 1.9는 사람만 챙기는 인기형, 한가운데 5.5가 타협, 둘 다 9면 이상형.","why":"격자가 1~9라 가운데는 5다.","mix":""},{"name":"리더십 이론의 발전","facts":["특성이론 → 행동이론 → 상황이론","성공한 리더의 특성을 찾는 것이 특성이론"],"hook":"타고난 자질을 찾다가(특성), 행동을 보다가(행동), 결국 때와 곳에 달렸다(상황)로 옮겨 갔다.","why":"","mix":""},{"name":"사회행동의 기본 형태와 집단의 기능","facts":["사회행동: 협력 · 대립 · 도피 · 융합","집단의 기능: 집단 목표 · 규범 · 응집력","모방·암시·동일화는 사회행동 형태가 아니다"],"hook":"함께(협력)·맞서(대립)·물러나(도피)·섞여(융합), 상대와의 거리 넷이다. 집단은 「목표·규범·끈끈함」 셋으로 산다.","why":"","mix":""}],"n":14,"rounds":13},{"id":"1-17","subject":"안전관리론","chapter":"안전보건교육","big":"토의법","title":"토의 기법 이름 맞추기","topic3d":"","items":[{"name":"버즈 세션","facts":["6-6 회의 = 6명이 6분","참가자 다수일 때 전원 참여시키는 소집단 방법"],"hook":"버즈(buzz)는 벌 윙윙. 6명이 6분 동안 윙윙거리면 버즈 세션이다.","why":"","mix":""},{"name":"심포지엄·포럼·패널","facts":["심포지엄: 전문가 여럿이 발표한 뒤 참가자가 질문","패널 디스커션: 패널 4~5명이 토의한 뒤 청중과 질의","포럼: 발표는 짧고 청중이 주인공"],"hook":"심포지엄은 전문가들의 「심」포니 연주 뒤 질문, 패널은 무대 위 4~5명 토론, 포럼은 객석이 주인공.","why":"","mix":""},{"name":"롤 플레잉","facts":["일정한 역할을 주어 연기시켜 자기 역할을 인식","태도교육에 효과적"],"hook":"「역할·연기」 두 낱말이 보이면 롤 플레잉. 남 자리에 서 보면 그 마음을 안다.","why":"","mix":""},{"name":"재해사례연구의 순서","facts":["사실의 확인 → 문제점의 발견 → 대책수립","사실 확인이 언제나 첫걸음"],"hook":"무슨 일이 있었나(사실) → 뭐가 잘못됐나(문제점) → 어떻게 할까(대책).","why":"","mix":""},{"name":"모랄 서베이의 태도조사법","facts":["질문지법 · 면접법 · 집단토의법 · 투사법","관찰법·통계법은 태도조사법이 아니다"],"hook":"「질면집투」: 본인 입으로 듣는 넷. 관찰은 밖에서 보는 것, 통계는 기록을 뒤지는 것이라 빠진다.","why":"","mix":""},{"name":"버드의 도미노 이론(재)","facts":["버드의 직접원인은 징후","버드는 첫째 골패(관리의 부족)를 빼라 한다"],"hook":"하인리히는 셋째 골패, 버드는 첫째 골패. 「징후」라는 낱말은 버드의 직접원인이다.","why":"","mix":""}],"n":14,"rounds":13},{"id":"1-18","subject":"안전관리론","chapter":"안전점검·인증","big":"안전인증·검사","title":"안전검사 주기와 인증 대상","topic3d":"approach","items":[{"name":"안전검사의 주기","facts":["크레인·리프트·곤돌라: 설치 끝난 날부터 3년 이내 최초, 그 뒤 2년마다","건설현장의 크레인·리프트·곤돌라는 6개월마다","이동식 크레인·이삿짐운반용 리프트·고소작업대: 신규등록 후 3년 이내 최초, 그 뒤 2년마다","프레스·전단기·압력용기·원심기·롤러기 등도 3년 이내 최초, 2년마다"],"hook":"「삼이(3·2)」 검사: 처음 3년, 그 뒤 2년. 공사판 크레인만 반년(6개월)마다.","why":"건설현장은 옮겨 다니고 험하게 써서 짧다.","mix":""},{"name":"자율검사프로그램","facts":["안전검사 주기의 2분의 1마다 검사","인정 유효기간 2년","공단은 신청서 접수 후 15일 이내 인정 여부 결정","안전인증 확인 주기는 3년 이하"],"hook":"남의 검사를 안 받는 대신 두 배 자주(주기의 1/2) 본다. 인정은 2년짜리, 결정은 보름(15일).","why":"","mix":""},{"name":"절연장갑의 등급 색상","facts":["00등급 갈색 · 0등급 빨강 · 1등급 흰색 · 2등급 노랑 · 3등급 녹색 · 4등급 등색","직류 시험값은 교류값의 1.5배"],"hook":"「갈빨흰노녹등」: 갈비 빨리, 흰 노래, 녹색 등불. 00부터 4까지 여섯 색.","why":"","mix":"보기가 색을 한 칸씩 밀어 놓는다. 00 = 갈색만 제자리인지 본다."},{"name":"안전인증 대상 기계","facts":["프레스 · 전단기 · 크레인 · 리프트 · 곤돌라 · 압력용기 · 롤러기 · 사출성형기 · 고소작업대","연삭기는 안전인증 대상이 아니다(덮개 등 방호장치만 자율안전확인)"],"hook":"「프전크리곤압롤사고」 아홉 글자. 연삭기·둥근톱·수동대패는 기계가 아니라 「덮개」가 대상이다.","why":"","mix":""},{"name":"안전검사 대상 기계","facts":["아크용접기는 안전검사 대상이 아니다","크고 오래 쓰는 설비가 대상"],"hook":"안전검사는 쓰는 동안 주기적으로 받는 것. 용접기 자체가 아니라 거기 붙이는 전격방지기가 규제 대상이다.","why":"","mix":""},{"name":"안전모의 성능기준","facts":["내관통성 · 충격흡수성 · 내전압성 · 내수성 · 난연성 · 턱끈","내열성은 항목이 아니다(난연성)","내수성 질량 증가율 1% 미만, AE·ABE만 시험"],"hook":"「뚫림·충격·전압·물·불·턱끈」 여섯. 불은 「난연」이지 「내열」이 아니다. 한 글자 바꿔치기가 함정.","why":"","mix":""}],"n":14,"rounds":14},{"id":"1-19","subject":"안전관리론","chapter":"보호구","big":"안전모·안전대","title":"표지 색도와 안전모 시험","topic3d":"","items":[{"name":"안전보건표지의 색도기준","facts":["흰색 N9.5, 검은색 N0.5","빨간색 7.5R 4/14 (화학물질 취급장소의 유해·위험 경고)","N은 무채색, 뒤 숫자가 명도"],"hook":"N9.5는 밝기 9.5점, 거의 흰색. N0.5는 0.5점, 거의 검정. 두 값을 바꿔 놓은 보기가 단골 함정이다.","why":"","mix":""},{"name":"안전보건표지의 종류와 색","facts":["빨강 금지 · 노랑 경고 · 파랑 지시 · 녹색 안내","금연은 금지표지","경고는 노랑이지만 화학물질 유해·위험 경고만 빨강"],"hook":"독극물 딱지는 빨갛다. 경고 중 「화학물질」만 노랑이 아니라 빨강이다. 「~착용」은 시키니 지시, 「비상구」는 알려 주니 안내.","why":"","mix":""},{"name":"표지의 개수","facts":["금지 8 · 경고 15 · 지시 9 · 안내 8","접촉금지는 금지표지에 없다(고온·저온·부식성 경고 쪽 낱말)"],"hook":"8·15·9·8: 광복절(8·15)에 구팔(9·8). 「접촉」은 뜨겁고 차갑고 녹이는 경고 낱말이다.","why":"","mix":""},{"name":"안전모의 성능시험","facts":["AE·ABE종만 내전압성·내수성 시험","내전압성: 교류 20kV에서 1분간 견디고 누설전류 10mA 이하","내수성: 질량 증가율 1% 미만","증가율 = 늘어난 몫 ÷ 처음 값"],"hook":"E는 Electric. E 붙은 모자만 전기 시험. 물 먹으면 전기가 통하니 젖는 시험도 같이. 410 ÷ 400 = 102.5%는 증가율이 아니라 「몇 %인가」다.","why":"","mix":""}],"n":13,"rounds":10},{"id":"1-20","subject":"안전관리론","chapter":"안전보건관리 체제","big":"안전조직","title":"라인·스태프 조직 규모","topic3d":"","items":[{"name":"안전관리 조직의 유형과 규모","facts":["라인형: 100명 미만, 지시가 빠르고 명령계통 간단, 전문성 낮음","스태프형: 100~1,000명, 전문성 높음, 생산부문에 권한 없어 실시 늦음","라인·스태프형: 1,000명 이상, 계획은 스태프·실행은 라인, 명령계통과 조언이 혼동"],"hook":"문턱은 100과 1,000 둘뿐. 백 명 아래 줄 하나(라인), 천 명 아래 참모(스태프), 천 넘으면 둘 다. 「500명·중규모」는 미끼.","why":"","mix":"스태프형은 「따로 논다」, 라인·스태프형은 「겹쳐 헷갈린다」. 단점이 서로 다르다."},{"name":"라인·스태프형의 특징","facts":["안전계획·평가·조사는 스태프에서, 생산기술의 안전대책은 라인에서","생산부문이 반드시 책임을 진다","가장 이상적인 형태"],"hook":"머리는 스태프, 손발은 라인. 계획은 참모가 짜고 실행은 현장이 한다.","why":"","mix":""},{"name":"안전관리조직의 목적","facts":["재해를 미리 막는 것","재해손실의 산정 및 작업통제는 목적이 아니다"],"hook":"조직은 「미리 막기」. 손실 셈은 이미 난 뒤 이야기라 방향이 반대다.","why":"","mix":""},{"name":"산업재해 통계의 성격","facts":["통계는 대체적인 경향을 보여 줄 뿐 정밀자료가 아니다"],"hook":"재해엔 우연이 섞여 숫자를 정밀하게 믿을 수 없다. 「정밀자료」라고 적힌 보기가 오답.","why":"","mix":""}],"n":12,"rounds":10},{"id":"1-21","subject":"안전관리론","chapter":"안전점검·인증","big":"안전점검","title":"안전점검의 종류와 방법","topic3d":"","items":[{"name":"안전점검의 종류","facts":["일상(수시)점검: 늘, 작업 전·중·후","정기점검: 주·월·분기 등 지정된 날짜","특별점검: 천재지변·이상사태·신설·개조 뒤","임시점검: 이상이 보일 때 갑자기"],"hook":"「일정특임」: 일정(日程)이 특임(特任). 태풍 지나가면 특별, 이상한 낌새면 임시.","why":"","mix":"밖에서 온 사건이면 특별, 안에서 느낀 징후면 임시다."},{"name":"안전점검의 방법","facts":["육안점검 = 부식·마모","작동점검 · 기기점검(검지기·온도계) · 정밀점검(분해)"],"hook":"눈·손(작동)·계기·분해 넷. 해머는 소리로, 검지기는 눈금으로 보니 육안이 아니다.","why":"","mix":""},{"name":"안전점검의 유의사항","facts":["강평은 결함과 잘된 점을 함께","일상점검 작업 전 항목에 생산품질은 없다"],"hook":"점검은 「고치자」지 「혼내자」가 아니다. 결함만 지적하면 다음엔 숨긴다.","why":"","mix":""},{"name":"안전점검표(체크리스트)","facts":["점검 전에 만드는 양식","조치「사항」은 담고 조치「결과」는 담지 않는다"],"hook":"무엇을 할지(사항)는 미리 적고, 무엇을 했는지(결과)는 하고 나서 적는다.","why":"","mix":""}],"n":10,"rounds":10},{"id":"1-22","subject":"안전관리론","chapter":"재해조사 및 분석","big":"재해 발생 형태","title":"직접원인과 기인물·가해물","topic3d":"","items":[{"name":"재해의 직접원인과 간접원인","facts":["직접원인 = 인적(불안전 행동) · 물적(불안전 상태) 둘뿐","기술·교육·관리 등 나머지는 간접원인","하인리히: 불안전 행동 88% · 불안전 상태 10% · 불가항력 2%"],"hook":"사고 나는 「그 순간」에 있던 것만 직접. 88·10·2는 「팔팔한 사람이 88% 사고 친다」.","why":"","mix":"「물적 원인」이 간접원인 보기에 끼어 있으면 그것이 답이다."},{"name":"기인물과 가해물","facts":["기인물 = 사고가 비롯된 것(선반 전체)","가해물 = 몸에 닿아 다치게 한 것(튄 부분)"],"hook":"기인물은 「어디서 시작」, 가해물은 「무엇에 맞았나」. 뿌리는 기인물, 닿은 것은 가해물.","why":"","mix":""},{"name":"불안전한 행동과 상태","facts":["사람이 「~한다」면 행동, 물건이 「~하다」면 상태","보호구 미착용은 행동, 보호구 불량은 상태"],"hook":"주어가 사람이면 행동, 물건이면 상태.","why":"","mix":""},{"name":"행동 변화에 걸리는 시간","facts":["지식 → 태도 → 개인행위 → 집단행위 순으로 오래 걸린다"],"hook":"머리(지식)는 금방, 마음(태도)은 좀, 몸(개인행위)은 더, 우리 모두(집단)는 제일 오래.","why":"안전문화가 가장 더딘 까닭이다.","mix":""}],"n":9,"rounds":9},{"id":"1-23","subject":"안전관리론","chapter":"안전보건관리 체제","big":"안전보건관리규정","title":"관리규정과 개선계획 기한","topic3d":"","items":[{"name":"안전보건관리규정","facts":["작성 대상: 상시근로자 100명 이상(제조업 등) 또는 300명 이상(그 밖)","사유 발생일부터 30일 이내 작성","내용: 조직 · 교육 · 작업장 안전보건관리 · 사고조사 · 그 밖","생산관리·MSDS는 규정 내용이 아니다"],"hook":"「조교관사」 넷에 그 밖. 조직·교육·관리·사고조사. 생산 이야기는 다른 규정 몫이다.","why":"","mix":""},{"name":"안전보건개선계획","facts":["대상: 재해율이 동종 평균의 2배 이상, 중대재해, 직업성 질병자 연 2명 이상(1천 명 이상은 3명), 노출기준 초과","계획서 제출: 명령 받은 날부터 60일 이내","심사·결과 통보: 접수일부터 15일 이내","중점개선 항목: 시설 · 기계장치 · 작업방법 · 안전보건교육(보호구 착용 아님)"],"hook":"「삼십 만들고 육십 내고 십오 본다」: 규정은 30일 안에, 개선계획서는 60일 안에, 심사는 15일. 개선 넷은 딱딱한 셋 + 사람(교육) 하나.","why":"계획을 세우는 쪽이 오래 걸리고 심사는 짧다.","mix":"보호구는 마지막 수단이라 「개선」 항목이 아니다."},{"name":"함께 나오는 기한","facts":["유해위험방지계획서: 제조업 15일 전, 건설업 착공 전날","공정안전보고서: 착공 30일 전"],"hook":"계획서는 보름 전(제조), 전날(건설). 공정안전보고서는 한 달 전.","why":"","mix":""}],"n":7,"rounds":7},{"id":"1-24","subject":"안전관리론","chapter":"안전보건관리 체제","big":"도급·중대재해","title":"중대재해의 범위","topic3d":"","items":[{"name":"중대재해의 범위","facts":["사망자 1명 이상","3개월 이상 요양이 필요한 부상자 동시 2명 이상","부상자 또는 직업성 질병자 동시 10명 이상","「1개월 요양 5명」은 중대재해가 아니다"],"hook":"「일·이·십, 석 달」: 한 명 죽거나, 석 달 다친 둘, 열 명 다치면 중대. 1개월 5명은 두 문턱 다 못 넘는 미끼.","why":"","mix":"3개월 부상자 1명 + 2개월 4명도 아니다. 기간과 인원이 둘 다 맞아야 한다."},{"name":"중대재해 보고","facts":["사업주는 알게 된 즉시 지체 없이 관할 지방고용노동관서장에게 보고"],"hook":"중대재해는 「지체 없이」. 하루도 이틀도 아니고 바로.","why":"","mix":""},{"name":"아차사고","facts":["사고가 나도 손실을 전혀 수반하지 않는 것","near는 「가까이 갈 뻔」이지 「가까운 곳」이 아니다"],"hook":"「하마터면!」이 아차사고. 장소가 아니라 순간이다.","why":"","mix":""}],"n":5,"rounds":5},{"id":"1-25","subject":"안전관리론","chapter":"안전보건교육","big":"법정 교육시간","title":"법정 교육시간 숫자","topic3d":"","items":[{"name":"채용 시·작업내용 변경 시 교육","facts":["채용 시: 일용근로자 1시간 이상, 그 밖 8시간 이상","작업내용 변경 시: 일용근로자 1시간 이상, 그 밖 2시간 이상"],"hook":"「팔·이·십육(8·2·16)」: 처음은 길게(8), 바꿀 땐 짧게(2), 위험작업은 두 배(16). 일용직은 뭐든 1시간, 「일용은 일(1)」.","why":"","mix":""},{"name":"정기교육(2023.9.27 개정)","facts":["사무직·판매직 매반기 6시간 이상","그 밖의 근로자 매반기 12시간 이상","관리감독자 연간 16시간 이상","옛 「매분기 3시간·6시간」은 지금 기준이 아니다"],"hook":"분기에서 반기로 바뀌며 숫자가 두 배. 사무직 6, 현장 12, 감독자 연 16.","why":"","mix":"옛 기출의 「매분기 3시간」은 개정 전 값이다."},{"name":"특별교육","facts":["대상 39가지 유해·위험작업","16시간 이상(단기간·간헐적 작업은 2시간 이상)","동바리 작업 교육에 비계 조립순서는 없다","타워크레인 신호작업 교육에 걸고리·와이어로프 점검은 없다"],"hook":"특별교육은 「그 작업 특유의 위험」만. 동바리 물었는데 비계, 신호수 물었는데 점검이면 남의 작업이다.","why":"","mix":"작업 순서·동선은 채용 시 교육, 관리감독자 정기교육이 아니다."}],"n":4,"rounds":4},{"id":"1-26","subject":"안전관리론","chapter":"기계 일반","big":"동력전달·통로","title":"프레스 작업시작 전 점검","topic3d":"","items":[{"name":"프레스 작업시작 전 점검사항","facts":["클러치·브레이크 기능","크랭크축·플라이휠·슬라이드·연결봉·연결나사 풀림","1행정 1정지기구·급정지장치·비상정지장치 기능","슬라이드·칼날 상태, 금형·고정볼트 상태, 방호장치 기능","언로드밸브는 공기압축기 점검사항"],"hook":"「밸브」가 보이면 프레스가 아니라 공기압축기. 프레스엔 밸브가 없고 클러치와 브레이크가 있다.","why":"","mix":""}],"n":2,"rounds":2},{"id":"1-27","subject":"안전관리론","chapter":"보호구","big":"보호구 일반","title":"보호구는 마지막 수단","topic3d":"","items":[{"name":"위험관리 대책의 우선순위","facts":["위험 제거 · 공학적 대책이 위, 보호구는 맨 아래","보호구의 사용은 소극적 대책"],"hook":"보호구는 벗으면 끝, 위험은 그대로 남는다. 그래서 언제나 꼴찌(소극적).","why":"","mix":""},{"name":"특별교육 내용 가르기","facts":["산소농도 측정은 밀폐공간 작업 교육","폭발범위·인화점은 화학설비 교육","방사선 작업 교육에 산소농도는 없다"],"hook":"「산소」가 나오면 밀폐공간, 「폭발·인화」가 나오면 화학설비. 방사선실엔 산소계가 없다.","why":"","mix":""}],"n":2,"rounds":2},{"id":"1-28","subject":"안전관리론","chapter":"안전보건표지","big":"표지","title":"표지 그림 크기","topic3d":"","items":[{"name":"안전보건표지의 제작","facts":["그림·부호의 크기는 표지 전체 규격의 30% 이상"],"hook":"판의 삼분의 일 가까이(30%)는 그림. 글자만 빽빽하면 표지가 아니라 공문이다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"1-29","subject":"안전관리론","chapter":"안전보건관리 체제","big":"제조물책임","title":"제조물책임법의 결함","topic3d":"","items":[{"name":"제조물책임법의 결함 3종","facts":["제조상 · 설계상 · 표시상의 결함","사용상의 결함은 없다(쓰는 사람 몫)"],"hook":"「제설표」: 제설차 표지판. 만들 때(제조)·그릴 때(설계)·알릴 때(표시) 셋뿐이다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"1-30","subject":"안전관리론","chapter":"건설공사 안전개요","big":"계획·관리비","title":"유해위험방지계획서 대상","topic3d":"","items":[{"name":"유해위험방지계획서 제출 대상 건설공사","facts":["터널 건설공사는 규모 조건 없이 대상","높이 31 m · 지간 50 m · 깊이 10 m 기준","제조업은 전기 계약용량 300 kW 이상"],"hook":"「삼일·오십·십(31·50·10)」 높이·지간·깊이, 터널은 무조건. 굴 파면 어디든 무너지고 숨 막힌다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"1-31","subject":"안전관리론","chapter":"결함수분석","big":"FTA 기호·구조","title":"휴먼에러 분류 기준","topic3d":"","items":[{"name":"휴먼에러의 분류 기준","facts":["독립행동에 의한 분류: 생략 · 실행 · 순서 · 시간 · 불필요 오류","원인에 의한 분류: 1차 · 2차 · 명령 오류","명령오류는 독립행동이 아니라 원인에 의한 분류"],"hook":"「무엇을 잘못했나」는 독립행동, 「왜 잘못했나」는 원인. 지시가 없어서 못 한 명령오류는 「왜」 쪽이다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"2-01","subject":"인간공학 및 시스템안전공학","chapter":"결함수분석","big":"FTA 기호·구조","title":"FTA 기호와 게이트","topic3d":"","items":[{"name":"FTA의 사상기호","facts":["직사각형 = 결함사상(정상사상·중간사상)","원 = 기본사상(더 나눌 수 없는 밑바닥)","집 모양 오각형 = 통상사상(늘 일어나는 정상적 사상)","마름모 = 생략사상(정보가 부족해 더 캐지 않음)","삼각형 = 전이기호(다른 곳으로 이어짐)"],"hook":"집은 늘 거기 있으니 「통상」, 마름모는 다이아 살 돈이 없어 조사를 「생략」, 동그란 알은 더 못 쪼개니 「기본」, 삼각형 화살표는 딴 데로 「전이」다.","why":"","mix":"직사각형은 정상사상과 중간사상 모두를 담는 결함사상이고, 밑바닥은 원(기본사상)뿐이다."},{"name":"FTA의 수정게이트","facts":["조합 AND 게이트: n개 중 k개(3개 중 2개)가 일어나면 출력","우선적 AND 게이트: 정해진 순서로 일어날 때 출력","배타적 OR 게이트: 입력 중 하나만 일어날 때 출력(동시 발생 없음)","위험지속 게이트: 정해진 시간 동안 지속되어야 출력","억제 게이트: 조건부 사건이 만족될 때만 출력"],"hook":"소개팅 조건표다. 「3명 중 2명」이면 조합, 「순서 지켜」면 우선적, 「오래 버텨」면 위험지속, 「딱 하나만」이면 배타적. 개수·순서·시간·하나만, 네 조건이 네 게이트다.","why":"","mix":"「3개 중 2개」처럼 개수 조건이면 조합 AND, 「동시에 겹치면 안 됨」이면 배타적 OR이다."},{"name":"억제 게이트","facts":["조건부 사건이 일어난 상태에서 입력이 발생할 때 출력","모양은 육각형에 조건 상자를 옆에 매단다","AND 게이트는 밑이 평평한 반원, OR 게이트는 밑이 위로 굽은 반원","부정 게이트는 작은 동그라미"],"hook":"육각형 벌집 옆에 조건 쪽지가 붙어 있다. 문지기가 「쪽지 조건 통과해야 들어와」 하고 억제하는 그림이다.","why":"","mix":"조건이 「개수」면 조합 AND, 조건이 「사건 하나」면 억제 게이트다."},{"name":"컷셋과 패스셋","facts":["컷셋: 모두 일어나면 정상사상이 나는 기본사상의 집합(시스템의 위험성)","패스셋: 모두 일어나지 않으면 정상사상이 안 나는 집합(시스템의 신뢰성)","미니멀 컷셋: 정상사상을 일으키는 최소한의 컷셋 → 어디를 고칠까","미니멀 패스셋: 시스템을 살리는 최소한의 집합 → 어디를 지킬까","컷셋은 Fussell 알고리즘, 패스셋은 쌍대 FT로 구한다"],"hook":"컷(cut)은 자르는 것이라 시스템을 죽이는 조합, 패스(path)는 길이라 살아 나가는 조합. 「컷은 죽이고 패스는 살린다」 한 줄로 끝난다.","why":"","mix":"위험성을 나타내면 컷셋, 신뢰성을 나타내면 패스셋. 「고장 나지 않도록」이란 말이 보이면 패스셋이다."},{"name":"스웨인의 휴먼에러 분류","facts":["omission 생략 오류: 해야 할 일을 하지 않음","commission 작위 오류: 했지만 잘못함","extraneous 과잉행동 오류: 하지 않아도 될 일을 함","sequential 순서 오류: 순서를 뒤바꿈","timing 시간 오류: 너무 빠르거나 늦음"],"hook":"「오·커·엑·시·타」(Omission·Commission·Extraneous·Sequential·Timing). 빼먹은 오(O), 하긴 했는데 수수료 떼먹듯 잘못한 커미션, 굳이 튀어나온 엑스트라, 순서의 시퀀스, 때를 놓친 타이밍.","why":"","mix":"「수행 지연」은 commission이 아니라 timing error이고, 「불필요한 작업」은 extraneous error다."},{"name":"라스무센 3분류와 리즌의 오류","facts":["숙련(기능) 기반 행동: 몸에 밴 일 → slip·lapse","규칙 기반 행동: 아는 규칙을 적용 → 규칙을 잘못 고름","지식 기반 행동: 낯선 상황에서 따짐 → 분석·의사결정의 오류","「경험 기반 행동」은 없다","Slip = 의도는 맞고 행동이 어긋남, Lapse = 잊음, Mistake = 계획 자체가 틀림, Violation = 알면서 어김"],"hook":"운전으로 외운다. 핸들 꺾기는 숙련(손이 미끄러지면 slip), 신호 지키기는 규칙, 처음 가는 길에서 헤매면 지식. 「숙·규·지」 세 층 계단이다.","why":"","mix":"계획이 틀리면 Mistake, 계획은 맞는데 손이 틀리면 Slip, 잊으면 Lapse, 일부러면 Violation이다."},{"name":"정상사상 확률 계산","facts":["AND 게이트는 확률을 그냥 곱한다","OR 게이트는 1 − (1−q)들의 곱","확률이 작으면 OR는 대략 합, AND는 훨씬 작다","중복사상이 있으면 먼저 불 대수로 정리한다(A + AB = A)"],"hook":"AND는 「둘 다」라 곱해서 작아지고, OR는 「하나라도」라 여사건을 곱해 1에서 뺀다. 「곱은 AND, 1 빼기 여곱은 OR」.","why":"","mix":"같은 기본사상이 두 곳에 나오면 그냥 곱하면 안 되고 미니멀 컷셋부터 구한다."}],"n":67,"rounds":24},{"id":"2-02","subject":"인간공학 및 시스템안전공학","chapter":"정보입력표시","big":"표시장치·조종장치","title":"양립성·안전성 평가","topic3d":"","items":[{"name":"화학설비 안전성 평가 6단계","facts":["1 자료 정비 → 2 정성적 평가 → 3 정량적 평가 → 4 안전대책 → 5 재해정보 재평가 → 6 FTA 재평가","정성적 평가: 입지조건·공장 내 배치·건조물·원재료·중간제품","정량적 평가 다섯 항목: 물질·용량·온도·압력·조작","등급: Ⅰ 16점 이상, Ⅱ 11~15점, Ⅲ 10점 이하(Ⅳ등급은 없다)","안전대책은 설비적 대책과 관리적 대책 둘"],"hook":"「자·정성·정량·대책·재·재」. 자정에 성당(정성)에서 정량껏 대책 세우고 재재(再再) 두 번 다시 본다. 정량 다섯은 「물·용·온·압·조」, 물을 용기에 넣고 온도·압력을 조작한다.","why":"","mix":"입지조건·공장 내 배치는 2단계 정성적 평가, 「점수」가 나오면 3단계 정량적 평가다."},{"name":"양립성의 네 가지","facts":["공간 양립성: 배치가 맞음(오른쪽 스위치 → 오른쪽 전등)","운동 양립성: 움직임 방향이 맞음(레버 올리면 압력 상승, 시계 방향은 증가)","개념 양립성: 뜻이 맞음(빨강 위험·파랑 안전)","양식 양립성: 자극과 응답의 감각이 맞음(귀로 들으면 입으로 답)","양립성이 클수록 코딩·반응시간은 짧아진다","「감성 양립성」은 없다"],"hook":"「공·운·개·양」 공원에서 운동하는 개와 양(羊). 공간은 자리, 운동은 방향, 개념은 뜻, 양식은 감각의 짝이다.","why":"","mix":"「레버 위로 = 압력 위로」는 운동, 「오른쪽 스위치 = 오른쪽 등」은 공간. 둘을 바꿔 묻는다."},{"name":"인간-기계 시스템 설계 6단계","facts":["1 목표·성능명세 결정","2 시스템 정의","3 기본 설계(기능 할당·인간 성능 요건·직무분석·작업 설계)","4 인터페이스 설계(표시장치·조종장치·화면)","5 촉진물(보조물) 설계(매뉴얼·훈련도구)","6 시험 및 평가"],"hook":"집 짓기 순서다. 「목표 → 정의 → 기본 → 인터페이스 → 촉진물 → 시험」. 「목·정·기·인·촉·시」, 목이 정기적으로 인촉시(人觸試)한다고 읊는다.","why":"","mix":"기능 할당·직무분석은 3단계 기본 설계, 화면 설계는 4단계 인터페이스 설계다."},{"name":"FTA의 특징과 FMEA 대비","facts":["FTA는 Top-Down·연역적, 정상사상에서 원인으로 내려간다","정성·정량 해석이 모두 가능, 논리기호 사용, 컴퓨터 처리 가능","복잡하고 대형화된 시스템에 알맞다(1962년 벨연구소)","FMEA는 Bottom-Up·귀납적, 부품에서 출발, 정량화 어려움","FTA 기대효과: 원인 규명 간편화·일반화·정량화, 노력·시간 절감(시간에 따른 원인 분석은 아님)"],"hook":"FTA의 T는 Top, 꼭대기(정상사상)에서 뿌리로 파 내려가는 「탑다운·연역」. FMEA는 부품부터 위로 올라가는 「바텀업·귀납」. 나무는 위에서, 부품은 아래에서.","why":"","mix":"「정성적 분석만 가능」·「버텀업」은 FTA 설명으로 틀린 보기다."},{"name":"인간-기계 기능 배분","facts":["인간 우위: 귀납적 추리·일반화, 예기치 못한 사건 감지, 원칙 적용 문제 해결, 경험 기반 의사결정","기계 우위: 명시된 절차의 신속·정량적 처리, 연역적 추리, 반복 작업 신뢰성, 대량 정보 보관"],"hook":"사람은 「대충 보고 눈치채기」(귀납·일반화·돌발 감지)의 달인, 기계는 「시킨 대로 지치지 않고 정확히」(연역·반복·저장)의 달인. 눈치는 사람, 반복은 기계.","why":"","mix":"귀납은 사람, 연역은 기계. 둘을 바꿔 놓는 것이 단골 함정이다."},{"name":"아날로그 표시장치와 THERP","facts":["일반적으로 동침형(바늘이 움직임)을 선호한다","동목형은 눈금이 움직인다","THERP = 사람의 실수 확률(Human Error Rate)을 예측하는 기법"],"hook":"동침형은 시계처럼 바늘(針)이 움직여 눈에 익고, 동목형은 눈금(目)이 움직여 어지럽다. 바늘 뛰는 쪽이 편하다.","why":"","mix":""}],"n":65,"rounds":22},{"id":"2-03","subject":"인간공학 및 시스템안전공학","chapter":"","big":"","title":"소음작업·조도·기초 개념","topic3d":"noise","items":[{"name":"강렬한 소음작업 기준","facts":["90 dB 이상 1일 8시간, 95 dB 4시간, 100 dB 2시간","105 dB 1시간, 110 dB 30분, 115 dB 15분","충격소음: 120 dB 초과 1일 1만회, 130 dB 1천회, 140 dB 1백회"],"hook":"90에서 8시간, 5 dB 오를 때마다 시간이 반토막. 「구십팔, 구오사, 백이, 백오일, 백십반, 백십오는 십오분」 랩처럼. 충격소음은 120·130·140에 만·천·백, 10 오를 때마다 0 하나 떼기.","why":"5 dB 오르면 허용시간이 절반이 되는 교환율 때문이다.","mix":"115 dB의 짝은 15분이다. 「120 dB에 몇 시간」 같은 보기는 없다."},{"name":"작업면 조도기준","facts":["초정밀작업 750 lux 이상","정밀작업 300 lux 이상","보통작업 150 lux 이상","그 밖의 작업 75 lux 이상"],"hook":"75를 두 배씩 올려 75·150·300, 마지막만 750으로 점프. 「칠오·백오십·삼백·칠백오십」, 75가 처음과 끝(750)에 다시 나온다.","why":"","mix":""},{"name":"경고등 설계","facts":["점멸속도 3~10회/초","배경보다 2배 이상 밝게","경고등은 하나만 둔다","지속시간 0.05초 이상"],"hook":"「삼십(3~10)회 깜빡, 두 배 밝게, 하나만」. 눈은 30회/초 넘으면 깜빡임을 못 느끼니 그보다 훨씬 느리게 깜빡인다.","why":"사람 눈은 약 30회/초를 넘으면 깜빡임을 느끼지 못한다.","mix":"「1초에 한 번」도 「2개 이상」도 틀린 보기다."},{"name":"연구 기준의 요건","facts":["적절성(타당성): 의도한 것을 실제로 재는가","무오염성: 다른 변수가 끼어들지 않는가","신뢰성(반복성): 되풀이해도 같은 값인가","민감도: 피실험자 간 예상 차이에 비례하는 단위로 재는가","「다양성」은 요건이 아니다"],"hook":"「적·무·신·민」, 적을 무찌른 신민(臣民). 적절·무오염·신뢰·민감 넷이고 「다양성」은 없다.","why":"","mix":""},{"name":"위험조정기술 네 가지","facts":["회피(avoidance): 위험한 일을 아예 하지 않는다","감축(reduction): 확률이나 크기를 줄인다(방호장치·교육)","보류(retention): 작은 위험은 스스로 떠안는다(자가보험)","전가(transfer): 남에게 넘긴다(보험·도급)","「책임」·「확인」은 위험조정기술이 아니다"],"hook":"「회·감·보·전」, 회장님이 감기 걸려 보험(보전) 들었다. 피하고, 줄이고, 떠안고, 넘긴다.","why":"","mix":""},{"name":"인간공학 기초 개념","facts":["인간공학은 기계를 사람에게 맞춘다(사람을 기계에 맞추는 것이 아님)","기대효과: 작업손실시간 감소·품질 향상·생산성 향상·노사 신뢰 향상","조종장치 암호화 방법: 모양·크기·색·촉감·위치(강도는 아님)","불 대수: A·Ā = 0, A + Ā = 1","정밀 조립은 좌식작업, 단독작업은 과오와 거리가 멀다"],"hook":"「기계가 사람에게 절한다」가 인간공학 한 문장. 방향을 뒤집은 보기가 늘 틀린다. 암호화는 보고 만져 구별되는 것, 「강도(힘의 세기)」는 안 보이니 탈락.","why":"","mix":"「여럿이·오래·갈래 많이」가 과오를 부른다. 단독작업은 셋 중 어디에도 없다."}],"n":64,"rounds":23},{"id":"2-04","subject":"인간공학 및 시스템안전공학","chapter":"정보입력표시","big":"청각·경보","title":"phon·sone과 소음","topic3d":"noise","items":[{"name":"phon과 sone","facts":["phon 기준은 1,000 Hz 순음의 dB(1,000 Hz에서는 dB = phon)","1 sone = 1,000 Hz 40 dB(40 phon)","10 phon 오를 때마다 sone은 2배","sone = 2^((phon − 40)/10)","40·50·60·70·80 phon = 1·2·4·8·16 sone"],"hook":"「천 헤르츠 사십 데시벨이 손(sone) 하나」. 손가락 하나에서 10 phon 오를 때마다 손이 두 배로 불어난다. 40·50·60·70·80은 1·2·4·8·16.","why":"","mix":"phon은 「dB과 같게 들리는 수준」, sone은 「몇 배 크게 들리나」. 4배 크게 들리면 20 phon 위다."},{"name":"소음 노출기준","facts":["90 dB 8시간, 95 dB 4시간, 100 dB 2시간","105 dB 1시간, 110 dB 30분, 115 dB 15분","5 dB 오르면 허용시간은 절반"],"hook":"5 오르면 반으로. 「구십에 팔시간」에서 출발해 15분(115 dB)까지 여섯 칸 내려온다.","why":"","mix":"115 dB의 짝은 15분이고, 120 dB의 짝은 없다."},{"name":"소음성 난청","facts":["청력손실이 가장 먼저·크게 오는 대역은 4,000 Hz(C5-dip, 3,000~4,000 Hz)","회화음역은 500·1,000·2,000 Hz라 초기에 본인이 못 알아챈다","가청주파수 20~20,000 Hz, 가장 예민한 대역 1,000~4,000 Hz"],"hook":"「사천(4,000) 헤르츠에서 C5 딥(dip)」, 사천에서 푹 꺼진다. 말소리(500~2,000)는 멀쩡해서 본인은 모른다.","why":"","mix":""},{"name":"차폐효과와 음성통신 지수","facts":["차폐(masking): 한 음 때문에 다른 음의 감도가 떨어지는 현상(증가 아님)","두 음의 주파수가 가까울 때 크다","명료도 지수 AI = Σ(log(S/N) × 가중치), 옥타브대별","PSIL은 500·1,000·2,000 Hz 잡음의 평균","MAA만 방향에 관한 지수"],"hook":"「차폐」는 가린다는 뜻. 헤어드라이어가 전화벨을 가리면 감도는 떨어진다. 「감도 증가」로 뒤집은 보기가 틀린 보기.","why":"","mix":"Speech·Noise가 붙으면 음성통신 지수, Angle(MAA)이 붙으면 방향 지수다."},{"name":"촉각 암호화와 소리의 물리량","facts":["촉각적 암호화: 점자·진동·온도·표면 촉감·모양","높낮이는 진동수(한 옥타브에 2배), 크기는 진폭","시각 암호화는 색·모양·점멸 등"],"hook":"손끝으로 아는 것 셋 「점·진·온」, 점자·진동·온도. 점진적으로 온다.","why":"","mix":"「높낮이는 진동수, 크기는 진폭」을 바꿔 놓은 보기가 틀린 보기다."},{"name":"작업부담 척도와 JND","facts":["육체적 작업부담: 맥박수·산소소비량","정신적 피로: 점멸융합주파수(CFF)·GSR","근전도(EMG)는 국소 근육, 정신 척도가 아니다","JND는 낮은 주파수·큰 강도에서 가장 작다(예민)","HSI는 열압박지수, 음량 척도가 아니다"],"hook":"숨차고 맥박 뛰면 몸(육체), 깜빡임(CFF)이 둔해지면 머리(정신). 「몸은 숨·맥, 머리는 깜빡」.","why":"","mix":"HSI는 Heat Stress, 소리 척도가 아니다."}],"n":35,"rounds":19},{"id":"2-05","subject":"인간공학 및 시스템안전공학","chapter":"정보입력표시","big":"시각","title":"시각 표시장치와 조명","topic3d":"","items":[{"name":"시각 vs 청각 표시장치","facts":["시각: 나중에 재참조·길고 복잡·공간 정보·소음 환경·수신자가 한곳에","청각: 긴급·짧고 단순·시간 정보·조명 불량·수신자가 이동","도시가스 부취제는 후각적 경보(실용성 있음)"],"hook":"「소리는 흘러가고 글은 남는다」. 다시 볼 거면 눈(시각), 지금 당장이면 귀(청각). 글은 게시판, 소리는 사이렌.","why":"","mix":"「정보가 후에 재참조되는 경우」가 시각 표시장치의 대표 보기다."},{"name":"점멸융합주파수(CFF)","facts":["정신적으로 피로하면 CFF가 내려간다(피로의 척도)","암조응이면 내려간다","조명 강도의 대수치에 선형 비례(반비례 아님)","휘도가 같으면 색상은 영향 없음"],"hook":"피곤하면 눈이 깜빡임을 못 따라가 CFF가 떨어진다. 「피로하면 내려가고, 밝으면 올라간다」 하나로 넷이 풀린다.","why":"","mix":"「대수치에 반비례」는 틀린 보기, 비례가 맞다."},{"name":"암순응과 명순응","facts":["완전한 암순응 30~40분","명순응 1~3분","순응은 비대칭이다"],"hook":"영화관 들어갈 땐 30~40분 더듬더듬(암순응), 나올 땐 1~3분 눈부심(명순응). 「들어갈 때 삼사십, 나올 때 일삼」.","why":"","mix":""},{"name":"시각 암호와 부호","facts":["시각 암호 설계 3요건: 검출성·판별성·양립성(심각성은 아님)","삼각형(경고)은 임의적 부호, 물건을 닮으면 묘사적 부호","배경보다 2배 이상 밝게, 경고등은 3~10회/초, 하나만"],"hook":"「검·판·양」, 검은 판 위의 양. 보이나(검출), 가려지나(판별), 어울리나(양립). 삼각형은 아무것도 안 닮았으니 「임의적」.","why":"","mix":""},{"name":"조명 계산과 조도기준","facts":["소요조명(fc) = 휘도(fL) ÷ 반사율 (90 fL ÷ 0.6 = 150 fc)","초정밀 750·정밀 300·보통 150·그 밖 75 lux"],"hook":"반사율이 낮을수록 더 밝은 조명이 필요하니 「나눈다」. 조도는 75·150·300 두 배 사다리에 750만 점프.","why":"","mix":""},{"name":"최소 컷셋 계산","facts":["AND는 곱, OR는 합으로 전개","같은 기호는 여러 번 곱해도 하나(X·X = X)","큰 항이 작은 항을 품으면 큰 쪽을 지운다"],"hook":"「작은 놈이 큰 놈을 잡아먹는다」. A + AB = A, 작은 집합 A가 큰 집합 AB를 흡수한다.","why":"","mix":""}],"n":34,"rounds":21},{"id":"2-06","subject":"인간공학 및 시스템안전공학","chapter":"신뢰성","big":"신뢰도 계산","title":"직렬·병렬 신뢰도","topic3d":"","items":[{"name":"직렬·병렬 신뢰도","facts":["직렬 = 곱(하나 고장이면 전체 고장)","병렬 = 1 − Π(1 − R)(하나만 살아도 됨)","병렬 두 개 = 2R − R²","혼합은 병렬을 먼저 하나로 접고 직렬로 곱한다","같은 병렬 묶음 둘이 직렬이면 r²(2 − r)²"],"hook":"직렬은 옛날 크리스마스 전구, 하나 나가면 다 꺼지니 「곱셈」으로 작아진다. 병렬은 예비 타이어, 「하나만 살면 OK」라 1에서 죽을 확률의 곱을 뺀다.","why":"","mix":"「병렬은 한 부품이 고장 나면 시스템 고장」은 직렬 설명이라 틀린 보기다."},{"name":"지수분포와 정규분포 수명","facts":["고장률이 일정하면 지수분포","와이블은 고장률이 변하는 경우까지 포괄","정규분포 수명: Z = (t − 평균) ÷ 표준편차","평균 10,000·표준편차 200·t 9,600 → Z = −2 → 신뢰도 97.72%"],"hook":"「고장률 일정」 네 글자가 보이면 지수분포로 직행. 정규분포는 Z 하나 구해서 「살아남을 확률 = P(Z ≤ 2)」.","why":"","mix":"「횟수」를 물으면 푸아송, 「시간」을 물으면 지수다."},{"name":"MTBF와 고장률","facts":["MTBF = 1 ÷ λ(고장률의 역수)","총 가동시간 = 개수 × 시간(24개 × 4,000시간 ÷ 14회 = 6,857시간)","MTBF는 「시간」이지 「률」이 아니다"],"hook":"Mean Time이니 시간이다. 여러 대를 돌렸으면 「대수 × 시간」이 총 가동시간. 24대 4,000시간이면 96,000시간을 나눠야지, 4,000만 나누면 보기에 없다.","why":"","mix":""},{"name":"디버깅·번인·풀 프루프·페일 세이프","facts":["디버깅: 초기 고장기의 결함을 찾아 없애는 과정","번인: 미리 돌려 보는 기간(초기 고장기)","풀 프루프: 사람의 실수(작위 오류)를 막는 설계","페일 세이프: 고장이 나도 안전하게"],"hook":"디버깅은 「벌레(bug) 잡기」, 번인은 「미리 태워(burn) 보기」. 풀(fool)은 바보라 사람 실수 막기, 페일(fail)은 고장이라 고장 나도 안전.","why":"","mix":"「사람의 실수」면 풀 프루프, 「기기의 고장」이면 페일 세이프다."}],"n":30,"rounds":21},{"id":"2-07","subject":"인간공학 및 시스템안전공학","chapter":"시스템 위험분석","big":"PHA·FHA·FMEA","title":"PHA·FMEA·ETA","topic3d":"","items":[{"name":"예비위험분석(PHA)","facts":["시스템 설계 초기(구상단계)의 가장 기초적인 위험분석","위험 4범주: 파국적·중대(위기적)·한계적·무시가능","「예비조처상태」는 범주가 아니다"],"hook":"Preliminary = 「예비」 = 설계도도 없는 맨 처음. 등급은 「파·중·한·무」, 파도 한가운데 한 무리, 넷이다.","why":"","mix":""},{"name":"FMEA 고장평점법 5요소","facts":["기능적 고장 영향의 중요도","영향을 미치는 시스템의 범위","고장발생의 빈도","고장방지의 가능성","신규설계의 정도(「가능성」이 아님)","평점 C = (C1·C2·C3·C4·C5)^(1/5), 다섯 값의 기하평균"],"hook":"「중·범·빈·방·신」, 중범이가 빈방에서 신났다. 다섯을 곱해 5제곱근, 기하평균. 「가능성」이 붙는 건 「고장방지」 하나뿐이고 신규설계는 「정도」.","why":"","mix":"「신규설계의 가능성」·「생산능력의 범위」는 요소가 아니다."},{"name":"ETA·MORT·OHA","facts":["ETA: 사고의 연속된 경로를 앞으로 따라가는 귀납적 분석","MORT: 원자력 등 고도 안전 장소에서 관리·설계·생산·보전까지 넓게","OHA 운용위험분석: 저장·이동·실행 중의 위험","FTA는 연역(거꾸로), ETA는 귀납(앞으로)"],"hook":"ETA는 Event Tree, 「사건이 이리저리 굴러가는 길」을 앞으로 그린다. MORT는 Management가 앞에 있으니 관리까지 넓게, 원자력 단골. OHA는 Operating, 쓰는 중의 위험.","why":"","mix":"「원자력」이면 MORT, 「사람 과오율」이면 THERP다."},{"name":"FTA와 신뢰도","facts":["신뢰도 = 1 − 고장확률","보기는 AND 고장·OR 고장·OR 신뢰도·AND 신뢰도 네 값으로 짜인다"],"hook":"두 갈래를 두 번 묻는다. AND냐 OR냐, 고장이냐 신뢰도냐. 「1에서 빼면 신뢰도」.","why":"","mix":""}],"n":27,"rounds":19},{"id":"2-08","subject":"인간공학 및 시스템안전공학","chapter":"인간계측·작업공간","big":"작업공간·자세","title":"의자·작업대·RWL","topic3d":"","items":[{"name":"의자 설계의 원리","facts":["요부 전만(앞굽음)을 유지한다(후만·측만이 아님)","디스크(추간판) 압력을 줄인다(체중은 좌골결절에)","등근육의 정적 부하를 줄인다","자세 고정을 줄이고 자주 바꿀 수 있게 한다","조절이 쉽게 한다"],"hook":"허리는 「전만」, 앞으로 살짝 C자. 새우등(후만)이나 옆굽음(측만)은 틀린 보기. 「한 자세로 오래」도 틀린 보기, 의자는 몸을 꼼지락거리게 해야 한다.","why":"","mix":"「후만」·「측만」·「고정된 자세 장시간」 셋이 틀린 보기 단골이다."},{"name":"좌판 높이와 작업대 높이","facts":["조절식 → 극단치 → 평균치 순으로 적용","좌판 높이는 5%tile 오금높이(작은 사람 기준)","문·통로·울타리는 최대 집단치","은행 창구·계산대는 평균치","중작업 작업대 높이는 팔꿈치보다 15~20 cm 낮게"],"hook":"높으면 곤란한 건 작은 사람에게(좌판 5%), 낮으면 곤란한 건 큰 사람에게(문 95%). 「걸리면 큰 사람, 뜨면 작은 사람」. 무거운 일은 팔꿈치 아래 15~20 cm, 내려찍기 좋게.","why":"","mix":""},{"name":"부품 배치의 4원칙","facts":["중요성의 원칙","사용빈도의 원칙","기능별 배치의 원칙","사용순서의 원칙","「공정개선」·「사용방법」의 원칙은 없다"],"hook":"「중·빈·기·순」, 중빈이가 기순이를 만났다. 중요하고, 자주 쓰고, 기능끼리, 순서대로.","why":"","mix":""},{"name":"NIOSH 권장무게한계(RWL)","facts":["RWL = LC × HM × VM × DM × AM × FM × CM","부하상수 LC = 23 kg","계수: 수평·수직·거리·비대칭·빈도·커플링","「휴식 계수」는 없다"],"hook":"23 kg짜리 상자에 여섯 장 할인쿠폰(HM·VM·DM·AM·FM·CM)을 곱한다. 「휴식 쿠폰」은 없다.","why":"","mix":""},{"name":"근골격계 부담작업 기준","facts":["하루 4시간 이상 키보드·마우스 집중 조작","하루 2시간 이상 같은 동작 반복·머리 위 손·허리 구부림·쪼그림","2시간 이상 1 kg 손가락 집기, 4.5 kg 들기, 한 손 4.5 kg","하루 10회 이상 25 kg 들기, 하루 25회 이상 10 kg 들기","2시간 이상 시간당 10회 이상 손·무릎 반복 충격"],"hook":"키보드만 「4시간」, 나머지는 거의 「2시간」. 무게는 「10회에 25 kg, 25회에 10 kg」 숫자를 서로 바꾼 짝. 1 kg 손가락, 4.5 kg 손.","why":"","mix":"「10회·25 kg」과 「25회·10 kg」이 뒤바뀐 보기, 「반복 충격 5회」로 바꾼 보기가 함정이다."},{"name":"작업공간 포락면","facts":["포락면은 손이 닿는 범위를 감싼 입체","작업의 성질에 따라 경계가 달라진다","두꺼운 옷을 입으면 좁아진다"],"hook":"포락(包絡)은 「감싼다」. 팔 휘저어 닿는 풍선 같은 공간, 두꺼운 패딩 입으면 풍선이 작아진다.","why":"","mix":""}],"n":23,"rounds":17},{"id":"2-09","subject":"인간공학 및 시스템안전공학","chapter":"인간계측·작업공간","big":"인체계측","title":"인체측정 응용원리","topic3d":"","items":[{"name":"인체측정 응용원리 셋","facts":["조절식(5~95%tile, 사용자의 90% 수용) → 극단치 → 평균치 순","「다차원식 설계」는 없다","최대 집단치: 문·통로·울타리","최소 집단치: 선반 높이·조종장치 거리","평균치: 은행 창구·계산대"],"hook":"「조·극·평」, 조금씩 극복하면 평온. 조절되면 조절식, 안 되면 극단(큰 사람·작은 사람), 그것도 안 되면 평균. 양 끝 5%씩 잘라 90%를 품는다.","why":"양 끝까지 맞추려면 값이 지나쳐 비용이 급하게 오른다.","mix":"울타리·문은 최대(큰 사람), 선반 높이는 최소(작은 사람), 창구는 평균이다."},{"name":"정적·동적 측정과 작업영역","facts":["정적(구조적) 측정: 움직이지 않고 고정된 자세","동적(기능적) 측정: 움직일 때","정상작업영역: 상완을 늘어뜨리고 아래팔만 뻗어 닿는 범위","최대작업영역: 팔 전체를 뻗은 범위"],"hook":"「구조적 = 고정, 기능적 = 움직임」. 정상은 팔꿈치 붙이고 아래팔만, 최대는 팔 쭉. 밥상에서 반찬(정상)과 국(최대)의 거리다.","why":"","mix":""}],"n":15,"rounds":13},{"id":"2-10","subject":"인간공학 및 시스템안전공학","chapter":"정보입력표시","big":"동작·반응 법칙","title":"반응시간·웨버·Fitts","topic3d":"","items":[{"name":"감각별 반응시간","facts":["청각 0.17초로 가장 빠르다","촉각 0.18초, 시각 0.20초, 미각 0.29초","통각 0.70초로 가장 느리다","단순반응시간 0.15~0.2초","자극을 예상 못 하면 약 0.1초 더 걸린다"],"hook":"「청·촉·시·미·통」, 청국장은 촉촉시(時)에 미통(味通). 귀가 제일 빠르고(0.17) 아픔이 제일 늦다(0.70). 그래서 경보는 소리로 준다.","why":"","mix":"0.17·0.18·0.20은 아주 가깝다. 순서만 잡으면 된다."},{"name":"웨버 법칙과 Fitts 법칙","facts":["웨버비 = ΔI ÷ I, 작을수록 예민하다","원래 자극이 클수록 더 크게 바뀌어야 알아챈다","Fitts: 표적이 작고 이동거리가 길수록 이동시간 증가(거리와 너비 둘뿐)","정보량 H = log2 n, 4택1 = 2 bit"],"hook":"웨버: 조용한 방 속삭임은 들리고 시장에선 고함도 묻힌다. Fitts: 멀고 작은 과녁일수록 오래 걸린다, 다트판 이야기.","why":"","mix":"Fitts에 색상·모양·밝기는 들어가지 않는다."},{"name":"진동과 불안전행동 요인","facts":["진동에 가장 약한 성능은 추적(tracking) 능력","생리적 요인: 재고 잴 수 있는 몸의 상태","심리적 요인: 주의력·서두름 등 마음의 상태"],"hook":"덜컹거리는 차 안에서 글씨 쓰기(추적)가 제일 먼저 망가진다. 보는 건 된다.","why":"","mix":"「주의력」은 심리적 요인이지 생리적 요인이 아니다."}],"n":15,"rounds":11},{"id":"2-11","subject":"인간공학 및 시스템안전공학","chapter":"시스템 위험분석","big":"시스템 안전 일반","title":"SSPP·수명주기","topic3d":"","items":[{"name":"SSPP 포함 사항","facts":["계획의 개요·안전 조직·계약 조건·관련 부문과의 조정","안전 기준·안전 해석·안전성 평가","안전 데이터의 수집과 분석·경과와 결과의 분석","「안전 종류」·「신뢰성 분석비용」은 없다"],"hook":"안전 프로그램 계획에 「돈 계산(비용)」과 「안전 종류」는 없다. 아홉 항목 모두 「어떻게 안전을 챙길까」의 이야기다.","why":"","mix":""},{"name":"시스템 수명주기","facts":["구상 → 정의 → 개발 → 생산 → 운전","안전점검 기준에 따른 평가는 운전단계","PHA는 구상단계"],"hook":"「구·정·개·생·운」, 구정에 개가 생일 운세를 본다. 이미 만든 물건 점검은 「운전」, 아직 아이디어면 「구상」.","why":"","mix":""},{"name":"위험관리·안전성 평가 항목","facts":["위험 분석·평가는 손실의 크기와 번짐을 본다(작업표준 이해도는 아님)","안전성 평가는 설비·공정을 본다(작업자 평가는 아님)","시스템 안전관리 업무에 비용·효과 분석은 없다","안전대책 단계는 설비적 대책·관리적 대책(위험도 평가는 아님)","위험강도: 파국적·위기적·한계적·무시가능, 「전혀 발생하지 않는」 등급은 없다"],"hook":"안전성 평가는 「설비 검사」지 「사람 시험」이 아니다. 「작업자 평가」·「작업표준 이해도」·「비용 효과」처럼 사람·돈 냄새 나면 탈락.","why":"","mix":""}],"n":14,"rounds":12},{"id":"2-12","subject":"인간공학 및 시스템안전공학","chapter":"작업환경관리","big":"온열·조명·진동","title":"WBGT·옥스퍼드·반사율","topic3d":"","items":[{"name":"습구흑구온도지수(WBGT)","facts":["실내·햇볕 없는 옥외: 0.7 NWB + 0.3 GT","햇볕 있는 옥외: 0.7 NWB + 0.2 GT + 0.1 DB","계수의 합은 1","자연습구 20·흑구 18·건구 30 → 20.6℃"],"hook":"습구는 언제나 0.7, 「칠(7)칠맞은 습구」. 햇볕이 들면 흑구 0.3을 「흑구 0.2 + 건구 0.1」로 쪼갠다. 합은 항상 1.","why":"","mix":"옥외 식은 세 항, 실내 식은 두 항. 「건구」가 보이면 햇볕 있는 옥외다."},{"name":"옥스퍼드 지수(WD)","facts":["WD = 0.85 × 습구 + 0.15 × 건구","건구 24·습구 20 → 20.6℃","건구 30·습구 35 → 34.25"],"hook":"「팔오 습, 일오 건」. 더울 때 괴로운 건 온도보다 습도라 습구가 무겁다.","why":"땀이 말라야 열을 버리므로 습도(습구온도)가 훨씬 중요하다.","mix":"0.15를 습구에 붙이면 엉뚱한 값이 나와 오답 보기로 끌린다."},{"name":"실내 표면 추천반사율","facts":["천장 80~90%","벽 40~60%","가구·사무기기 25~45%","바닥 20~40%","바닥 < 가구 < 벽 < 천장"],"hook":"위로 갈수록 밝게. 「바·가·벽·천」, 바가지 벽에 천장. 하늘(천장)이 제일 밝고 땅(바닥)이 제일 어둡다.","why":"천장은 빛을 아래로 되돌리고, 바닥은 눈부심을 막아야 한다.","mix":""},{"name":"중이 증폭과 음원 방향","facts":["중이(이소골)에서 음압이 약 22배 증폭(임피던스 정합)","음원 방향은 두 귀의 강도차와 위상차로 안다","정면·정후면은 차이가 0이라 헷갈린다"],"hook":"귀 속 작은 뼈 셋이 지렛대로 「22배」 뻥튀기. 22는 귀 두 짝이 나란히 선 모양이다.","why":"","mix":""},{"name":"소음대책과 동작 합리화","facts":["소음대책은 줄이거나 막거나 귀를 지키는 것(소음에 적응된 인원 배치는 대책이 아님)","동작 합리화의 물리적 조건: 접촉 면적은 작게(마찰 감소)","누적손상장애(CTD) 인자에 「다습한 환경」은 거리가 멀다"],"hook":"「소음에 적응된 사람 배치」는 소리를 1 dB도 못 줄인다. 대책은 소리 쪽에서만.","why":"","mix":""}],"n":13,"rounds":13},{"id":"2-13","subject":"인간공학 및 시스템안전공학","chapter":"신뢰성","big":"보전","title":"설비보전·TPM","topic3d":"","items":[{"name":"설비보전의 종류","facts":["일상 보전: 점검·청소·주유·교체(열화 방지·수명 연장)","개량 보전: 설비를 뜯어고친다","보전 예방: 설계 단계에서 보전이 필요 없게","자주보전: 작업자 본인이 직접(청소·급유·조임·점검)"],"hook":"「매일 하면 일상, 고치면 개량, 태어날 때부터면 보전 예방」. TPM 자주보전은 「내 설비는 내가」, 청·급·조·점.","why":"","mix":"「보전 예방」은 설계 단계의 일이라 「예방 보전」과 다르다."},{"name":"보전효과 평가 지표","facts":["고장도수율 = 고장건수 ÷ 가동시간","정미가동률 = (생산량 × 실제 주기시간) ÷ 가동시간","속도가동률 분자에 기준 주기시간이 온다"],"hook":"「~율」은 「나쁜 일 ÷ 전체」. 정미(正味)는 「실제로 돌아간」이니 실제 주기시간을 곱한다.","why":"","mix":"정미가동률에 「기준 주기시간」이 들어가면 틀린 보기다."},{"name":"인간공학의 가치와 시스템 유형","facts":["가치: 성능 향상·훈련비용 절감·인력 이용률 향상·손실 감소·경제성 증대·수용도 향상","「경제성 감소」는 틀린 보기","인간공학 설계 대상에 보전(maintenance)은 들지 않는다","기계화 시스템: 사람이 조종장치를 통제","자동화 시스템: 사람은 감시·계획·정비"],"hook":"가치 여섯은 전부 「좋아진다」 방향, 「감소·저하」로 뒤집힌 보기가 늘 답. 조종간 잡고 있으면 기계화, 팔짱 끼고 보고 있으면 자동화.","why":"","mix":""}],"n":13,"rounds":12},{"id":"2-14","subject":"인간공학 및 시스템안전공학","chapter":"작업환경관리","big":"열교환·실효온도","title":"열균형·실효온도","topic3d":"","items":[{"name":"열균형 방정식","facts":["ΔS = (M − W) ± R ± C − E","M 대사, W 한 일, R 복사, C 대류, E 증발","W와 E는 항상 빼기, R·C만 ±"],"hook":"「M에서 일(W) 빼고, 복사·대류는 들락날락(±), 땀(E)은 늘 나간다」. 땀이 몸을 데우는 일은 없다.","why":"땀이 마르며 몸을 데우는 일은 없고, 일로 쓴 에너지가 몸을 데우지도 않는다.","mix":"「한 일 W도 빼야 한다」를 놓치기 쉽다."},{"name":"실효온도와 열교환 경로","facts":["실효온도(감각온도) = 온도·습도·기류 셋","복사열을 더하면 수정 실효온도","체온계로 입안 온도를 재는 것이 아니다","열교환 경로 넷: 전도·대류·복사·증발(분자량은 아님)"],"hook":"「온·습·기」, 온습기는 가습기의 사촌. 세 개면 실효온도, 「수정」이 붙어야 복사열이 들어온다.","why":"","mix":"「복사열」은 실효온도의 조건이 아니라 수정 실효온도의 조건이다."},{"name":"추울 때 몸의 조절","facts":["피부 혈관 수축","피를 몸 안쪽으로 모은다","겉은 차가워지고 속은 약간 오른다","발한(땀)은 멎는다"],"hook":"추우면 몸은 「성을 지키는 왕」, 겉(성벽)은 포기하고 속(왕궁)을 데운다. 땀은 당연히 스톱.","why":"","mix":""}],"n":12,"rounds":11},{"id":"2-15","subject":"인간공학 및 시스템안전공학","chapter":"인간계측·작업공간","big":"생리·에너지","title":"휴식시간·에너지","topic3d":"","items":[{"name":"머렐의 휴식시간","facts":["R = T(E − S) ÷ (E − 1.5)","E 작업 에너지, S 권장 평균 에너지, 1.5 휴식 중 에너지(kcal/min)","작업 6 kcal/min·60분 → 휴식 13.3분"],"hook":"분자는 「넘친 만큼(E − S)」, 분모는 「쉬면 줄어드는 만큼(E − 1.5)」. 넘친 에너지를 쉬며 갚는 데 걸리는 시간이다.","why":"","mix":""},{"name":"산소소비량과 대사량","facts":["산소 1 L ≈ 5 kcal","질소는 몸에서 쓰이지 않아 흡기량과 배기량이 같다","안정 시 대사량은 기초대사량의 약 1.2배","RMR = 작업대사량 ÷ 기초대사량"],"hook":"산소 1리터에 5킬로칼로리, 「오(O)에 오(5)」. 질소는 몸이 안 쓰니 들어온 만큼 그대로 나간다.","why":"","mix":""},{"name":"생리학적 측정법과 뼈의 기능","facts":["전신 작업 = 산소소비량","국소 근육(간헐 페달) = 근전도(EMG)","정신 피로 = 플리커(CFF)·GSR","뼈의 기능: 지지·보호·조혈·저장·근육 부착(대사는 근육의 일)"],"hook":"「온몸은 숨, 한 근육은 전기, 머리는 깜빡」. 뼈는 「받치고·지키고·만들고·저장하고·붙이고」, 대사는 살아 움직이는 근육 몫.","why":"","mix":""}],"n":12,"rounds":11},{"id":"2-16","subject":"인간공학 및 시스템안전공학","chapter":"시스템 위험분석","big":"HAZOP·기타","title":"HAZOP·THERP·SDT","topic3d":"","items":[{"name":"HAZOP 가이드워드","facts":["No/Not: 설계 의도의 완전한 부정","More/Less: 양적인 증가·감소","As well as: 성질상의 증가","Part of: 성질상의 감소","Reverse: 설계 의도와 반대","Other than: 완전한 대체(기타 환경 요인이 아님)"],"hook":"「양」은 More/Less, 「성질」은 As well as/Part of. 덤으로 딴 것까지면 As well as, 일부만이면 Part of, 아예 딴 것이면 Other than.","why":"","mix":"Other than을 「기타 환경적 요인」이라 하면 틀린 보기다."},{"name":"HAZOP 전제조건","facts":["설비는 제대로 만들어졌다고 본다","안전장치는 필요할 때 정상 동작한다고 본다"],"hook":"「멀쩡한 설비에서도 왜 위험한가」를 따지는 것이 HAZOP. 그래서 안전장치는 잘 듣는다고 놓고 시작한다.","why":"","mix":""},{"name":"THERP·MORT·신호검출이론","facts":["THERP: 인간 오류율(Rate) 예측, 정량적, 사건나무로 확률을 곱해 간다","MORT: 원자력 등 고도 안전 장소, 관리·설계·생산·보전까지 넓게","SDT 판별기준이 두 정규분포 교차점에 있으면 β = 1","누락과 허위경보를 동시에 줄일 수는 없다"],"hook":"THERP의 R은 Rate, 「율」이니 숫자로 재는 정량. 화재감지기를 민감하게 하면 오작동이 늘듯 SDT는 시소, 한쪽 내리면 한쪽이 오른다.","why":"","mix":"「원자력」이면 MORT, 「사람 과오율」이면 THERP다."}],"n":9,"rounds":8},{"id":"2-17","subject":"인간공학 및 시스템안전공학","chapter":"결함수분석","big":"컷셋·확률","title":"컷셋 계산·분포","topic3d":"","items":[{"name":"최소 컷셋 구하기","facts":["부울 대수로 전개 → 흡수법칙 A + AB = A → 남은 항","Fussell 알고리즘: AND는 가로, OR는 세로","중복사상이 있으면 그냥 곱하지 말고 먼저 정리한다"],"hook":"「작은 놈이 큰 놈을 잡아먹는다」, A가 AB를 흡수. Fussell은 AND 가로줄, OR 세로줄로 표를 그리듯 늘어놓는다.","why":"","mix":""},{"name":"푸아송·지수분포","facts":["발생확률이 낮은 사건의 발생 횟수 → 푸아송분포","고장 간격 시간(고장률 일정) → 지수분포","X1·X2·X3 각 0.1인 AND면 정상사상 확률은 0.01"],"hook":"「횟수」는 푸아송, 「시간」은 지수. 「드문 사건 몇 번」이면 푸아송으로 직행.","why":"","mix":""}],"n":8,"rounds":8},{"id":"2-18","subject":"인간공학 및 시스템안전공학","chapter":"신뢰성","big":"가용도·수리율","title":"가용도·MTBF","topic3d":"","items":[{"name":"가용도(availability)","facts":["A = μ ÷ (λ + μ), 수리율 ÷ (고장률 + 수리율)","A = MTBF ÷ (MTBF + MTTR)","수리율 0.5·고장률 0.001 → 0.998","A 0.9·MTTR 2시간 → MTBF 18시간","MTTR = 평균수리시간(보전도, 짧을수록 좋다)"],"hook":"가용도는 「쓸 수 있는 시간 ÷ 전체 시간」. 분자엔 좋은 것(수리율·MTBF), 분모엔 좋은 것 더하기 나쁜 것. 고장이 드물면 거의 1이다.","why":"","mix":"분자에 「고장률」을 놓는 실수만 피하면 된다."},{"name":"직렬 신뢰도·FMEA β·공분산","facts":["타이어 4개 직렬: 0.99⁴ ≈ 0.96","FMEA β: 1 실제 손실, 0.1~1 손실 예상, 0~0.1 손실 가능, 0 영향 없음","기본사상의 독립 여부는 공분산으로 본다(독립이면 0)"],"hook":"타이어 하나 터지면 차는 못 간다, 직렬 곱셈. FMEA β는 「없음·가능·예상·발생」 0·0.1·1 세 눈금.","why":"","mix":"「예상」과 「발생」을 바꿔 놓는 것이 함정이다."}],"n":7,"rounds":5},{"id":"2-19","subject":"인간공학 및 시스템안전공학","chapter":"정보입력표시","big":"정보이론","title":"정보량·매직넘버","topic3d":"","items":[{"name":"정보량","facts":["H = log2 n","4택1 = 2 bit","확률이 다르면 H = Σ p × log2(1/p)","64 = 2⁶이면 6 bit"],"hook":"「2를 몇 번 곱하나」가 bit. 4지선다는 2번이니 2 bit, 64는 6번. byte로 쓴 보기는 단위 장난.","why":"","mix":""},{"name":"매직넘버와 절대식별","facts":["밀러의 매직넘버 7 ± 2","순음의 절대식별 약 5개","음의 세기 절대식별 약 5개","색의 절대식별 약 9개"],"hook":"머릿속 선반은 7칸 ± 2, 전화번호를 마디로 끊는 이유다. 소리(음·세기)는 5개, 색은 9개, 「소리 오, 색 구」.","why":"","mix":""}],"n":6,"rounds":6},{"id":"2-20","subject":"인간공학 및 시스템안전공학","chapter":"기계 일반","big":"소음·진동","title":"소음대책 순서","topic3d":"noise","items":[{"name":"소음의 방지대책","facts":["음원 → 전파경로 → 수음자 순으로 손댄다","음원 대책이 가장 효과적","통제·격리·차폐·배치·보호구","귀마개·귀덮개는 수음자(사람) 쪽 대책","「소음의 분배」라는 대책은 없다"],"hook":"「나는 곳·가는 길·듣는 귀」. 원인(음원)을 잡는 게 으뜸, 귀마개는 언제나 꼴찌. 위험관리 우선순위와 같은 논리다.","why":"","mix":"귀마개를 「음원 대책」이라 하면 틀린 보기다."}],"n":4,"rounds":4},{"id":"2-21","subject":"인간공학 및 시스템안전공학","chapter":"건설공사 안전개요","big":"계획·관리비","title":"유해위험방지계획서","topic3d":"","items":[{"name":"제출 시기와 기관","facts":["제조업(기계·기구 설치·이전): 작업 시작 15일 전까지 공단에 2부","건설업: 착공 전날까지","심사 결과 통보: 접수일부터 15일 이내","제출 기관: 한국산업안전보건공단","건설공사 중 확인: 6개월 이내마다"],"hook":"「제조는 15일 전, 건설은 전날」. 15가 두 번(제출 15일 전, 심사 15일 이내). 공단(公團)에 두 부(2부).","why":"","mix":""},{"name":"제출 대상","facts":["전기 계약용량 300 kW 이상인 제조업 등","가스집합 용접장치는 대상, 전기용접장치는 대상이 아니다"],"hook":"가스가 모이면(가스집합) 펑 터지니 계획서, 전기용접기는 그 정도가 아니다. 「가스는 대상, 전기는 탈락」.","why":"","mix":"「가스집합 용접장치」와 「전기용접장치」를 바꿔 놓은 보기가 함정이다."}],"n":3,"rounds":3},{"id":"2-22","subject":"인간공학 및 시스템안전공학","chapter":"인간공학 개요","big":"동작경제·실험","title":"동작경제의 원칙","topic3d":"","items":[{"name":"동작경제의 3분류","facts":["신체 사용에 관한 원칙","작업장 배치에 관한 원칙","공구·설비 설계에 관한 원칙","「가까운 곳에 배치」는 작업장 배치의 원칙"],"hook":"「몸·자리·도구」 세 갈래. 「배치」란 말이 보이면 자리(작업장 배치) 쪽이다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"2-23","subject":"인간공학 및 시스템안전공학","chapter":"설비 유지관리","big":"설비관리","title":"페일 세이프","topic3d":"","items":[{"name":"페일 세이프와 풀 프루프","facts":["페일 세이프: 기기 고장이 나도 사고가 안 되게","풀 프루프: 사람이 실수해도 사고가 안 되게"],"hook":"fail(고장)은 기계, fool(바보)은 사람. 「고장 나도 세이프, 바보라도 프루프」.","why":"","mix":"물음이 「기기의 고장」에서 시작하면 페일 세이프다."}],"n":1,"rounds":1},{"id":"2-24","subject":"인간공학 및 시스템안전공학","chapter":"인간공학 개요","big":"정의·목적","title":"인간공학의 목적","topic3d":"","items":[{"name":"인간-기계 시스템의 목적","facts":["안전 극대화 + 생산능률 향상","기계를 사람에게 맞춘다"],"hook":"「안전도 능률도」 둘 다 말하는 보기가 답. 하나만 말하면 반쪽이다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"2-25","subject":"인간공학 및 시스템안전공학","chapter":"공정안전","big":"PSM·공정관리","title":"공정안전보고서 대상","topic3d":"","items":[{"name":"공정안전보고서 제출 대상","facts":["원유 정제처리업·기타 석유정제물 재처리업","석유화학계 기초화학물질·합성수지 제조업","질소질 비료·복합비료 제조업","농약 원제·화약 및 불꽃제품 제조업","운송설비업은 대상이 아니다","규정량 이상 취급하면 업종 무관 대상"],"hook":"전부 「펑 터지거나 독한 화학 제조업」. 「원·석·석·질·복·농·화」, 원석의 석질을 복(福)으로 농화(濃化). 운송은 만드는 게 아니니 탈락.","why":"","mix":""}],"n":1,"rounds":1},{"id":"3-01","subject":"기계위험방지기술","chapter":"기계 일반","big":"위험점·방호","title":"위험점과 방호장치","topic3d":"forklift","items":[{"name":"기계설비의 위험점","facts":["끼임점: 고정부 + 회전부 (연삭숫돌과 받침대, 교반기 날개와 하우스)","물림점: 반대로 도는 두 회전체 사이 (롤러기의 두 롤러)","협착점: 왕복운동부 + 고정부","접선물림점: 벨트와 풀리, 체인과 스프로킷, 기어와 랙","절단점: 회전하는 부분이 단독으로 만든다"],"hook":"짝 맞추기 게임이다. 고정과 회전이 만나면 「끼」고, 롤러 둘이 마주 돌면 「물」고, 왕복하는 놈이 벽에 「협」박당하고, 벨트는 접선으로 「말려」 든다. 절단점만 짝 없는 외톨이다.","why":"무엇과 무엇 사이인가만 보면 이름이 갈린다.","mix":"물림점은 둘 다 회전, 끼임점은 하나만 회전한다."},{"name":"선반의 방호장치","facts":["쉴드(실드): 칩·절삭유 비산 방지","척 커버","칩 브레이커: 긴 칩을 짧게 끊는다(바이트에 붙음)","브레이크","방진구: 길이가 지름의 12배 이상인 긴 일감의 떨림 방지"],"hook":"선반의 다섯 보디가드 「쉴·척·칩·브·방」(쉴드·척커버·칩브레이커·브레이크·방진구). 「슬라이딩」은 야구장에서나 하는 것이라 선반 출입 금지다.","why":"","mix":"끊으면 칩 브레이커, 튀는 것을 막으면 쉴드다."},{"name":"양수기동식 방호장치의 안전거리","facts":["Dm = 1,600 × Tm (Tm은 초, Dm은 mm)","Tm = (1/클러치 맞물림 개소수 + 1/2) × 60,000 / SPM (ms)","예: 4개소·300 SPM → Tm 150 ms → Dm 240 mm","예: 하사점까지 0.5 s → 800 mm, 0.15 s → 24 mm"],"hook":"손은 초속 1.6 m로 달려드는 단거리 선수다. 그래서 「1,600 × 시간(초) = 거리(mm)」. 슬라이드가 0.5초 뒤에 내려오면 손은 800 mm 밖에서 출발해야 늦는다.","why":"손이 위험구역에 들어가는 속도를 1.6 m/s로 잡은 값이다.","mix":"광전자식도 D = 1.6(Tl + Ts)로 같은 1.6이다. 시간이 ms면 답은 mm로 나온다."},{"name":"방호장치의 분류","facts":["위험장소 방호: 격리형·위치제한형·접근거부형·접근반응형","위험원 방호: 포집형·감지형","양수조작식 = 위치제한형","접근거부형: 기계적으로 밀어낸다 / 접근반응형: 감지해 정지","감지형: 이상온도·이상기압·과부하를 감지해 안전상태로"],"hook":"장소를 지키는 경비원 넷 「격·위·거·반」(격리·위치제한·접근거부·접근반응), 위험원을 잡는 포수 둘 「포·감」(포집·감지). 양수조작식은 두 손을 버튼에 「묶어 두는」 위치제한형이다.","why":"","mix":"밀어내면 거부형, 멈추면 반응형이다. 포집형은 장소가 아니라 위험원 쪽이다."},{"name":"크레인 방호장치의 조정","facts":["크레인 방호장치 넷: 과부하방지·권과방지·비상정지·제동장치","권과방지장치 간격: 25 cm 이상 (직동식은 5 cm 이상)","과부하방지장치: 정격 초과 시 자동으로 상승 정지","비상정지장치: 모든 전원을 끊어 급정지","자동보수장치·파이널 리미트 스위치는 크레인 것이 아니다"],"hook":"크레인의 넷 「과·권·비·제」(과부하방지·권과방지·비상정지·제동). 훅이 천장을 들이받기 25 cm 전에 권과방지장치가 「그만!」을 외친다. 직동식은 5 cm까지 봐준다.","why":"","mix":"파이널 리미트 스위치는 승강기 몫이다. 브레이크는 「저속으로」가 아니라 즉시 정지다."},{"name":"지게차 헤드가드","facts":["강도: 최대하중의 2배 등분포정하중 (4톤 초과는 4톤으로)","상부틀 개구부의 폭 또는 길이 16 cm 미만","앉아서 조작: 0.903 m, 서서 조작: 1.88 m","1.5배·5톤·1.5 m·1.8 m로 바꿔 놓은 보기는 함정"],"hook":"지게차 지붕은 두 배로 튼튼하게, 4톤이 천장이다. 구멍은 머리가 안 빠지는 16 cm 미만. 0.903과 1.88이라는 못생긴 숫자가 오히려 「정답 도장」이다. 예쁜 숫자가 오답이다.","why":"16 cm는 머리가 빠져나가지 못하는 크기라서 정한 값이다.","mix":"2배·4톤·16 cm·0.903·1.88 다섯 수를 한 세트로 묶는다."},{"name":"컨베이어의 방호장치","facts":["비상정지장치","이탈 및 역주행 방지장치 (정전·전압강하 대비)","덮개 또는 울","건널다리: 운전 중 컨베이어를 넘어갈 때","잠금장치·권과방지장치는 컨베이어 것이 아니다"],"hook":"컨베이어 넷 「비·이·덮·건」(비상정지·이탈역주행방지·덮개울·건널다리). 컨베이어를 넘어가고 싶으면 급정지 버튼이 아니라 다리(건널다리)를 놓는다.","why":"","mix":"권과방지는 양중기, 잠금장치는 컨베이어 목록에 없다."},{"name":"프레스 방호장치의 선정","facts":["수인식·손쳐내기식: 슬라이드 행정수 100 SPM 이하, 행정길이 50 mm 이상","손쳐내기식은 120 SPM 이하까지","수인식은 확동식 클러치용 (마찰 클러치에는 부적합)","방호울식 = no hand in die, 양수조작·수인·손쳐내기·광전자 = hand in die"],"hook":"느린 프레스(100 SPM 이하)라야 손을 끌어당기거나(수인) 쳐낼(손쳐내기) 시간이 있다. 300 SPM짜리 속사포 앞에서는 봉이 손을 못 따라간다. 손쳐내기는 조금 더 빠른 120까지 봐준다.","why":"","mix":"방호울만 「손이 아예 못 들어가는」 no hand in die다."}],"n":123,"rounds":24},{"id":"3-02","subject":"기계위험방지기술","chapter":"프레스·전단기","big":"프레스","title":"프레스와 롤러기","topic3d":"roller","items":[{"name":"프레스 작업시작 전 점검","facts":["클러치 및 브레이크의 기능","크랭크축·플라이휠·슬라이드·연결봉·연결나사의 풀림 유무","1행정 1정지기구·급정지장치·비상정지장치의 기능","슬라이드 또는 칼날에 의한 위험방지 기구의 기능","압력방출장치·권과방지장치·공압계통·매니퓰레이터는 점검 항목이 아니다"],"hook":"프레스는 「멈추는 것」만 본다. 클러치·브레이크·급정지·비상정지. 압력방출장치가 보이면 보일러가 잘못 들어온 것이고, 매니퓰레이터가 보이면 로봇이 잘못 들어온 것이다.","why":"","mix":"권과·과부하가 보이면 양중기 쪽 문제다."},{"name":"롤러기 급정지장치 조작부 높이","facts":["손 조작식: 밑면에서 1.8 m 이내","복부 조작식: 밑면에서 0.8 m 이상 1.1 m 이내","무릎 조작식: 밑면에서 0.6 m 이내 (0.4~0.6 m)","조작부는 손·복부·무릎 셋뿐"],"hook":"몸에서 그 부위가 있는 높이 그대로다. 손은 만세 하면 1.8, 배꼽은 1 m 언저리(0.8~1.1), 무릎은 0.6. 1.2~1.4 m는 가슴이라 배로 누를 수 없다.","why":"손이 말려 들어가는 순간 쓸 수 있는 곳이 배와 무릎이다.","mix":"0.8은 복부의 아래 한계인데 무릎 자리에 옮겨 놓은 보기가 함정이다."},{"name":"롤러기 급정지거리","facts":["앞면 롤러 표면속도 30 m/min 미만: 원주의 1/3 이내","30 m/min 이상: 원주의 1/2.5 이내","예: 지름 300 mm·30 rpm → 속도 28.3 m/min → 942/3 ≒ 314 mm"],"hook":"느리면 3분의 1, 빠르면 2.5분의 1. 「빠를수록 더 짧게 세워야 하나?」 헷갈리면 이렇게 잡는다. 1/2.5가 1/3보다 크니 빠른 롤러에는 조금 더 긴 거리를 봐준다.","why":"","mix":"30 m/min이 갈림길이다. 원주 πD를 m/min으로 바꿔 먼저 속도를 판정한다."},{"name":"금형의 안전화·설치","facts":["T홈 안길이: 설치 볼트 지름의 2배 이상","금형 부착·해체·조정 시 안전블록 설치","페달에는 커버를 씌운다","급정지스위치는 적색"],"hook":"볼트는 깊이 물려야 안 빠진다. T홈은 볼트 지름의 두 배 깊이. 「이하」로 얕게 파 놓은 보기는 금형을 떨어뜨리는 보기다. 페달엔 뚜껑, 급정지는 빨간불.","why":"","mix":"안전 기준에서 「이하·짧게」가 나오면 한 번 더 의심한다."},{"name":"롤러기 급정지장치의 로프","facts":["와이어로프: 지름 4 mm 이상","합성섬유로프: 지름 6 mm 이상, 절단하중 2.94 kN 이상","프레스 수인식의 수인끈은 합성섬유 지름 4 mm 이상"],"hook":"쇠줄(와이어)은 4 mm, 무른 섬유줄은 6 mm. 약한 쪽이 더 굵어야 같은 힘을 버틴다는 상식대로다.","why":"","mix":"수인끈 4 mm는 프레스 쪽 기준이다."},{"name":"그 밖에","facts":["제품·스크랩 자동 배출장치가 아닌 것: 피더(공급장치)","양수조작식은 hand in die, 방호울식이 no hand in die"],"hook":"피더는 먹이는(feed) 장치지 내보내는 장치가 아니다. 들어오는 문과 나가는 문을 바꿔 놓은 함정이다.","why":"","mix":""}],"n":47,"rounds":24},{"id":"3-03","subject":"기계위험방지기술","chapter":"공작기계","big":"선반·밀링·드릴","title":"공작기계 안전수칙","topic3d":"","items":[{"name":"밀링작업의 안전수칙","facts":["일감은 바이스에 짧게 물린다 (길게 물리면 오답)","칩 제거는 정지 후 브러시로","칩 브레이커는 칩을 끊는 장치이지 치우는 장치가 아니다"],"hook":"공작기계 세계의 헌법 제1조: 「돌 때 손대지 않는다」. 제2조: 「길게 내밀면 흔들린다」. 일감도 바이트도 짧게. 칩은 멈추고 빗자루(브러시)로 쓴다.","why":"길게 내밀수록 휘청거려 정밀도가 떨어지고 부러진다.","mix":"플레이너에서 「칩 브레이커로 칩이 길게 되도록」은 거꾸로 된 문장이다."},{"name":"선반작업의 안전수칙","facts":["보안경 착용, 장갑은 금지","바이트는 짧게 물린다","칩은 도구로 치운다","길이가 지름의 12배 이상이면 방진구"],"hook":"선반 앞에서는 「눈은 가리고(보안경) 손은 벗는다(장갑 금지)」. 반대로 하면 장갑째 감겨 들어간다.","why":"","mix":"12배 이상 긴 일감이면 방진구, 이 숫자는 5배가 아니다."},{"name":"드릴작업의 안전","facts":["일감은 바이스로 고정, 플라이어로 잡고 뚫지 않는다","척 렌치는 작업 전 반드시 뺀다","드릴·리머는 금속 망치로 두드려 고정하지 않는다","장갑 금지"],"hook":"척 렌치를 꽂아 둔 채 스위치를 켜면 렌치가 총알이 되어 날아간다. 「렌치 빼기」가 드릴의 첫 의식이다. 손으로 잡고 뚫는 것은 손을 같이 돌리겠다는 뜻이다.","why":"드릴이 뚫고 나가는 순간 일감을 함께 돌린다.","mix":"「손」이 들어가는 방법은 모두 오답이다."},{"name":"장갑 착용 금지작업","facts":["회전 공작기계(선반·드릴·밀링)는 장갑 금지","용접 작업은 장갑 착용"],"hook":"도는 것 앞에서는 맨손, 뜨거운 것 앞에서는 장갑. 보기 셋이 모두 회전기계면 남는 하나가 용접이다.","why":"","mix":""},{"name":"침투탐상검사의 순서","facts":["전처리 → 침투 → 세척 → 현상 → 관찰 → 후처리","세척이 침투와 현상 사이에 낀다"],"hook":"「전·침·세·현·관·후」(전처리·침투·세척·현상·관찰·후처리). 화장하듯 「스며들게 하고, 겉만 닦고, 빨아올려 드러낸다」의 순서다.","why":"","mix":""}],"n":37,"rounds":22},{"id":"3-04","subject":"기계위험방지기술","chapter":"산업용 기계","big":"보일러·압력용기","title":"보일러 압력방출장치","topic3d":"boiler","items":[{"name":"압력방출장치의 검사 주기","facts":["매년 1회 이상 검사","공정안전보고서 이행상태 평가 우수 사업장: 4년에 1회 이상","8년은 오답"],"hook":"모범생(우수 사업장)은 4년에 한 번만 시험 본다. 나머지는 해마다. 「8년」은 졸업할 때까지 안 보겠다는 소리라 오답이다.","why":"","mix":"매년 1회와 4년 1회, 두 값뿐이다."},{"name":"압력방출장치의 봉인","facts":["봉인 재료는 납","납은 무르고 자국이 남는다"],"hook":"납은 손만 대도 자국이 남는 「고자질쟁이」 금속이다. 그래서 누가 건드렸는지 표 나야 하는 봉인에 쓴다.","why":"무르고 잘 눌려 손댄 자국이 그대로 남는다.","mix":""},{"name":"압력방출장치 2개 설치 시 작동압력","facts":["1개는 최고사용압력 이하에서 작동","다른 1개는 최고사용압력의 1.05배 이하에서 작동"],"hook":"첫째가 제때 안 열릴까 봐 둘째를 5 % 늦게(1.05배) 열리는 예비 선수로 둔다. 「일점영오」는 보일러의 백업 번호다.","why":"첫째가 안 열릴 때를 대비한 예비다.","mix":""},{"name":"보일러의 방호장치·이상현상","facts":["방호장치 셋: 압력방출장치·압력제한스위치·고저수위 조절장치","압력제한스위치: 버너 연소를 차단해 정상압력으로","프라이밍(솟음)·포밍(거품)·캐리오버(실려 나감)는 물 쪽 현상","역화는 연소의 이상","아웃트리거는 크레인의 받침다리"],"hook":"보일러의 걱정은 「압력」과 「물 마름」 둘뿐이라 방호장치도 압력·압력·수위다. 물이 솟고(프라이밍) 거품 일고(포밍) 실려 나가면(캐리오버) 한 드라마, 불이 거꾸로 나오면(역화) 다른 드라마다.","why":"","mix":"아웃트리거가 보이면 양중기 낱말이 잘못 들어온 것이다."},{"name":"파열판의 표시사항","facts":["파열판에는 분출차가 없다","분출차는 여닫는 안전밸브의 표시 항목"],"hook":"파열판은 한 번 터지면 끝나는 일회용 풍선이다. 「얼마나 열렸다 닫히나(분출차)」를 적을 수가 없다. 그건 여닫이문(안전밸브) 이야기다.","why":"","mix":""}],"n":34,"rounds":22},{"id":"3-05","subject":"기계위험방지기술","chapter":"기계 일반","big":"안전조건·안전율","title":"안전율과 안전화","topic3d":"","items":[{"name":"안전율(안전계수)","facts":["안전율 = 인장강도(기초강도) ÷ 허용응력, 언제나 1보다 크다","허용응력 = 인장강도 ÷ 안전율 (250 N/mm²·안전율 4 → 62.5)","최대하중 = 파괴강도 × 단면적 ÷ 안전율 (70 MPa·1,800 mm²·2 → 63 kN)","안전도 = 인장강도 ÷ 내압"],"hook":"안전율은 「버티는 힘 나누기 걸리는 힘」, 늘 큰 놈이 위(분자)에 올라간다. 1보다 작은 안전율은 「이미 부러졌다」는 뜻이니 보기에서 바로 지운다.","why":"견디는 값이 분자, 실제로 걸리는 값이 분모다.","mix":"보기 중 분자·분모를 뒤집어 놓은 것 하나가 함정이다."},{"name":"페일 세이프와 풀 프루프","facts":["페일 세이프: 기계가 고장 나도 안전","풀 프루프: 사람이 실수해도 안전","페일 세이프의 기능적 분류에 Fool proof는 없다"],"hook":"페일(fail)은 기계가 「실패」한 것, 풀(fool)은 사람이 「바보짓」한 것. 보기 셋이 fail로 시작하고 하나만 fool이면 그 바보가 답이다.","why":"","mix":"「인간이 취급을 잘못해도」라는 말이 보이면 풀 프루프다."},{"name":"no hand in die","facts":["방호울식 = no hand in die","양수조작식·수인식·손쳐내기식·광전자식 = hand in die"],"hook":"「금형 안에 손 없음」은 이름 그대로 손이 아예 못 들어가는 울타리(방호울)뿐이다. 양수조작식은 두 손을 밖에 붙잡아 둘 뿐 금형은 열려 있다.","why":"","mix":""},{"name":"기계설비의 안전화 분류","facts":["외형의 안전화: 회전부 덮개, 돌출부 제거, 색칠","기능의 안전화: 오동작 검토","구조의 안전화: 재료·가공 결함","적극적 대책: 회로 개선·설계 변경 / 소극적: 벌어진 뒤 정지"],"hook":"「외형」은 겉모습이라 덮개와 페인트, 「기능」은 오동작, 「구조」는 재료와 가공이다. 애초에 안 벌어지게 고치면 적극적, 벌어진 뒤 멈추면 소극적이다.","why":"","mix":"「오동작」이 붙으면 기능, 「재료·가공」이 붙으면 구조다."}],"n":30,"rounds":21},{"id":"3-06","subject":"기계위험방지기술","chapter":"공작기계","big":"연삭기","title":"연삭기 덮개와 숫돌","topic3d":"grinder","items":[{"name":"연삭기 덮개의 노출각도","facts":["상부 사용 탁상용: 60° 이내","일반 탁상용: 125° 이내 (수평면 위로 65° 이내)","원통·센터리스 등: 150° 이내","휴대용: 180° 이내","덮개 설치 대상: 숫돌 지름 5 cm 이상"],"hook":"60 → 125 → 150 → 180, 손에 들수록 활짝 연다. 위쪽만 쓰는 탁상용은 60°만 살짝 열고, 휴대용은 반원(180°)을 통째로 연다.","why":"작업점이 위에 있으면 좁게, 손으로 들고 넓은 면을 쓰면 넓게 연다.","mix":"「상부 사용」이 붙으면 60°, 안 붙으면 125°다."},{"name":"연삭숫돌의 플랜지","facts":["평형 플랜지 지름: 숫돌 지름의 1/3 이상","150 mm → 50 mm, 180 mm → 60 mm, 300 mm → 100 mm, 60 cm → 20 cm","안팎 플랜지 지름은 같아야 정상"],"hook":"플랜지는 숫돌을 붙드는 손바닥이다. 손바닥이 숫돌의 3분의 1은 돼야 붙든다. 숫돌 지름 보고 3으로 나누면 끝.","why":"","mix":"플랜지가 「현저히 클 때」는 파괴 원인이 아니다. 클수록 안전하다."},{"name":"연삭숫돌의 파괴 원인","facts":["측면 사용 (정면 사용은 정상)","플랜지가 숫돌 지름의 1/3 미만으로 작을 때","회전속도 과다","안팎 플랜지 지름이 다를 때"],"hook":"숫돌은 정면으로 깎으라고 태어났다. 옆구리(측면)로 밀면 쪼개진다. 「정면 사용」이나 「플랜지가 큼」이 파괴 원인으로 나오면 그게 오답이다.","why":"","mix":""},{"name":"연삭기의 안전기준·시운전","facts":["작업 시작 전 시운전 1분 이상","숫돌 교체 후 시운전 3분 이상","워크레스트(받침대) 간격 3 mm 이내","조정편 간격 5 mm 이내","인장강도 274.5 MPa"],"hook":"「전 1, 후 3」. 출근하면 1분 워밍업, 새 숫돌로 갈아 끼우면 3분 워밍업. 받침대 3 mm, 조정편 5 mm는 「삼오」로 묶는다.","why":"","mix":"교체 후 「2분」은 모자란다."},{"name":"연삭기의 원주속도","facts":["V = πDN ÷ 1,000 (D는 mm, V는 m/min)","200 mm·300 rpm → 188.5 m/min","250 m/min·20 cm → 약 398 rpm","원주길이가 주어지면 그대로 × 회전수"],"hook":"πDN 세 글자를 「파이(π) 던(D) 엔(N)」 한 숨에 외운다. mm를 m로 바꾸는 1,000만 안 잊으면 답이 나온다.","why":"","mix":""},{"name":"눈메꿈과 무딤","facts":["눈메꿈(로딩): 숫돌 구멍이 칩으로 막힘","무딤(글레이징): 날이 안 떨어져 무뎌짐","둘 다 드레싱으로 고친다"],"hook":"눈메꿈은 「눈이 막힌」 것, 무딤은 「날이 무딘」 것. 병은 둘인데 약은 하나, 드레싱이다.","why":"","mix":""}],"n":29,"rounds":20},{"id":"3-07","subject":"기계위험방지기술","chapter":"운반·양중기","big":"크레인","title":"크레인과 와이어로프","topic3d":"wirerope","items":[{"name":"달기구의 안전계수","facts":["근로자가 타는 운반구의 달기와이어로프·체인: 10 이상","화물을 직접 지지하는 달기와이어로프·체인: 5 이상","훅·샤클·클램프·리프팅 빔: 3 이상","그 밖의 경우: 4 이상"],"hook":"사람 10 · 화물 5 · 훅류 3 · 나머지 4. 사람 목숨이 화물의 두 배 값이다. 훅·샤클은 「쇳덩이라 3」, 나머지는 「그냥 4」.","why":"안전계수 = 절단하중 ÷ 걸리는 하중의 최대값, 값이 클수록 여유가 크다.","mix":""},{"name":"와이어로프의 꼬임","facts":["보통 꼬임: 꼬임이 잘 안 풀리고 튼튼하나 빨리 닳는다","랭 꼬임: 내마모성·유연성이 우수하다","한쪽에 장점을 다 몰아 놓은 보기가 틀렸다"],"hook":"보통 꼬임은 「성실한 노인」, 튼튼하지만 빨리 닳는다. 랭 꼬임은 「유연한 청년」, 잘 안 닳고 부드럽다. 둘의 장점을 한 명이 다 가졌다고 하면 거짓말이다.","why":"","mix":""},{"name":"양중기의 종류·기준","facts":["크레인: 정격하중 0.5톤 이상","이삿짐운반용 리프트: 적재하중 0.1톤 이상","승강기: 출제 당시 최대하중 0.25톤 이상","0.1톤 미만 이삿짐 리프트는 양중기가 아니다"],"hook":"양중기 입장권 값: 크레인 0.5톤, 승강기 0.25톤, 이삿짐 리프트 0.1톤. 반, 반의 반, 십분의 일로 내려간다.","why":"","mix":""},{"name":"로프에 걸리는 총 하중","facts":["총 하중 = 정하중 + 동하중","동하중 = (W/g) × a","100 kg을 2 m/s²로 권상 → 약 1,200 N"],"hook":"엘리베이터가 출발할 때 몸이 무거워지는 그 느낌이 동하중이다. 정하중(그냥 무게)에 「가속도 몫」을 얹어 준다.","why":"","mix":""},{"name":"타워크레인의 지지·방호","facts":["와이어로프 지지: 4개소 이상, 같은 각도, 수평면에서 60° 이내","과부하방지장치: 정격 초과 시 자동으로 상승 정지","전용탑승설비 작업 시 승차석 외 탑승 제한은 조치 사항이 아니다"],"hook":"타워크레인은 네 방향에서 같은 각도로 잡아당기는 텐트다. 줄이 60°보다 곧추서면 옆으로 붙드는 힘이 사라진다.","why":"각도가 수직에 가까울수록 옆으로 붙드는 힘이 약해진다.","mix":"4개소·같은 각도·60° 이내, 셋을 한 묶음으로."}],"n":27,"rounds":18},{"id":"3-08","subject":"기계위험방지기술","chapter":"기계 일반","big":"동력전달·통로","title":"사다리·통로·회전축","topic3d":"ladder","items":[{"name":"사다리식 통로의 기준","facts":["기울기 75° 이하 (60°는 오답)","고정식 사다리 90° 이하, 높이 7 m 이상이면 등받이울","발판과 벽 사이 15 cm 이상","상단은 걸쳐 놓은 지점에서 60 cm 이상 돌출","길이 10 m 이상이면 5 m 이내마다 계단참"],"hook":"사다리는 「칠오(75)」가 기본, 벽에 박은 고정식은 「구십(90)」. 발끝 15, 머리 위 60, 열 미터 넘으면 다섯마다 쉼터. 「75 · 90 · 7 · 15 · 60 · 10 · 5」를 노래하듯.","why":"사다리는 가파르게 세우는 것이라 60°는 오히려 계단 각이다.","mix":""},{"name":"통로의 조도와 옥내통로","facts":["통로 조도 75 lux 이상","옥내통로는 높이 2 m 이내에 장애물 금지"],"hook":"통로는 「다니기만 하면 되니」 가장 어두운 75 lux. 천장 2 m 아래로 파이프가 지나가면 머리를 박는다.","why":"","mix":"75 lux는 「그 밖의 작업」과 같은 값이다."},{"name":"컨베이어 작업시작 전 점검","facts":["원동기·풀리 기능의 이상 유무","이탈 방지장치 기능","비상정지장치 기능","원동기·회전축·기어·풀리의 덮개 또는 울","급유는 점검 항목이 아니다","하물 적치 후 시동·정지 반복 테스트는 금지"],"hook":"「돌아가나 · 벗어나지 않나 · 멈추나 · 덮여 있나」 넷. 기름칠(급유)은 정비사의 일이지 아침 점검이 아니다.","why":"","mix":""},{"name":"원동기·회전축의 위험 방지","facts":["덮개·울·슬리브·건널다리를 설치","램은 위험방지 장치가 아니다"],"hook":"돌아가는 축은 「덮고(덮개) 두르고(울) 씌우고(슬리브) 건너간다(건널다리)」. 램은 프레스가 내리찍는 놈이라 남의 집 식구다.","why":"","mix":""},{"name":"그 밖에","facts":["선반 작동 중 주유는 금지, 정지 후 주유","회전부 덮개는 외형의 안전화"],"hook":"「작동 중·운전 중·회전 중」 뒤에 무슨 동사가 와도 오답이다. 기름칠도 예외 없다.","why":"","mix":""}],"n":21,"rounds":14},{"id":"3-09","subject":"기계위험방지기술","chapter":"산업용 기계","big":"아세틸렌·용접","title":"아세틸렌 용접장치","topic3d":"gasweld","items":[{"name":"아세틸렌 용접장치의 금속·압력","facts":["구리 또는 구리 함유량 70 % 이상 합금 사용 금지 (60 %는 오답)","은·수은도 금지 (폭발성 아세틸라이드 생성)","게이지 압력 127 kPa(1.3 kgf/cm²) 초과 금지"],"hook":"아세틸렌과 구리는 사귀면 폭탄(아세틸라이드)을 낳는 커플이다. 구리 70 %부터 출입 금지. 「칠십 금지, 백이십칠 초과 금지」로 묶는다.","why":"","mix":""},{"name":"발생기실·가스집합장치의 거리","facts":["가스집합장치: 화기 설비에서 5 m 이상","발생기실: 화기 설비에서 3 m 초과, 건물 최상층","발생기실 옥외 설치 시 개구부는 다른 건축물에서 1.5 m 이상","1 m는 오답"],"hook":"「5 · 3 · 1.5」로 내려간다. 큰 가스집합장치는 불에서 5 m, 발생기실은 3 m, 옆집 창문과는 1.5 m. 불이 제일 무서우니 불에서 제일 멀다.","why":"","mix":"발생기실 1 m는 함정, 3 m 초과다."},{"name":"가스용기의 취급","facts":["운반할 때는 캡을 씌운다 (벗기면 오답)","용기 온도 40 ℃ 이하 유지","아세틸렌 용기는 세워서 사용 (뉘어서 사용은 오답)"],"hook":"캡은 밸브의 헬멧이다. 넘어져 밸브가 부러지면 용기가 로켓이 되어 날아간다. 옮길 때야말로 헬멧을 씌운다. 용기는 40 ℃ 이하로, 사람처럼 열나면 안 된다.","why":"","mix":""},{"name":"안전기의 설치·역화","facts":["안전기는 취관마다, 분기관에 설치","수봉식·건식 두 종류","역화 원인: 팁 막힘·과열·압력 부적당 (아세틸렌 공급 과다는 아니다)","아세틸렌 발화점 약 406~408 ℃"],"hook":"안전기는 불이 거꾸로 기어 들어오는 길목마다 세운 검문소다. 수봉식은 물로 막는 검문소. 역화는 「불이 굶어서」 거슬러 오는 것이지 배불러서(공급 과다) 오는 게 아니다.","why":"","mix":"수봉식 안전기는 아세틸렌 용접장치 것이지 공기압축기 것이 아니다."},{"name":"용접부의 결함","facts":["언더컷: 전류 과대·속도 빠름·아크 짧게 유지 어려움 → 모재가 파여 홈","오버랩: 전류가 약할 때"],"hook":"언더컷은 「아래로 파인」 홈, 오버랩은 「위로 겹친」 혹. 전류가 세면 파이고 약하면 덮인다.","why":"","mix":""}],"n":21,"rounds":15},{"id":"3-10","subject":"기계위험방지기술","chapter":"설비진단","big":"비파괴검사","title":"비파괴검사와 고속회전체","topic3d":"rotor","items":[{"name":"고속회전체의 비파괴검사","facts":["대상: 회전축 중량 1톤 초과 + 원주속도 120 m/s 이상 (둘 다 충족)","고속회전체 자체의 정의는 원주속도 25 m/s"],"hook":"「무겁고(1톤 초과) 빠른(120 m/s) 놈」만 속을 들여다본다. 터지면 파편이 총알이 되기 때문이다. 보기 넷은 이 둘을 하나씩 어긋나게 짝지어 놓았다.","why":"","mix":"25 m/s는 고속회전체의 정의, 120 m/s는 비파괴검사 대상이다."},{"name":"설비 배치의 3단계","facts":["지역배치 → 건물배치 → 기계배치"],"hook":"「땅 → 집 → 가구」 순서다. 집을 짓기 전에 소파 자리부터 정하는 사람은 없다.","why":"큰 것에서 작은 것으로 좁혀 간다.","mix":""},{"name":"비파괴검사의 종류","facts":["비파괴 여섯: RT(방사선)·UT(초음파)·MT(자분)·PT(침투)·ET(와전류)·AE(음향방출)","인장시험·피로시험·샤르피 충격시험은 파괴시험","내부는 RT·UT, 표면은 MT·PT"],"hook":"「~탐상」「~투과」가 붙으면 비파괴, 「당기고(인장) 두드리고(충격) 지치게(피로)」 하면 파괴다. 속을 보려면 RT·UT, 겉을 보려면 MT·PT.","why":"","mix":""},{"name":"와전류(와류)탐상","facts":["교류를 통한 코일을 도체에 접근시켜 유기 전압·전류 변화로 결함 검출","빠르고 비접촉이지만 영향 인자가 많다"],"hook":"코일이 「소용돌이(와류)」를 일으켜 몰래 속을 훑는다. 빠르고 손 안 대는 대신 변수에 잘 휘둘리는 예민한 성격이다. 「인자가 적다」는 칭찬은 거짓이다.","why":"","mix":""},{"name":"자분탐상(MT)","facts":["강자성체의 표면 결함, 누설자속에 쇳가루가 모인다","결과가 눈에 보인다","오스테나이트계 스테인리스강(304·316)은 자석에 안 붙어 불가"],"hook":"자석에 쇳가루 뿌리는 초등학교 실험 그대로다. 금 간 자리에 자력선이 새어 쇳가루가 줄을 선다. 자석에 안 붙는 스테인리스는 실험 불참.","why":"","mix":"「강자성체」「누설자속」 두 낱말이 곧 자분탐상이다."},{"name":"그 밖에","facts":["음향방출시험은 재료 종류·물성에 따라 달라진다","방사선 투과사진 상질 점검에 주파수는 없다"],"hook":"음향방출은 재료가 「비명 지르는 소리」를 듣는 검사라 재료마다 목소리가 다르다. 「재료와 관계없이」는 거짓이다.","why":"","mix":""}],"n":20,"rounds":20},{"id":"3-11","subject":"기계위험방지기술","chapter":"기계 일
