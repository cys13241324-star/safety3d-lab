반","big":"소음·진동","title":"방진구·소음·진동","topic3d":"","items":[{"name":"선반의 방진구","facts":["일감 길이가 지름의 12배 이상이면 방진구","5배는 오답","바이트는 짧게, 방진구는 12배"],"hook":"국수 가락처럼 가늘고 긴 일감은 돌면 춤을 춘다. 지름의 12배부터 허리를 붙드는 방진구를 채운다. 「열두 배 방진구」로 외운다.","why":"길수록 휘어 떨린다.","mix":""},{"name":"소음의 방지대책","facts":["소음원 대책: 발생원 제거·차단·저감","작업자 보호구 착용은 수음자 대책이지 소음원 대책이 아니다"],"hook":"소음원 대책은 「입을 막는」 것, 보호구는 「귀를 막는」 것. 귀마개는 소리를 줄이는 게 아니라 나만 안 듣는 것이다.","why":"","mix":""},{"name":"프레스의 안전블록","facts":["금형 부착·해체·조정 시 슬라이드 낙하 방지","전원을 꺼도 슬라이드는 제 무게로 떨어진다"],"hook":"차 밑에 들어갈 때 잭만 믿지 말고 받침목을 괴듯, 슬라이드 밑에 몸이 들어갈 땐 안전블록을 괸다. 전기는 꺼져도 중력은 안 꺼진다.","why":"","mix":""},{"name":"도플러 효과·공기스프링","facts":["도플러 효과: 다가오면 고음, 멀어지면 저음","공기스프링은 측면 강성이 약하다"],"hook":"구급차가 지나갈 때 「삐요삐요」가 높아졌다 낮아지는 그것이 도플러다. 공기스프링은 위아래로는 잘 버티지만 옆으로 밀면 물주머니처럼 기운다.","why":"","mix":""},{"name":"칩 브레이커·선반 수칙","facts":["칩 브레이커: 이어진 칩을 잘게 끊는다","변속·측정·칩 제거·공구 교환은 주축 정지 후"],"hook":"이어진 칩은 뜨거운 면발이라 몸에 감기면 크게 다친다. 「끊는다」는 말이 곧 브레이커다.","why":"","mix":""}],"n":15,"rounds":11},{"id":"3-12","subject":"기계위험방지기술","chapter":"기계 일반","big":"재료·강도시험","title":"재료시험과 고장유형","topic3d":"","items":[{"name":"비파괴시험과 파괴시험","facts":["비파괴: RT·UT·MT·PT·ET·AE","파괴: 인장·압축·굽힘·충격(샤르피)·피로·경도","내부 균열은 초음파탐상(UT), 표면 개구 결함은 침투탐상(PT)","항복점은 인장시험으로"],"hook":"「탐상·투과」는 살살 보는 검사, 「인장·충격·피로」는 부러뜨려 보는 검사다. 속이 궁금하면 초음파(UT), 겉 틈이 궁금하면 침투(PT).","why":"","mix":"경도시험은 흠집만 내서 준파괴로 보기도 한다."},{"name":"욕조곡선과 고장의 유형","facts":["초기고장 → 우발고장 → 마모고장","순간적·예기치 못한 외력 = 우발고장","마모고장은 예방보전으로 막는다","조립 고장·수시고장은 고장 유형이 아니다"],"hook":"욕조를 옆에서 본 모양이다. 처음엔 높고(초기, 갓난아기), 가운데는 낮고(우발, 청년), 끝에 다시 오른다(마모, 노년). 「초·우·마」.","why":"","mix":""},{"name":"안전율·안전도","facts":["안전율 = 인장강도 ÷ 작용응력","안전도 = 인장강도 ÷ 내압","교반기 날개와 하우스 사이는 끼임점"],"hook":"안전율은 언제나 「큰 값이 위」. 세 값이 0.79~0.83으로 붙어 있으면 어림하지 말고 꼭 나눠 본다.","why":"","mix":""}],"n":12,"rounds":11},{"id":"3-13","subject":"기계위험방지기술","chapter":"운반·양중기","big":"지게차·차량계","title":"지게차 안정도","topic3d":"forklift","items":[{"name":"지게차의 안정도 기준","facts":["하역작업 시 전후: 4 % 이내 (5톤 이상은 3.5 %)","하역작업 시 좌우: 6 % 이내","주행 시 전후: 18 % 이내","주행 시 좌우: (15 + 1.1V) % 이내, V는 최고속도 km/h","예: 20 km/h → 37 %"],"hook":"「4 · 6 · 18 · 15+1.1V」. 짐 들고 있을 땐 조심조심(4·6), 빈 채로 달릴 땐 널널(18·15+1.1V). 속도가 붙는 건 주행 좌우 딱 하나, 커브 돌 때 넘어지니까.","why":"짐을 들면 무게중심이 높아져 훨씬 위험하므로 하역 때 값이 작다.","mix":"「부하 상태」라도 「주행」이면 주행 기준 18 %다."},{"name":"안정도 계산","facts":["안정도(%) = 높이 ÷ 수평거리 × 100","수평거리 20 m·높이 5 m → 25 %","수평거리 = 높이 ÷ 안정도 (30 %는 0.3으로)"],"hook":"안정도는 「기울기」다. 올라간 높이를 간 거리로 나눈다. 30 %를 30으로 나누면 자릿수가 도망가니 0.3으로 바꾼다.","why":"","mix":"안정도는 「안 넘어지는 한계」이지 「비탈을 오르는 힘(등판능력)」이 아니다."},{"name":"지게차의 안정 조건","facts":["W·a ≤ G·b (W 화물중량, a 앞바퀴~화물 무게중심, G 차체중량, b 앞바퀴~차체 무게중심)","화물 200 kgf·1 m, 차체 400 kgf → b는 0.5 m 초과"],"hook":"앞바퀴를 받침점으로 한 시소다. 앞자리 화물이 뒷자리 차체보다 무거워지면 앞으로 꼬꾸라진다. 그래서 엉덩이에 카운터웨이트를 단다.","why":"","mix":""},{"name":"구내운반차·점검","facts":["핸들 중심에서 차체 바깥까지 65 cm 이상 (70은 오답)"],"hook":"핸들 잡은 손이 차 밖으로 안 나가는 거리가 65 cm다. 「70」처럼 반듯하게 다듬은 숫자는 함정이다.","why":"","mix":""}],"n":12,"rounds":11},{"id":"3-14","subject":"기계위험방지기술","chapter":"기계 일반","big":"수공구·작업수칙","title":"수공구·정·드릴 수칙","topic3d":"","items":[{"name":"정(chisel) 작업의 안전","facts":["시작할 때와 끝날 무렵에는 약하게 친다 (세게 치면 오답)","약 → 강 → 약의 리듬"],"hook":"정 작업은 「약·강·약」의 왈츠다. 처음엔 자리 잡느라 살살, 마지막엔 조각이 튀지 않게 살살. 「끝날 때 세게」는 파편을 얼굴로 받겠다는 뜻이다.","why":"끊어지기 직전 마지막 한 번의 세기가 튀는 조각의 속도를 정한다.","mix":""},{"name":"드릴작업의 안전수칙","facts":["작업 전 척 렌치를 반드시 뺀다","렌치를 끼운 채 작업은 오답","장갑 금지, 손으로 잡기 금지, 회전 중 손 넣기 금지"],"hook":"드릴의 3금기 1필수. 장갑·손잡기·손넣기는 금지, 척 렌치 빼기는 필수. 렌치를 꽂고 켜면 렌치가 프로펠러가 되어 날아간다.","why":"","mix":""},{"name":"보일러의 프라이밍","facts":["프라이밍: 수면이 솟아 수위 판단 불가","포밍: 거품이 인다","캐리오버: 물이 증기에 실려 나간다","프라이밍·포밍이 심하면 캐리오버로 이어진다"],"hook":"「솟고(프라이밍) → 거품 일고(포밍) → 실려 나간다(캐리오버)」 콜라 흔들어 딴 순서와 같다.","why":"","mix":""},{"name":"금형의 설치와 조정","facts":["금형 부착·해체·조정 시 안전블록을 설치한다 (빼는 것이 아님)"],"hook":"전원을 껐어도 슬라이드는 제 무게로 떨어진다. 스위치는 중력을 못 끈다. 안전블록은 「끼우는」 것이다.","why":"","mix":""}],"n":10,"rounds":10},{"id":"3-15","subject":"기계위험방지기술","chapter":"산업용 기계","big":"로봇·기타","title":"산업용 로봇","topic3d":"robot","items":[{"name":"로봇 작업시작 전 점검","facts":["외부 전선의 피복 또는 외장 손상 유무","매니퓰레이터 작동의 이상 유무","제동장치 및 비상정지장치의 기능","윤활유 상태는 점검 항목이 아니다"],"hook":"「전선 · 팔 · 브레이크」 셋뿐이다. 로봇의 팔이 닿는 자리에 사람이 들어가니 「멈출 수 있나」가 핵심. 기름(윤활유)은 정기점검의 일이다.","why":"","mix":"압력·수위·밸브가 보이면 보일러 쪽 항목이다."},{"name":"로봇의 방호·안전조치","facts":["방책(울타리) 높이 1.8 m 이상","이상 발견 시 즉시 운전 정지 (보고하고 기다리며 계속은 오답)","2명 이상 작업 시 신호방법을 정한다"],"hook":"1.8 m는 어른이 못 넘는 담장이다. 로봇 팔은 예고 없이 휘두르니 담장 안에 들어가지 못하게 한다. 이상하면 「멈추고 나서」 보고한다.","why":"","mix":""},{"name":"교시 지침·안전매트","facts":["교시 지침에 「로봇 구성품의 설계·조립 방법」은 없다","안전매트에 감응시간을 조절하는 장치가 있으면 안 된다","안전매트에는 단선경보장치가 있어야 한다"],"hook":"교시 지침은 「현장에서 어떻게 움직이고 살필까」이지 설계도가 아니다. 안전매트의 감응시간을 조절할 수 있으면 누군가 늦춰서 무력화한다. 조절 장치가 「있으면」 틀린 보기다.","why":"","mix":""}],"n":10,"rounds":9},{"id":"3-16","subject":"기계위험방지기술","chapter":"운반·양중기","big":"리프트·곤돌라·승강기","title":"리프트와 승강기","topic3d":"","items":[{"name":"양중기의 표시사항","facts":["정격하중·운전속도·경고표시 셋","승강기는 최대 적재하중을 따로 표시","최대 인양 높이는 표시 항목이 아니다"],"hook":"「얼마나 들고(정격하중) · 얼마나 빠르고(운전속도) · 조심해(경고)」 셋. 높이는 현장마다 달라 미리 못 적는다.","why":"","mix":""},{"name":"승강기·리프트의 종류","facts":["승강기의 종류에 리프트는 없다 (리프트와 승강기는 양중기 목록의 형제)","리프트의 종류: 건설용·일반작업용·간이·이삿짐운반용","승강용 리프트는 없다"],"hook":"리프트와 승강기는 양중기 명단에 나란히 이름 올린 형제지 부모 자식이 아니다. 「승강용 리프트」는 「달리기용 마라톤」처럼 말이 안 되는 이름이다.","why":"","mix":""},{"name":"리프트의 기준·안전장치","facts":["간이 리프트: 적재하중 0.1톤 이상, 바닥면적 1 m² 이하 또는 천장높이 1.2 m 이하","이삿짐운반용 리프트: 적재하중 0.1톤 이상, 차량에 탑재","리프트의 안전장치: 리미트 스위치(권과방지)","정격속도: 정격하중을 싣고 올라갈 때의 최고속도"],"hook":"리미트 스위치는 「여기까지」 하고 어깨를 치는 손이다. 운반구가 닿으면 전원이 끊긴다. 정격속도는 「싣고 · 올라갈 때 · 최고」 세 낱말이 다 있어야 맞다.","why":"올라갈 때가 가장 힘들고 위험하므로 그 값을 기준으로 삼는다.","mix":""}],"n":8,"rounds":7},{"id":"3-17","subject":"기계위험방지기술","chapter":"공작기계","big":"목재가공","title":"둥근톱 분할날","topic3d":"sawblade","items":[{"name":"분할날의 설치 조건","facts":["두께: 톱날 두께의 1.1배 이상, 치진폭 미만 (2 mm·치진폭 2.5 mm → 2.2 ≤ t < 2.5)","톱날 원주면과의 간격 12 mm 이내","톱날 후면 날의 2/3 이상을 덮는다","덮개 하단과 가공재 상면 간격 8 mm는 덮개 조건이지 분할날 조건이 아니다"],"hook":"분할날 세 숫자 「12 · 1.1 · 2/3」. 톱날보다 살짝 두꺼워(1.1배) 켠 틈을 벌리고, 이빨 폭보다는 얇아 틈에 들어간다. 12 mm 안에 바짝 붙어 뒤를 2/3 덮는 그림자다.","why":"톱자국이 오므라들어 톱을 물지 않게 벌려 주는 쇳조각이다.","mix":"「15 mm 덮개 간격」이 분할날 조건으로 나오면 오답이다."},{"name":"분할날의 최소 길이","facts":["분할날 최소 길이 = πD ÷ 6","D = 500 mm → 약 262 mm"],"hook":"톱날이 나무에 물려 있는 구간이 대략 원주의 6분의 1이다. 그만큼은 벌려 놓아야 반발을 막는다. 「파이 디 나누기 육」.","why":"","mix":""},{"name":"둥근톱의 방호장치 구분","facts":["분할날 = 반발예방장치","덮개 = 톱날접촉예방장치"],"hook":"둥근톱의 걱정은 둘, 「튀어 오르는 것(반발)」과 「손이 닿는 것(접촉)」. 분할날은 튀는 것을, 덮개는 닿는 것을 막는다.","why":"","mix":""}],"n":6,"rounds":5},{"id":"3-18","subject":"기계위험방지기술","chapter":"산업용 기계","big":"롤러기·원심기","title":"원심기·컨베이어 종류","topic3d":"","items":[{"name":"방호조치 대상 기계·기구(영 별표20)","facts":["예초기·원심기·공기압축기·금속절단기·지게차·포장기계 여섯","롤러기는 이 여섯에 들지 않는다"],"hook":"「예·원·공·금·지·포」(예초기·원심기·공기압축기·금속절단기·지게차·포장기계). 「예원(정원)에서 공 금지, 포장해」로 읊으면 여섯이 한 줄에 선다. 롤러기는 급정지장치를 달지만 이 명단엔 없다.","why":"","mix":""},{"name":"컨베이어의 종류·역전방지장치","facts":["종류: 벨트·체인·롤러·나사(스크루)·버킷·유체 컨베이어 (그리드 컨베이어는 없다)","역전방지장치 기계식: 라쳇식·밴드식·롤러식","전기식: 전기 브레이크·스러스트 브레이크","이탈 및 역주행 방지장치는 정전·전압강하 대비"],"hook":"컨베이어 이름은 「무엇으로 나르나」다. 격자(그리드)로는 아무것도 못 나른다. 역전방지에서 스러스트만 전자석으로 잡는 전기식, 나머지는 손으로 만질 수 있는 쇠붙이다.","why":"","mix":"스러스트식이 기계식으로 나오면 오답이다."},{"name":"원심기의 안전","facts":["덮개 설치, 회전수 제한","원심기에 압력방출장치는 필요 없다"],"hook":"원심기의 위험은 「빨리 도는 것」이지 「부풀어 터지는 것」이 아니다. 세탁기 탈수통에 압력밸브를 달자는 소리와 같다.","why":"","mix":""}],"n":5,"rounds":5},{"id":"3-19","subject":"기계위험방지기술","chapter":"기계 일반","big":"소성가공","title":"소성가공·정비 시 운전정지","topic3d":"","items":[{"name":"사출성형기 등의 방호장치","facts":["게이트가드는 닫지 않으면 기계가 작동하지 않는 연동구조","「닫지 않아도 동작」은 오답"],"hook":"연동(인터록)은 전자레인지 문이다. 문 닫아야 돌고, 열면 멈춘다. 문 열고도 도는 전자레인지는 그냥 문 달린 상자다.","why":"","mix":""},{"name":"정비 등의 작업 시 운전정지(LOTO)","facts":["운전 정지 후 기동장치에 잠금장치, 열쇠는 별도 관리 또는 표지판","열쇠를 남이 찾기 쉬운 곳에 두면 오답","갑자기 가동될 우려가 있으면 작업지휘자 배치"],"hook":"잠그고(Lock) · 붙이고(Tag) · 열쇠는 내 주머니에. 열쇠를 「찾기 쉬운 곳」에 두는 잠금은 잠금이 아니라 초대장이다.","why":"","mix":""},{"name":"열간가공과 냉간가공","facts":["구분 기준은 재결정 온도","재결정 온도 위에서는 가공경화가 없다"],"hook":"재결정 온도는 찌그러진 결정이 「자리를 다시 잡는」 온도다. 그 위에서 두드리면 말랑, 그 아래서 두드리면 점점 딱딱(가공경화).","why":"","mix":""}],"n":4,"rounds":3},{"id":"3-20","subject":"기계위험방지기술","chapter":"설비진단","big":"고장·수명곡선","title":"보전 방식과 욕조곡선","topic3d":"","items":[{"name":"설비보전의 종류","facts":["시간기준보전(TBM): 일정 기간마다 (예: 10일 간격 정기 수리)","상태기준보전(CBM): 상태를 재서 정한다"],"hook":"달력 보고 하면 TBM(Time), 청진기 대 보고 하면 CBM(Condition). 「10일 간격」이라는 말이 곧 달력이다.","why":"","mix":""},{"name":"욕조곡선(bathtub curve)","facts":["초기고장(디버깅으로 줄임) → 우발고장 → 마모고장(예방보전)","조립 고장·수시고장은 고장 형태가 아니다"],"hook":"욕조 단면 그대로다. 「초·우·마」(초기·우발·마모). 갓난아기 때 잔병치레, 청년기 평온, 노년기 다시 잔병. 조립 고장·수시고장은 명단에 없는 손님이다.","why":"","mix":""}],"n":3,"rounds":3},{"id":"3-21","subject":"기계위험방지기술","chapter":"산업용 기계","big":"용접장치","title":"가스집합 용접장치","topic3d":"gasweld","items":[{"name":"가스집합 용접장치의 안전","facts":["주관과 분기관에 안전기 설치, 하나의 취관에 안전기 2개 이상","배관·부속기구에 구리 또는 구리 70 % 이상 합금 금지 (60 %는 오답)","아세틸렌 게이지 압력 127 kPa(1.3 kgf/cm²) 초과 금지","가스집합장치는 화기 설비에서 5 m 이상"],"hook":"안전기는 검문소, 취관 하나에 검문소 둘. 구리 70 %부터 출입 금지, 압력은 127 kPa이 천장. 「70 · 127 · 5」로 묶는다.","why":"","mix":""},{"name":"아세틸렌 용접장치의 기준","facts":["발생기실은 건물의 최상층, 화기 설비에서 3 m 초과 (1 m는 오답)","옥외 설치 시 개구부는 다른 건축물에서 1.5 m 이상"],"hook":"발생기실은 옥탑방에 산다. 불에서 3 m, 옆집 창문에서 1.5 m. 불이 옆집보다 무서우니 불에서 더 멀다.","why":"","mix":"「127 kPa · 3 m · 1.5 m」 세 값이다."}],"n":2,"rounds":2},{"id":"3-22","subject":"기계위험방지기술","chapter":"설비진단","big":"진동·소음","title":"설비 진동의 종류","topic3d":"","items":[{"name":"설비 진동의 종류","facts":["회전축·베어링의 마모, 회전의 불균형에 의한 진동 = 정상진동","축이 한 바퀴 돌 때마다 되풀이되어 규칙적이다"],"hook":"바퀴에 껌 하나 붙이면 한 바퀴마다 「덜컥」 한다. 늘 같은 박자로 오니 「정상진동」, 그 규칙 덕분에 고장을 미리 잡는다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"3-23","subject":"기계위험방지기술","chapter":"산업용 기계","big":"롤러기","title":"급정지장치 로프","topic3d":"roller","items":[{"name":"롤러기 급정지장치의 로프","facts":["와이어로프: 지름 4 mm 이상","합성섬유로프: 지름 6 mm 이상, 절단하중 2.94 kN 이상","프레스 수인끈: 합성섬유 지름 4 mm 이상"],"hook":"쇠줄 4, 섬유줄 6. 무른 쪽이 더 굵어야 같은 힘을 버틴다. 수인끈 4 mm는 프레스네 집 숫자다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"3-24","subject":"기계위험방지기술","chapter":"운반·양중기","big":"양중기","title":"레버풀러·체인블록","topic3d":"","items":[{"name":"레버풀러와 체인블록","facts":["훅 입구 간격이 제조사 기준보다 10 % 이상 벌어지면 폐기","와이어로프 지름 감소 한도는 7 %"],"hook":"훅은 입이 10 %만 벌어져도 짐을 뱉는다. 「하품 10 % = 폐기」. 로프의 살 빠짐 7 %와 짝지어 둔다.","why":"","mix":"훅 10 %, 로프 지름 감소 7 %."}],"n":1,"rounds":1},{"id":"3-25","subject":"기계위험방지기술","chapter":"설비진단","big":"진동·소음 진단","title":"설비진단의 판단법","topic3d":"","items":[{"name":"설비진단의 판단법","facts":["상호 판단(다른 설비와 비교)·비교 판단(예전의 나와 비교)·절대 판단(기준값과 비교)","평균 판단은 없다"],"hook":"성적표 보는 법과 같다. 옆자리와 비교(상호), 지난 학기의 나와 비교(비교), 커트라인과 비교(절대). 「평균 판단」은 없는 과목이다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"4-01","subject":"전기위험방지기술","chapter":"감전재해","big":"인체 영향","title":"심실세동과 전격방지","topic3d":"welder","items":[{"name":"심실세동전류·위험한계에너지","facts":["심실세동전류 I = 165 ÷ √T [mA]","인체저항 500 Ω·1초의 위험한계에너지 13.6 J","5,000 Ω이면 10배인 136 J","800 Ω이면 1.6배인 약 21.8 J","계산 때 165 mA = 0.165 A로 바꾼다"],"hook":"165는 「일육오」, 일단 육박하면 오싹하다. 루트 T로 나누니 오래 붙잡힐수록 작은 전류로도 심장이 떤다. 13.6 J은 「13일의 금요일에 6명」으로 잡아 둔다.","why":"통전시간이 길수록 더 작은 전류로도 심실세동이 일어난다.","mix":"500 Ω 13.6 J을 기준으로 저항이 10배면 136 J, 1.6배면 21.8 J로 그대로 비례한다."},{"name":"자동전격방지장치","facts":["아크 중단 후 1초 이내에 무부하전압을 25~30 V 이하로 낮춘다","평상시 무부하전압은 60~95 V","시동감도 = 장치가 작동하는 2차측 최대저항","지동시간 = 용접봉을 뗀 뒤 25 V 이하로 떨어질 때까지의 시간(1초 이내)"],"hook":"용접봉을 떼면 「1초 만에 25살로」. 한 살(1초) 안에 전압을 스물다섯(25 V)으로 되돌리는 회춘 장치다.","why":"안전전압 30 V 언저리까지 내려야 쉬는 동안 감전되지 않는다.","mix":"「감도」는 저항(Ω)이고, 시동시간·지동시간은 시간(초)이다. 시간이 나오면 감도가 아니다."},{"name":"인체의 전기저항","facts":["인가전압이 클수록 피부저항이 급격히 떨어진다","500 V를 넘으면 거의 내부저항만 남는다","계산 문제의 인체저항 기준값은 0.5 kΩ(500 Ω)"],"hook":"피부는 문지기다. 전압이 세게 밀면 문(각질층)이 뚫려 저항이 무너지고, 500 V부터는 문 없는 집이 된다.","why":"높은 전압이 피부 각질층을 파괴하기 때문이다.","mix":""},{"name":"심실세동·전격 위험 시기","facts":["심실세동전류 = 치사적 전류","심실 수축 종료 후 휴식기(T파)에 전격이 오면 심실세동 확률이 가장 크다","인체 대전에 의한 전격 발생한계 전위는 약 3 kV","정전기 전격은 놀라 넘어지는 2차 재해가 무섭다"],"hook":"심장이 쉬는 틈에 들어오는 전기가 제일 무섭다. 자는 사람 갑자기 깨우면 놀라듯 심장이 놀라 떤다. 문손잡이 「탁」이 3 kV, 다치는 건 전기가 아니라 넘어져서다.","why":"","mix":""}],"n":51,"rounds":22},{"id":"4-02","subject":"전기위험방지기술","chapter":"접지","big":"접지 일반","title":"접지저항과 단락접지","topic3d":"staticflow","items":[{"name":"접지저항 기준값","facts":["피뢰기·피뢰침 접지저항 10 Ω 이하","여러 접지를 이은 총합 접지저항 5 Ω 이하","정전기 제거용 접지 10⁶ Ω 이하"],"hook":"벼락은 십(10) Ω 급행열차만 타고, 정전기는 백만(10⁶) Ω 완행버스도 탄다. 전하가 적으니 느슨한 길로도 다 빠져나간다.","why":"벼락은 큰 전류를 순식간에 흘려야 하고, 정전기는 전하량이 아주 작다.","mix":"피뢰 10 Ω과 정전기 10⁶ Ω은 10만 배 차이다. 정전기용을 10 Ω으로 바꿔 놓으면 함정이다."},{"name":"접지저항의 저감","facts":["접지극 크기·흙과 닿는 면적을 키운다","흙을 바꾸거나 저감제를 쓴다","접지극을 병렬로 늘리거나 깊게 묻는다","접지극 도금·금속 재질 개선은 효과가 없다"],"hook":"접지저항의 주범은 「흙」이지 「쇠」가 아니다. 금도금 접지봉을 박아도 흙이 마르면 소용없다. 넓게·깊게·촉촉하게가 전부다.","why":"저항의 대부분이 접지극 바깥의 흙에 있다.","mix":""},{"name":"정전작업의 단락접지","facts":["3상 3선식 정전작업의 기본 조치 = 3선을 단락 접지","접지용구는 설치의 역순으로 철거","작업 전에 단락접지기구를 철거하는 것은 틀린 조치"],"hook":"「먼저 붙이고 나중에 뗀다」. 신발끈처럼 접지부터 매고, 작업이 끝날 때까지 절대 풀지 않는다.","why":"어느 순간에도 접지가 끊기지 않아야 한다.","mix":""},{"name":"정전기 방지·방전(부도체)","facts":["가습은 상대습도 60~70%","부도체 대책 = 제전기·가습·대전방지제·도전성 재료로 교체","부도체에는 접지가 듣지 않는다","불꽃 방전 = 도체와 도체 사이의 강한 발광·파괴음","연면 방전 = 층상 부도체 박리 때 표면의 수지상 발광"],"hook":"부도체에 접지선 묶기는 플라스틱에 빨대 꽂기다. 길이 없다. 대신 습도 「육칠십」으로 눅눅하게 만들면 전기가 저절로 샌다.","why":"","mix":"불꽃은 도체끼리, 연면은 부도체 표면의 나뭇가지 모양, 한쪽이 부도체면 스트리머다."},{"name":"옛 접지공사 종별·전선 접속","facts":["220 V 전동기 외함은 제3종 접지공사(개정 전 기준)","특별 제3종은 400 V 이상(개정 전 기준)","전선 접속 시 세기는 20% 이상 줄지 않아야 한다","현행 KEC는 종별 없이 계통접지(TN·TT·IT)"],"hook":"전선을 이으면 힘이 「이십(20) %」까지만 빠져도 된다. 30%로 부풀린 보기는 이(2)가 삼(3)으로 몰래 바뀐 가짜다.","why":"","mix":"제3종은 400 V 미만, 특별 제3종은 400 V 이상으로 갈린다."}],"n":49,"rounds":24},{"id":"4-03","subject":"전기위험방지기술","chapter":"정전기","big":"정전기 발생·방전","title":"정전기 발생과 방전","topic3d":"staticflow","items":[{"name":"정전기 발생의 영향 인자","facts":["물체의 특성·표면 상태·이력·접촉면적과 압력·분리속도 다섯","물체의 질량은 상관없다","접촉시간은 영향 인자가 아니다"],"hook":"정전기는 「피부 접촉」 사건이라 표면에서 벌어지는 일만 따진다. 몸무게(질량)와 얼마나 오래 껴안았나(접촉시간)는 묻지 않는다.","why":"대전은 두 물체가 닿는 면에서 일어난다.","mix":"「접촉면적·압력」은 인자이고 「접촉시간」은 아니다. 면적과 시간을 바꿔 놓은 보기를 조심한다."},{"name":"정전기 대전의 종류","facts":["마찰·박리·유동·분출·충돌·파괴·유도·비말 대전","유동대전 = 액체가 배관 속을 흐를 때 생긴다","중화는 발생이 아니라 제거(제전) 쪽 낱말"],"hook":"「마박유분충파」, 마! 박유분(사람 이름)이 충파(충돌해 파괴)했다. 마찰·박리·유동·분출·충돌·파괴 순서다. 중화는 소화기라 발생 목록에 없다.","why":"","mix":""},{"name":"정전기 방전의 종류","facts":["코로나·스트리머·불꽃·연면·뇌상 다섯","코로나 방전은 오존(O₃)을 만든다","불꽃 방전 = 도체 사이 강한 발광과 파괴음","연면 방전 = 층상 부도체 표면의 수지상 발광","스프레이는 방전 종류가 아니다"],"hook":"「코스불연뇌」, 코(코로나) 스(스트리머) 불(불꽃) 연(연면) 뇌(뇌상). 코 스치면 불이 연달아 뇌우처럼. 복사기 옆 냄새가 코로나의 오존이다.","why":"","mix":""},{"name":"유속 제한·완화시간·도체구 전위","facts":["관내경 25 mm에 제한유속 6.5 m/s는 틀린 값","완화시간(시정수) = 전하가 37%(36.8%)로 줄어드는 시간","반감기(50%)와 헷갈리지 않는다","도체구 전위 V = Q ÷ (4πε₀r), Q = 2×10⁻⁷ C·r = 25 cm → 7.2 kV"],"hook":"시정수는 「삼칠 남는다」. 절반(50)이면 반감기, 37이면 시정수다. e의 역수 0.368을 「삼육팔 아저씨」로 외운다.","why":"","mix":"37%는 남은 전하, 63%는 빠져나간 전하다. 두 수를 뒤집은 보기가 함정이다."},{"name":"제전기·대전방지제","facts":["제전기 종류 = 전압인가식·자기방전식·방사선식","「정전식 제전기」는 없다","제전효율 90% 이상","합성섬유 외부용 일시성 대전방지제는 음이온계","가습은 상대습도 60~70%"],"hook":"「전자방」, 전(전압인가) 자(자기방전) 방(방사선). 제전기는 전자방에 산다. 「정전식 제전기」는 정전기를 만든다는 말이라 자기모순이다.","why":"","mix":""}],"n":46,"rounds":24},{"id":"4-04","subject":"전기위험방지기술","chapter":"감전재해","big":"감전 방지대책","title":"감전 방지대책","topic3d":"elcb","items":[{"name":"감전사고의 방지대책","facts":["전기기기의 정격 표시는 감전 방지대책이 아니다","절연저항은 높이고 접지저항은 낮춘다","충전부는 출입이 어려운 폐쇄된 장소에 둔다(전개된 장소 ×)","우리나라 안전전압은 약 30 V"],"hook":"「정격 표시」는 명찰이지 갑옷이 아니다. 명찰 달았다고 감전을 못 막는다. 접지는 낮게 절연은 높게, 「접낮절높」.","why":"","mix":"접지저항과 절연저항을 뒤바꿔 놓은 보기가 늘 나온다."},{"name":"누전차단기의 정격감도전류","facts":["감전방지용(일반) 30 mA 이하·0.03초 이내","물기 있는 장소 15 mA 이하·0.03초 이내","고속형 0.1초 이내, 감전방지용 0.03초 이내"],"hook":"「삼십에 영점영삼」. 30 뒤에 0을 붙이고 소수점을 찍으면 0.03초다. 물 묻으면 전류만 반값(15), 시간은 그대로.","why":"심실세동에 이르기 전에 끊어야 하므로 0.03초가 기준이다.","mix":"30 mA는 일반, 15 mA는 물기, 시간은 둘 다 0.03초다. 고속형 0.1초와 섞지 않는다."},{"name":"충전전로 인근 작업·고압 충전부 방호","facts":["전선에는 절연용 방호구, 사람에게는 절연용 보호구","35 kV 이하 특고압 기기 울타리는 높이 + 충전부까지 거리 합 5 m 이상"],"hook":"방호구는 전선의 옷, 보호구는 사람의 옷, 「방전보사」. 울타리는 「높이 더하기 거리가 5 m」, 키가 작으면 그만큼 멀리 선다.","why":"","mix":""},{"name":"정전작업·구조 조치","facts":["잠금장치와 통전금지 표지판은 함께 둔다","작업 전 단락접지기구 철거는 틀린 조치","감전자 구조는 전원 차단 또는 절연물 사용, 맨손 금지"],"hook":"자물쇠는 「못 켜게」, 표지판은 「왜 못 켜는지」. 둘은 부부라 따로 안 다닌다. 감전자를 맨손으로 잡으면 둘이 나란히 눕는다.","why":"","mix":""}],"n":42,"rounds":23},{"id":"4-05","subject":"전기위험방지기술","chapter":"전기 방폭","big":"방폭구조","title":"방폭구조와 폭발등급","topic3d":"gasweld","items":[{"name":"방폭구조의 종류·기호","facts":["내압(d)·압력(p)·유입(o)·안전증(e)·본질안전(ia, ib)·비점화(n)","「고압 방폭구조」는 없다","0종 장소에 쓸 수 있는 것은 ia뿐","2종 장소 전용은 n(비점화)"],"hook":"「내압유안본비」, 내 압류 유안(친구)이 본 비. 내압·압력·유입·안전증·본질안전·비점화다. 「고압 방폭」은 없는 자식이다.","why":"","mix":"ia는 0종까지, ib는 1종부터다."},{"name":"내압(耐壓) 방폭구조·안전간극","facts":["용기 안 폭발 압력을 견디고 접합면 틈으로 화염이 밖에 안 나간다","안전간극을 좁히는 이유 = 폭발화염의 외부 전파 방지","화염일주한계 = 화염 전파를 저지할 수 있는 틈새의 최대 간격","습기 침투 보호는 내압방폭의 필요충분조건이 아니다"],"hook":"「견딜 내(耐)」는 배에 힘주고 참는 씨름꾼, 「안 내(內)」는 풍선처럼 부풀려 밀어내는 압력 방폭이다. 불꽃은 좁은 골목을 지나며 식어 버린다.","why":"좁고 긴 틈을 지나며 뜨거운 가스가 벽에 열을 빼앗겨 밖에서는 발화점 아래가 된다.","mix":"「보호가스를 압입」이면 압력 방폭구조(內壓), 「틈의 냉각효과」면 내압 방폭구조(耐壓)다."},{"name":"폭발등급(안전간극·이격거리)","facts":["ⅡA 0.9 mm 초과(프로판)","ⅡB 0.5~0.9 mm(에틸렌)","ⅡC 0.5 mm 미만(수소·아세틸렌), 가장 위험","이격거리 ⅡA 10 mm·ⅡB 30 mm·ⅡC 40 mm"],"hook":"「프로 에틸 수아」, 프로판(A) 에틸렌(B) 수소·아세틸렌(C). 틈은 좁아질수록(0.9→0.5) 위험하고 거리는 멀어질수록(10→30→40) 조심한다. C는 「최악(C)」.","why":"간극이 좁은 가스일수록 작은 틈으로도 불이 새 나가므로 더 멀리 둔다.","mix":"간극은 C가 가장 좁고, 이격거리는 C가 가장 길다. 방향이 반대다."},{"name":"방폭 기본개념·IP·특별저압","facts":["방폭의 기본개념 = 격리·증강·억제 셋","「폭발성 위험분위기 해소」라는 넷째 개념은 없다","IP 숫자 2 = 지름 12.5 mm 이상 고형물, 15° 기울인 물방울","IP 숫자 3 = 지름 2.5 mm 이상 고형물, 60° 범위 물보라","직류(리플프리) 120 V 이하는 교류의 약 2.4배"],"hook":"「격증억」, 폭발을 격하게 증오해서 억누른다. 격리(가둔다)·증강(튼튼히)·억제(작게). IP는 숫자가 커질수록 작은 것과 센 물도 막는다.","why":"","mix":""}],"n":40,"rounds":22},{"id":"4-06","subject":"전기위험방지기술","chapter":"감전재해","big":"누전차단기","title":"누전차단기 시설 기준","topic3d":"elcb","items":[{"name":"누전차단기의 시설","facts":["인체감전보호형 = 30 mA 이하·0.03초 이내 고감도고속형(0.05초 ×)","물기 있는 곳 15 mA 이하·0.03초 이내","전로 전압 변동 범위는 정격전압의 85~110%(75~120% ×)","구성요소에 전력퓨즈는 없다"],"hook":"「팔십오에서 백십」, 아래로 15 위로 10만 봐준다. 75~120은 헐렁한 바지다. 퓨즈는 과전류 담당이라 누전차단기 식구가 아니다.","why":"","mix":"0.03초가 감전방지용이고 0.05초로 늘린 보기는 오답이다."},{"name":"변압기 중성점 접지저항","facts":["중성점 접지저항 = 150 ÷ 1선지락전류 [Ω]","1초 초과 2초 이내 차단이면 300 ÷ 1선지락전류","1초 이내 차단이면 600 ÷ 1선지락전류","빨리 끊을수록 큰 저항을 허용한다"],"hook":"「백오십·삼백·육백」, 빨리 끊는 놈에게 두 배씩 용돈. 1초 안에 끊으면 600, 2초면 300, 못 끊으면 150이다.","why":"차단이 빠르면 위험한 시간이 짧아 저항이 커도 된다.","mix":""},{"name":"중성점 접지방식·접지 목적","facts":["소호리액터 접지 = 지락전류 거의 0, 아크 소멸·정전 없음","소호리액터 접지는 고장 검출이 어렵다","「기능용 접지 – 피뢰기 기능손상 방지」는 틀린 짝"],"hook":"소호(消弧)는 「불(아크)을 끈다」. 리액터가 지락전류를 지워 불꽃도 정전도 없지만, 너무 조용해서 고장난 줄도 모른다.","why":"","mix":""},{"name":"누전차단기 설치 면제","facts":["이중절연 구조(또는 같은 수준 이상 보호 구조)의 기계·기구","절연대 위 등 감전위험이 없는 장소에서 사용하는 기계·기구","비접지방식의 전로","옛 기준 문제에는 절연변압기(2차 300 V 이하·비접지)도 나온다"],"hook":"차단기 없어도 되는 집은 「애초에 샐 데가 없는 집」. 두 겹 옷(이중절연), 절연 방석 위(절연대), 땅과 인연 끊음(비접지).","why":"누전 경로 자체가 없으면 차단할 전류도 없다.","mix":"「절연물 피복」은 면제 사유가 아니다. 규칙 제304조의 셋만 기억한다."}],"n":32,"rounds":18},{"id":"4-07","subject":"전기위험방지기술","chapter":"","big":"","title":"전압 구분·피뢰 등급","topic3d":"","items":[{"name":"전압의 구분(KEC)","facts":["저압 = 교류 1 kV 이하, 직류 1.5 kV 이하","고압 = 교류 1 kV 초과 7 kV 이하, 직류 1.5 kV 초과 7 kV 이하","특고압 = 7 kV 초과(교류·직류 같음)","옛 기준(직류 750 V·교류 600 V)은 쓰지 않는다"],"hook":"「교일 직일오 특칠」. 교류 1, 직류 1.5, 특고압 7이다. 직류가 교류보다 0.5 너그럽고, 특고압 문턱 7은 둘이 똑같다.","why":"","mix":"특고압은 7 kV 「초과」다. 「이상」이면 7 kV가 고압과 겹친다."},{"name":"회전구체법(피뢰시스템 등급)","facts":["Ⅰ등급 20 m(가장 엄격, 위험물시설)","Ⅱ등급 30 m","Ⅲ등급 45 m(40 m가 아니다)","Ⅳ등급 60 m"],"hook":"「이십·삼십·사십오·육십」, 간격이 10·15·15로 늘어난다. 셋째만 45다. 「사십오」를 「사십」으로 깎아 10씩 늘어나는 척하는 보기가 함정이다.","why":"","mix":""},{"name":"외부피뢰시스템·방폭기기 그룹","facts":["수뢰부 = 돌침·수평도체·메시도체","수뢰부 → 인하도선 → 접지극 순","환상도체는 땅속 접지극이라 수뢰부가 아니다","ⅡC 기기는 ⅡA·ⅡB 지역에도 쓸 수 있다(반대는 불가)"],"hook":"「받고 내리고 흘린다」. 돌침이 받고, 인하도선이 내리고, 접지극이 흘린다. 환상(고리)은 땅속 반지다. ⅡC는 만능키, ⅡA는 자기 집 열쇠다.","why":"더 엄격한 기기를 덜 엄격한 곳에 쓰는 것은 된다.","mix":""},{"name":"그 밖에","facts":["누설전류 한도 = 최대공급전류의 1/2,000","광량자 에너지 E = hν, 주파수가 높을수록 크다","표준충격파형 1.2×50 μs = 파두장 × 파미장","접촉 전위차의 원인 = 두 물체의 일함수 차","3상 전류 I = P ÷ (√3·V·cosθ), 50 kW·380 V·역률 0.8 → 94.96 A"],"hook":"이천분의 일은 「암페어 절반을 mA로」. 200 A면 100 mA다. 2,000으로 나누고 1,000을 곱하니 결국 반토막이다.","why":"","mix":""}],"n":31,"rounds":21},{"id":"4-08","subject":"전기위험방지기술","chapter":"전기화재","big":"전기화재·피뢰","title":"피뢰기와 전기화재","topic3d":"powerline","items":[{"name":"피뢰기의 보호여유도","facts":["보호여유도(%) = (충격절연강도 − 제한전압) ÷ 제한전압 × 100","제한전압 800 kV·충격절연강도 1,000 kV → 25%","나누는 쪽은 제한전압"],"hook":"「(견딤 − 남김) ÷ 남김」. 기기가 견디는 힘에서 피뢰기가 남긴 전압을 빼고, 남긴 전압으로 나눈다. 1000−800=200, 200÷800=25%.","why":"","mix":"분모는 충격절연강도가 아니라 제한전압이다."},{"name":"피뢰기의 구비조건","facts":["방전 개시전압·제한전압은 낮을 것","속류 차단능력·방전내량은 클 것","반복 동작이 가능하고 구조가 견고할 것"],"hook":"「전압」은 낮게 「능력」은 크게. 피뢰기는 문턱(개시전압)이 낮고 지갑(방전내량)이 두둑한 친구다. 「높을 것」이 붙은 전압 보기는 함정이다.","why":"","mix":""},{"name":"피뢰기의 설치장소","facts":["발전소·변전소의 인입구·인출구","특고압 가공전선로에서 공급받는 수용장소의 인입구","가공전선로에서 공급받는 배전용 변압기의 고압·특고압측","가공전선로와 지중전선로가 접속되는 곳","저압 수용장소의 인입구는 아니다"],"hook":"「전기가 드나드는 목」마다 경비원을 세운다. 발변전소 출입구, 특고압 인입구, 변압기 고압측, 가공-지중 접속점. 저압 인입구엔 경비가 안 선다.","why":"벼락 서지는 전기가 드나드는 목을 타고 들어온다.","mix":""},{"name":"표준충격파형","facts":["1.2×50 μs = 파두장 × 파미장","1.2 μs = 파고치까지 오르는 시간(파두)","50 μs = 파고치의 50%로 줄어드는 시간(파미)","허용오차 파두장 ±30%, 파미장 ±20%","63%는 시정수의 값이라 다른 자리다"],"hook":"번개는 「확 솟고 천천히 진다」. 1.2 μs에 머리(파두) 꼭대기, 50 μs 뒤 꼬리(파미)가 반값. 「50 μs에 50%」로 오십오십이다.","why":"","mix":""},{"name":"전기화재 3요건·누전화재 3요소","facts":["전기화재 3요건 = 발화원·착화물·출화의 경과","누전화재 3요소 = 누전점·발화점·접지점","경로별 원인에 「저전압」은 없다","단로기의 목적 = 무부하 선로의 개폐"],"hook":"「무엇이(발화원)·무엇에(착화물)·어떻게(경과)」 삼단 뉴스. 누전은 「새고(누전점)·타고(발화점)·빠지고(접지점)」. 단로기는 불 꺼진 뒤 문 닫는 사람이다.","why":"","mix":"혼촉은 고압과 저압이 닿는 다른 사고라 누전화재 3요소가 아니다."}],"n":26,"rounds":24},{"id":"4-09","subject":"전기위험방지기술","chapter":"전기설비","big":"절연·측정","title":"절연저항과 누설전류","topic3d":"powerline","items":[{"name":"전로의 절연저항(KEC)","facts":["SELV·PELV 0.5 MΩ 이상","FELV·500 V 이하 1.0 MΩ 이상","500 V 초과 1.0 MΩ 이상","380 V 전로 → 1.0 MΩ"],"hook":"「오·일·일」, 0.5·1.0·1.0 세 값뿐이다. 특별저압(SELV·PELV)만 반값 0.5, 나머지는 몽땅 1 MΩ이다.","why":"","mix":"옛 기준 0.1·0.2·0.3·0.4 MΩ은 개정 전 문항에서만 쓴다."},{"name":"옛 절연저항 기준(개정 전 출제)","facts":["대지전압 150 V 이하 0.1 MΩ 이상","150 V 초과 300 V 이하 0.2 MΩ(220 V가 여기)","300 V 초과 400 V 미만 0.3 MΩ","400 V 이상 0.4 MΩ"],"hook":"「일이삼사」 계단. 전압 칸이 오를 때마다 0.1씩 오른다. 220 V는 둘째 칸이라 0.2다. 옛 기출에만 쓰고 현행은 1 MΩ이다.","why":"전압이 높을수록 더 큰 절연저항을 요구한다.","mix":""},{"name":"누설전류의 한도","facts":["누설전류 ≤ 최대공급전류의 1/2,000","300 A 전선로 1선 → 150 mA","200 A → 100 mA(0.1 A)","감전방지용 누전차단기 30 mA와는 다른 기준"],"hook":"이천분의 일은 「암페어 절반을 mA로」. 300 A면 150 mA, 200 A면 100 mA다. 30 mA는 차단기 얘기라 섞지 않는다.","why":"","mix":""},{"name":"과전류에 의한 전선의 발화 단계","facts":["인화단계 40~43 A/mm²","착화단계 43~60 A/mm²(절연물이 탄다)","발화단계 60~120 A/mm²(화구 없이 발화·심선 용단)","순간용단 120 A/mm² 이상"],"hook":"「인착발용」, 인화·착화·발화·용단. 40·43·60·120이다. 「사십삼 육십 백이십」, 마지막은 두 배(60→120)로 뻥 터진다.","why":"전류밀도가 커질수록 발열이 커져 단계가 올라간다.","mix":""},{"name":"내열등급·연면거리·정전기 축적","facts":["내열등급 Y·A·E·B·F·H·C = 90·105·120·130·155·180·180 초과 ℃","연면거리 = 표면을 따라 재는 거리, 표면에 골을 파면 늘어난다","정전기는 빠져나갈 길이 없어야 쌓인다","금속 파이프 내 분진은 축적 요인이 아니다"],"hook":"「와이 에이 이 비 에프 에이치 씨」를 노래처럼. 알파벳 순이 아니라는 게 함정이다. 「연면(沿面)」은 면을 따라 기어가는 거리다.","why":"","mix":""}],"n":25,"rounds":16},{"id":"4-10","subject":"전기위험방지기술","chapter":"전기설비","big":"차단기·개폐기","title":"차단기·퓨즈 특성","topic3d":"","items":[{"name":"아크 발생 기구의 이격거리","facts":["고압용 개폐기·차단기·피뢰기는 목재 벽·천장 등 가연물에서 1.0 m 이상"],"hook":"아크 튀는 놈은 나무에서 「한 발짝(1 m)」 떨어뜨린다. 불똥이 닿지 않을 만큼이다.","why":"","mix":""},{"name":"과전류차단기(퓨즈)의 용단특성","facts":["4 A 이하: 1.5배 부동작, 2.1배 동작(60분)","4 A 초과 16 A 미만: 1.5배·1.9배(60분)","16 A 이상 63 A 이하: 1.25배·1.6배(60분)","63 A 초과 160 A 이하: 1.25배·1.6배","고압 퓨즈는 정격 1.3배로 2시간 이내 용단 없음","배선차단기 과부하 부동작 1.13In·동작 1.45In(63 A 이하 60분)"],"hook":"작은 퓨즈일수록 배수가 크다. 꼬마는 「이점일(2.1)」까지 참아 준다. 안 그러면 툭하면 끊겨서 못 쓴다. 「이점일 → 일점구 → 일점육」 내리막이다.","why":"정격이 작을수록 조금만 넘쳐도 자꾸 끊기면 쓸 수 없다.","mix":"「1.3배로 2시간」은 고압 퓨즈, 「2.1배로 60분」은 4 A 이하 저압 퓨즈다."},{"name":"주택용 배선차단기·차단기 구분","facts":["순시트립 B형 3In~5In, C형 5In~10In, D형 10In~20In","고장전류를 끊는 것은 소호장치가 있는 차단기(CB)뿐","단로기·개폐기는 무부하 개폐","전동기 운전 조작 순서 = 메인 스위치 → 분전반 스위치 → 전동기용 개폐기"],"hook":"B·C·D는 「삼오·오십·십이십」, 뒤로 갈수록 돌입전류에 너그럽다. 차단기만 아크를 끄는 소화기(소호장치)를 들고 있다. 켤 땐 큰 문부터 연다.","why":"돌입전류가 큰 부하일수록 뒤쪽 타입을 쓴다.","mix":""},{"name":"점화원·간선 차단기·절연내력","facts":["정상 회전 중에도 불꽃이 나는 것 = 전동기의 슬립링","전동기 간선 과전류차단기 = 전동기 정격 합 × 3 + 그 밖의 부하","간선 허용전류의 2.5배와 견주어 작은 쪽","절연내력 시험 7 kV 이하는 최대사용전압의 1.5배(최저 500 V)","절연내력 시험시간은 등급 무관 10분"],"hook":"슬립링은 「돌면서 불꽃 쇼」. 접점 여닫는 것들은 순간이고 슬립링만 회전 중 계속 튄다. 절연내력 시험은 「언제나 10분」, 배수만 다르다.","why":"","mix":""},{"name":"누전 시 인체통과전류","facts":["사람이 외함을 잡으면 인체는 외함 접지저항(R3)과 병렬","병렬 합성저항을 먼저 구한다","인체저항이 훨씬 커서 대부분의 전류는 R3로 빠진다"],"hook":"사람이 외함을 잡으면 「지름길(접지)」 옆의 「오솔길(인체)」이다. 전류는 넓은 길로 몰리니 접지저항을 낮출수록 사람 몫이 준다.","why":"","mix":""}],"n":25,"rounds":17},{"id":"4-11","subject":"전기위험방지기술","chapter":"전기 방폭","big":"위험장소·등급","title":"위험장소와 온도등급","topic3d":"","items":[{"name":"폭발위험장소의 구분(0·1·2종)","facts":["0종 = 폭발분위기가 지속적·장기간 존재(닫힌 채 늘 고인 곳)","1종 = 정상 운전 중 가끔 생성","2종 = 이상 시에만 잠깐(부식·열화·파손·고장)","3종 장소는 없다","가연성 증기 순환통로 내부는 1종(0종 ×)"],"hook":"「늘·가끔·이상 시」가 0·1·2다. 늘 고여 있는 술독은 0종, 가끔 뚜껑 여는 술병은 1종, 깨져야 새는 술잔은 2종. 3종은 없다.","why":"폭발분위기가 얼마나 자주·오래 있느냐로 나눈다.","mix":"「순환·통로·환기」가 붙으면 흘러 지나가는 곳이라 등급이 하나 내려간다."},{"name":"방폭기기의 온도등급","facts":["T1 450℃ 이하","T2 300℃ 이하","T3 200℃ 이하","T4 135℃ 이하","T5 100℃ 이하","T6 85℃ 이하(가장 엄격)"],"hook":"「사오공·삼백·이백·백삼오·백·팔오」. 숫자가 커질수록 차가워지는 「거꾸로 온도계」다. T6는 손 대도 될 85℃, T는 Temperature다.","why":"","mix":"등급 숫자가 클수록 허용 표면온도는 낮다. 방향이 반대다."},{"name":"위험장소 판정·전기설비 방호","facts":["판정 기준 = 가스 존재 여부·누출량·환기(방출)·가스 종류","습도는 판정 기준이 아니다","단락보호장치는 고장 시 자동복구되지 않게 한다"],"hook":"판정은 「있나·얼마나·빠지나·뭔가」 네 물음이다. 습도는 정전기 동네 얘기다. 자동복구 차단기는 폭탄에 도로 불 붙이는 셈이라 금지다.","why":"","mix":""}],"n":20,"rounds":13},{"id":"4-12","subject":"전기위험방지기술","chapter":"전기 일반","big":"전기 기초 계산","title":"정전기 에너지 계산","topic3d":"","items":[{"name":"정전기 방전에너지","facts":["E = ½CV²","120 pF·3 kV → 0.54 mJ","C = 2W ÷ V²","최소착화에너지 0.26 mJ·100 pF → 약 2,280 V","0.5 m² = 5,000 cm², 0.02 pF/cm²·3,300 V → 5.445×10⁻⁴ J"],"hook":"「반(½) 씨(C) 브이 제곱」, 반씨가 브이를 두 번 외친다. ½를 빼먹으면 두 배, mJ과 J을 헷갈리면 천 배 틀린다.","why":"","mix":"보기 넷이 ½ 누락과 mJ·J 혼동, 딱 그 두 함정으로 짜여 있다."},{"name":"정전기 정의·완화시간·유전체","facts":["정전기 = 전하의 이동이 적고 자계는 무시할 만하다","완화시간에 남는 전하 36.8%, 빠져나간 전하 63.2%","유전체 속에서 전계는 1/εs로 작아진다","코로나 방전 안정 = 내측 원통 실질 반경이 커져 전계가 낮아진다"],"hook":"「정(靜)」은 멈춤이라 안 움직이니 자석 성질이 없다. 시정수에 「삼십육점팔」 남고 「육십삼점이」 도망간다. 두 수를 뒤집은 함정을 조심한다.","why":"","mix":""},{"name":"인체 대전·정전력·용접기 사용률","facts":["아세톤 취급 시 인체대전 전위 약 4,800 V 이하","1 C 두 전하 1 m 거리의 정전력 9×10⁹ N","허용사용률 = (정격2차전류 ÷ 사용전류)² × 정격사용률","500 A 정격·250 A 사용·정격사용률 10% → 40%"],"hook":"쿨롱 힘은 「구 곱하기 십의 구」. 1 C 둘이 1 m 떨어지면 9×10⁹ N이다. 용접기 사용률은 「전류 비 제곱」, 반으로 쓰면 네 배(10→40%)다.","why":"","mix":""}],"n":19,"rounds":18},{"id":"4-13","subject":"전기위험방지기술","chapter":"전기설비","big":"정전작업·활선","title":"정전작업과 활선작업","topic3d":"powerline","items":[{"name":"활선근접작업의 접근한계거리","facts":["머리 위 30 cm 이상","발아래 60 cm 이상(40 cm ×)","몸 옆 수평 30 cm 이상(50 cm ×)","세 조건을 채우면 방호조치를 생략할 수 있다","대지전압 50 kV 이하 충전전로에 무자격자는 300 cm 이내 접근 금지(400 cm ×)"],"hook":"「머리 삼십·발 육십·옆 삼십」, 삼육삼 리듬이다. 발밑이 제일 멀다. 미끄러지는 건 아래니까.","why":"몸이 기울거나 미끄러질 여지가 아래쪽에 크다.","mix":""},{"name":"활선작업용 기구·보호구","facts":["활선시메라 = 전선을 당겨 잡아 두는 기구(검전·방전 용도 ×)","COS 개폐는 후크봉으로","충전 유무 확인은 저압·고압용 검전기","대전방지화는 정전기용이라 활선작업 보호구가 아니다","동일주·인접주에서 다른 작업은 금지"],"hook":"시메라는 「집게」, 검전기는 「청진기」, 후크봉은 「낚싯대」다. 집게로 맥을 짚지 않는다. 대전방지화는 전기를 흘리는 신발이라 활선에선 감전 통로다.","why":"","mix":"활선작업은 전기를 끊어야 하고 정전기 대책은 흘려야 한다. 정반대다."},{"name":"정전작업의 잔류전하·단락접지","facts":["콘덴서가 있는 전로는 잔류전하를 방전한다","잔류전하 가능성이 가장 낮은 것 = 방전 코일","정전작업 5대 수칙의 셋째 = 검전기로 무전압 확인","검전 뒤 단락접지(유도전압·오통전 대비)"],"hook":"콘덴서는 「물탱크」다. 밸브를 잠가도 남은 물(전하)이 있으니 빼야 한다. 방전 코일은 배수구라 남을 일이 없다. 검전기는 「지금 없다」만, 단락접지는 「앞으로도 없다」다.","why":"","mix":""}],"n":14,"rounds":10},{"id":"4-14","subject":"전기위험방지기술","chapter":"전기 방폭","big":"분진 방폭","title":"분진 방폭","topic3d":"","items":[{"name":"분진 방폭구조의 종류","facts":["특수방진 = 전폐구조 + 접합면에 일정 깊이 이상의 패킹","보통방진 = 접합면 깊이만","폭연성 분진(금속분)은 금속관·케이블 공사(캡타이어 ×)","가연성 분진은 합성수지관도 가능"],"hook":"「패킹이면 특수, 깊이만이면 보통」. 김치통 뚜껑에 고무 패킹 달면 특수방진이다. 폭연성 분진(금속가루)은 쇠파이프(금속관)만 쓴다.","why":"더 꼼꼼히 막은 쪽이 「특수」다.","mix":""},{"name":"분진폭발 위험 물질","facts":["생석회(CaO)·시멘트·모래는 폭발하지 않는다(이미 산화)","금속분·유기물 가루는 거의 다 위험","최소발화에너지가 가장 작은 것 = 폴리에틸렌(금속분보다 작다)","종이 뭉치 같은 덩어리 가연물은 폭발위험장소가 아니라 화재위험장소"],"hook":"「이미 다 탄 놈은 안 탄다」, 생석회·시멘트는 재다. 뜻밖에 플라스틱 가루(폴리에틸렌)가 금속가루보다 불이 잘 붙는다.","why":"폭발은 공기와 고루 섞인 기체나 가루라야 일어난다.","mix":""},{"name":"분진 도전성·스파크 화재 방지","facts":["도전성 분진 = 카본블랙·코크스·그을음(탄소 계열)","비도전성 = 밀가루·설탕·염료","스파크 방지 = 방폭형 기기·불연성 함·포장 퓨즈·접촉저항 관리","비포장 퓨즈·유입개폐기 내수벽은 대책이 아니다","감독자 상주는 분진폭발 대책이 아니다"],"hook":"탄소는 연필심처럼 전기가 통한다. 「카본·코크스·그을음」은 도전성, 빵집 가루(밀가루·설탕)는 비도전성이다. 퓨즈는 포장된 것만, 비포장은 포장 뜯긴 폭죽이다.","why":"","mix":""}],"n":14,"rounds":11},{"id":"4-15","subject":"전기위험방지기술","chapter":"감전재해","big":"응급처치","title":"감전 응급처치","topic3d":"","items":[{"name":"감전자의 소생률","facts":["1분 이내 95%","3분 75%","4분 50%","5분 25%","6분 10%"],"hook":"「일구오·삼칠오·사오공·오이오·육일공」. 1분 95를 「일찍 구해 오라」로 잡으면 나머지가 계단처럼 내려간다.","why":"뇌는 산소 없이 몇 분을 못 버틴다.","mix":"보기에 75와 50이 함께 놓여 있어 시간을 잘못 보면 그리로 끌린다."},{"name":"응급조치의 순서·방법","facts":["질식 상태면 그 자리에서 곧바로 심폐소생술","옮기거나 사람 부르느라 시간을 쓰지 않는다","구강 대 구강 인공호흡은 매분 12~15회, 30분 이상","구조자는 전원 차단 또는 절연물 사용, 맨손 금지"],"hook":"「그 자리에서 곧바로」. 업고 뛰면 4분 지나 반은 죽는다. 숨은 「십이에서 십오」 번, 최소 「삼십 분」은 포기 금지다.","why":"","mix":""},{"name":"감전자의 관찰 사항","facts":["의식·호흡·맥박 셋을 가장 먼저 본다","출혈·골절·화상 같은 상처는 그 뒤","인체 통과 전류의 크기(50 mA 초과 여부)는 현장에서 관찰할 수 없다"],"hook":"「의호맥」, 의사(의식) 호출(호흡) 맥박(맥박). 전류가 몇 mA였는지는 눈에 안 보이니 관찰 항목이 아니다.","why":"관찰은 보고·만지고·듣는 것으로 이루어진다.","mix":""}],"n":13,"rounds":10},{"id":"4-16","subject":"전기위험방지기술","chapter":"감전재해","big":"보폭·접촉전압","title":"허용접촉전압","topic3d":"","items":[{"name":"허용접촉전압의 종별","facts":["제1종 2.5 V 이하(인체가 물에 젖은 상태)","제2종 25 V 이하(땀 등으로 현저히 젖음, 금속에 늘 닿음)","제3종 50 V 이하(건조한 통상 상태에서 위험이 높은 경우)","제4종 제한 없음","현행 KEC는 종별 없음(개정 전 기준 출제)"],"hook":"「이점오·이십오·오십·무제한」. 앞 둘은 소수점만 옮긴 10배(2.5→25)다. 물에 젖으면 2.5, 땀에 젖으면 25, 마르면 50. 젖을수록 값이 준다.","why":"젖을수록 인체저항이 낮아 같은 전압에도 큰 전류가 흐른다.","mix":"물(제1종 2.5 V)과 땀(제2종 25 V)을 가른다. 0.5 V·35 V는 함정 숫자다."},{"name":"접촉전압·보폭전압 계산","facts":["접촉전압 = I × (Rk + Rf ÷ 2), 두 발 저항 병렬","보폭전압 = I × (Rk + 2Rf), 두 발 저항 직렬","보폭전압의 두 점 간격은 1 m","변전소 허용접촉전압 예제 답 202 V"],"hook":"두 발 「나란히」면 병렬(÷2), 「앞뒤」면 직렬(×2)다. 서 있으면 반, 걸으면 두 배. 보폭은 한 걸음 1 m다.","why":"","mix":"300을 그대로 더해 215로 가는 보기가 함정이다. 나란한 두 발은 병렬이다."},{"name":"접지의 목적·단락접지기구","facts":["접지 목적 = 감전 방지·대지전위 상승 억제·보호계전기 확실한 동작·낙뢰와 이상전압 보호","전위는 낮추지 절연강도를 올리지 않는다","정전작업 중 단락접지기구의 목적 = 혼촉·오동작에 의한 감전 방지"],"hook":"접지는 「전기 하수도」다. 전위를 낮추고 흘러갈 길을 만든다. 절연을 두껍게 하는 건 접지가 아니라 방수다. 단락접지는 남이 실수로 스위치 올려도 나를 지키는 보험이다.","why":"","mix":""}],"n":12,"rounds":10},{"id":"4-17","subject":"전기위험방지기술","chapter":"전기설비","big":"보수·점검","title":"누전경보기와 보수","topic3d":"","items":[{"name":"누전화재경보기","facts":["시험 항목에 절연저항시험은 있고 접지저항시험은 없다","변류기는 수신부 스위치의 2차측(부하측)에 설치","제연설비는 경보설비가 아니라 소화활동설비"],"hook":"경보기 시험은 「기계 건강검진」이라 땅(접지저항)은 검진 대상이 아니다. 변류기는 지켜야 할 쪽(2차측)에 문지기처럼 선다.","why":"접지저항은 기계가 아니라 설치한 땅의 상태다.","mix":""},{"name":"방폭설비 보수·본질안전·기본 대책","facts":["본질안전 방폭구조는 통전 중에도 외함을 열 수 있다","불꽃이 나도 에너지가 최소발화에너지에 못 미친다","0종 장소에 쓸 수 있는 유일한 구조","전기작업 기본 대책에 부품 재사용은 없다","단락접지는 유도전압·오통전 대비"],"hook":"본질안전은 「아기 손 불꽃」이라 나더라도 힘이 없어 열어 놓고 만져도 된다. 안전 보기에 「재사용·절약」이 끼면 거의 오답이다.","why":"","mix":""}],"n":9,"rounds":7},{"id":"4-18","subject":"전기위험방지기술","chapter":"전기 일반","big":"용접기·기타","title":"전기기구 조작·주수","topic3d":"","items":[{"name":"전기기계·기구 조작 시 안전조치","facts":["조작부 점검·보수 때 작업공간 폭 70 cm 이상(50 cm ×)","설치 시 고려 = 전기적 용량·기계적 강도, 습기·분진 등 주위 환경, 방호수단의 적정성","「시간 가동율」은 고려 사항이 아니다","공인 인증기관 인증 제품을 쓴다"],"hook":"「칠십 센티」는 몸 돌려 도망칠 폭이다. 50 cm면 감전돼도 뒤로 못 빠진다. 설치 고려는 「용량·환경·방호」 셋, 「가동율·효율」은 사장님 말이다.","why":"","mix":""},{"name":"전기화재 주수·금속관·용접기 효율","facts":["전기화재에 봉상주수(물기둥)는 금지, 물이 이어져 감전된다","무상(분무)주수는 가능","가연성 가스 장소의 금속관 공사는 5턱 이상 나사조임","용접기 효율 = 출력 ÷ (출력 + 내부손실), 무부하 80 V·아크 25 V·300 A·손실 4 kW → 65.2%"],"hook":"물기둥은 「전깃줄」이다. 이어진 물로 전기가 올라온다. 안개(무상)로 뿌리면 끊겨서 안전하다. 금속관 나사는 「다섯 턱」까지 돌려야 불꽃이 못 샌다.","why":"","mix":""}],"n":6,"rounds":6},{"id":"4-19","subject":"전기위험방지기술","chapter":"정전기","big":"정전기 방지대책","title":"제전복과 제전기","topic3d":"","items":[{"name":"제전복·습도","facts":["상대습도 60~70% 이상이면 정전기가 거의 쌓이지 않는다","상대습도가 높은 장소에서는 제전복을 안 입어도 된다","건조한 겨울에 정전기가 심하다"],"hook":"습도 「육칠십」이면 정전기가 물길 따라 새어 나간다. 장마철엔 제전복을 벗어도 되고, 겨울 문손잡이는 그래서 따갑다.","why":"공기 중 수분이 전하가 빠져나갈 길이 된다.","mix":""},{"name":"제전기의 종류","facts":["전압인가식·자기방전식·방사선식 셋","「정전식 제전기」는 없다","제전효율 90% 이상","접지와 달리 부도체에도 통한다"],"hook":"「전자방」 삼형제, 전압인가·자기방전·방사선. 공기를 이온화해 반대 극성으로 중화한다. 「정전식」은 정전기 만드는 이름이라 가짜다.","why":"","mix":""}],"n":2,"rounds":2},{"id":"4-20","subject":"전기위험방지기술","chapter":"전기 방폭","big":"방폭 개요","title":"방폭구조의 목적","topic3d":"","items":[{"name":"방폭구조의 목적","facts":["전기설비가 점화원이 되는 화재·폭발이 대단히 많아 방폭화한다","폭발 3요소 중 현장에서 손댈 수 있는 것은 점화원"],"hook":"가연물과 산소는 공장에 늘 있다. 우리가 끌 수 있는 촛불은 점화원뿐이고, 그 촛불 대부분이 전기다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"4-21","subject":"전기위험방지기술","chapter":"보호구","big":"호흡·눈·귀","title":"보호구의 지급","topic3d":"","items":[{"name":"보호구의 지급 기준","facts":["낙하·충격·끼임·감전·정전기 대전 위험 작업 = 안전화","높이·깊이 2 m 이상 추락 위험 = 안전대","낙하·비래·추락 위험 = 안전모","물체 흩날림 = 보안경, 용접 불꽃 = 보안면","영하 18℃ 이하 급냉동어창 하역 = 방한모·방한복·방한화·방한장갑"],"hook":"「끼임 + 정전기」가 같이 나오면 발(안전화)이다. 발등은 밟히고 정전기는 발바닥으로 샌다. 영하 십팔 도 냉동창고엔 방한 4종 세트다.","why":"","mix":"안전대는 2 m부터, 안전모는 높이와 상관없이 떨어질 물건이 있으면이다."}],"n":1,"rounds":1},{"id":"4-22","subject":"전기위험방지기술","chapter":"정보입력표시","big":"시각","title":"조도 감소의 원인","topic3d":"","items":[{"name":"조도 감소의 원인(감광보상률)","facts":["광원 노화·전압 부족으로 덜 나온다","먼지·오물로 광속 흡수율이 증가한다","반사면 변질로 반사율이 감소한다","「흡수율 감소」는 방향이 거꾸로라 원인이 아니다"],"hook":"먼지 앉은 전등은 「살찐 스펀지」다. 빛을 더 먹고(흡수 증가) 덜 튕긴다(반사 감소). 흡수가 「감소」한다고 쓰면 거꾸로다.","why":"","mix":""}],"n":1,"rounds":1},{"id":"4-23","subject":"전기위험방지기술","chapter":"안전점검·인증","big":"안전인증·검사","title":"절연장갑 등급 전압","topic3d":"approach","items":[{"name":"내전압용 절연장갑의 등급별 최대사용전압","facts":["직류값 = 교류값 × 1.5","등급 2는 교류 17,000 V, 직류 25,500 V","교류값만 외우면 직류는 곱해서 구한다"],"hook":"직류는 교류의 「한 배 반」이다. 등급 2는 교류 만칠천, 직류 이만오천오백. 「십칠 곱하기 일점오는 이십오점오」.","why":"","mix":"등급 2에 직류 17,000 V라고 쓰면 교류값을 그대로 옮긴 함정이다."}],"n":1,"rounds":1},{"id":"5-01","subject":"화학설비위험방지기술","chapter":"연소·폭발","big":"연소 이론","title":"연소 이론·소화 기초","topic3d":"gasweld","items":[{"name":"화염방지기의 설치","facts":["인화성 액체·가스 설비의 대기 방출부 상단(끝)에 설치","통기관 중앙 설치는 틀린 말","소염소자 = 가는 금망 여러 겹으로 불길의 열을 빼앗음","인화점 38℃ 이상 60℃ 이하 액체 취급 시 예외 있음"],"hook":"불길은 문 앞에서 막는다. 화염방지기는 굴뚝 꼭대기에 씌우는 모자이지, 배 가운데 두르는 벨트가 아니다.","why":"바깥 불이 탱크 안으로 들어오지 못하게 하려면 통기관의 끝에 있어야 한다.","mix":"통기관 「중앙」은 오답, 「상단」이 정답"},{"name":"완전연소 반응식","facts":["CO₂ 몰수 = 분자식의 탄소 원자 수","H₂O 몰수 = 수소 원자 수 ÷ 2","에탄올 C₂H₅OH → CO₂ 2몰 + H₂O 3몰","연료 속의 O는 산소 계수를 그만큼 줄인다"],"hook":"탄소는 1인승(C 하나가 CO₂ 하나), 수소는 2인승 택시(H 둘이 물 하나). 에탄올은 손님 C 2명·H 6명이라 차 2대·택시 3대.","why":"","mix":"에탄올 수소는 5 + 1 = 6개, 5개로 세면 틀린다"},{"name":"고압가스 용기의 도색","facts":["수소 주황 · 아세틸렌 황색 · 산소 녹색","암모니아 백색 · 염소 갈색","질소·LPG 등 그 밖의 가스 회색","의료용 산소는 백색(산업용과 다름)"],"hook":"무지개 순서 「주·노·초」= 수소·아세틸렌·산소, 이어서 「하·갈·회」= 암모니아·염소·나머지. 「수아산 암염나, 주노초 하갈회」로 한 번에.","why":"","mix":"주황(수소)과 노랑(아세틸렌) 자리 바꿔 놓기가 단골 함정"},{"name":"이산화탄소 소화약제","facts":["부식성이 없다(전기실·정밀기기에 적합)","주작용은 질식소화","「부식성이 매우 강하다」는 정반대 오답"],"hook":"CO₂는 청소 안 해도 되는 손님. 뿌리고 나면 녹도 얼룩도 안 남긴다. 그래서 컴퓨터실에 쓴다.","why":"물이나 분말을 뿌릴 수 없는 전기·정밀 설비 때문에 쓰는 약제다.","mix":""},{"name":"소화의 방법","facts":["연소 4요소 = 가연물·산소·점화원·연쇄반응","제거 · 질식 · 냉각 · 억제가 각각 하나씩 없앤다","열에너지를 흡수하는 매체 투입 = 냉각소화","거품(폼)은 질식, 할로겐은 억제(부촉매)"],"hook":"「제·질·냉·억」 = 땔감 치우기(제거)·산소 끊기(질식)·열 빼기(냉각)·연쇄 끊기(억제). 물은 냉각, 거품은 질식, 할론은 억제.","why":"","mix":""},{"name":"불활성화(퍼지)","facts":["진공 · 압력 · 스위프 · 사이폰 퍼지 네 가지","사이클론·가열 퍼지는 없다","수증기는 응축돼 사라지므로 불활성 첨가제로 부적절","퍼지 가스는 천천히 충분히(빠른 속도 다량 송입 금지)"],"hook":"빼고(진공)·밀고(압력)·쓸고(스위프)·채웠다 빼고(사이폰). 사이클론은 먼지 청소기라 딴 동네 식구다.","why":"","mix":"수증기는 식으면 물이 되어 산소를 계속 눌러 두지 못한다"},{"name":"폭발성 물질·유기과산화물","facts":["니트로·아조·과산화가 붙으면 폭발성","유기과산화물은 산업안전보건법상 폭발성 물질","과염소산·과산화수소·과망간산은 산화성"],"hook":"이름에 「니·아·과」가 있으면 산소 도시락을 싸 온 폭탄. 「과-」로 시작하는 산은 남을 태우는 산화제.","why":"폭발성 물질은 제 안에 산소를 품어 혼자서도 터진다.","mix":"과산화수소(산화성)와 유기과산화물(폭발성)은 다른 갈래"},{"name":"탄화칼슘(카바이드)과 물","facts":["탄화칼슘 + 물 → 아세틸렌 발생","아세틸렌 폭발범위 2.5~81 vol%로 매우 넓다","카바이드는 밀폐용기에 넣어 물기 없는 곳에 저장","물속에 저장하는 것은 황린(발화점 34℃)"],"hook":"카바이드는 물만 닿으면 아세틸렌을 뿜는 팝핑캔디. 그러니 물기 없는 통에. 물속에 재우는 건 황린 하나뿐.","why":"","mix":"탄화칼슘 물속 저장은 오답, 황린 물속 저장이 정답"},{"name":"그 밖에(연소속도·연소형태)","facts":["연소속도 요인 = 농도·온도·압력·촉매·표면적(색깔 무관)","가연성 가스는 확산연소, 액체는 증발연소","인화점이 가장 낮은 것은 이황화탄소","IG-541 = 질소 52% + 아르곤 40% + CO₂ 8%","녹슬기도 타기도 모두 산화"],"hook":"불은 색깔을 안 본다(연소속도와 무관). 기체는 퍼지며 타고(확산), 액체는 김 나며 탄다(증발). IG-541은 「오이·사공·팔」 52·40·8.","why":"","mix":""}],"n":88,"rounds":22},{"id":"5-02","subject":"화학설비위험방지기술","chapter":"위험물","big":"위험물 분류·저장","title":"위험물 분류와 농도 기준","topic3d":"chemdist","items":[{"name":"부식성 물질의 기준농도","facts":["부식성 산류 20% 이상: 염산·황산·질산","60% 이상: 인산·아세트산·불산","부식성 염기류 40% 이상: 수산화나트륨·수산화칼륨"],"hook":"센 산은 20만 있어도 무섭고, 약한 산은 60은 돼야 무섭고, 염기는 그 사이 40. 「센20·약60·염40」을 「이십 육십 사십」 랩처럼.","why":"센 산일수록 낮은 농도에서도 살을 녹이므로 기준이 낮다.","mix":"보기에 20과 60이 나란히 놓여 산 쪽으로 끌어당긴다. 염기는 40"},{"name":"위험물질의 종류","facts":["니트로·아조·과산화 = 폭발성","과염소산·과산화수소·과망간산 = 산화성","가연물 + 산화성 고체 혼합 → 최소점화에너지 감소·폭발위험 증가","암모니아는 인화성 가스가 아니다","과염소산칼륨은 인화성 물질이 아니다(산화성 고체)"],"hook":"이름 감별법: 「니트로·아조·과산화」는 폭탄, 「과-」로 시작하면 남 태우는 산화제, 진한 「-산」은 살 녹이는 부식성.","why":"","mix":""},{"name":"위험물의 유별 분류","facts":["제3류 = 자연발화성·금수성(물·공기와 만나면 위험)","제5류 = 자기반응성(제 안에 산소를 품음)","니트로글리세린은 제5류(제3류 아님)"],"hook":"3류는 물·공기 알레르기, 5류는 산소 도시락 폭탄. 「니트로」가 붙으면 5류.","why":"","mix":""},{"name":"금수성 물질의 소화","facts":["금수성 = 물 금지, 포소화기 사용 불가","탄산수소염류 분말소화기·마른 모래가 적응","마그네슘 화재에 물·CO₂ 소화 불가"],"hook":"금수(禁水)는 「물 금지」 팻말. 젖은 건 다 빼고 마른 것만 남긴다. 마른 분말, 마른 모래.","why":"","mix":""},{"name":"방유제·저장방법","facts":["인화성 액체 저장탱크 → 방유제(누출 확산 방지)","탄화칼슘은 물기 없는 곳에","황린은 물속에","니트로셀룰로오스는 알코올로 적셔서"],"hook":"방유제는 새어 나온 기름을 가두는 욕조 턱. 저장은 「카바이드 마르게, 황린 물속에, 질화면 촉촉하게」.","why":"","mix":"황린과 탄화칼슘의 저장법을 서로 바꿔 놓는 것이 이 유형의 함정"},{"name":"내화기준","facts":["건축물 기둥·보는 지상 1층(6 m 초과 시 6 m)까지 내화구조","배관·전선관 지지대는 지상 1단(6 m 초과 시 6 m)까지","2시간 이상 내화성능이면 면제"],"hook":"「일·육·이」 = 1층·6 m·2시간. 비행기 「이륙이」처럼: 1층 위 6 m까지 2시간 버틴다.","why":"","mix":""},{"name":"급성 독성물질과 정의 가르기","facts":["조직을 파괴하면 부식성, 몸에 흡수돼 해치면 독성","급성 독성 기준은 LD50·LC50 수치로 정한다","인화성 액체 정의의 표준압력 101.3 kPa"],"hook":"살에 닿아 녹이면 부식성, 몸속에 들어가 해치면 독성. 101.3은 압력(kPa), 273.15는 온도. 헷갈리면 「101 압력」.","why":"","mix":""},{"name":"그 밖에(안전거리)","facts":["단위공정시설 사이 10 m 이상","사람·플레어스택·저장탱크가 끼면 20 m 이상"],"hook":"「10 하나, 20 셋」. 설비끼리는 10 m, 사람이나 불꽃이 끼면 두 배 20 m.","why":"","mix":""}],"n":57,"rounds":24},{"id":"5-03","subject":"화학설비위험방지기술","chapter":"연소·폭발","big":"혼합가스 계산","title":"혼합가스 폭발범위 계산","topic3d":"","items":[{"name":"르 샤틀리에의 법칙","facts":["100/L = Σ(Vi/Li)","하한이 낮은 성분이 결과를 크게 끌어내린다","메탄 70·프로판 21·부탄 9 vol% → 3.45~12.58 vol%","메탄 70·부탄 30 vol% → 하한 3.2 vol%"],"hook":"분수 형제들(V/L)을 몽땅 더한 뒤 100을 얹어 뒤집는다. 하한 낮은 놈이 대장이라 결과를 끌어내린다.","why":"","mix":"몫을 더하고 「뒤집는 것」을 잊으면 엉뚱한 값이 나온다"},{"name":"화학양론조성(Cst)·Jones 식","facts":["분자가 클수록(탄소가 많을수록) Cst가 낮다","완전연소조성농도가 가장 낮은 것은 부탄(C₄H₁₀)","Jones 식: 연소하한 ≈ 0.55 × Cst","프로판 연소하한 ≈ 2.21 vol%"],"hook":"덩치 큰 분자는 밥(산소)을 많이 먹어 제 몫이 줄어든다. 존스 식은 「오오(0.55)를 곱하면 하한」.","why":"탄소·수소가 많을수록 산소가 더 필요하므로 연료의 몫이 줄어든다.","mix":""},{"name":"최소산소농도(MOC)","facts":["MOC = 연소하한 × 연소식의 산소 몰수","프로판(2.2~9.5 vol%) MOC = 11 vol%","실무는 여기서 4 vol% 정도 더 낮춰 잡는다","질소·CO₂로 산소를 MOC 아래로 낮추는 것이 불활성화"],"hook":"하한 곱하기 산소 계수. 프로판은 2.2 × 5 = 11. 불이 죽는 기준선이 MOC, 안전선은 거기서 4 더 밑.","why":"","mix":""},{"name":"주요 가스의 폭발범위","facts":["하한: CS₂ 1.2 < C₂H₂ 2.5 < H₂ 4 < CH₄ 5","아세틸렌 2.5~81 vol%","상한이 70을 넘는 것은 수소와 일산화탄소뿐","범위 넓이 순 H₂ > CO > CH₄ > C₃H₈"],"hook":"하한 줄서기 「씨·아·수·메」 = 이황화탄소 1.2, 아세틸렌 2.5, 수소 4, 메탄 5. 아세틸렌은 2.5~81, 뭘 섞어도 거의 터진다.","why":"","mix":"메탄 5가 넷 중 가장 높다는 것만 알아도 오답이 걸러진다"},{"name":"가스의 위험도","facts":["H = (U − L) ÷ L","하한이 낮고 범위가 넓을수록 위험도가 크다","범위의 넓이와 위험도는 다른 값"],"hook":"위험도는 (위−아래)÷아래. 아랫도리(하한)로 나누니 아래가 작으면 폭등. 범위 넓이 대장이 꼭 위험 대장은 아니다.","why":"하한으로 나눠야 하한이 낮을 때 값이 커진다.","mix":"벤젠(1.4~6.7)은 범위가 좁아도 하한이 작아 위험도가 크다"},{"name":"최대폭발압력·범위 요인","facts":["온도·압력·산소 ↑ → 폭발범위 넓어짐(하한↓ 상한↑)","압력·산소는 상한을 크게 밀어 올린다","초기 압력 ↑ → 최대폭발압력 ↑, 초기 온도 ↑ → ↓","난류·유속은 압력상승속도에 영향","최대압력은 화학양론보다 약간 진한 농도에서"],"hook":"「세게」와 「빨리」는 딴 이야기. 초기 압력은 세기를, 난류·유속은 속도를 키운다. 온도는 기체를 묽게 해 세기를 깎는다.","why":"","mix":"「초기 압력」과 「초기 온도」는 방향이 반대"},{"name":"기상폭발과 응상폭발","facts":["기상폭발 = 가스·분진·분무·분해 폭발","응상폭발 = 수증기폭발·전선폭발(상태 급변)","수증기폭발은 기상폭발이 아니다"],"hook":"떠 있으면 기상(가루·안개도 떠 있으니 기상). 액체가 갑자기 김이 되면 응상. 수증기폭발은 이름에 「기」가 있어도 응상.","why":"","mix":""}],"n":46,"rounds":20},{"id":"5-04","subject":"화학설비위험방지기술","chapter":"화학설비","big":"건조·열전달","title":"건조설비와 특수화학설비","topic3d":"","items":[{"name":"위험물 건조설비의 건축물(독립 단층)","facts":["위험물 건조설비 내용적 1 m³ 이상","고체·액체연료 최대사용량 10 kg/h 이상","기체연료 최대사용량 1 m³/h 이상","전기 정격용량 10 kW 이상","→ 독립된 단층 건물로 짓는다"],"hook":"「일·십·일·십」 = 부피 1, 연료 10, 가스 1, 전기 10. 덩치 크면 따로 산다, 독립 단층 건물.","why":"","mix":"액체연료 5 kg/h는 함정, 10 kg/h가 맞다"},{"name":"위험물 건조설비의 구조","facts":["상부는 가벼운 재료 + 폭발구","측벽·바닥은 견고하게","위험물 건조에 직화 사용 금지"],"hook":"지붕은 뚜껑처럼 가볍게, 터지면 하늘로 뿅 날아가라고(폭발구). 벽과 바닥은 튼튼. 「상부를 무거운 재료로」는 오답.","why":"폭발압력을 위로 빼내야 사람 있는 옆이 무사하다.","mix":""},{"name":"건조설비의 사용","facts":["건조물은 쉽게 이탈되지 않도록","위험물 건조에 직화는 금물","긴급차단장치 동력원 = 공기압·유압·전기(보온 아님)"],"hook":"건조기 안은 빵집 오븐이 아니라 화약고. 맨불(직화) 금지, 빵(건조물) 떨어뜨리지 말 것.","why":"떨어진 건조물이 뜨거운 바닥에 닿으면 그대로 불씨가 된다.","mix":""},{"name":"특수화학설비","facts":["350℃ 이상 또는 게이지 980 kPa 이상 운전 설비","발열반응 반응장치, 반응폭주 우려 설비","증류·정류·증발·추출 등 분리장치, 가열로·가열기","흡열반응 반응장치는 해당 없음"],"hook":"「삼오공 구팔공」 = 350℃·980 kPa, 뜨겁고 빵빵하면 특수. 흡열반응은 스스로 식으니 명단에 없다.","why":"열이 쌓이거나 상태가 급변할 수 있는 곳만 모았다.","mix":""},{"name":"BLEVE·플래시율","facts":["BLEVE = Boiling Liquid Expanding Vapor Explosion","불 → 탱크 가열 → 비등 → 압력 상승 → 파열 → 파이어볼","플래시율 = 엔탈피 차 ÷ 기화열","(1.45 − 1) ÷ 540 ≈ 0.00083 (cal/g = kcal/kg)"],"hook":"블레비는 「불에 레(액체)가 비등」. 탱크는 압력솥, 뚜껑 날아가면 파이어볼. 플래시율은 「남는 열 ÷ 끓는 데 드는 열」.","why":"","mix":""},{"name":"파열판과 안전밸브","facts":["파열판은 한 번 터지면 교환해야 한다","급격한 압력 상승에는 파열판","안전밸브는 스프링이라 반응이 느리다"],"hook":"파열판은 일회용 풍선, 한 번 터지면 새것. 스프링(안전밸브)은 느긋해서 폭주엔 못 따라간다.","why":"","mix":""},{"name":"그 밖에(공동현상·부속설비)","facts":["정압 < 증기압이면 물이 증발해 기포·부식 = 공동현상","사이클론·백필터·전기집진기는 분진처리 부속설비"],"hook":"캐비테이션은 물이 「압력 부족」으로 몰래 끓는 것. 김빠진 사이다 거품이 펌프를 갉아먹는다.","why":"","mix":""}],"n":32,"rounds":19},{"id":"5-05","subject":"화학설비위험방지기술","chapter":"","big":"","title":"가스 측정·혼합 위험","topic3d":"confined","items":[{"name":"지하작업장의 가스 측정","facts":["장시간 작업은 4시간마다 측정","인화하한계의 25% 이상이면 즉시 대피","산소농도 18% 이상 유지, 감시인 배치"],"hook":"오전 4시간·오후 4시간, 반나절마다 코를 킁킁(4시간). 하한의 4분의 1(25%)만 차도 튀어라.","why":"","mix":"6시간·8시간은 오답, 4시간"},{"name":"가스의 혼합 위험·혼촉발화","facts":["가연성 + 조연성이 위험한 짝","발연질산(산화제) + 아닐린(가연물) = 혼촉발화","수소는 공기보다 14배 가볍고 부탄은 2배 무겁다"],"hook":"성냥과 산소통은 한방에 두지 말 것. 탈 것 + 태울 것이 위험한 커플. 발연질산 옆에 아닐린은 데이트 폭발.","why":"","mix":""},{"name":"가스 누설검지 시험지","facts":["포스겐 - 하리슨 시험지(심등색)","황화수소 - 연당지","일산화탄소 - 염화파라듐지","시안화수소 - 초산벤젠지"],"hook":"「포하·황연·일염·시초」. 포스겐은 사람 이름 하리슨, 황화수소는 납(연)당지, CO는 파라듐, HCN은 초산벤젠.","why":"","mix":""},{"name":"탱크 내 작업·유해물 대책","facts":["기름 묻은 작업복 착용 금지(그 자체가 연료)","유해물 대책에 「적응자 배치」는 없다","관로 방향 변경은 엘보우","물에 가장 잘 녹는 것은 아세톤, 벤젠 첨가 탈수는 공비증류"],"hook":"탱크 안에서 기름옷은 심지 달린 양초. 「사람 골라 배치」는 유해물을 1 g도 못 줄인다.","why":"","mix":""}],"n":29,"rounds":16},{"id":"5-06","subject":"화학설비위험방지기술","chapter":"화재·소화","big":"소화 이론·설비","title":"화재 급수와 소화약제","topic3d":"","items":[{"name":"화재의 분류","facts":["A급 일반(종이·목재·섬유) 백색","B급 유류 황색","C급 전기 청색","D급 금속 무색"],"hook":"A는 재(Ash) 남기는 일반, B는 기름 끓는(Boil) 유류, C는 전류(Current) 전기, D는 다이너마이트급 금속. 색은 「백·황·청·무」.","why":"","mix":""},{"name":"분말소화약제","facts":["1종 탄산수소나트륨","2종 탄산수소칼륨","3종 인산암모늄(A급까지, 메타인산 방진효과)","4종 탄산수소칼륨 + 요소"],"hook":"「나·칼·인·칼요」 1234 = 나트륨, 칼륨, 인산암모늄, 칼륨+요소. A급까지 잡는 만능은 3종, 메타인산 막이 불을 덮는다.","why":"","mix":"보기 넷 가운데 셋이 자리를 바꿔 놓고 하나만 제자리인 문항이 나온다"},{"name":"할론 번호","facts":["C·F·Cl·Br 순으로 원자 수를 적는다","CF₃Br = 할론 1301","2402 = C₂F₄Br₂(Cl 0)","Br이 없으면 부촉매 효과가 없다(끝자리 0은 가짜)"],"hook":"「탄·불·염·브」 순서로 개수 적기. 1301은 탄1 불3 염0 브1. 끝자리 0이면 브롬이 없어 불을 못 끈다, 1310은 가짜.","why":"","mix":""},{"name":"강화액 소화약제","facts":["물에 탄산칼륨(K₂CO₃)을 녹인 알칼리성 수용액","어는점 −30℃까지(부동성)","소화력이 물보다 강하다"],"hook":"물이 겨울에 얼고 힘도 약해서 탄산칼륨 보약을 먹인 물 = 강화액. 영하 30℃에도 안 언다.","why":"","mix":""},{"name":"화재 방지·확대 방지·소화 갈래","facts":["예방 → 국한 → 소화 → 피난 순","발화원 제거 = 예방","방화벽·방화문·공지·불연성화 = 국한(구획·분리)","에어폼(거품) = 질식소화","포 혼합장치에 「낙하혼합장치」는 없다"],"hook":"「예·국·소·피」 = 안 나게(예방)·안 번지게(국한)·끄고(소화)·도망(피난). 벽으로 자르면 국한, 거품으로 덮으면 질식.","why":"","mix":"「통합·대형화」는 확대방지의 정반대"}],"n":25,"rounds":17},{"id":"5-07","subject":"화학설비위험방지기술","chapter":"연소·폭발","big":"자연발화","title":"자연발화와 자기반응성","topic3d":"","items":[{"name":"자연발화의 조건","facts":["발열 > 방열일 때 일어난다","고온·다습한 환경","표면적이 클수록","열전도율이 작을수록, 공기 유통이 적을수록(열 축적)"],"hook":"이불 속 핫팩: 뜨겁고(고온) 눅눅하고(다습) 넓게 펴져 있고(표면적) 열이 못 빠져나가면 저절로 불. 「표면적 작을수록」은 거짓.","why":"","mix":"열전도율과 공기 유통만 「작을수록」, 나머지는 「클수록」"},{"name":"자연발화의 방지","facts":["통풍·환기로 열을 내보낸다","저장온도 낮게, 습도 낮게","퇴적·수납 시 열 축적 방지","점화원 제거는 무관(자연발화엔 점화원이 없다)","밀폐·다습 저장은 정반대"],"hook":"방지는 이불 걷어내기: 바람 쐬고, 시원하게, 뽀송하게. 점화원 제거는 남의 집 이야기, 자연발화엔 원래 점화원이 없다.","why":"","mix":"「습도 높은 곳 저장」「공기 출입 막고 밀폐」는 오답"},{"name":"자연발화의 원인","facts":["산화열 · 분해열 · 흡착열 · 중합열 · 미생물(발효)열","증발열은 원인이 아니다(열을 빼앗는다)"],"hook":"「산·분·흡·중·미」 = 산화·분해·흡착·중합·미생물 열. 증발은 열을 훔쳐 가니 범인 명단에 없다.","why":"","mix":""},{"name":"니트로셀룰로오스의 저장","facts":["에틸알코올·이소프로필알코올로 습면 유지","물 또는 알코올로 20% 이상 적신다","마르면 자연발열해 분해 폭발","금수성은 말리고, 자기반응성은 적신다"],"hook":"질화면은 마르면 성질 더러운 화약. 술(알코올)로 20% 촉촉하게 재워 둔다. 금수성은 말리고, 자기반응성은 적신다.","why":"","mix":""},{"name":"그 밖에(아세틸렌·차단밸브)","facts":["아세틸렌은 공기 없이도 분해폭발, 사용압력 127 kPa 이하","아세톤에 녹여 다공물질에 담는다","안전밸브 앞뒤 차단밸브는 원칙 금지","자동압력조절밸브가 배출용량 1/2 이상이면 예외","기상폭발 피해예측은 압력상승 기인(물질 확산은 아님)"],"hook":"아세틸렌은 산소 없이도 혼자 터지는 폭죽. 그래서 「일이칠(127)」 넘게 못 누르고, 아세톤에 녹여 스펀지에 재운다.","why":"","mix":""}],"n":22,"rounds":17},{"id":"5-08","subject":"화학설비위험방지기술","chapter":"유해화학물질","big":"노출기준·독성","title":"독성 기준값 세트","topic3d":"","items":[{"name":"급성 독성물질의 기준","facts":["경구(쥐) LD50 300 mg/kg 이하","경피(토끼·쥐) LD50 1,000 mg/kg 이하","흡입 가스(쥐 4시간) LC50 2,500 ppm 이하","흡입 증기 LC50 10 mg/L 이하","흡입 분진·미스트 LC50 1 mg/L 이하"],"hook":"먹고(300)·바르고(1,000)·마시고(2,500) = 「삼백·천·이천오백」. 입으로 들어가는 게 제일 무서워 기준이 제일 낮다. 증기 10, 가루 1은 「십·일」.","why":"입으로 들어가는 쪽이 더 위험하므로 기준이 낮다.","mix":"경구 300과 경피 1,000을 맞바꾼 보기가 함정"},{"name":"LD50·LC50의 뜻","facts":["L = Lethal(치사), 50 = 절반이 죽는 값","D = Dose(용량): 먹거나 바르면 D","C = Concentration(농도): 마시면 C"],"hook":"D는 떠먹이는 Dose, C는 들이마시는 Concentration. 50은 반타작.","why":"","mix":""},{"name":"허용노출기준(TWA)·독성가스","facts":["포스겐(COCl₂) 0.1 ppm, 가장 독하다","염소 0.5 ppm, 시안화수소 10, 암모니아 25, 일산화탄소 30 ppm","기준값이 낮을수록 독하다","CO는 헤모글로빈 결합력이 산소의 200~300배","CO는 가연성(불연성·10 ppm은 오답)"],"hook":"낮을수록 독하다. 포스겐 0.1은 「영점일 = 영원히 못 일어남」. 염소 0.5, 시안 10, 암모니아 25, CO 30.","why":"","mix":"염소 0.5 → 25 → 200 → 1,000 식으로 자릿수가 벌어지면 가장 작은 것이 답"},{"name":"노출기준의 표시단위","facts":["가스·증기 = ppm(기체 부피 백만분율)","에어로졸(분진·흄·미스트) = mg/m³","섬유(석면 등) = 개/cm³"],"hook":"기체는 백만분의 몇 잔(ppm), 가루는 저울로(mg/m³), 실 같은 석면은 낱개로 센다(개/cm³).","why":"","mix":""},{"name":"혼합물질의 노출지수","facts":["EI = Σ(Ci ÷ Ti), 1을 넘으면 기준 초과","암모니아 20/25 + 톨루엔 20/50 = 1.2 → 초과","혼합물 허용농도 = ΣC ÷ EI","아세톤 200/500 + MEK 100/200 → 333 ppm"],"hook":"각자는 안전해도 합치면 초과: 0.8 + 0.4 = 1.2. 지수가 1을 넘는 순간 빨간불.","why":"","mix":""}],"n":22,"rounds":16},{"id":"5-09","subject":"화학설비위험방지기술","chapter":"화학설비","big":"배관·펌프·저장","title":"배관 부속과 펌프 이상","topic3d":"","items":[{"name":"배관 부속품의 용도","facts":["방향 변경: 엘보우(90°·45°)","지름 변경: 리듀서","막음: 플러그·캡","역류 방지: 체크밸브","2개 이상 밸브로 차단돼 열팽창 우려 있는 배관엔 안전밸브"],"hook":"「방·지·막·역」 = 방향은 팔꿈치(엘보우), 지름은 줄이는 리듀서, 막을 땐 플러그, 되돌아오면 체크(막음) 문지기.","why":"","mix":""},{"name":"압축기의 분류·이상 현상","facts":["용적형(왕복·회전) vs 터보형(원심·축류)","회전형만 나열하면 원심식·축류식","토출압력 급증 = 토출관 내 저항 발생","밸브 불량 → 역류·과열·소음(피스톤링 마모는 별개)"],"hook":"용적형은 가두고 조이는 주사기, 터보형은 돌려서 날리는 선풍기. 토출압력이 갑자기 오르면 나가는 길이 막힌 것.","why":"","mix":""},{"name":"공동현상(cavitation)","facts":["흡입 측 정압 < 증기압 → 기포·소음·진동·부식","방지: 회전수 낮추기","방지: 유효 흡입양정 작게","방지: 펌프를 낮게, 흡입관은 짧고 굵게"],"hook":"펌프가 너무 세게 빨면 물이 압력 부족으로 끓어 거품. 천천히, 낮게, 굵고 짧게 빨아라.","why":"","mix":""},{"name":"서징(surging) 현상","facts":["관로 내 공기 맥동·진동으로 불안정 운전","교축밸브를 기계 가까이(멀리는 오답)","출렁일 용적을 작게"],"hook":"서징은 관 속 공기가 스스로 출렁이는 파도. 출렁일 공간을 줄이려면 교축밸브를 기계 코앞에.","why":"","mix":""},{"name":"가스용기의 취급","facts":["용기 온도 40℃ 이하 유지","운반 시 캡을 씌운다","충격 금지, 밸브는 서서히"],"hook":"가스통은 「사십(40) 넘기지 말고 모자(캡) 씌워 다닌다」. 65℃는 함정.","why":"넘어져 밸브가 부러지면 고압가스가 뿜어 나와 용기가 날아간다.","mix":""},{"name":"누설 발화형 폭발의 예방","facts":["발화원 관리, 밸브 오조작 방지","누설물 검지·경보","불활성 가스 치환은 대책이 아니다"],"hook":"「새면 불난다」형은 안 새게·새면 알게·불씨 없애기. 안을 질소로 채우는 건 밀폐계 내부 폭발 이야기.","why":"","mix":""}],"n":21,"rounds":16},{"id":"5-10","subject":"화학설비위험방지기술","chapter":"유해화학물질","big":"물질 식별","title":"MIE·아세틸렌·흄","topic3d":"","items":[{"name":"최소발화에너지(MIE)","facts":["E = ½CV² (콘덴서 정전기 에너지)","줄열 I²Rt 식은 아니다","가장 작은 것은 수소(H₂)","수소·아세틸렌·이황화탄소가 작다"],"hook":"MIE는 성냥이 아니라 정전기 「따끔」 한 방: 콘덴서 에너지 ½CV². 수소가 제일 예민하다(가장 작다).","why":"","mix":""},{"name":"아세틸렌의 용해 저장","facts":["아세톤에 녹여 다공물질에 흡수시킨다","압축 자체가 위험(분해폭발)","사용압력 게이지 127 kPa 초과 금지","구리 70% 이상 합금 금지(아세틸라이드)"],"hook":"아세틸렌은 눌리면 성질 내는 놈이라 아세톤 술에 녹여 스펀지에 재운다. 「아세틸렌-아세톤」 이름부터 닮았다.","why":"","mix":""},{"name":"할론 번호(재출)","facts":["C·F·Cl·Br 순","2402 = C₂F₄Br₂, 0인 자리는 쓰지 않는다"],"hook":"「탄·불·염·브」 2402: 탄2 불4 염0 브2.","why":"","mix":""},{"name":"에어로졸의 종류","facts":["흄 = 금속 증기가 응고된 고체 미립자(용접)","분진 = 부수어 생긴 가루","미스트 = 액체 방울","흄은 분진보다 작아 폐 깊이 들어간다"],"hook":"흄은 녹았다 굳은 금속 안개(용접 연기), 분진은 부순 가루, 미스트는 물방울. 훈제(흄)는 연기다.","why":"","mix":""},{"name":"완전연소조성농도·폭발범위","facts":["탄소 수가 많을수록 Cst가 낮다(부탄이 가장 낮다)","프로판 MOC = 11.1 %v/v (Jones 식)","범위 넓이 H₂ > CO > CH₄ > C₃H₈","상한 70 넘는 것은 수소·CO"],"hook":"덩치 큰 부탄이 제일 조금(Cst 낮음). 범위 넓이 줄서기 「수·씨오·메·프」.","why":"","mix":""}],"n":18,"rounds":12},{"id":"5-11","subject":"화학설비위험방지기술","chapter":"화재·소화","big":"화재예방","title":"안전밸브 검사주기·설치","topic3d":"","items":[{"name":"안전밸브의 검사주기","facts":["유체와 디스크·시트 직접 접촉 → 매년 1회 이상","안전밸브 앞에 파열판 → 2년마다 1회 이상","공정안전보고서 이행 우수 사업장 → 4년마다 1회 이상"],"hook":"「일·이·사」 = 맨살 닿으면 1년, 파열판이 방패면 2년, 모범생 사업장은 4년. 방패가 두꺼울수록 검사는 뜸하게.","why":"보호가 두터울수록 부식·막힘이 적어 주기가 길어진다.","mix":"2년·3년으로 슬쩍 바꿔 놓은 보기가 함정"},{"name":"안전밸브의 설치대상","facts":["압력용기(안지름 150 mm 이하 제외)","정변위 압축기, 정변위 펌프","2개 이상 밸브로 차단돼 열팽창 우려 있는 배관","원심펌프는 대상이 아니다"],"hook":"정변위는 한 번에 정해진 양을 꾹꾹 밀어내는 놈, 출구 막히면 압력 무한 상승. 원심펌프는 날개만 헛돌아 빠진다.","why":"","mix":""},{"name":"차단밸브 설치 금지와 예외","facts":["안전밸브 앞뒤 차단밸브는 원칙 금지","예외: 병렬·복수 안전밸브","예외: 자동압력조절밸브와 병렬(배출용량 1/2 이상)"],"hook":"비상구 앞 자물쇠는 금지. 다른 비상구(병렬)가 살아 있을 때만 잠글 수 있다.","why":"","mix":"직렬이면 잠그는 순간 유일한 길이 끊긴다"},{"name":"파열판과 안전밸브의 한계","facts":["급격한 압력 상승(반응폭주)에는 파열판","안전밸브는 스프링이라 느리다","파열판은 일회용"],"hook":"스프링은 「끙」 하고 밀리는 시간이 있지만 파열판은 「빡」 찢어진다. 폭주엔 파열판.","why":"","mix":"「안전밸브 단독으로도 신속」은 함정"},{"name":"스팀 트랩·플레어스택·화염방지기","facts":["스팀 트랩 = 증기 누설 막고 응축수만 자동 배출","molecular seal = 밀도 작은 가스로 역류 방지","seal drum = 물로 막음","flame arrester = 유류탱크 통기부(증기 방출·외기 흡입)에 설치"],"hook":"트랩(덫)은 증기는 가두고 물만 흘려보내는 체. 플레어스택의 몰레큘러 실은 가벼운 가스 뚜껑, 실 드럼은 물 뚜껑.","why":"","mix":""},{"name":"퍼지의 종류","facts":["진공·압력·스위프·사이폰 퍼지","가열 퍼지는 없다","퍼지 가스는 천천히 충분히(급속 다량 송입 금지)"],"hook":"빼고·밀고·쓸고·채웠다 빼고. 가열 퍼지는 없다. 퍼지는 급하게 밀어 넣지 말고 은근히.","why":"","mix":""}],"n":17,"rounds":14},{"id":"5-12","subject":"화학설비위험방지기술","chapter":"화학설비","big":"반응기·증류탑","title":"반응기·열교환·혼합 계산","topic3d":"","items":[{"name":"반응기의 분류","facts":["조작방식 = 회분식·반회분식·연속식","구조방식 = 교반조형·관형·탑형·유동층형","관형은 구조 분류(조작 분류 아님)","관형은 전열면적이 커 발열반응 연속 처리에 적합"],"hook":"「어떻게 넣고 빼나」는 조작(회·반회·연속), 「어떻게 생겼나」는 구조(교반·관·탑·유동층). 「~형」이 붙으면 생김새.","why":"","mix":""},{"name":"용액의 혼합 계산","facts":["목표 농도에 가까운 쪽 용액을 더 많이","양의 비는 거리의 비의 반대","5%와 10%로 6% 100 kg → 5% 80 kg + 10% 20 kg"],"hook":"시소 법칙: 목표(6)에 가까운 5%가 무겁게(80), 먼 10%가 가볍게(20). 거리 1:4면 양은 4:1.","why":"","mix":""},{"name":"단열압축과 온도 상승","facts":["빠르게 압축하면 열이 빠질 새 없이 온도 상승","디젤 점화·압축기 화재의 원리","20℃ 1기압 → 5기압(k = 1.4) 약 191℃","화씨는 랭킨으로(℉ + 459.67)"],"hook":"자전거 펌프가 뜨거워지는 그것. 5배 누르니 20℃가 191℃. 계산은 반드시 절대온도로(켈빈·랭킨).","why":"","mix":""},{"name":"반응폭주·열교환·증류","facts":["반응폭주 = 열이 반응을 부르고 반응이 열을 부르는 되먹임","「지수함수적 증대」가 곧 반응폭주","향류가 병류보다 열교환 능률이 높다","포종·시브트레이·충전물은 증기·액체 접촉을 늘린다"],"hook":"폭주는 눈덩이(지수함수). 열교환은 마주 보고 걷는 향류가 이긴다, 끝까지 온도차가 남으니까.","why":"","mix":""},{"name":"분진 발화폭발의 조건","facts":["가연성(불연성은 탈락)","미분 상태","공기 중 부유","점화원 존재"],"hook":"가루 폭발 4박자: 탈 것·곱게·떠 있고·불씨. 불연성은 애초에 탈락.","why":"","mix":""}],"n":17,"rounds":13},{"id":"5-13","subject":"화학설비위험방지기술","chapter":"화학설비","big":"계측·제어","title":"화학설비 분류·계측","topic3d":"","items":[{"name":"화학설비와 부속설비","facts":["본체: 반응기·열교환기류(응축기·냉각기·가열기·증발기)·건조기·분리장치","부속: 배관·밸브, 자동제어(온도·압력·유량 지시·기록)","부속: 안전·비상조치 설비, 분진처리(사이클론·백필터·전기집진기)","「처리·제어·비상·공급」이 붙으면 부속"],"hook":"물질을 직접 만지면 본체, 그 둘레를 돌보면 부속. 열교환기는 본체, 압력계·집진기는 부속.","why":"","mix":""},{"name":"특수화학설비의 필수 장치","facts":["계측장치(온도계·유량계·압력계)","자동경보장치","긴급차단장치","예비동력원","소화장치·비중계는 아니다"],"hook":"「재고·알리고·끊고·버틴다」 = 계측·경보·긴급차단·예비동력. 소화기는 불난 뒤 이야기라 명단 밖.","why":"","mix":""},{"name":"자동제어의 순서","facts":["공정상황 → 검출 → 조절계 → 밸브(조작부)","폐회로(피드백) 제어"],"hook":"사람 행동 그대로: 달라지고(공정) → 재고(검출) → 판단하고(조절계) → 손댄다(밸브). 재기 전에 판단 못 한다.","why":"","mix":""},{"name":"유량계·압력계","facts":["차압식 = 관을 좁혀 압력차로 읽는다","로타미터 = 가변면적식(압력차 일정)","압력계는 유체가 담기는 용기·배관에(밸브류 아님)"],"hook":"로타미터는 관이 위로 벌어져 부표가 뜨는 높이로 읽는다 → 면적식. 밸브에 압력계? 문짝에 체온계 다는 격.","why":"","mix":""}],"n":11,"rounds":10},{"id":"5-14","subject":"화학설비위험방지기술","chapter":"유해화학물질","big":"응급처치·중독","title":"분진폭발·중독·잠함병","topic3d":"","items":[{"name":"분진폭발의 특징","facts":["가스폭발보다 연소속도·압력은 작다","연소시간이 길고 발생 에너지는 크다","압력의 파급속도 > 화염의 파급속도","입자 크기·부유성이 영향","2차 폭발이 뒤따른다"],"hook":"분진은 굼뜨지만 오래 타는 장작: 속도는 느리고 에너지는 크다. 압력파가 먼저 달려가 쌓인 먼지를 날려 2차 폭발.","why":"","mix":"「발생에너지가 작다」는 오답"},{"name":"중독의 응급처치","facts":["임의로 약품·알코올 투여 금지","오염 의복 제거·세척, 신선한 공기","의사에게 인계"],"hook":"응급처치는 「빼고·씻고·지켜보기」지 「먹이기」가 아니다. 술은 독을 더 빨리 퍼뜨린다.","why":"","mix":""},{"name":"크롬·중금속","facts":["크롬은 3가·6가 화합물이 쓰인다","6가 크롬이 더 유해(발암)","미나마타 = 수은, 이타이이타이 = 카드뮴"],"hook":"육가크롬은 육수가 아니라 독, 6가가 나쁘다. 미나마타-수은(미수), 이타이이타이-카드뮴(이카).","why":"","mix":""},{"name":"잠함병(감압병)","facts":["고압에서 혈액에 녹은 질소가 급감압 시 기포","공기의 78%가 질소","예방은 천천히 감압"],"hook":"사이다 뚜껑 확 따면 거품, 몸속 질소도 똑같다. 잠함병은 질소, 천천히 올라오기.","why":"","mix":""},{"name":"폭발·화재 예방(규칙 제232조)","facts":["통풍 · 환기 · 분진 제거","세척·제습은 다른 조문의 낱말"],"hook":"「통·환·제」 = 통풍, 환기, 제거. 위험한 것을 그 자리에서 걷어 내는 세 가지.","why":"","mix":""}],"n":10,"rounds":9},{"id":"5-15","subject":"화학설비위험방지기술","chapter":"연소·폭발","big":"폭발 현상","title":"폭발 현상 다섯 갈래","topic3d":"","items":[{"name":"분진폭발의 진행","facts":["퇴적분진 → 비산 → 분산 → 발화원 → 전면폭발 → 2차폭발","2차 폭발이 1차보다 큰 피해"],"hook":"「퇴·비·분·발·전·이」 = 퇴적·비산·분산·발화·전면·이차. 퇴비 뿌리듯 날려서 터진다.","why":"","mix":""},{"name":"기상폭발과 응상폭발","facts":["기상 = 가스·분진·분무·분해 폭발","응상 = 수증기폭발·전선폭발(상태 급변)","응상만 기상폭발이 아니다"],"hook":"떠 있으면 기상, 액체가 순간 김이 되면 응상. 응상만 기상이 아니다.","why":"","mix":""},{"name":"BLEVE","facts":["비등액 팽창증기 폭발","화재 → 탱크 가열 → 비등 → 압력 상승 → 파열 → 파이어볼","대책은 탱크 표면에 물을 뿌려 냉각"],"hook":"블레비 = 「불·레(액체)·비등」. 압력솥 뚜껑 날아가는 그림. 대책은 솥에 찬물 끼얹기.","why":"","mix":""},{"name":"증기폭발·증기운폭발(UVCE)","facts":["증기폭발 = 뜨거운 액체가 찬 액체를 한꺼번에 끓게 함","사이에 굳은 껍질이 생기면 덜 위험","UVCE = 누설된 증기운에 점화, 클수록 점화 확률↑","누설 방지가 유일하게 확실한 대책"],"hook":"뜨거운 쇳물에 물 한 컵 = 증기폭발. 증기운(UVCE)은 새면 끝이라 「안 새게」가 전부.","why":"","mix":""},{"name":"분진폭발의 위험 인자","facts":["수분만 적을수록 위험","온도·압력·산소·표면적·부유성은 클수록 위험","입자 표면적이 작을 때는 덜 위험"],"hook":"잘 타는 조건이면 다 위험. 딱 하나 반대는 수분, 젖은 밀가루는 안 터진다.","why":"","mix":""}],"n":10,"rounds":6},{"id":"5-16","subject":"화학설비위험방지기술","chapter":"화재·소화","big":"감지기·경보","title":"화재감지기 갈래","topic3d":"","items":[{"name":"화재감지기의 종류","facts":["열감지기 = 차동식·정온식·보상식","연기감지기 = 이온화식·광전식","불꽃감지기 = 자외선·적외선","바이메탈식은 정온식 계열(차동식 아님)"],"hook":"열은 「차·정·보」, 연기는 「이온·광전」, 불꽃은 「자외·적외」. 「광(빛)」은 연기를 보는 눈, 「온(溫)」은 열.","why":"","mix":"광전식을 열감지기에 넣은 보기가 단골 오답"},{"name":"소방설비의 분류","facts":["경보설비(알린다)","피난기구(완강기·구조대·유도등)","소화설비(끈다)","간이완강기는 경보 설비가 아니다"],"hook":"「알리나·도망치나·끄나」 세 물음. 완강기는 도망 도구(피난).","why":"","mix":""},{"name":"안전밸브 설치대상(재출)","facts":["정변위 압축기 → 안전밸브","압력용기(안지름 150 mm 이하 제외)","2개 이상 밸브 차단·열팽창 우려 배관","과압 방지 = 안전밸브·파열판"],"hook":"「과압」 낱말이 보이면 안전밸브·파열판. 150 mm(십오공) 이하 꼬마 용기는 면제.","why":"","mix":""}],"n":9,"rounds":9},{"id":"5-17","subject":"화학설비위험방지기술","chapter":"연소·폭발","big":"폭발범위·한계","title":"위험도와 폭발범위 요인","topic3d":"","items":[{"name":"위험도(H)","facts":["H = (U − L) ÷ L","하한이 작을수록·범위가 넓을수록 크다","범위의 넓이와 위험도는 다른 값"],"hook":"(위−아래)÷아래. 「아래」로 나누니 아래가 작으면 폭등. 벤젠(1.4~6.7)이 좁아도 위험도 1등인 이유.","why":"","mix":""},{"name":"폭발범위에 영향을 주는 요인","facts":["온도 ↑ → 하한↓ 상한↑(넓어짐)","압력 ↑ → 상한이 크게 오른다(압력과 무관은 오답)","산소 ↑ → 상한↑","압력·산소는 상한만 크게 민다"],"hook":"태우기 좋으면 넓어진다. 단, 압력과 산소는 천장(상한)만 밀어 올리고 바닥(하한)은 거의 그대로.","why":"","mix":"「상한과 하한이 모두 현저히 증가」는 오답"},{"name":"최대폭발압력·폭굉한계","facts":["초기 압력 ↑ → 최대폭발압력 ↑","초기 온도 ↑ → 최대폭발압력 ↓","폭굉한계는 폭발범위 안쪽에 좁게 들어 있다"],"hook":"초기 「압력」은 세기를 키우고 초기 「온도」는 깎는다, 뜨거우면 기체가 묽어져서. 폭굉은 폭발이라는 큰 방 안의 작은 방.","why":"","mix":""}],"n":8,"rounds":6},{"id":"5-18","subject":"화학설비위험방지기술","chapter":"위험물","big":"가스용기·저장","title":"가스용기 색과 구리 금지","topic3d":"gasweld","items":[{"name":"고압가스 용기의 도색","facts":["수소 주황 · 아세틸렌 황색 · 산소 녹색","암모니아 백색 · 염소 갈색","질소·LPG 등 그 밖의 가스 회색"],"hook":"무지개 「주·노·초」 = 수소·아세틸렌·산소, 이어서 「하·갈·회」 = 암모니아·염소·나머지.","why":"","mix":"주황과 황색 자리 바꾸기가 흔한 함정"},{"name":"구리 사용이 금지되는 가스","facts":["아세틸렌 · 암모니아 · 황화수소","아세틸렌은 구리 70% 이상 합금 금지(아세틸라이드)","산소는 구리를 써도 안전"],"hook":"「아·암·황」(아세틸렌·암모니아·황화수소)은 구리와 원수, 만나면 폭발성 아세틸라이드. 산소통은 구리 OK.","why":"","mix":""},{"name":"용기 파열·플래시 증발","facts":["내압력 부족 원인 = 재질·용접 불량·부식·과열","과잉 충전은 압력 증가 쪽(내압력 부족 아님)","플래시 증발량 = 현열 ÷ 잠열","25℃ LPG 10 kg 파열 시 약 4.20 kg 증발"],"hook":"터짐은 「몸이 약해졌거나(내압력 부족)」와 「너무 눌렀거나(과잉 충전)」 두 팀. 과잉 충전은 뒤쪽 팀.","why":"","mix":"음수 온도를 빼는 곳(25 − (−42.2))을 놓치면 값이 크게 어긋난다"},{"name":"고압가스의 분류","facts":["압축가스: 수소·산소·질소","액화가스: LPG·암모니아·염소","용해가스: 아세틸렌"],"hook":"눌러 담으면 압축, 식혀 액체로 담으면 액화, 녹여 담으면 용해. 용해는 아세틸렌 하나.","why":"","mix":""}],"n":7,"rounds":7},{"id":"5-19","subject":"화학설비위험방지기술","chapter":"공정안전","big":"PSM·공정관리","title":"공정안전보고서(PSM)","topic3d":"","items":[{"name":"공정안전보고서의 구성","facts":["공정안전자료 · 공정위험성평가서 · 안전운전계획 · 비상조치계획","배치도·도면·사양은 공정안전자료","「평균안전율」은 포함되지 않는다","비상조치계획에 따른 교육계획은 비상조치계획 쪽"],"hook":"「자·평·운·비」 = 자료, 평가, 운전, 비상. 도면·배치도는 자료 서랍, 「비상조치계획에 따른」 교육은 비상 서랍.","why":"","mix":"안전운전계획에도 「근로자 교육계획」이 있어 헷갈린다"},{"name":"제출과 절차","facts":["착공일 30일 전까지 공단에 2부 제출","유해위험방지계획서(제조업)는 작업 시작 15일 전","심사 결과 통보는 30일 이내","변경 사유 발생 시 지체 없이 보완(14일 승인은 없다)"],"hook":"「PSM 30, 유해위험 15」, 무거운 서류일수록 여유를 길게. 고칠 일 생기면 허락 기다리지 말고 지체 없이.","why":"","mix":""},{"name":"제출 사유(주요 구조부분 변경)","facts":["반응기 추가·교체","플레어스택 설치·변경","전기 정격용량 300 kW 이상 증가","가스누출감지경보기 교체·추가는 해당 없음"],"hook":"뼈대가 바뀌어야 제출: 반응기·플레어스택·삼백(300 kW) 전기. 경보기는 액세서리.","why":"","mix":""}],"n":6,"rounds":2},{"id":"5-20","subject":"화학설비위험방지기술","chapter":"화학설비","big":"설비 기준·안전거리","title":"화학설비 안전거리","topic3d":"chemdist","items":[{"name":"안전거리(별표 8)","facts":["단위공정시설 사이: 바깥면부터 10 m 이상","플레어스택으로부터: 20 m 이상","저장탱크로부터 단위공정·보일러·가열로: 20 m 이상","사무실·연구실 등으로부터: 20 m 이상"],"hook":"「10 하나, 20 셋」. 설비끼리는 10 m, 사람·불꽃(플레어)·탱크가 끼면 두 배 20 m.","why":"","mix":""},{"name":"위험물 주입 시의 정전기","facts":["가솔린 남은 설비에 등유·경유 주입","액면이 주입관 선단을 넘을 때까지 1 m/s 이하"],"hook":"기름 위에 기름 부을 땐 초속 1 m 거북이걸음. 빠르면 정전기 불꽃.","why":"불붙을 증기와 전하를 쌓는 액체가 한자리에 모이기 때문이다.","mix":""},{"name":"기상폭발 대책·경보장치","facts":["예방(전) → 긴급(중) → 방호(후)","방폭벽·안전거리 = 방호대책","조기 파악 = 자동경보장치, 이상 시 차단 = 긴급차단장치","분체화학물질 분리장치에 분쇄기는 없다"],"hook":"「조기에 안다」는 경보, 「막는다」는 차단. 벽과 거리는 맞아도 덜 아프게 하는 방호.","why":"","mix":""}],"n":6,"rounds":5},{"id":"5-21","subject":"화학설비위험방지기술","chapter":"환기·집진","big":"국소배기·집진","title":"송풍기 상사·후드","topic3d":"","items":[{"name":"송풍기의 상사법칙","facts":["풍량 ∝ 회전수¹","풍압 ∝ 회전수²","동력 ∝ 회전수³","300 → 400 m³/min이면 1,300 × 4/3 ≈ 1,733 rpm"],"hook":"「일·이·삼」 = 풍량 1승·풍압 2승·동력 3승. 회전수 두 배면 전기요금은 여덟 배.","why":"","mix":"풍량 계산에 제곱·세제곱을 쓰면 값이 훌쩍 커진다"},{"name":"국소배기장치의 후드","facts":["개구부 면적은 가능한 한 작게","발생원에 가깝게 설치","유해물질 발생원마다 설치"],"hook":"빨대는 가늘고 가까이. 후드 입구는 작게, 발생원엔 바짝.","why":"같은 바람으로 좁은 입구를 빨아야 세게 빨린다.","mix":""}],"n":4,"rounds":4},{"id":"5-22","subject":"화학설비위험방지기술","chapter":"유해화학물질","big":"MSDS·경고표지","title":"MSDS 작성·제외","topic3d":"","items":[{"name":"MSDS 작성·비치 제외 대상","facts":["다른 법으로 관리되는 것: 식품·농약·화장품·의약품·방사성물질","플라스틱 원료는 대상","관세법으로 수입되는 공업용 유기용제도 대상"],"hook":"딴 법이 이미 키우는 애들은 빼준다: 밥(식품)·약(의약품)·화장품·농약·방사능. 플라스틱 원료는 돌봐 줄 법이 없어 MSDS 대상.","why":"","mix":""},{"name":"작성 항목·대표 MSDS 요건","facts":["16개 항목","물리·화학적 특성, 독성 정보, 폭발·화재 대처, 응급조치 포함","「주요 구입·폐기처」는 항목이 아니다","혼합물 대표 작성: 성분 같고 함량 차 10% 이하, 유해성 비슷"],"hook":"16개 항목은 「이게 뭐고·어떻게 다루고·사고 나면 어쩌나」. 쌍둥이 제품은 함량 차 10% 안이면 한 장으로.","why":"","mix":""}],"n":4,"rounds":4},{"id":"5-23","subject":"화학설비위험방지기술","chapter":"화학설비","big":"저장·충전","title":"액화가스 충전량","topic3d":"","items":[{"name":"액화가스의 충전량","facts":["용기 1개 충전량 W = 내용적 V ÷ 가스정수 C","프로판 310 kg, 50 L, C = 2.35 → 용기당 21.3 kg","310 ÷ 21.3 = 14.6 → 올림 15개"],"hook":"통 하나에 담기는 무게는 부피 ÷ 가스정수. 14.6개는 못 쓰니 올림 15, 남는 가스는 통에 안 들어간다.","why":"","mix":"21.3 kg은 중간값이지 답이 아니다"}],"n":2,"rounds":2},{"id":"5-24","subject":"화학설비위험방지기술","chapter":"전기 방폭","big":"분진 방폭","title":"폭발위험장소 구분","topic3d":"","items":[{"name":"가스·분진 폭발위험장소","facts":["가스 0·1·2종, 분진 20·21·22종","정상작동 중 분진운이 존재하면 21종","20종 장소 외 = 21·22종"],"hook":"분진은 가스 번호에 20을 붙인다: 0→20, 1→21, 2→22. 「정상작동 중」은 가운데 1이니 분진이면 21.","why":"","mix":""}],"n":2,"rounds":2},{"id":"5-25","subject":"화학설비위험방지기술","chapter":"화학설비","big":"건조설비","title":"함수율 계산","topic3d":"","items":[{"name":"함수율의 두 기준","facts":["건량 기준 함수율 = 수분 무게 ÷ 건조 고체 무게","10 kg → 6.8 kg이면 3.2 ÷ 6.8 = 0.47","습량 기준은 젖은 전체로 나눈다","건량 기준은 1을 넘을 수도 있다"],"hook":"kg·H₂O/kg 밑의 kg은 마른 몸. 젖은 10이 아니라 마른 6.8로 나눈다. 0.32(10으로 나눈 값)는 함정.","why":"","mix":""}],"n":2,"rounds":2},{"id":"5-26","subject":"화학설비위험방지기술","chapter":"산업용 기계","big":"아세틸렌·용접","title":"아세틸렌 용접장치","topic3d":"gasweld","items":[{"name":"아세틸렌 용접장치","facts":["발생압력 게이지 127 kPa 초과 금지","구리·은·수은 및 합금(구리 70% 이상) 금지","안전기는 취관마다(분기관마다 설치 시 예외)","주관에만 하나 설치는 오답"],"hook":"「일이칠(127)」 넘기면 아세틸렌은 혼자 터진다. 안전기는 불꽃 나는 취관마다 하나씩, 주관에 하나로 퉁 치기 금지.","why":"역화는 불꽃이 있는 취관 쪽에서 일어난다.","mix":""}],"n":2,"rounds":2},{"id":"5-27","subject":"화학설비위험방지기술","chapter":"밀폐공간","big":"밀폐공간","title":"밀폐공간 작업 조치","topic3d":"confined","items":[{"name":"밀폐공간 작업의 조치","facts":["적정공기: 산소 18~23.5%","방폭형 전등 사용(비방폭 전등은 오답)","환기·감시인 배치"],"hook":"밀폐공간은 가스가 고인 병 속. 불꽃 튀는 일반 전등은 성냥과 같다. 산소는 「십팔~이십삼점오」.","why":"","mix":""}],"n":1,"rounds":1},{"id":"5-28","subject":"화학설비위험방지기술","chapter":"유해화학물질","big":"반응 위험","title":"발열·흡열 반응","topic3d":"","items":[{"name":"발열반응과 흡열반응","facts":["질소 + 산소 반응은 흡열(발열 동반 없음)","번개·엔진 고온에서만 NO가 생긴다"],"hook":"공기 속 N₂와 O₂가 평소에 안 싸우는 건 흡열이라서. 번개 칠 때만 억지로 결혼(NO).","why":"","mix":""}],"n":1,"rounds":1},{"id":"5-29","subject":"화학설비위험방지기술","chapter":"전기 방폭","big":"방폭구조","title":"방폭구조 기호","topic3d":"","items":[{"name":"방폭구조의 기호","facts":["충전 방폭구조 q(모래 등을 채움)","비점화 n","내압 d · 압력 p · 안전증 e · 본질안전 i · 유입 o"],"hook":"q는 quartz(석영 모래)를 채워 넣는 충전, n은 no spark 비점화. 「충전 : n」은 오답.","why":"","mix":""}],"n":1,"rounds":1},{"id":"6-01","subject":"건설안전기술","chapter":"건설공사 안전개요","big":"지반·토질","title":"지반과 흙, 굴착 기울기","topic3d":"","items":[{"name":"굴착면의 기울기 기준","facts":["모래 1 : 1.8","연암·풍화암 1 : 1.0","경암 1 : 0.5","그 밖의 흙 1 : 1.2","앞의 1이 연직 높이, 뒤가 수평 길이"],"hook":"흘러내리는 모래는 가장 눕히고(1.8), 바위 같은 경암은 절벽처럼 세운다(0.5). 「모일팔·흙일이·연일영·경영오」를 랩처럼 한 번에 뱉는다.","why":"단단한 지반일수록 가파르게 파도 무너지지 않는다.","mix":"옛 기준 풍화암 1 : 0.8·연암 1 : 0.5는 개정 전 값이고, 현행은 둘 다 1 : 1.0으로 합쳐졌다."},{"name":"히빙(heaving) 현상과 대책","facts":["연약 점토지반에서 배면 흙 무게가 굴착 바닥을 밀어 올리는 현상","대책: 흙막이 근입깊이를 깊게","대책: 배면 상재하중 제거, 소단 굴착, 지반개량","부풀어 오른 바닥 흙 제거·주변 수위 높이기는 대책이 아니다"],"hook":"히빙은 점토가 「히~잉」 하고 바닥에서 솟는 것이다. 부푼 바닥을 걷어 내면 냄비 뚜껑을 연 것처럼 더 솟으니, 뚜껑(흙)은 그대로 두고 옆의 무게를 던다.","why":"바깥 흙의 무게가 안쪽 바닥을 밀어 올리므로, 미는 쪽은 덜고 솟는 쪽은 눌러야 한다.","mix":"모래에 물이 솟으면 보일링, 점토가 무게에 눌려 솟으면 히빙이다."},{"name":"콘크리트 타설작업","facts":["한쪽에 치우쳐 붓지 않는다","감시자를 배치하고 이상이 있으면 작업을 중지한다","타설 전 거푸집동바리의 변형·변위·침하를 점검한다","진동기를 지나치게 쓰지 않는다"],"hook":"굳지 않은 콘크리트는 무거운 죽이다. 한쪽에 몰아 부으면 그쪽 다리(동바리)가 먼저 주저앉는다. 이상이 보이면 「일단 멈춤」, 「계속하면서 보강」은 오답이다.","why":"","mix":""},{"name":"차량계 건설기계의 전도 방지·제한속도","facts":["전도 방지 조치: 유도자 배치·지반 침하 방지·갓길 붕괴 방지·도로 폭 유지","작업반경 유지는 조치 항목이 아니다","최대 제한속도 10 km/h 이하인 기계는 제한속도를 따로 정하지 않아도 된다"],"hook":"「유·침·갓·폭」(유도자, 침하, 갓길, 폭)은 전부 기계가 딛고 선 땅 이야기다. 시속 10 km는 사람이 뛰는 속도라 봐준다.","why":"","mix":""},{"name":"다짐롤러의 종류","facts":["탬핑롤러: 철륜에 돌기, 고함수비 점성토·깊은 다짐","타이어롤러: 고무 타이어, 사질토·노반","머캐덤롤러: 삼륜, 탠덤롤러: 앞뒤 매끈한 두 바퀴, 포장면 마무리","진동롤러: 떨며 누른다, 사질토"],"hook":"탬핑은 「탬탬」 발끝으로 콕콕 찍기다. 돌기 달린 롤러가 진흙에 구멍을 내며 물을 짜낸다. 매끈한 탠덤은 아스팔트 다림질용이다.","why":"","mix":"돌기가 있으면 탬핑, 고무면 타이어, 매끈하면 로드롤러(머캐덤·탠덤)다."},{"name":"표준관입시험(SPT)","facts":["30 cm 관입에 필요한 타격횟수가 N값","N 0~4 몹시 느슨, 4~10 느슨, 10~30 보통, 30~50 조밀, 50 이상 대단히 조밀","50/3은 50회 타격에 3 cm 관입, 앞이 타격횟수"],"hook":"50/3은 「50번 때렸는데 3 cm밖에 안 들어갔다」는 뜻이다. 분자가 매질 횟수, 분모가 들어간 깊이. 많이 때려도 조금 들어가면 땅이 단단하다.","why":"","mix":"앞이 굴진 깊이라고 뒤집어 놓은 보기가 함정이다."},{"name":"동상·흙의 성질·성토재료","facts":["동상: 토중수가 얼어 부피 약 9% 늘어 지표면이 솟는 현상","연화: 봄에 녹으며 물러지는 현상","흙은 비선형·비균질·비등방성","성토재료는 함수율이 낮아야 한다"],"hook":"흙도 겨울엔 「동상」에 걸려 9% 붓고, 봄엔 「연화」로 흐물거린다. 겨울과 봄이 한 세트다. 흙은 자리마다·방향마다·시간마다 다른 변덕쟁이다.","why":"","mix":""},{"name":"지반조사 간격·깊이","facts":["절토·개착·터널 구간은 기반암 심도 2~3 m까지 확인","5~6 m가 아니다"],"hook":"바위(기반암)를 만나면 「두세 걸음(2~3 m)」만 더 파 본다. 다섯 걸음은 과하다.","why":"","mix":""}],"n":54,"rounds":21},{"id":"6-02","subject":"건설안전기술","chapter":"건설재해 대책","big":"추락","title":"추락 막기: 난간·발판·사다리","topic3d":"rail","items":[{"name":"안전난간의 구조","facts":["상부난간대 90 cm 이상 120 cm 이하","120 cm 초과 시 중간난간대 2단 이상, 난간대 사이 60 cm 이하","발끝막이판 10 cm 이상","구성: 상부난간대·중간난간대·발끝막이판·난간기둥"],"hook":"구십(90)은 「구해줘」 높이, 백이십(120)을 넘으면 「이(2)단」으로. 발끝막이판 10 cm는 신발 한 켤레 높이다.","why":"","mix":"발끝막이판은 20 cm가 아니라 10 cm이고, 케틀·호퍼·피트의 울타리 90 cm도 난간 아래 한계와 같은 값이다."},{"name":"작업발판의 구조","facts":["높이 2 m 이상 비계의 발판 폭 40 cm 이상","발판재료 사이 틈 3 cm 이하","둘 이상의 지지물에 연결·고정","달비계 작업발판도 폭 40 cm 이상, 틈이 없어야 한다"],"hook":"발판은 「사십(40) 세 살(3)」이다. 폭 40 cm, 틈 3 cm. 지지물이 하나면 시소처럼 뒤집히니 둘 이상에 묶는다.","why":"","mix":"사다리식 통로 폭은 30 cm, 작업발판 폭은 40 cm다."},{"name":"사다리식 통로의 구조","facts":["기울기 75° 이하, 고정식은 90° 이하","폭 30 cm 이상, 발판과 벽 사이 15 cm 이상","상단은 60 cm 이상 돌출","길이 10 m 이상이면 5 m 이내마다 계단참","고정식 높이 7 m 이상이면 등받이울 등 조치"],"hook":"기대 세운 사다리는 「칠십오(75)」, 벽에 딱 붙인 고정식만 「구십(90)」. 「30·15·60」은 폭·발틈·머리 위 손잡이다. 10 m 오르면 5 m마다 숨 고르기.","why":"","mix":"계단참은 3 m가 아니라 5 m 이내마다다."},{"name":"이동식 비계","facts":["작업발판 최대적재하중 250 kg","바퀴 구름방지장치·아웃트리거 설치","최상부 작업 시 안전난간 설치","발판 위에서 사다리·받침대 사용 금지, 사람 태운 채 이동 금지"],"hook":"바퀴 달린 비계는 「이백오십(250)」, 어른 넷 몸무게쯤이다. 발판 위에 사다리를 또 올리면 비계 위 서커스라 금지다.","why":"","mix":"이동식 비계 250 kg, 강관비계 기둥 간 400 kg이다."},{"name":"선박승강설비(현문사다리)","facts":["300톤급 이상 선박에 현문사다리 설치","너비 55 cm 이상","방책 높이 82 cm 이상","근로자 통행 전용, 아래에 안전망"],"hook":"「삼백 톤 배엔 오오(55) 팔이(82)」다. 300톤 넘는 배, 55 cm 폭, 82 cm 난간. 짐 나르는 발판으로 쓰면 안 된다.","why":"","mix":"200톤급이 아니라 300톤급이다."},{"name":"작업발판 일체형 거푸집","facts":["갱폼·슬립폼(슬라이딩폼)·클라이밍폼·터널 라이닝폼","유로폼은 발판이 없는 일반 거푸집이라 해당 없음"],"hook":"「갱·슬·클·터」(갱폼, 슬립폼, 클라이밍폼, 터널폼)는 사람이 설 자리가 붙어 있는 거푸집이다. 유로폼은 낱장 합판이라 설 데가 없다.","why":"","mix":""},{"name":"2 m 경계선·기타 추락 방지","facts":["화물자동차 짐 윗면까지 2 m 이상이면 승강설비","추락 방지 순서: 작업발판 → 안전난간 → 추락방호망 → 안전대","개구부는 막거나 덮는다, 발판 설치는 방호가 아니다","터널 낙반 방지: 지보공·록볼트·부석 제거"],"hook":"2 m는 추락의 국경선이다. 난간·발판·방호망·승강설비가 전부 2 m에서 시작한다. 낙반은 「받치거나(지보공) 꿰매거나(록볼트) 떼어낸다(부석)」.","why":"","mix":""}],"n":45,"rounds":23},{"id":"6-03","subject":"건설안전기술","chapter":"가시설물","big":"비계","title":"비계 숫자 총집합","topic3d":"ramp","items":[{"name":"강관비계의 구조","facts":["비계기둥 간격 띠장방향 1.85 m 이하, 장선방향 1.5 m 이하","띠장 간격 2 m 이하","최상부에서 31 m 아래 기둥은 강관 2개로 묶는다","기둥 간 적재하중 400 kg 초과 금지"],"hook":"「일팔오·일오·이·삼십일·사백」이다. 31 m 아래로는 기둥이 둘씩 어깨동무하고, 기둥 사이엔 400 kg까지만 얹는다.","why":"아래로 갈수록 하중이 쌓이므로 31 m 밑은 기둥을 두 개로 묶는다.","mix":"옛 기준 띠장 1.5 m·기둥 1.8 m는 개정 전 값이고, 현행은 띠장 2 m·기둥 1.85 m다. 31 m 밑은 3개가 아니라 2개다."},{"name":"벽이음 조립간격","facts":["단관비계 수직 5 m 이하, 수평 5 m 이하","틀비계 수직 6 m, 수평 8 m"],"hook":"단관은 「오오(5·5)」로 단순하고, 틀비계는 틀이 튼튼해 「육팔(6·8)」로 더 벌려도 된다.","why":"","mix":""},{"name":"강관틀비계","facts":["높이 20 m 초과·중량물 작업 시 주틀 간격 1.8 m 이하, 주틀 높이 2 m 이하","띠장방향 4 m 이하이고 높이 10 m 초과면 10 m 이내마다 버팀기둥","벽이음 수직 6 m·수평 8 m"],"hook":"20 m를 넘으면 주틀을 「일점팔」로 바짝 붙인다. 「4 m 좁고 10 m 높으면 10 m마다 버팀기둥」, 4·10·10 세 숫자다.","why":"조건이 가혹할수록 간격을 좁힌다.","mix":"주틀 간격 2.4 m는 틀린 값이다."},{"name":"달비계 와이어로프 사용 금지","facts":["이음매가 있는 것","한 꼬임에서 끊어진 소선 수가 10% 이상","지름 감소가 공칭지름의 7% 초과","꼬인 것, 심하게 변형·부식된 것, 열·전기충격 손상"],"hook":"「이음·십·칠·꼬임」이다. 이음매 있고, 소선 10% 끊기고, 지름 7% 줄고, 꼬였으면 버린다. 7%는 「칠(7)면 안 되는 로프」.","why":"","mix":"지름 감소는 5%가 아니라 7% 초과다."},{"name":"달비계의 안전계수","facts":["달기 와이어로프·달기 강선 10 이상","달기 체인·달기 훅 5 이상","달기 강대와 지점: 강재 2.5 이상, 목재 5 이상"],"hook":"「줄은 열(10), 사슬·훅·나무는 다섯(5), 강재만 이점오(2.5)」. 사람을 매단 줄이 제일 겁이 많아 10배다.","why":"사람이 매달리는 부재일수록 크게, 고른 성질의 강재는 작게 잡는다.","mix":"강재는 3이 아니라 2.5다."},{"name":"말비계","facts":["지주부재와 수평면의 기울기 75° 이하","높이 2 m 초과 시 작업발판 폭 40 cm 이상","지주부재 사이에 보조부재, 밑에 미끄럼 방지장치"],"hook":"말비계는 말(馬)처럼 다리를 벌린 비계다. 「칠십오(75)도 다리, 사십(40) 등판」, 사다리와 같은 75°에 발판과 같은 40 cm다.","why":"","mix":"30 cm는 사다리식 통로 폭이고 말비계 발판은 40 cm다."},{"name":"시스템 비계","facts":["수직재와 받침철물 겹침길이는 받침철물 전체길이의 1/3 이상","벽 연결재 간격은 제조사가 정한 기준","수직재와 수평재는 직각으로 흔들리지 않게"],"hook":"받침철물에 「삼분의 일」은 꽂아야 안 빠진다. 「시공자 임의대로」는 시험에서 거의 늘 오답이다.","why":"","mix":""},{"name":"통나무 비계·가설통로","facts":["통나무 비계는 4층 이하 또는 12 m 이하 건축물에만","가설통로 경사 30° 이하, 15° 초과 시 미끄럼 방지","달비계 작업대는 4개 모서리에 로프, 섬유로프는 2개 이상 고정점에 결속"],"hook":"통나무는 「사층 십이 미터」, 한 층 3 m씩 네 층까지다. 그 위는 강관으로 올린다.","why":"","mix":""}],"n":34,"rounds":20},{"id":"6-04","subject":"건설안전기술","chapter":"건설공사 안전개요","big":"지하수·배수","title":"물과 흙의 파괴 현상","topic3d":"trench","items":[{"name":"보일링과 히빙 가르기","facts":["보일링: 사질토, 수두차로 물이 솟으며 모래가 액상화(분사현상)","히빙: 연약 점토, 배면 흙 무게로 굴착 바닥 융기","파이핑: 보일링이 이어져 물길이 뚫림","보일링 대책: 지하수위 저하·근입장 깊게·지반개량"],"hook":"보일링은 「끓는다(boil)」, 모래바닥이 물과 함께 부글부글. 히빙은 점토가 「히~잉」 통째로 솟기. 「모래+물=보일, 점토+무게=히빙」.","why":"","mix":"점토지반 굴착면 융기를 보일링이라 적은 보기는 히빙 설명을 끼워 넣은 함정이다."},{"name":"비탈면 붕괴 방지·토석붕괴 원인","facts":["상부 하중 제거, 하단 다짐, 배수","비탈면 상부에 토사 적재는 금지","내적 원인: 토석의 강도 저하·함수비 증가·성층·절리","외적 원인: 기울기·하중 증가, 진동, 굴착"],"hook":"산사태 공식은 「위는 가볍게, 아래는 단단하게」다. 위에 흙을 얹는 것은 스스로 방아쇠를 당기는 일이다.","why":"","mix":"「강도 상승」은 붕괴 원인이 아니고, 「강도 저하」가 내적 원인이다."},{"name":"잠함·우물통 내부 굴착","facts":["천장 높이 1.8 m 이상","굴착 깊이 20 m 초과 시 외부 통신설비·승강설비·송기설비","산소 18% 미만이면 작업 중지·환기"],"hook":"우물 속 방 천장은 「일점팔」, 키 큰 어른이 허리 펴는 높이다. 20 m 넘으면 전화기·엘리베이터·공기호스 세트를 넣는다.","why":"","mix":"통신설비 기준은 10 m가 아니라 20 m 초과다."},{"name":"지하수위 저하공법·옹벽 배수","facts":["배수공법: 웰포인트·딥웰(물을 뽑는다)","차수공법: 동결·차수벽(물을 막는다)","옹벽은 침투수가 저항력을 깎으므로 배수구멍·배수재 필수"],"hook":"웰(well)은 우물이니 물을 「뽑는」 쪽, 동결·차수벽은 「막는」 쪽이다. 옹벽엔 반드시 눈물구멍(weep hole)을 뚫는다.","why":"","mix":""},{"name":"계측기·투수계수","facts":["하중계는 버팀대 축력 측정, 상부 적재하중이 아니다","공극비가 클수록 투수계수는 크다"],"hook":"하중계는 버팀대가 얼마나 힘쓰는지 재는 저울이다. 빈틈(공극)이 많으면 물이 술술, 투수계수가 크다.","why":"","mix":""}],"n":34,"rounds":20},{"id":"6-05","subject":"건설안전기술","chapter":"건설공사 안전개요","big":"계획·관리비","title":"관리비와 계획서 숫자","topic3d":"","items":[{"name":"관리비 사용기준(공정율)","facts":["공정율 50% 이상 70% 미만 → 50% 이상 사용","70% 이상 90% 미만 → 70% 이상","90% 이상 → 90% 이상","사용내역은 매월 작성, 공사 종료 후 1년 보존","6개월 이내마다 확인"],"hook":"공정율 앞자리가 곧 써야 할 비율이다. 50이면 50, 70이면 70, 90이면 90. 「매월 쓰고 1년 남긴다」.","why":"","mix":"공정율 65%는 50 구간이라 50% 이상이다."},{"name":"관리비 계상 구조","facts":["5억 미만: 대상액 × 비율","5억 이상 50억 미만: 대상액 × 비율 + 기초액","50억 이상: 대상액 × 비율","대상액 구분이 없으면 총공사금액의 70%를 대상액으로","발주자 지급재료 포함 시 1.2배 한도"],"hook":"기초액은 「5억에서 50억 사이」에서만 붙는 보너스다. 대상액을 모르면 「70%」로 뭉뚱그린다.","why":"","mix":""},{"name":"관리비로 쓸 수 있는 것·없는 것","facts":["가능: 안전관리자 인건비, 안전시설비(추락방호망·안전난간), 보호구, 진단비, 교육비, 건강관리비, 기술지도비","불가: 외부비계·작업발판·안전통로 등 가설구조물 설치비","불가: 교통정리·신호수 인건비"],"hook":"「그 일 하려면 어차피 드는 돈」은 안 되고 「안전 때문에 더 드는 돈」만 된다. 비계는 공사비, 방호망은 안전비다.","why":"","mix":""},{"name":"유해위험방지계획서 제출 대상","facts":["지상높이 31 m 이상 건축물·인공구조물","연면적 3만 ㎡ 이상 건축물","문화·집회·판매·종합병원·냉동창고 등 연면적 5천 ㎡ 이상","최대 지간 50 m 이상 교량, 터널, 저수용량 2천만 t 이상 댐","깊이 10 m 이상 굴착공사"],"hook":"「삼십일·삼만·오천·오십·이천만·십」 여섯 숫자다. 31 m는 열 층짜리 건물 높이, 딱 그 높이부터 서류를 낸다.","why":"","mix":"교량 40 m·굴착 5 m나 8 m는 한 칸 모자라 대상이 아니다. 「이상」이라 딱 맞으면 대상이다."},{"name":"제출 시기·첨부서류·확인","facts":["건설공사는 착공 전날까지, 제조업은 작업 시작 15일 전까지 공단에 제출","첨부: 공사개요서·주변현황 도면·전체공정표·기계설비 배치도·관리비 사용계획서·안전관리조직표","작업인부 배치도면은 첨부서류가 아니다","확인 항목: 계획 부합 여부·변경 적정성·추가 위험요인, 6개월마다"],"hook":"건설은 「전날」, 제조는 「보름 전」. 설계 변경이 잦은 건설을 늦게까지 봐준다. 첨부서류는 「무엇을·어디에·언제·얼마로」이고, 사람을 어디 세울지는 매일 바뀌어 안 넣는다.","why":"","mix":""}],"n":31,"rounds":22},{"id":"6-06","subject":"건설안전기술","chapter":"건설공사 안전개요","big":"사면·붕괴","title":"사면과 사다리 기울기","topic3d":"ladder","items":[{"name":"사다리식 통로의 기울기","facts":["일반 사다리식 통로 75° 이하","고정식 사다리식 통로 90° 이하","고정식 높이 7 m 이상이면 등받이울 등 조치"],"hook":"75°는 시계 「7시 5분」 바늘 기울기, 90°는 벽에 딱 붙인 소방 사다리다. 7 m 넘게 곧추서면 등받이울로 등을 받쳐 준다.","why":"벽에 붙여 세우는 고정식은 수직에 가까워도 안전하다.","mix":"말비계 지주부재 기울기도 75° 이하로 같은 값이다."},{"name":"사면보호공법","facts":["식생공: 떼붙임·씨앗뿜기·식생구멍, 뿌리로 표층토 고정","구조물 보호공: 블록공·돌쌓기·격자블록·뿜어붙이기(숏크리트)·콘크리트 붙임","쉴드공은 터널 굴착공법이라 해당 없음"],"hook":"식생공은 사면에 「풀 이불」을 덮는 것, 구조물공은 「콘크리트 갑옷」을 입히는 것이다. 쉴드는 두더지 터널 기계라 사면과 무관하다.","why":"","mix":"식생구멍공은 식생공이지 구조물 보호공이 아니다."},{"name":"토석붕괴의 내적·외적 원인","facts":["외적: 사면 기울기 증가, 절토·성토 높이 증가, 상재하중 증가, 진동, 지표수·지하수 침투","내적: 절토 사면의 토질·성층·절리, 토석의 강도 저하"],"hook":"「밖에서 건드렸나(외적) vs 흙 속이 바뀌었나(내적)」. 강도 「저하」는 흙 자체 일이라 내적이고, 「상승」은 붕괴 원인일 리 없다.","why":"","mix":""},{"name":"화물 적재 시 준수사항","facts":["하중이 한쪽으로 치우치지 않게","낙하 방지 로프·시트 사용","운전자 시야를 가리지 않게","화물 무너짐 방지"],"hook":"「치우쳐서 효율적으로」는 말 자체가 모순이다. 트럭은 짐을 편애하면 넘어진다.","why":"","mix":""},{"name":"굴착면 기울기 읽는 법","facts":["1 : 0.5에서 앞의 1이 연직 높이, 뒤가 수평 길이","뒤 숫자가 작을수록 가파르다"],"hook":"「1 : 뒤」에서 1은 높이, 뒤는 밑변이다. 뒤가 작을수록 절벽. 뒤집어 읽으면 10 m가 튀어나오는 함정에 걸린다.","why":"","mix":""},{"name":"구축물 안전성 평가·설계변경 요청","facts":["안전진단 대상: 지진·화재 등 손상, 침하·균열·비틀림, 장기 방치, 용도 변경","과도한 안전측 설계는 대상이 아니다","설계변경 요청 가설구조물: 비계 31 m 이상, 거푸집동바리 6 m 이상(작업발판 일체형 거푸집 포함)","흙막이 지보공 2 m 이상(터널 지보공 포함), 동력을 이용해 움직이는 가설구조물","10 m 이상 외부작업용 작업발판·안전시설물 일체형 가설구조물"],"hook":"설계변경 네 숫자 「31·6·2·10」. 31은 비계, 6은 동바리, 2는 흙막이, 10은 외벽에 매단 일체형 발판이다. 동력으로 움직이는 놈은 높이를 안 따지고 무조건 들어간다.","why":"","mix":"31 m는 유해위험방지계획서의 31 m와 같은 값이라 짝지어 둔다. 「너무 튼튼하게 지어서」 진단하는 일은 없다."}],"n":27,"rounds":17},{"id":"6-07","subject":"건설안전기술","chapter":"양중·해체","big":"양중작업","title":"타워크레인과 바람","topic3d":"wirerope","items":[{"name":"타워크레인 와이어로프 지지","facts":["설치각도는 수평면에서 60° 이내","지지점 4개소 이상, 같은 각도","클립·샤클 등 기구로 고정","충분한 강도와 장력"],"hook":"「육십(60)도 사(4)방」, 텐트 치듯 네 줄을 60° 이내로 눕혀 당긴다. 줄을 세우면 옆바람에 못 버틴다.","why":"각도가 클수록 옆으로 잡아 주는 힘이 줄어든다.","mix":"「60° 이상」이 아니라 「60° 이내」이고, 클립·샤클로 「고정하지 않는다」가 틀린 문장이다."},{"name":"강풍 시 중지·조치 기준","facts":["순간풍속 10 m/s 초과: 타워크레인 설치·수리·해체 중지","15 m/s 초과: 타워크레인 운전 중지","30 m/s 초과: 주행크레인 이탈방지장치 작동","35 m/s 초과: 옥외 승강기·리프트 붕괴 방지 조치"],"hook":"「십·십오·삼십·삼십오」다. 설치 10, 운전 15, 이탈방지 30, 리프트 35. 위험한 일일수록 약한 바람에 먼저 멈춘다.","why":"조립·해체가 운전보다 위험하므로 더 낮은 풍속에서 멈춘다.","mix":"철골작업 중지는 10분 평균 10 m/s 이상, 타워크레인은 순간풍속 기준이다."},{"name":"양중기의 종류","facts":["크레인(호이스트 포함)","이동식 크레인","리프트(이삿짐운반용은 적재하중 0.1톤 이상)","곤돌라, 승강기","지게차·고소작업차는 양중기가 아니다"],"hook":"「크·이·리·곤·승」(크레인, 이동식 크레인, 리프트, 곤돌라, 승강기) 다섯이다. 지게차는 「양중」이 아니라 「하역」 식구다.","why":"","mix":"고소작업차는 차량계 건설기계, 지게차는 차량계 하역운반기계다."},{"name":"타워크레인 안전장치","facts":["권과방지장치, 과부하방지장치","브레이크(제동)장치, 비상정지장치","트롤리 제한장치·선회제한장치","호이스트 스위치는 조작 스위치라 안전장치가 아니다"],"hook":"안전장치는 전부 「막는 놈」이다. 권과는 과다감기를, 과부하는 무거운 짐을, 브레이크는 떨어짐을 막는다. 스위치는 그냥 켜는 놈이다.","why":"","mix":""},{"name":"크레인 사용·인양 각도·달줄","facts":["끌어당기거나 밀어내는 작업 금지","인양 와이어로프 매달기 각도는 양변 60° 기준","거푸집 해체 시 달줄·달포대를 사용한다"],"hook":"크레인은 「곧게 위로만」 든다. 옆으로 끌면 로프가 활시위처럼 튄다. 달줄·달포대는 「던지지 말고 매달아 내리라」는 도구라 쓰지 말라는 조문은 없다.","why":"","mix":""}],"n":25,"rounds":21},{"id":"6-08","subject":"건설안전기술","chapter":"구조물공사","big":"말뚝·기초","title":"항타기·동바리·진동치","topic3d":"shore","items":[{"name":"항타기·항발기 무너짐 방지","facts":["버팀대만으로 안정시킬 때 3개 이상","버팀줄만으로 안정시킬 때 3개 이상, 같은 간격","연약지반은 깔판·깔목, 시설물 위는 내력 확인·보강"],"hook":"카메라 삼각대처럼 「셋」이라야 안 넘어진다. 둘이면 한 방향으로 벌렁 넘어간다. 버팀대도 버팀줄도 3.","why":"","mix":"하나만 2개로 낮춰 놓은 보기가 함정이다."},{"name":"파이프서포트 동바리","facts":["3개 이상 이어서 사용 금지","이을 때 볼트·전용철물 4개 이상","높이 3.5 m 초과 시 2 m 이내마다 수평연결재 2방향","깔판·받침목 2단 이상 끼우기 금지, 맞댄이음·장부이음은 피한다","조립강주는 4 m 초과 시 4 m 이내마다"],"hook":"「삼 금지, 사 조임, 삼점오 넘으면 이 마다」다. 3개 잇지 말고, 볼트 4개, 3.5 m 넘으면 2 m마다 허리띠(수평연결재)를 두른다.","why":"이을수록 좌굴에 약해진다.","mix":"4.5 m가 아니라 3.5 m다."},{"name":"발파허용 진동치","facts":["문화재 0.2 cm/s","주택·아파트 0.5 cm/s","상가 1.0 cm/s","철골콘크리트 빌딩·상가 1.0~4.0 cm/s"],"hook":"튼튼할수록 잘 참는다. 문화재(할머니) 0.2 → 집 0.5 → 상가 1.0 → 철골빌딩 4.0. 맨 끝이 도로 작아지면 틀린 보기다.","why":"단단한 건물일수록 진동 허용치가 크다.","mix":""},{"name":"지반개량공법","facts":["점성토: 샌드드레인·페이퍼드레인·팩드레인·프리로딩·생석회말뚝·치환","사질토: 바이브로 플로테이션·다짐말뚝·폭파다짐·전기충격","공통: 약액주입·동결"],"hook":"점토는 「빨대(drain) 꽂아 물 빼기」, 모래는 「흔들어(vibro) 다지기」다. 바이브로가 점토 문제에 나오면 오답이다.","why":"","mix":""},{"name":"흙막이 지보공 부재·터파기 공법","facts":["부재: 흙막이판·말뚝·띠장·버팀대","턴버클은 부재가 아니다","오픈컷·아일랜드컷·트렌치컷은 터파기 방식, 시트파일은 흙막이 공법"],"hook":"「판·말·띠·버」(판, 말뚝, 띠장, 버팀대) 네 식구다. 턴버클은 나사 조이개라 흙막이 식구가 아니다. 「컷」이 붙으면 파는 방식이다.","why":"","mix":""},{"name":"관리비 비율·기초액(출제 당시)","facts":["일반건설공사(갑) 5억 이상 50억 미만: 비율 1.86%, 기초액 5,349,000원","공사종류 구분은 이후 개정되어 최신 표 확인 필요"],"hook":"「일점팔육에 오백삼십사만구천」이다. 기초액은 5억~50억 구간에서만 붙는 값이니 그 구간 숫자로 묶어 둔다.","why":"","mix":""},{"name":"PC말뚝의 절단·철골건립 준비","facts":["PC말뚝은 강선을 미리 당겨 넣어 자르면 프리스트레스가 풀린다","철골건립 준비 시 지장 있는 수목은 제거한다"],"hook":"PC말뚝은 팽팽히 당긴 고무줄을 속에 넣은 말뚝이라, 자르면 「탁」 하고 풀린다. 건립에 걸리는 나무는 베어야지 「절대 제거 금지」는 오답이다.","why":"","mix":""}],"n":24,"rounds":17},{"id":"6-09","subject":"건설안전기술","chapter":"양중·해체","big":"해체공사","title":"해체 순서와 발파","topic3d":"scaffold","items":[{"name":"해체작업 순서와 공법","facts":["순서: 슬래브 → 보 → 벽체 → 기둥","공법: 압쇄·잭·절단·전도·대형 브레이커·화약발파·팽창압","진공공법이라는 해체공법은 없다","거푸집 해체는 수평부재를 연직부재보다 늦게 뗀다"],"hook":"짓는 순서를 거꾸로 헐면 「슬·보·벽·기」다. 위에 얹힌 것부터 내려놓는다. 「진공」으로는 아무것도 못 부순다.","why":"받치고 있는 부재를 먼저 빼면 위가 무너진다.","mix":""},{"name":"터널 전기발파","facts":["발파모선은 절연 전선 30 m 이상","도통시험은 장전 장소에서 30 m 이상 떨어져서","점화회선은 동력선·조명회선과 완전히 분리","발파 후 모선을 발파기에서 즉시 분리하고 끝을 절연","불발 시 발파기와 모선을 분리하고 5분 이상 대기"],"hook":"「삼십·삼십·오」다. 모선 30 m, 도통시험 30 m 밖, 불발이면 5분 기다림. 전깃줄과 한 묶음으로 두면 유도전류로 「펑」 한다.","why":"","mix":"모선 20 m는 틀린 값이다."},{"name":"비계 조립·해체 작업","facts":["달비계·높이 5 m 이상 비계 조립·해체 시 관리감독자 지휘","조립·해체 작업발판 폭 20 cm 이상","벽이음·가새는 좌굴 방지","추락방호망 처짐은 짧은 변의 12% 이상"],"hook":"5 m 넘는 비계를 손볼 땐 「폭 20 cm 발판」, 발 한 짝 너비다. 기둥끼리 묶는 이유는 「좌굴(휘청)」을 막기 위해서다.","why":"","mix":""},{"name":"해체용 장비·핸드 브레이커","facts":["핸드 브레이커는 작업시간을 제한한다(진동 → 백랍병)","램머·진동롤러는 다짐기계, 스크레이퍼는 깎아 나르는 기계","폭파해체는 빠르지만 순간 진동·분진이 커 주위 영향이 크다"],"hook":"손에 쥐는 브레이커만 「시간제」다. 손이 떨려 하얗게 되는 백랍병 때문이다. 램머는 「눌러 다지는」 놈이지 부수는 놈이 아니다.","why":"","mix":""},{"name":"유해위험방지계획서 대상(해체 포함)","facts":["지상높이 31 m 이상 건축물의 건설·개조·해체","깊이 10 m 이상 굴착","최대 지간 50 m 이상 교량"],"hook":"「삼십일·오십·십」이다. 헐 때도 지을 때와 같은 31 m부터 서류를 낸다. 8 m 굴착은 한 칸 모자란다.","why":"","mix":""}],"n":23,"rounds":20},{"id":"6-10","subject":"건설안전기술","chapter":"가시설물","big":"추락방호망·방망사","title":"방망사 강도 여섯 숫자","topic3d":"fall","items":[{"name":"방망사의 인장강도","facts":["그물코 10 cm 매듭 없는 방망: 신품 240 kg, 폐기 150 kg","그물코 10 cm 매듭 방망: 신품 200 kg, 폐기 135 kg","그물코 5 cm 매듭 방망: 신품 110 kg, 폐기 60 kg","정기시험: 사용 개시 후 1년 이내, 그 뒤 6개월마다"],"hook":"신품은 「이사(240)·이백(200)·백십(110)」, 폐기는 「백오십·백삼십오·육십」이다. 매듭은 약점이라 200이 240보다 작고, 5 cm 잔그물은 가늘어 110이다.","why":"매듭 자리가 약점이라 같은 그물코에서 매듭방망이 낮고, 폐기 기준은 신품의 60~70% 언저리다.","mix":"5 cm 그물코는 매듭방망에만 있다."},{"name":"추락방호망 설치","facts":["작업면에서 망까지 수직거리 10 m 이하","망의 내밀기 3 m 이상","처짐은 짧은 변 길이의 12% 이상","수평으로 설치"],"hook":"「십·삼·십이」다. 10 m 아래에, 3 m 내밀고, 12% 늘어지게. 해먹처럼 축 처져야 사람을 받는다.","why":"","mix":"낙하물방지망은 「10 m 이내마다·2 m 이상·20~30°」라 숫자를 갈라 둔다."},{"name":"안전율·허용응력","facts":["안전율 = 파괴응력(인장강도) ÷ 허용응력","허용응력 = 인장강도 ÷ 안전계수 (2,000 MPa ÷ 4 = 500 MPa)","절단하중 200 t, 안전계수 5이면 최대하중 40 t"],"hook":"안전율은 「나누기」다. 2,000을 4로 나눠 500. 2,000을 그대로 고르면 안전율을 잊은 것이다.","why":"","mix":"「~율」과 「~비」는 나눈 값이고 「~하중」은 그 자체 크기다."},{"name":"철골 공작도·고소작업 감소","facts":["공작도에 넣을 것: 외부비계 받침·기둥승강용 트랩·구명줄 고리·건립 시 걸림 고리 등","고압전주는 부재가 아니라 건립 전 검토사항","고소작업을 줄이는 대책: 철골 기둥과 빔의 일체 구조화·지상 선조립"],"hook":"공작도는 「공장에서 미리 용접해 오는 걸이」 목록이다. 현장 전봇대는 부재가 아니라 주변 사정이다. 높은 데서 일할 거리를 땅에서 미리 붙여 없앤다.","why":"","mix":""}],"n":22,"rounds":13},{"id":"6-11","subject":"건설안전기술","chapter":"구조물공사","big":"콘크리트·철골","title":"철골작업과 날씨","topic3d":"weather","items":[{"name":"철골작업 중지 기준","facts":["풍속: 10분간 평균 10 m/s 이상","강우: 시간당 1 mm 이상","강설: 시간당 1 cm 이상","지진은 기준에 없다"],"hook":"「바람 십, 비 일 밀리, 눈 일 센치」다. 눈은 비보다 열 배 두껍게 쌓이니 mm가 cm로 바뀐다. 강설 5 mm는 0.5 cm라 미달이다.","why":"","mix":"타워크레인 운전 중지는 순간풍속 15 m/s, 철골작업은 10분 평균 10 m/s다."},{"name":"철골 승강로·건립 중 방망","facts":["승강로 답단 간격 30 cm 이내","건립 중 높이 20 m 이내마다 추락방지용 방망·승강설비"],"hook":"철골 사다리 발판 「삼십(30)」은 보통 계단 한 칸이다. 20 m마다 그물 한 장 깔고 올라간다.","why":"","mix":""},{"name":"외압(풍압) 내력 확인 대상","facts":["높이 20 m 이상 구조물","폭과 높이의 비 1 : 4 이상","단면구조에 현저한 차이, 이음부가 현장용접","연면적당 철골량 50 kg/㎡ 이하, 타이플레이트형 기둥"],"hook":"「이십·일대사·오십」이다. 20 m 높고, 1 : 4로 홀쭉하고, 50 kg/㎡로 가벼우면 바람에 흔들린다. 공장에서 붙여 온 이음부는 걱정 없다.","why":"키 크고 홀쭉하고 가벼운 구조물이 바람에 약하다.","mix":"높이 15 m는 대상이 아니다."},{"name":"앵커볼트 매립 허용오차","facts":["기둥 중심은 기준선·인접기둥 중심에서 5 mm 이내","앵커볼트는 기둥 중심에서 2 mm 이내","베이스플레이트 하단은 기준 높이에서 3 mm 이내"],"hook":"「기둥 오(5), 볼트 이(2), 판 삼(3)」이다. 큰 놈일수록 오차를 넉넉히, 작은 볼트는 새끼손톱만큼만 봐준다.","why":"","mix":"기둥 중심 3 mm는 틀린 값이다."},{"name":"콘크리트 압축강도","facts":["압축강도 = 파괴하중 ÷ 단면적","지름 15 cm 공시체 460 kN 파괴 → 약 26 MPa"],"hook":"강도는 「힘 나누기 면적」이다. 460 kN을 지름 15 cm 원 면적으로 나누면 26이 나온다.","why":"","mix":""}],"n":20,"rounds":16},{"id":"6-12","subject":"건설안전기술","chapter":"운반·하역","big":"운반·하역","title":"하역과 운반의 원칙","topic3d":"stairs","items":[{"name":"하역작업 지휘자의 준수사항","facts":["단위화물 100 kg 이상 싣고 내릴 때 작업지휘자 지정","작업순서와 방법을 정하고 지휘","기구·공구 점검, 불량품 제거","관계 근로자 외 출입 금지","로프 풀기·덮개 벗기기는 낙하 위험 없음을 확인한 뒤","대피방법 사전 교육·편중 적재는 준수사항이 아니다"
