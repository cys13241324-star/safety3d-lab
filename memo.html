<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>산업안전기사 암기 은행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Gothic+A1:wght@800&display=swap">
<style>
:root{color-scheme:dark;--bg:#0A1018;--panel:#0F1622;--panel2:#182234;--line:#263248;--line-soft:#1B2536;--text:#E8EEF8;--muted:#8C99B0;--dim:#5D6A82;--accent:#7FA6E0;--ok:#5CC08A;--ok-soft:rgba(92,192,138,.16);--bad:#F07056;--bad-soft:rgba(240,112,86,.16);--warn:#E3B54D;
  --sans:"IBM Plex Sans KR","Pretendard","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;--display:'Gothic A1',var(--sans)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:22px 18px 80px}
header .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
header h1{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:-.02em;margin:0 0 4px}
.hazard{height:6px;max-width:260px;border-radius:3px;margin:10px 0 12px;background:repeating-linear-gradient(135deg,#E3B54D 0 14px,#141A24 14px 28px)}
.lede{color:var(--muted);margin:0 0 12px;max-width:66ch}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;color:var(--muted);margin:0 0 14px} .stats b{font-family:var(--display);font-weight:800;font-size:20px;color:var(--text);margin-right:4px}
.topLinks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{font:inherit;font-size:13.5px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:#0B1220;border-color:var(--accent);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:6px 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs button{font:inherit;font-size:15px;padding:10px 14px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--warn);font-weight:600}
.b{font:inherit;font-size:14.5px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;text-decoration:none;display:inline-block}
.b:hover{border-color:var(--accent)} .b.primary{background:var(--warn);color:#1A1200;border-color:var(--warn);font-weight:600} .b.sm{font-size:13px;padding:5px 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:12px}
.tag{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.tag .fq{color:var(--warn)}
.stem{font-size:16px;margin:0 0 10px;font-weight:500}
.cloze{font-size:18px;margin:0 0 14px;padding:12px 14px;background:var(--panel2);border-left:3px solid var(--warn);border-radius:6px}
.cloze .blank{display:inline-block;min-width:64px;border-bottom:2px solid var(--warn);color:var(--warn);text-align:center;font-family:var(--mono)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.opts button{font:inherit;font-family:var(--mono);font-size:17px;padding:12px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer}
.opts button:hover{border-color:var(--accent)} .opts button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)} .opts button.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)} .opts button:disabled{cursor:default}
.fb{padding:10px 14px;border-radius:6px;margin-bottom:12px;font-size:14.5px} .fb.ok{background:var(--ok-soft);border:1px solid var(--ok)} .fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb small{display:block;color:var(--muted);font-family:var(--mono);font-size:12.5px;margin-top:4px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .mono{font-family:var(--mono)}
.list{display:flex;flex-direction:column;gap:6px}
.item{background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.item .t{font-size:14.5px} .item .m{font-family:var(--mono);font-size:12px;color:var(--dim)} .item .m b{color:var(--warn);font-weight:500}
.item .t .v{color:var(--warn);font-family:var(--mono)}
.numgrid{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.numgrid button{font:inherit;font-family:var(--mono);font-size:14px;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer} .numgrid button small{color:var(--dim);margin-left:4px} .numgrid button[aria-pressed="true"]{border-color:var(--warn);color:var(--warn)}
input[type=search]{font:inherit;font-size:15px;padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);width:100%;max-width:420px}
.prog{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px} .prog div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px} .prog b{display:block;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em} .prog span{font-family:var(--mono);font-size:12px;color:var(--dim)}
table.acc{width:100%;border-collapse:collapse;font-size:14px} table.acc td,table.acc th{padding:6px 8px;border-top:1px solid var(--line-soft);text-align:left} table.acc th{color:var(--dim);font-weight:500;font-size:12.5px;font-family:var(--mono)}
.pair{display:grid;grid-template-columns:1fr;gap:8px} .pair .st{padding:10px 14px;background:var(--panel2);border-radius:6px} .pair .st.ok{border:1px solid var(--ok)} .pair .st.bad{border:1px solid var(--bad)}
.empty{color:var(--dim);padding:30px;text-align:center}
@media (max-width:600px){header h1{font-size:26px} .item{grid-template-columns:1fr} .opts{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
(function(){
  const BANK = JSON.parse(document.getElementById('bank').textContent);
  const el = id => document.getElementById(id);
  const SITE = 'https://cys13241324-star.github.io/safety3d-lab/';
  const SUBJ_ORDER = ['안전관리론','인간공학 및 시스템안전공학','기계위험방지기술','전기위험방지기술','화학설비위험방지기술','건설안전기술'];
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
  const fmtVal = (v, u) => `${v} ${u}`;
  let subj = '전체', tab = 'cards';
  // ---- 저장(간격 반복·진도) ----
  const KEY = 'memo_srs_v1'; let srs = {}; try{ srs = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){ srs = {}; }
  const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(srs)); }catch(e){} };
  const today = ()=> new Date().toISOString().slice(0, 10);
  function grade(id, ok){ const r = srs[id] || {n:0, ok:0, iv:0, due:0, hist:[]}; r.n++; if(ok){ r.ok++; r.iv = r.iv ? Math.round(r.iv*2.3) : 1; r.due = Date.now() + r.iv*86400000; } else { r.iv = 0; r.due = Date.now() + 10*60000; } r.last = Date.now(); r.day = today(); srs[id] = r; const d = srs.__days || {}; d[today()] = (d[today()] || 0) + 1; srs.__days = d; save(); }
  // ---- 공통 ----
  el('stats').innerHTML = `<span><b>${BANK.atoms.length.toLocaleString()}</b>원자</span><span><b>${BANK.cards.length}</b>빈칸 카드</span><span><b>${BANK.pairs.length}</b>헷갈리는 쌍</span><span><b>${BANK.rounds}</b>회차 ${BANK.questions.toLocaleString()}문항</span>`;

  el('subjChips').querySelectorAll('.chip').forEach(b=> b.addEventListener('click', ()=>{ subj = b.dataset.s; el('subjChips').querySelectorAll('.chip').forEach(x=> x.setAttribute('aria-pressed', x===b)); render(); }));
  el('tabs').querySelectorAll('[data-tab]').forEach(b=> b.addEventListener('click', ()=>{ tab = b.dataset.tab; el('tabs').querySelectorAll('[data-tab]').forEach(x=> x.setAttribute('aria-selected', x===b)); render(); }));
  const inSubj = x => subj==='전체' || x.subject===subj;
  const link3d = k => k ? `<a class="b sm" href="${SITE}#topic=${k}" target="_blank" rel="noopener">3D 현장에서 보기 →</a>` : '';
  function render(){ ['cards','pairs','numbers','atoms','progress'].forEach(k=> el('v_'+k).hidden = (k!==tab)); ({cards: renderCards, pairs: renderPairs, numbers: renderNumbers, atoms: renderAtoms, progress: renderProgress})[tab](); }
  // ---- 빈칸 카드 (간격 반복) ----
  let cur = null;
  function pickCard(){ const pool = BANK.cards.filter(inSubj); if(!pool.length) return null; const now = Date.now();
    const due = pool.filter(c=> srs[c.src] && srs[c.src].due <= now).sort((a,b)=> srs[a.src].due - srs[b.src].due);
    if(due.length) return due[0];
    const fresh = pool.filter(c=> !srs[c.src]); if(fresh.length){ fresh.sort((a,b)=> (parseFloat(b.freq)||0) - (parseFloat(a.freq)||0)); return fresh[Math.floor(Math.random()*Math.min(8, fresh.length))]; }
    return pool.sort((a,b)=> srs[a.src].due - srs[b.src].due)[0]; }
  function renderCards(){ const v = el('v_cards'); if(!cur || !inSubj(cur)) cur = pickCard(); if(!cur){ v.innerHTML = '<div class="empty">이 과목엔 빈칸 카드가 없습니다.</div>'; return; }
    const c = cur, r = srs[c.src], opts = shuffle(c.opts.slice()), pool = BANK.cards.filter(inSubj), dueN = pool.filter(x=> srs[x.src] && srs[x.src].due <= Date.now()).length, newN = pool.filter(x=> !srs[x.src]).length;
    v.innerHTML = `<div class="card"><div class="tag"><span>${esc(c.subject)} › ${esc(c.chapter)}</span><span class="fq">빈출 ${esc(c.freq||'-')}</span><span>${esc(c.src)}</span>${r ? `<span>${r.ok}/${r.n} 맞힘</span>` : '<span>새 카드</span>'}</div>
      <p class="stem">${esc(c.stem)}${c.cond ? ' <span class="muted">' + esc(c.cond) + '</span>' : ''}</p>
      <div class="cloze">${esc(c.cloze).replace('___', '<span class="blank">?</span>')}</div>
      <div class="opts" id="opts">${opts.map((o,i)=> `<button type="button" data-v="${esc(o)}">${i+1}. ${esc(fmtVal(o, c.unit))}</button>`).join('')}</div>
      <div id="fb"></div>
      <div class="row"><button class="b primary" id="bNext" type="button" hidden>다음 카드 →</button><span class="muted mono">오늘 복습 ${dueN} · 새 카드 ${newN} · 1~4 키로 고르기</span></div></div>`;
    const answer = String(c.answer);
    v.querySelectorAll('#opts button').forEach(b=> b.addEventListener('click', ()=> choose(b)));
    function choose(b){ const ok = b.dataset.v === answer; v.querySelectorAll('#opts button').forEach(x=>{ x.disabled = true; if(x.dataset.v === answer) x.classList.add('ok'); }); if(!ok) b.classList.add('bad'); grade(c.src, ok);

      el('bNext').hidden = false; el('bNext').focus(); }
    el('bNext').addEventListener('click', ()=>{ cur = pickCard(); renderCards(); });
    document.onkeydown = e=>{ if(tab!=='cards') return; if(/^[1-4]$/.test(e.key)){ const b = v.querySelectorAll('#opts button')[+e.key-1]; if(b && !b.disabled) b.click(); } else if(e.key==='Enter' && !el('bNext').hidden) el('bNext').click(); }; }
  // ---- 헷갈리는 쌍 ----
  let curPair = null;
  function renderPairs(){ const v = el('v_pairs'); const pool = BANK.pairs.filter(inSubj); if(!pool.length){ v.innerHTML = '<div class="empty">쌍이 없습니다.</div>'; return; }
    if(!curPair || !inSubj(curPair)) curPair = pool[Math.floor(Math.random()*Math.min(40, pool.length))];
    const p = curPair, askA = Math.random() < 0.5, st = askA ? p.a : p.b, ans = askA ? p.va : p.vb, other = askA ? p.vb : p.va;
    const blanked = esc(st).replace(new RegExp(esc(ans).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*' + p.unit.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')), `<span class="blank">?</span> ${esc(p.unit)}`);
    const opts = shuffle([ans, other]);
    v.innerHTML = `<div class="card"><div class="tag"><span>${esc(p.subject)} › ${esc(p.chapter)}</span><span class="fq">같은 단위 ${esc(p.unit)} · 이웃 숫자</span></div>
      <div class="cloze">${blanked}</div>
      <div class="opts" id="popts">${opts.map(o=> `<button type="button" data-v="${esc(o)}">${esc(fmtVal(o, p.unit))}</button>`).join('')}</div>
      <div id="pfb"></div><div class="row"><button class="b primary" id="pNext" type="button" hidden>다음 쌍 →</button><span class="muted mono">${pool.length}쌍 · 둘 중 하나</span></div></div>`;
    v.querySelectorAll('#popts button').forEach(b=> b.addEventListener('click', ()=>{ const ok = b.dataset.v === ans; v.querySelectorAll('#popts button').forEach(x=>{ x.disabled = true; if(x.dataset.v === ans) x.classList.add('ok'); }); if(!ok) b.classList.add('bad');
      el('pfb').innerHTML = `<div class="pair"><div class="st ok">${esc(p.a)}</div><div class="st">${esc(p.b)}</div></div><div style="height:10px"></div>`; el('pNext').hidden = false; }));
    el('pNext').addEventListener('click', ()=>{ curPair = pool[Math.floor(Math.random()*pool.length)]; renderPairs(); }); }
  // ---- 숫자 색인 ----
  let unitSel = 'm', valSel = null;
  function renderNumbers(){ const v = el('v_numbers'); const atoms = BANK.atoms.filter(inSubj);
    const units = {}; atoms.forEach(a=> a.vals.forEach(([n,u])=>{ units[u] = (units[u]||0) + 1; }));
    const ulist = Object.entries(units).sort((a,b)=> b[1]-a[1]).slice(0, 26); if(!units[unitSel]) unitSel = ulist.length ? ulist[0][0] : 'm';
    const byVal = {}; atoms.forEach(a=> a.vals.forEach(([n,u])=>{ if(u!==unitSel) return; const k = n.replace(/,/g,''); (byVal[k] = byVal[k] || {n:k, atoms:new Set()}).atoms.add(a); }));
    const vals = Object.values(byVal).sort((a,b)=> parseFloat(a.n) - parseFloat(b.n)); if(valSel && !byVal[valSel]) valSel = null;
    const cur = valSel ? byVal[valSel] : null;
    v.innerHTML = `<p class="muted">단위를 고르고 숫자를 누르면 그 숫자가 나오는 규정을 모두 보여 줍니다. 이웃 숫자끼리 나란히 놓고 구분해 보세요.</p>
      <div class="chips">${ulist.map(([u,n])=> `<button class="chip" data-u="${esc(u)}" aria-pressed="${u===unitSel}">${esc(u)} <small>${n}</small></button>`).join('')}</div>
      <div class="numgrid">${vals.map(x=> `<button type="button" data-v="${esc(x.n)}" aria-pressed="${x.n===valSel}">${esc(x.n)}<small>${x.atoms.size}</small></button>`).join('')}</div>
      <div class="list">${cur ? [...cur.atoms].sort((a,b)=> b.vfreq - a.vfreq).map(a=> atomRow(a)).join('') : '<div class="empty">숫자를 누르세요</div>'}</div>`;
    v.querySelectorAll('.chip').forEach(b=> b.addEventListener('click', ()=>{ unitSel = b.dataset.u; valSel = null; renderNumbers(); }));
    v.querySelectorAll('.numgrid button').forEach(b=> b.addEventListener('click', ()=>{ valSel = b.dataset.v; renderNumbers(); })); }
  function atomRow(a){ let t = esc(a.text); a.vals.forEach(([n,u])=>{ t = t.replace(esc(n) + (u ? '' : ''), `<span class="v">${esc(n)}</span>`); });
    return `<div class="item"><div><div class="t">${t}</div><div class="m">${esc(a.subject)} › ${esc(a.chapter)} · <b>${a.vfreq}회차</b> 출제 · ${esc((a.src||[]).slice(0,3).join(', '))}</div></div><div>${link3d(a.topic3d)}</div></div>`; }
  // ---- 원자 목록 ----
  let q = '';
  function renderAtoms(){ const v = el('v_atoms'); const list = BANK.atoms.filter(inSubj).filter(a=> !q || a.text.includes(q) || a.chapter.includes(q)).slice(0, 300);
    v.innerHTML = `<div class="row" style="margin-bottom:12px"><input type="search" id="q" placeholder="검색: 난간, 30 mA, 굴착…" value="${esc(q)}"><span class="muted mono">${list.length}건 (최대 300)</span></div><div class="list">${list.map(atomRow).join('') || '<div class="empty">없음</div>'}</div>`;
    const inp = el('q'); inp.addEventListener('input', ()=>{ q = inp.value.trim(); const pos = inp.selectionStart; renderAtoms(); const i2 = el('q'); i2.focus(); i2.setSelectionRange(pos, pos); }); }
  // ---- 진도 ----
  function renderProgress(){ const v = el('v_progress'); const ids = BANK.cards.map(c=> c.src), seen = ids.filter(id=> srs[id]), okN = seen.reduce((n,id)=> n + (srs[id].ok > 0 ? 1 : 0), 0), dueN = ids.filter(id=> srs[id] && srs[id].due <= Date.now()).length;
    const days = srs.__days || {}, dlist = Object.keys(days).sort(); let streak = 0; { const d = new Date(); for(;;){ const k = d.toISOString().slice(0,10); if(days[k]){ streak++; d.setDate(d.getDate()-1); } else break; } }
    const per = SUBJ_ORDER.map(s=>{ const cs = BANK.cards.filter(c=> c.subject===s); const sn = cs.filter(c=> srs[c.src]).length, n = cs.reduce((a,c)=> a + (srs[c.src] ? srs[c.src].n : 0), 0), ok = cs.reduce((a,c)=> a + (srs[c.src] ? srs[c.src].ok : 0), 0); return `<tr><td>${esc(s)}</td><td class="mono">${cs.length}</td><td class="mono">${sn}</td><td class="mono">${n ? Math.round(ok/n*100) + ' %' : '-'}</td></tr>`; }).join('');
    v.innerHTML = `<div class="prog"><div><b>${seen.length}/${ids.length}</b><span>본 카드</span></div><div><b>${okN}</b><span>한 번 이상 맞힌 카드</span></div><div><b>${dueN}</b><span>지금 복습할 카드</span></div><div><b>${streak}일</b><span>연속 학습</span></div><div><b>${days[today()]||0}</b><span>오늘 푼 카드</span></div></div>
      <table class="acc"><thead><tr><th>과목</th><th>카드</th><th>본 카드</th><th>정답률</th></tr></thead><tbody>${per}</tbody></table>
      <p class="muted" style="margin-top:14px">기록은 이 브라우저에만 저장됩니다. <button class="b sm" id="bReset" type="button">기록 지우기</button></p>`;
    el('bReset').addEventListener('click', ()=>{ if(confirm('학습 기록을 지울까요?')){ srs = {}; save(); renderProgress(); } }); }
  render();
})();
</script>
