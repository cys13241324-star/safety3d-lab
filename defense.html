<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1018">
<title>불안전 행동 디펜스</title>
<script>(function(){try{var t=localStorage.getItem('safety_theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Gothic+A1:wght@700;800&display=swap">
<style>
:root{--bg:#0A1018;--panel:#0F1622;--panel2:#182234;--line:#33425C;--line-soft:#1E2938;--text:#E8EEF8;--muted:#8C99B0;--dim:#8290AC;--accent:#7FA6E0;--accent-ink:#0B111C;--ok:#5CC08A;--ok-soft:rgba(92,192,138,.16);--bad:#F07056;--bad-soft:rgba(240,112,86,.16);--warn:#E3B54D;--warn-soft:rgba(227,181,77,.10);--warn-line:rgba(227,181,77,.45);--on-accent:#1A1200;--glass:rgba(15,22,34,.9);--tint:rgba(255,255,255,.05);--scrim:rgba(6,10,17,.78);--sans:"IBM Plex Sans KR","Pretendard","Malgun Gothic",sans-serif;--mono:"IBM Plex Mono",Consolas,monospace;--display:"Gothic A1","IBM Plex Sans KR",sans-serif;}
/* safety3d_tpl.html:302 근처 밝은 테마 오버라이드를 그대로 가져옴 — safety_theme 값을 여러 페이지가 공유한다 */
:root[data-theme="light"]{color-scheme:light;--bg:#F4F6FA;--panel:#FFFFFF;--panel2:#EAEEF5;--line:#C6D0DE;--line-soft:#E0E6EF;--text:#14202E;--muted:#4A5568;--dim:#66738A;--accent:#2F5FA8;--accent-ink:#FFFFFF;--ok:#1F6B45;--ok-soft:rgba(31,107,69,.12);--bad:#A8391F;--bad-soft:rgba(168,57,31,.10);--warn:#8F6512;--warn-soft:rgba(143,101,18,.10);--warn-line:rgba(143,101,18,.35);--on-accent:#FFFFFF;--glass:rgba(255,255,255,.93);--tint:rgba(0,0,0,.04);--scrim:rgba(244,246,250,.88);}
/* fix round 1 — 자매 템플릿(hub_tpl.html:13·palace_tpl.html:13·memo_tpl.html:13)에는 다 있는
   전역 .mono 규칙이 이 파일에만 없었다. class="mono" 가 붙은 자리(#eScore·#eAcc·#eWave·
   .eGroupCount — 전부 숫자·기호만 담는다, 한글 없음)가 실제로 고정폭 숫자로 보이도록
   font-family 까지 준다(자매 템플릿의 tabular-nums 만으론 폰트가 안 바뀐다 — 검증 시 이 차이가
   드러났다). #hud 안의 b.mono 는 이미 스코프 규칙이 있어 그대로 둔다. */
.mono{font-variant-numeric:tabular-nums}
#dEnd .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
html,body{height:100%}
/* Task 6: 390px 재검증 — #c(캔버스)는 touch-action:none 인데 HUD·버튼·모달은 캔버스의 형제
   요소라 그 규칙을 안 물려받는다(터치 액션은 대상 요소와 그 조상만 본다 — 형제는 무관하다).
   그래서 버튼을 두 번 빠르게 두드리면 캔버스 밖에서는 확대가 안 막혀 있었다 — body 에 기본값을
   깔아 모든 형제 요소가 같이 막히게 한다. manipulation 은 두 번 탭 확대·더블탭 확대만 막고
   스크롤은 남기지만, 이 페이지는 overflow:hidden 이라 스크롤 자체가 없다.*/
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.6;overflow:hidden;touch-action:manipulation}
#stage{position:fixed;inset:0}
#c{width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
/* Task 5: HUD 다시 만들기 — 목숨은 하트가 아니라 무재해 기록 3칸(안전모 아이콘), 일제 점검
   남은 횟수는 버튼 글자가 아니라 여기(HUD)에 낸다. 사양에 없던 마크업은 늘리지 않는다. */
#hud{position:fixed;left:14px;top:12px;width:max-content;max-width:calc(100vw - 172px);display:flex;flex-wrap:wrap;row-gap:4px;column-gap:9px;align-items:center;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);font-size:15px;color:var(--text);z-index:3}
#hud .sep{color:var(--dim)}
#hud b.mono{font-family:var(--mono);font-weight:500;color:var(--warn);font-variant-numeric:tabular-nums}
#hud .hudLifeWrap{display:inline-flex;align-items:center;gap:6px}
#hud .hudLifeLabel{font-size:14px;color:var(--muted)}
#hud .hudLives{display:inline-flex;gap:4px}
#hud .life{width:20px;height:16px;color:var(--dim);opacity:.4}
#hud .life svg{display:block;width:100%;height:100%;fill:currentColor}
#hud .life.on{color:var(--warn);opacity:1}
#hud .hudSweep b.mono{color:var(--accent)}
/* fix round 3(C1) — 오지적 누적. 「잘못 분 것도 놓친 것만큼 나쁘다」가 규칙이라면 그 누적이
   HUD 에 보여야 학습자가 규칙으로 이해한다(감점만 뜨고 사라지면 규칙이 아니라 잔소리다).
   자리는 390px 실측으로 정했다 — #hud 는 flex-wrap 이라 좁은 화면에서 이 항목이 한 줄을
   더 차지할 뿐 넘치지 않는다(검사6). 2/3 부터 색을 바꿔 「다음이 마지막」을 미리 알린다. */
#hud .hudWrong b.mono{color:var(--muted)}
#hud .hudWrong.near b.mono{color:var(--bad)}
#hud .hudWrong .hudWrongMax{color:var(--dim);font-family:var(--mono);font-size:14px}
#hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:14px;color:var(--dim);background:var(--glass);border:1px solid var(--line-soft);border-radius:999px;padding:6px 14px;backdrop-filter:blur(8px);z-index:3;white-space:nowrap}
/* 화면 중앙 고정 조준 십자선 + palace_tpl.html:77~80 의 hm(적중 표시)·pops(점수 팝업)를 그대로 가져옴.
   원본은 마우스를 따라다니는 조준점(.fx)이지만 여긴 카메라가 고정이라 항상 화면 중앙이다. */
#fx{position:fixed;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:3}
#fx .cross i{position:absolute;background:rgba(232,238,248,.85);border-radius:1px}
#fx .cross i:nth-child(1){width:2px;height:12px;left:-1px;top:-18px}
#fx .cross i:nth-child(2){width:2px;height:12px;left:-1px;top:6px}
#fx .cross i:nth-child(3){width:12px;height:2px;left:-18px;top:-1px}
#fx .cross i:nth-child(4){width:12px;height:2px;left:6px;top:-1px}
#fx .dot{position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:var(--warn)}
/* palace_tpl.html:77 에서 가져옴 — 그대로 */
#fx .hm{position:absolute;left:0;top:0;width:0;height:0;opacity:0;transition:opacity .1s}
#fx .hm.on{opacity:1}
#fx .hm i{position:absolute;left:-7px;top:-1px;width:14px;height:2px;background:#fff;border-radius:1px}
#fx .hm i:nth-child(1){transform:translate(-11px,-11px) rotate(45deg)}
#fx .hm i:nth-child(2){transform:translate(11px,-11px) rotate(-45deg)}
#fx .hm i:nth-child(3){transform:translate(-11px,11px) rotate(-45deg)}
#fx .hm i:nth-child(4){transform:translate(11px,11px) rotate(45deg)}
#fx .hm.ok i{background:#3FD37F}
#fx .hm.bad i{background:#FF5C5C}
/* palace_tpl.html:78 에서 가져옴 — 그대로 */
#fx .pops{position:absolute;left:0;top:0}
#fx .pops span{position:absolute;left:14px;top:-10px;font-family:var(--display);font-weight:800;font-size:20px;color:var(--warn);white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6);animation:fpop .9s ease-out forwards}
#fx .pops span.bad{color:#FF7A7A}
@keyframes fpop{0%{opacity:0;transform:translateY(6px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-38px) scale(1)}}
@media (prefers-reduced-motion:reduce){#fx .pops span{animation-duration:.01s}}
/* Task 3: 근거 한 줄 · 호루라기 잠김 · 사고 섬광. #hud 는 손대지 않는다 — Task 5 가 사양대로 다시 만든다. */
#dBasis{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);box-sizing:border-box;width:max-content;max-width:min(94vw,680px);display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;padding:10px 18px;border-radius:12px;border:1px solid var(--warn-line);background:var(--glass);backdrop-filter:blur(8px);box-shadow:0 6px 24px rgba(0,0,0,.35);z-index:4}
#dBasis[hidden]{display:none}
#dBasis b{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.35;color:var(--warn)}
#dBasis span{font-size:16px;line-height:1.55;color:var(--text);word-break:keep-all;overflow-wrap:anywhere}   /* 조문 하나가 화면보다 길 수 있다(confined 는 조문 셋) */
/* fix round 3(C1) — 오지적 3회로 무재해 1칸을 잃는 순간의 화면. 사고(놓침)와 반드시 구분돼야
   한다: 사고는 붉은 섬광(#dFlash) + 발밑 고리 + 「사고 발생」 팝업이고, 이쪽은 섬광 없이 이
   띠 하나만 뜬다. 왜 안전모를 잃었는지 학습자가 알아야 한다. 자리는 십자선 위(50% − 76px) —
   아래쪽 50% + 30px 은 「호루라기 잠김」(#dStun)이 같은 순간에 뜨는 자리라 겹치면 안 된다. */
#dWarn{position:fixed;left:50%;top:calc(50% - 76px);transform:translateX(-50%);font-size:15px;font-weight:600;color:var(--text);background:var(--glass);border:1px solid var(--bad);border-radius:999px;padding:6px 14px;white-space:nowrap;pointer-events:none;backdrop-filter:blur(8px);z-index:4}
#dWarn[hidden]{display:none}
#dStun{position:fixed;left:50%;top:calc(50% + 30px);transform:translateX(-50%);font-size:14px;font-weight:600;color:#FFC0B2;background:var(--bad-soft);border:1px solid var(--bad);border-radius:999px;padding:4px 12px;white-space:nowrap;pointer-events:none;z-index:4}
:root[data-theme="light"] #dStun{color:var(--bad)}
#fx.lock .cross i{background:rgba(240,112,86,.9)}
#fx.lock .dot{background:var(--bad)}
#dFlash{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity .35s ease-out;background:radial-gradient(ellipse at 50% 55%,rgba(240,80,60,0) 30%,rgba(190,40,25,.6) 100%)}
#dFlash.on{opacity:1;transition:opacity .05s}
/* Task 4: 웨이브 다섯 · 정비 시간 · 일제 점검. #hud 는 손대지 않는다 — 일제 점검 남은 횟수는
   버튼 글자로 낸다(HUD 내용을 바꾸지 말라는 지시 때문에 #hud 안에는 안 넣는다). */
#btnSweep{position:fixed;right:14px;top:12px;z-index:3;min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);color:var(--text);font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer}
#btnSweep:disabled{opacity:.4;cursor:default}
/* Task 8: 홈 링크. 위쪽 두 모서리(#hud·#btnSweep)는 이미 찼고, 아래 중앙은 #hint 가 문구
   길이만큼 늘었다 줄었다 한다("화면을 클릭해 호루라기를 붑니다"가 가장 길어 390px 에서도
   좌우 87px씩은 항상 빈다 — 실측 확인) — 그래서 아래 왼쪽 구석에 아이콘 전용 44px 버튼 하나만
   둔다. 텍스트를 넣지 않은 건 이 구석의 여유가 안정적으로 크지 않아서다("← 홈" 같은 글자
   버튼은 #hint 와 부딪힐 여지가 있다). #hud 처럼 aria-hidden 을 주지 않는다 — 이건 진짜
   내비게이션 링크라 스크린리더가 봐야 한다. */
#btnHome{position:fixed;left:14px;bottom:12px;z-index:3;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);color:var(--text);text-decoration:none}
#btnHome svg{width:20px;height:20px;fill:currentColor}
#btnHome:hover{border-color:var(--warn)}
#dMaint{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim)}
#dMaint[hidden]{display:none}
#dMaint .mCard{box-sizing:border-box;width:min(94vw,520px);max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 20px 16px}
#dMaint .mHead{margin:0 0 4px;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.02em;color:var(--warn);text-transform:uppercase}
#dMaint .mSrc{margin:0 0 10px;font-size:14px;color:var(--muted)}
#dMaint .mStem{margin:0 0 14px;font-size:17px;line-height:1.55;color:var(--text);word-break:keep-all}
#dMaint .mChoices{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:8px}
#dMaint .mChoices li{box-sizing:border-box;min-height:44px;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--line-soft);background:var(--panel2);font-size:16px;line-height:1.5;color:var(--text);cursor:pointer}
#dMaint .mChoices li b{color:var(--muted);font-family:var(--mono);font-weight:500;flex:none}
#dMaint .mChoices.answered li{cursor:default}
#dMaint .mChoices li.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
#dMaint .mChoices li.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
#dMaint .mPoint{margin:0 0 14px;padding:10px 12px;border-left:2px solid var(--warn);font-size:14px;line-height:1.55;color:var(--muted)}
#dMaint .mPoint strong{color:var(--text)}
#dMaint .mPoint u{color:var(--text)}
#dMaint #btnNextWave{display:block;width:100%;min-height:44px;border:none;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--sans);font-weight:700;font-size:16px;cursor:pointer}
/* Task 5: 종료 화면. dMaint 와 같은 모달 뼈대(고정 전체 화면 + 스크림)를 그대로 써서
   잔여 작업자(5웨이브가 끝나도 걷고 있는 사람들)를 가린다. */
#dEnd{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim)}
#dEnd[hidden]{display:none}
#dEnd .eCard{box-sizing:border-box;width:min(94vw,560px);max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px 20px}
#dEnd .eHead{margin:0 0 14px;font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:.01em;color:var(--warn);text-align:center}
#dEnd .eStats{display:flex;gap:10px;margin:0}
#dEnd .eStat{flex:1;box-sizing:border-box;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:10px;background:var(--panel2);border:1px solid var(--line-soft)}
#dEnd .eStatN{font-size:20px;font-weight:600;color:var(--text)}
#dEnd .eStatL{font-size:14px;color:var(--muted);text-align:center}
#dEnd .eAccSub{margin:8px 0 0;font-size:14px;color:var(--muted);text-align:center}
#dEnd .eMissedHead{margin:18px 0 8px;font-size:16px;font-weight:600;color:var(--text)}
#dEnd .eMissed{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
#dEnd .eMissedEmpty{margin:0 0 18px;font-size:16px;color:var(--muted)}
#dEnd .eGroup{box-sizing:border-box;padding:12px 14px;border-radius:12px;border:1px solid var(--line-soft);background:var(--panel2)}
#dEnd .eGroupHead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 6px}
#dEnd .eGroupName{font-size:16px;font-weight:600;color:var(--text);word-break:keep-all}
#dEnd .eGroupCount{font-size:14px;color:var(--bad);flex:none}
#dEnd .eGroupTell{margin:0 0 4px;font-size:14px;line-height:1.5;color:var(--warn);word-break:keep-all}
#dEnd .eGroupFix{margin:0 0 8px;font-size:14px;line-height:1.5;color:var(--muted);word-break:keep-all}
#dEnd .eGroupLaw{margin:0 0 10px;font-size:14px;color:var(--muted)}
#dEnd .eGroupLaw summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:4px;font-size:14px;color:var(--accent);list-style:none}
#dEnd .eGroupLaw summary::-webkit-details-marker{display:none}
#dEnd .eGroupLaw summary::before{content:'▸';font-family:var(--mono)}
#dEnd .eGroupLaw[open] summary::before{content:'▾'}
#dEnd .eGroupLaw p{margin:6px 0 0;font-size:16px;line-height:1.55;color:var(--text);word-break:keep-all;overflow-wrap:anywhere}   /* 조문 원문 — 자르지 않는다(confined 는 조문 셋) */
#dEnd .eGroupLink{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-size:14px;font-weight:600}
#dEnd #btnAgain{display:block;width:100%;min-height:44px;margin-top:4px;border:none;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--sans);font-weight:700;font-size:16px;cursor:pointer}
/* Task 8: 종료 화면에도 홈 — 여기까지 온 사람(사고로 끝났든 완주했든)은 "다시" 말고는
   나갈 길이 없었다(실습장 링크는 target=_blank 라 이 탭은 그대로 남는다). */
#dEnd #eHome{display:flex;align-items:center;justify-content:center;min-height:44px;margin-top:8px;font-size:14px;color:var(--muted);text-decoration:none}
#dEnd #eHome:hover{color:var(--text)}
</style>
</head>
<body>

<div id="stage"><canvas id="c"></canvas></div>
<div id="hud" aria-hidden="true">
  <span class="hudLifeWrap"><span class="hudLifeLabel">무재해</span><span class="hudLives" id="hudLives"></span></span>
  <span class="sep">·</span>
  <span>WAVE <b class="mono" id="hudWaveN">0</b></span>
  <span class="sep">·</span>
  <span><b class="mono" id="hudScoreN">0</b>점</span>
  <span class="sep">·</span>
  <span class="hudWrong" id="hudWrong">오지적 <b class="mono" id="hudWrongN">0</b><span class="hudWrongMax" id="hudWrongMax">/3</span></span>
  <span class="sep">·</span>

  // 세로 화면(좁은 aspect)에서는 수평 시야가 크게 줄어(수직 fov 고정) 카메라 구석에 고정한

  function tube(r, h, mat, parent, x, y, z, rx, rz){

  function link(a, b, r, mat, parent){

  function pivotAll(w, y){

    fall(w, safe){
      const g = w.g;
      tube(0.05, 2.5, steelMat, g, -1.25, 1.25, -0.55);
      tube(0.05, 2.5, steelMat, g,  1.25, 1.25, -0.55);
      link(P3(-1.25, 2.42, -0.55), P3(1.25, 2.42, -0.55), 0.04, steelMat, g);
      const belt = P3(0.17, 0.72, 0.02);
      if(safe){
        link(belt, P3(0.10, 2.30, -0.48), 0.03, lanyMat, g);
        const hook = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.035, 8, 16), steelMat);
        hook.position.set(0.10, 2.42, -0.52); hook.rotation.y = Math.PI/2; g.add(hook);
      }else{
        link(belt, P3(0.34, 0.08, -0.90), 0.03, lanyMat, g);
        link(P3(0.34, 0.06, -0.90), P3(0.46, 0.05, -1.48), 0.03, lanyMat, g);
        const hook = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.035, 8, 16), steelMat);
        hook.position.set(0.48, 0.05, -1.55); hook.rotation.x = Math.PI/2; g.add(hook);
      }
    },

    /* rail — 「난간을 타 넘는 자세」 / 정상 「난간 안쪽으로 걷는다」
       난간은 두 쪽 다 옆에 있다. 위험한 쪽은 난간 위로 올라타 바깥 다리를 넘긴다. */
    rail(w, safe){
      const g = w.g;
      [-1.1, 1.1].forEach(z=> tube(0.045, 1.05, railMat2, g, -0.8, 0.52, z));
      [1.0, 0.55].forEach(y=> tube(0.04, 2.4, railMat2, g, -0.8, y, 0, Math.PI/2));
      box(0.05, 0.14, 2.4, railMat2, g, -0.8, 0.07, 0);
      if(safe) return;
      const b = pivotAll(w, 0);
      b.position.set(-0.5, 0.34, 0); b.rotation.z = -0.16;
      const L = g.userData.limbs;
      L.legs[0].rotation.z = -1.75;      // 바깥쪽 다리를 난간 너머로
      L.arms[0].rotation.z = -0.95; L.arms[1].rotation.x = -0.45;
      w.amp = 0; w.armsFree = false;
    },

    /* ladder — 「사다리 옆으로 몸이 기울었다」 / 정상 「몸이 사다리 가운데에 있다」 */
    ladder(w, safe){
      const g = w.g;
      g.position.y = 0.55;                                  // 사다리에 올라서 있다
      [-0.24, 0.24].forEach(x=> tube(0.045, 2.8, woodMat, g, x, 0.85, -0.34));
      for(let i=0;i<7;i++) tube(0.035, 0.48, woodMat, g, 0, -0.5 + i*0.36, -0.34, 0, Math.PI/2);
      const b = pivotAll(w, 0.35), L = g.userData.limbs;
      w.amp = 0; w.armsFree = false;
      if(safe){ L.arms.forEach(a=> a.rotation.x = -2.5); }
      else { b.rotation.z = 0.62; L.arms[0].rotation.z = -1.35; L.arms[1].rotation.x = -2.3; }
    },

    /* ramp — 「경사로에서 뛰는 자세」 / 정상 「난간을 잡고 걷는다」
       위험한 쪽은 보폭이 크고 몸이 앞으로 쏠리고 발이 뜬다(위아래로 튄다). 걸음도 빠르다. */
    ramp(w, safe){
      const g = w.g, L = g.userData.limbs;
      // 경사로를 진행 방향과 나란히 두면 옆모습이 접혀서 그냥 판자 상자로 보인다(1차 촬영에서 확인).
      // 비스듬히 돌려 놓아야 12m 에서도 「내려오는 비탈」로 읽힌다.
      const r = new THREE.Group(); r.rotation.y = -0.55; g.add(r);
      // Task 6: 390px 재검증에서 다리·발 표 둘 다 판에 먹혀 안 보인 원인 — 판의 카메라쪽 끝이
      // 사람 앞(z=+0.9, 카메라에 더 가까움)까지 나와 있어 사람과 카메라 사이를 가로막았다.
      // 폭 1.4→0.85 로 좁히고(그래도 「판자」로 읽힌다), 중심을 뒤로 밀어(z −0.9→−1.7) 카메라쪽
      // 끝이 사람 발치(z=0)보다 뒤(−0.25)에 오게 했다 — 사람과 카메라 사이에 판이 없다.
      const slab = box(0.85, 0.14, 3.0, woodMat, r, 0, 0.272, -1.7); slab.rotation.x = -0.36;
      tube(0.045, 1.05, railMat2, r, -0.68, 1.28, -2.0);
      tube(0.045, 1.05, railMat2, r, -0.68, 0.56, -0.1);
      link(P3(-0.68, 1.80, -2.0), P3(-0.68, 1.09, -0.1), 0.045, railMat2, r);
      w.armsFree = false;
      // fix round 1 (리뷰 Important): 다리·발 표는 판에 가려질 수 있는 자리라 판 폭을 줄이는
      // 것만으론 100% 안심할 수 없어, 판에 가려질 일이 없는 자리(머리 뒤, y≈1.55)에 속도선(호)을
      // 하나 더 두기로 했다. 처음엔 이 호를 unsafe 분기 안에서만 그렸는데, 리뷰어가 noise 를
      // 다시 짚었다 — noise 의 소음 파형(:573-576)은 if(safe) **앞**에서 양쪽 다 그리고, 표는
      // 그 안의 귀덮개뿐이다. 「호가 있으면 위험」은 noise 의 실제 패턴이 아니라 내가 잘못
      // 따라 한 것이었다. 그래서 noise 처럼 양쪽 다 그리되, 정상은 걷는 만큼(작고 옅게) ·
      // 위험은 뛰는 만큼(크고 진하게) 그려 표를 「호의 유무」가 아니라 「세기」로 바꿨다.
      // 자세(앞으로 기울기·벌어진 보폭)가 이미 독립적으로 표라서 호는 어디까지나 보조다.
      const spec = safe ? {rads: [0.13, 0.19], tube: 0.018, op: .35} : {rads: [0.24, 0.36], tube: 0.032, op: .85};
      const am = speedMat.clone(); am.opacity = spec.op;
      [-1, 1].forEach(side=> spec.rads.forEach(rad=>{
        const a = new THREE.Mesh(new THREE.TorusGeometry(rad, spec.tube, 6, 16, Math.PI*0.7), am);
        a.position.set(0, 1.55, -0.18); a.rotation.z = side > 0 ? -Math.PI*0.35 : Math.PI*0.55; g.add(a);
      }));
      if(safe){
        L.arms[0].rotation.z = -0.75; L.arms[0].rotation.x = -0.5; L.arms[1].rotation.x = 0.2;
      }else{
        const b = pivotAll(w, 0.62); b.rotation.x = 0.55;   // 32도 앞으로 쏠린 몸 — 서 있는 사람과 실루엣이 갈린다
        w.speed *= 1.8; w.rate = 12;
        // 걸음을 sin 으로만 흔들면 다리가 모이는 순간이 있어 「뛴다」가 한 프레임씩 사라진다.
        // 보폭에 바닥을 깔아 항상 크게 벌어져 있게 하고, 발이 뜨도록 몸을 띄운다.
        w.tick = ww=>{
          const s = Math.sin(ww.phase), Lb = ww.g.userData.limbs;
          Lb.legs[0].rotation.x =  0.62 + s*0.55; Lb.legs[1].rotation.x = -0.62 + s*0.55;
          Lb.arms[0].rotation.x = -1.15 - s*0.45; Lb.arms[1].rotation.x = 0.85 - s*0.45;
          ww.body.position.y = 0.62 + Math.max(0, Math.sin(ww.phase*0.5))*0.32;
        };
      }
    },

    /* plank — 「발이 발판 틈에 빠진다」 / 정상 「발판 가운데를 딛는다」 */
    plank(w, safe){
      const g = w.g;
      g.position.y = 0.46;
      [-0.44, 0.44].forEach(z=> box(1.5, 0.09, 0.56, woodMat, g, 0, -0.045, z));   // 사이가 0.32m 벌어진 발판 두 장
      [-0.62, 0.62].forEach(x=> [-0.55, 0.55].forEach(z=> tube(0.05, 0.37, steelMat, g, x, -0.275, z)));
      box(1.5, 0.06, 0.06, steelMat, g, 0, -0.43, -0.55);
      box(1.5, 0.06, 0.06, steelMat, g, 0, -0.43,  0.55);
      const b = pivotAll(w, 0);
      w.amp = 0; w.armsFree = false;
      if(safe){ b.position.z = 0.44; }
      else {
        b.position.y = -0.34; b.rotation.z = 0.30;          // 틈으로 빠져 내려앉고 몸이 기운다
        g.userData.limbs.arms.forEach(a=> a.rotation.x = -2.45);   // 두 팔이 위로
      }
    },

    /* scaffold — 「자재를 한 칸에 높이 쌓는다」 / 정상 「자재를 나눠 나른다」 */
    scaffold(w, safe){
      const g = w.g;
      [-0.8, 0.8].forEach(x=> tube(0.05, 2.7, steelMat, g, x, 1.35, -0.62));
      [0.9, 1.85].forEach(y=> tube(0.045, 1.6, steelMat, g, 0, y, -0.62, 0, Math.PI/2));
      box(1.7, 0.08, 0.62, woodMat, g, 0, 0.95, -0.62);
      // 적재물은 두 쪽 다 몸 옆(x=0.45)에 둔다. 정상 쪽 자재가 몸에 가리면 「자재가 있으면 위험」이
      // 돼 버려서, 표가 적재 높이가 아니라 자재 유무가 된다.
      const n = safe ? 2 : 9;
      for(let i=0;i<n;i++){
        const b2 = box(0.62, 0.13, 0.44, i%2 ? brickMat : woodMat, g, 0.45 + (safe ? 0 : i*0.028), 1.06 + i*0.14, -0.62);
        if(!safe) b2.rotation.y = i*0.05;                   // 위로 갈수록 어긋나며 기운다
      }
      if(safe){
        box(0.42, 0.13, 0.3, brickMat, g, 0, 0.79, 0.36);   // 한 장씩 나눠 나른다
        g.userData.limbs.arms.forEach(a=> a.rotation.x = -0.75); w.armsFree = false;
      }
    },

    /* carry — 「무릎을 편 채 상체만 숙인다」 / 정상 「무릎을 굽히고 든다」 */
    carry(w, safe){
      const g = w.g, L = g.userData.limbs;
      w.amp = 0; w.armsFree = false;
      if(safe){
        const b = pivotAll(w, 0); b.position.y = -0.24;     // 무릎을 굽혀 낮췄다(몸통은 세운 채)
        L.legs[0].rotation.z = 0.3; L.legs[1].rotation.z = -0.3;
        L.arms.forEach(a=> a.rotation.x = -0.95);
        box(0.56, 0.4, 0.4, woodMat, b, 0, 0.98, 0.42);
      }else{
        const b = pivotUp(w, 0.62); b.rotation.x = 1.32;    // 다리는 편 채 허리만 굽혔다 — 등이 거의 수평
        L.arms.forEach(a=> a.rotation.x = -0.4);
        box(0.56, 0.4, 0.4, woodMat, b, 0, -0.03, 0.36);
      }
    },

    /* noise — 「소음 구역인데 귀가 맨귀」 / 정상 「귀덮개를 쓰고 있다」
       ★ 「없음」이 표인 행동. 두 쪽 다 같은 소음원(브레이커)과 같은 소음 파형을 갖는다.
       다른 것은 청록색 귀덮개 하나뿐 — 그게 있어야 오지적이 운이 아니게 된다. */
    noise(w, safe){
      const g = w.g, L = g.userData.limbs;
      box(0.18, 0.52, 0.2, darkMat, g, 0.06, 0.86, 0.44);
      tube(0.045, 0.66, steelMat, g, 0.06, 0.28, 0.44);
      box(0.3, 0.1, 0.13, forkMat, g, 0.06, 1.1, 0.44);
      L.arms.forEach(a=> a.rotation.x = -0.9); w.armsFree = false;
      const nm = noiseMat.clone();
      [-1, 1].forEach(s=> [0.28, 0.44].forEach(r=>{
        const a = new THREE.Mesh(new THREE.TorusGeometry(r, 0.03, 6, 18, Math.PI*0.8), nm);
        a.position.set(0, 1.44, 0.03); a.rotation.z = s > 0 ? -Math.PI*0.4 : Math.PI*0.6; g.add(a);
      }));
      w.tick = ww=>{ nm.opacity = 0.4 + 0.45*Math.abs(Math.sin(ww.phase*0.9)); };
      if(safe){
        const head = g.userData.head;
        [-1, 1].forEach(s=>{ const m = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.1, 14), muffMat); m.position.set(s*0.21, -0.01, 0); m.rotation.z = Math.PI/2; head.add(m); });
        const band = new THREE.Mesh(new THREE.TorusGeometry(0.235, 0.035, 6, 16, Math.PI), muffMat);
        head.add(band);
      }
    },

    /* approach — 「전선 쪽으로 손을 뻗는다」 / 정상 「절연용 방호구를 쓰고 거리를 둔다」 */
    approach(w, safe){
      const g = w.g, L = g.userData.limbs;
      [-1.4, 1.4].forEach(x=> tube(0.06, 2.5, darkMat, g, x, 1.25, -0.35));
      tube(0.05, 2.8, darkMat, g, 0, 2.15, -0.35, 0, Math.PI/2);
      [-1.4, 1.4].forEach(x=> tube(0.1, 0.2, stripeMat, g, x, 2.32, -0.35));
      if(safe){
        tube(0.14, 1.5, orangeMat, g, 0, 2.15, -0.35, 0, Math.PI/2);   // 절연용 방호관
      }else{
        L.arms[1].rotation.x = -3.0; w.armsFree = false;               // 전선 쪽으로 손을 뻗는다
        link(P3(0.3, 1.80, -0.06), P3(0.30, 2.06, -0.24), 0.022, arcMat, g);
        const sp = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 6), arcMat);
        sp.position.set(0.30, 2.10, -0.28); g.add(sp);
      }
    },

    /* forklift — 「움직이는 지게차 앞을 가로지른다」 / 정상 「지게차를 보내고 지나간다」
       ★ 지게차는 두 쪽이 위치·크기까지 글자 그대로 같다. 정상 쪽만 멀리 두면 작업자가 다가올수록
       화면 밖으로 밀려서(수평 반폭 = 거리×0.267 이라 6m 에선 1.60m 뿐) 「지게차가 보이면 위험,
       안 보이면 정상」이 된다 — 표를 안 보고 이기는 길이 생긴다.
       그래서 자리를 옮기는 것은 기계가 아니라 사람이다. 위험한 쪽은 통행로 줄무늬 위에서 포크
       사이를 지나가고, 정상 쪽은 줄무늬 밖으로 비켜서서 지게차를 본다. 줄무늬도 두 쪽이 같다. */
    forklift(w, safe){
      const g = w.g;
      const f = new THREE.Group(); f.position.set(-1.0, 0, -0.15); f.rotation.y = Math.PI/2; g.add(f);
      box(1.0, 0.75, 1.5, forkMat, f, 0, 0.55, -0.1);
      box(0.8, 0.5, 0.7, darkMat, f, 0, 1.1, -0.45);
      [-0.45, 0.45].forEach(x=> [-0.75, 0.15].forEach(z=> tube(0.05, 1.0, forkMat, f, x, 1.4, z)));
      box(1.15, 0.08, 1.15, forkMat, f, 0, 1.92, -0.3);                 // 헤드가드
      [-0.3, 0.3].forEach(x=> tube(0.06, 1.9, steelMat, f, x, 0.95, 0.72));
      [-0.3, 0.3].forEach(x=> box(0.1, 0.07, 0.6, steelMat, f, x, 0.11, 1.02));   // 포크(끝이 월드 x=+0.32)
      [-0.5, 0.5].forEach(x=> [-0.55, 0.5].forEach(z=>{
        const wl = new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.16, 14), darkMat);
        wl.position.set(x, 0.26, z); wl.rotation.z = Math.PI/2; f.add(wl);
      }));
      // 지게차 통행로. 발이 이 위에 있느냐 밖에 있느냐가 두 번째 표다(거리 하나에만 기대지 않는다).
      const path = new THREE.Mesh(new THREE.PlaneGeometry(2.3, 0.95), new THREE.MeshBasicMaterial({map: forkPathTex}));
      path.rotation.x = -Math.PI/2; path.position.set(-0.70, 0.012, -0.15); g.add(path);
      // fix round 1 (리뷰 Important): 처음엔 「발밑 붉은 원」을 unsafe 분기 안에서만 그려서
      // 「원이 있으면 위험」이 됐었다 — 위험구역은 누가 서 있든 존재해야 한다는 원칙을 어겼다.
      // 통행로(path)가 이미 양쪽에 있는 것처럼, 위험구역 테두리도 통행로 가장자리에 두르는
      // 것으로 옮겼다(if/else 밖 — 두 쪽 다 그린다). 표는 이제 「테두리 유무」가 아니라 noise
      // 의 귀덮개·approach 의 방호관처럼 「그 안에 있느냐 밖이냐」다. 리뷰어가 네이티브 390px
      // 에서 이전 원이 잘 안 보인다고 지적한 것도 여기서 같이 고친다 — 판 전체를 두르는 굵은
      // 테두리라 반경 0.3~0.46 짜리 원 하나보다 훨씬 크게 보인다.
      const dzMat = dangerMat.clone(); dzMat.opacity = .8;
      const dzW = 2.3, dzD = 0.95, dzX = -0.70, dzZ = -0.15, dzB = 0.07;
      function dzEdge(w2, d2, x2, z2){
        const m = new THREE.Mesh(new THREE.PlaneGeometry(w2, d2), dzMat);
        m.rotation.x = -Math.PI/2; m.position.set(x2, 0.02, z2); g.add(m);
      }
      dzEdge(dzW, dzB, dzX, dzZ - dzD/2);   // 앞
      dzEdge(dzW, dzB, dzX, dzZ + dzD/2);   // 뒤
      dzEdge(dzB, dzD, dzX - dzW/2, dzZ);   // 좌
      dzEdge(dzB, dzD, dzX + dzW/2, dzZ);   // 우
      if(safe){
        pivotAll(w, 0).position.x = 0.95;        // 통행로 밖으로 비켜선다(포크 끝까지 0.45m)
        pivotUp(w, 0.62).rotation.y = -0.9;      // 지게차 쪽을 보고 선다
      }else{
        w.tick = ww=>{ f.position.x = -1.0 + Math.sin(ww.g.position.z*0.9)*0.10; };
      }
    },

    /* grinder — 「연삭기에 덮개가 없다」 / 정상 「덮개가 씌워져 있다」 */
    grinder(w, safe){
      const g = w.g, L = g.userData.limbs;
      L.arms.forEach(a=> a.rotation.x = -0.95); L.arms[1].rotation.z = -0.3; w.armsFree = false;
      // 연삭기를 배 앞에 두면 흰 숫돌이 몸통에 겹쳐 덮개 유무가 안 보인다(1차 촬영에서 확인).
      // 몸 옆으로 빼서 숫돌이 배경 위에 놓이게 한다.
      const gr = new THREE.Group(); gr.position.set(0.42, 0.96, 0.5); g.add(gr);
      box(0.36, 0.16, 0.17, darkMat, gr, -0.32, 0, 0);
      const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.30, 0.30, 0.035, 24), wheelMat);
      disc.rotation.x = Math.PI/2; gr.add(disc);
      if(safe){
        const hood = new THREE.Mesh(new THREE.CylinderGeometry(0.37, 0.37, 0.22, 24, 1, true, Math.PI*0.02, Math.PI*1.24), guardMat);
        hood.rotation.x = Math.PI/2; hood.material.side = THREE.DoubleSide; gr.add(hood);
        const side = new THREE.Mesh(new THREE.CircleGeometry(0.36, 24, Math.PI*0.02, Math.PI*1.24), guardMat);
        side.position.z = 0.12; side.material.side = THREE.DoubleSide; gr.add(side);   // 카메라 쪽에서 숫돌 윗부분을 가린다
      }
      const sm = arcMat.clone(); const sparks = [];
      const n = safe ? 5 : 16, spread = safe ? 0.5 : 2.7;
      const sz = safe ? 0.05 : 0.075;
      for(let i=0;i<n;i++){ const s = new THREE.Mesh(new THREE.BoxGeometry(sz, sz, sz), sm); gr.add(s); sparks.push(s); }
      w.tick = ww=>{ sparks.forEach((s, i)=>{
        const a = -Math.PI*0.5 + (((i*0.37 + ww.phase*0.11) % 1) - 0.5)*spread;
        const r = 0.34 + (((i*0.23 + ww.phase*0.31) % 1))*(safe ? 0.2 : 0.52);
        s.position.set(Math.cos(a)*r, Math.sin(a)*r, 0.02);
      }); };
    },

    /* confined — 「맨몸으로 맨홀에 들어간다」 / 정상 「송풍기를 돌리고 들어간다」
       ★ 「없음」이 표인 행동. 두 쪽 다 맨홀에 반쯤 들어간 모습이고, 정상 쪽에만 송풍기와 덕트가 있다. */
    confined(w, safe){
      const g = w.g, L = g.userData.limbs;
      const b = pivotAll(w, 0); b.position.y = -0.62;
      w.amp = 0; w.armsFree = false; L.arms.forEach(a=> a.rotation.x = -0.25);
      const hole = new THREE.Mesh(new THREE.CircleGeometry(0.44, 24), darkMat);
      hole.rotation.x = -Math.PI/2; hole.position.y = 0.02; g.add(hole);
      const rim = new THREE.Mesh(new THREE.TorusGeometry(0.46, 0.07, 8, 24), steelMat);
      rim.rotation.x = Math.PI/2; rim.position.y = 0.05; g.add(rim);
      const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.07, 20), steelMat);
      lid.position.set(0.88, 0.44, 0.12); lid.rotation.z = Math.PI/2 - 0.22; g.add(lid);
      if(safe){
        const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.48, 16), drumMat);
        drum.position.set(-1.2, 0.32, -0.3); drum.rotation.z = Math.PI/2; g.add(drum);
        box(0.72, 0.1, 0.7, darkMat, g, -1.2, 0.05, -0.3);
        const duct = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.1, 8, 20, Math.PI), ductMat);
        duct.position.set(-0.6, 0.15, -0.2); g.add(duct);                // 맨홀로 들어가는 송풍 덕트
      }
    },
  };

  // ACT_BUILD: 불안전 행동을 하는 사람 · ACT_SAFE: 같은 상황에서 규정을 지킨 사람(미끼)
  const ACT_BUILD = {}, ACT_SAFE = {};
  Object.keys(RIG).forEach(id=>{ ACT_BUILD[id] = w=> RIG[id](w, false); ACT_SAFE[id] = w=> RIG[id](w, true); });
  (window.HAZARD_ACTS || []).forEach(a=>{ if(!ACT_BUILD[a.id]) console.error('ACT_BUILD 누락: ' + a.id); });

  /* ---------- 게임 상태 · 스폰 · 걸음 · 판정 ---------- */
  // judgeN·judgeOk: Task 5 종료 화면의 지적 정확도(맞은 지적/전체 지적)가 읽는다. judge(w) 가 채운다.
  // fix round 3(C1) — wrong: 다음 무재해 1칸까지 남은 오지적 누적(3에서 0으로 되돌아간다) ·
  // wrongTotal: 한 판의 오지적 총 횟수(종료 화면) · wrongLives: 오지적으로 잃은 칸 수 ·
  // overCause: 무엇으로 끝났는가('accident' 놓침 / 'wrong' 오지적) — 종료 화면 헤드라인이 읽는다.
  const S = { workers: [], t: 0, lives: 3, score: 0, wave: 0, running: false,
              streak: 0, stun: 0, basisT: 0, warnT: 0, missed: [], over: false, judgeN: 0, judgeOk: 0,
              wrong: 0, wrongTotal: 0, wrongLives: 0, overCause: null };

  // 조끼 색은 행동과 무관하게 뽑는다. 색으로 위험/정상이 갈리면 「보고 나서 쏘는」 일이 사라지고
  // 게임이 색깔 맞추기가 된다 — 그러면 오지적 벌칙도 학습도 뜻이 없다.
  const VEST = [0xF07056, 0x4F86C6, 0x5CC08A, 0xE0A33C, 0xB07FD8];

  // act 가 null 이면 그냥 정상 작업자. act 를 주고 safe=true 면 「같은 상황에서 규정을 지킨」 미끼로,
  // 판정은 정상 작업자다(지적하면 오지적). Task 4 의 웨이브가 이 세 가지를 섞어 낸다.
  function spawnWorker(act, safe){
    const g = worker(VEST[(Math.random()*VEST.length)|0]);
    const side = Math.random() < .5 ? -1 : 1;
    g.position.set(side * (2 + Math.random()*3), 0, -12 - Math.random()*4);
    scene.add(g);
    // 몸 부품을 피벗 하나로 묶는다. (1) 자세를 g.lookAt 에 덮이지 않게 주고 (2) 레이캐스트를
    // 몸에만 걸어 소품(사다리·지게차)을 클릭해도 사람을 부른 것으로 치지 않는다.
    const pv = new THREE.Group(); g.children.slice().forEach(k=> pv.add(k)); g.add(pv); g.userData.pv = pv;
    // 일제 점검(sweepHighlight)이 나중에 이 몸 메시들을 traverse 하며 필요로 하는 boundingSphere 를
    // 여기서 한 번만 미리 계산해 둔다(리뷰 Minor) — 몸 27개 메시는 전부 여기서 만들어지고 이후엔
    // 안 늘어나니, 만들 때 한 번이면 충분하고 sweepHighlight 는 몇 번을 불려도 다시 안 잰다.
    pv.traverse(o=>{ if(o.isMesh && o.geometry && !o.geometry.boundingSphere) o.geometry.computeBoundingSphere(); });
    // safe: Task 4 웨이브가 「웨이브마다 미끼가 최소 1명 나온다」를 셀 수 있게 남겨 두는 플래그.
    // w.act===null 만으로는 미끼(spawn(act,true))와 행인(spawn(null))이 구분되지 않는다.
    const w = { g, body: pv, act: safe ? null : (act || null), look: act ? act.id : null, safe: !!safe,
                phase: Math.random()*6, speed: 0.9 + Math.random()*0.3,
                stopped: false, done: false };
    S.workers.push(w);
    const build = act ? (safe ? ACT_SAFE : ACT_BUILD)[act.id] : null;
    if(build) build(w);
    return w;
  }

  function stepWorkers(dt){
    for(const w of S.workers){
      if(w.stopped || w.done) continue;
      w.phase += dt * (w.rate || 6);
      w.g.position.z += dt * w.speed;
      w.g.position.x += (0 - w.g.position.x) * dt * 0.4;
      w.g.lookAt(w.g.position.x, w.g.position.y, w.g.position.z + 1);
      walkPose(w.g, w.phase, w.amp === undefined ? 0.5 : w.amp, w.armsFree !== false);
      if(w.tick) w.tick(w, dt);          // 표 자체의 움직임(불꽃·소음 파형·지게차)은 walkPose 뒤에 덮는다
      if(w.g.position.z > 3) reachedZone(w);
    }
  }

  /* 근거 한 줄 — act.law 를 글자 그대로 쓴다. 자르거나 다듬지 않는다(접어 보이는 처리는 Task 5). */
  // Task 4: double(4웨이브)이 표 둘을 한 사람에게 같이 건다 — acts 를 배열로도 받아 둘 다 보여준다.
  function showBasis(acts){
    const list = Array.isArray(acts) ? acts : [acts];
    const b = el('dBasis'); if(!b) return;
    b.textContent = '';
    list.forEach(act=>{
      const n = document.createElement('b'); n.textContent = act.name;
      const l = document.createElement('span'); l.textContent = act.law;
      b.appendChild(n); b.appendChild(l);
    });
    b.hidden = false; S.basisT = 2.6;
  }

  // 옳게 지적당한 작업자는 잠깐 바로잡는 시늉을 하고 물러난다
  function fixAnim(w){
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.34, 0.05, 8, 20),
                                new THREE.MeshBasicMaterial({color: col(0x5CC08A), transparent: true, opacity: .95, depthTest: false}));
    ring.position.copy(w.g.localToWorld(P3(w.body.position.x, 2.0, w.body.position.z))); ring.lookAt(camera.position); scene.add(ring);
    FX.push({o: ring, life: 0.9, t: 0.9});
    const L = w.g.userData.limbs; if(L) L.arms.forEach(a=> a.rotation.x = -1.9);
    setTimeout(()=> fadeOut(w), 700);
  }

  // skinMat·pantsMat 같은 재질은 여러 작업자가 함께 쓴다 — 투명도를 건드리면 남의 몸까지 흐려진다.
  // 그래서 퇴장은 오그라들며 사라지는 것으로 만들었다.
  function fadeOut(w){
    if(w.gone) return; w.gone = true; w.done = true; w.stopped = true;
    const t0 = performance.now();
    (function step(){
      const k = Math.min(1, (performance.now() - t0)/450);
      w.g.scale.setScalar(Math.max(0.001, 1 - k));
      if(k < 1) requestAnimationFrame(step);
      else { scene.remove(w.g); const i = S.workers.indexOf(w); if(i >= 0) S.workers.splice(i, 1); }
    })();
  }

  function accidentFx(w){
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.42, 28),
                                new THREE.MeshBasicMaterial({color: col(0xF07056), transparent: true, opacity: .9, side: THREE.DoubleSide, depthTest: false}));
    ring.position.copy(w.g.position).add(P3(0, 0.06, 0)); ring.rotation.x = -Math.PI/2; scene.add(ring);
    FX.push({o: ring, life: 0.7, t: 0.7, grow: 5});
    const f = el('dFlash'); if(f){ f.classList.add('on'); setTimeout(()=> f.classList.remove('on'), 90); }
  }

  // fix round 3(C1) — 끝나는 길이 둘이 됐다: 놓쳐서(사고) 0칸, 오지적 3회씩 쌓여 0칸.
  // 둘 다 「무재해 기록 0 = 종료」라는 같은 규칙이고 끝나는 방식도 같다 — 다른 것은 왜 끝났는지뿐이다.
  function gameOver(cause){
    S.running = false; S.over = true; S.overCause = cause || 'accident';
    S.stun = 0;                       // 경직 중에 끝났어도 잠김 표시를 남기지 않는다
    lockUi(false);
    el('hint').textContent = S.overCause === 'wrong'
      ? '오지적 ' + S.wrongTotal + '회 — 게임 오버'
      : '사고 ' + S.missed.length + '회 — 게임 오버';
    showEndScreen();
  }

  function lockUi(on){
    const f = el('fx'), s = el('dStun');
    if(f) f.classList.toggle('lock', !!on);
    if(s) s.hidden = !on;
  }

  // 작업 구역(z>3) 도달 = 놓쳤다. 불안전 행동을 하던 사람이면 사고.
  // fix round 1: w.spawnWave·wstat 은 이 함수보다 뒤(Task 4 절)에서 정의되지만, 함수 선언은
  // 끌어올려지고(hoist) reachedZone 은 게임 루프가 돈 뒤에야 불리므로 여기서 써도 안전하다.
  function reachedZone(w){
    if(w.done) return;
    w.done = true;
    if(w.spawnWave){ const st = wstat(w.spawnWave); st.arrived++; if(w.safe) st.baitArrived++; }
    if(w.act){
      S.lives--; S.missed.push(w.act); if(w.act2) S.missed.push(w.act2); S.streak = 0; accidentFx(w);
      hitMark('bad'); popText('사고 발생', true);
      hud();
      if(S.lives <= 0) gameOver('accident');
    }
    fadeOut(w);                                   // 정상 작업자는 그냥 지나간다
  }

  function judgeAt(cx, cy){
    if(!S.running || S.stun > 0) return;          // 경직 중에는 호루라기가 안 나간다
    const r = new THREE.Raycaster();
    r.setFromCamera(new THREE.Vector2((cx/innerWidth)*2 - 1, -(cy/innerHeight)*2 + 1), camera);
    const live = S.workers.filter(w=> !w.stopped && !w.done);
    const hits = r.intersectObjects(live.map(w=> w.body), true);   // 소품 말고 사람만
    whistle();
    if(!hits.length){ pointLine(r.ray.at(30, P3())); return; }
    let o = hits[0].object; while(o.parent && !live.some(w=> w.body === o)) o = o.parent;
    const w = live.find(x=> x.body === o);
    if(w) judge(w);
  }
  // Task 4: 정비 시간 카드·일제 점검 버튼은 이 캔버스 위에 뜨는 진짜 DOM 이라, 그냥 두면 버튼을
  // 눌러도 이 window 레벨 리스너가 같이 걸려 judgeAt() 이 불려 호루라기가 헛되게 나간다.
  addEventListener('pointerdown', e=>{ if(e.target.closest && e.target.closest('#dMaint,#btnSweep,#dEnd,#btnHome')) return; judgeAt(e.clientX, e.clientY); });

  /* 판정. 오지적 벌칙(감점 + 1.2초 경직)이 이 게임의 중심이다 — 이게 없으면 화면을 긁는 것이
     최적 전략이 되고, 그러면 「보고 나서 쏘는」 일이 사라져 학습과 무관해진다. */
  function judge(w){
    if(w.stopped || w.done) return;
    w.stopped = true;
    S.judgeN++;                                   // 종료 화면의 "전체 지적" — double(표 둘)도 클릭 하나면 1회
    pointLine(w.g.localToWorld(P3(w.body.position.x, 1.1, w.body.position.z)));   // 몸이 옆으로 비켜선 경우(forklift 정상)도 사람을 가리킨다
    if(w.act){                                    // 옳은 지적
      S.judgeOk++;                                // 종료 화면의 "맞은 지적"
      const acts = w.act2 ? [w.act, w.act2] : [w.act];   // double(4웨이브) 은 표 둘을 같이 낸다
      let gained = 0;
      acts.forEach(()=>{ gained += 100 + Math.min(4, S.streak)*50; S.streak++; });
      S.score += gained;
      hitMark('ok'); popText('+' + gained + (acts.length > 1 ? ' (표 둘)' : ''));
      showBasis(acts);                            // 근거 한 줄(표 둘이면 두 줄)
      fixAnim(w);                                 // 시정 동작 후 퇴장
    }else{                                        // 오지적
      S.score = Math.max(0, S.score - 150); S.streak = 0;
      hitMark('bad'); popText('오지적 −150', true);
      S.stun = 1.2; lockUi(true);                 // 1.2초 호루라기 잠김
      setTimeout(()=>{ if(!w.done) w.stopped = false; }, 900);
      wrongCall();                                // fix round 3(C1) — 3회면 무재해 1칸
      if(S.over) return;                          // 그 3회째가 마지막 칸이었으면 이미 끝났다
    }
    hud();
  }

  /* fix round 3(C1) — 오지적 3회 = 무재해 1칸 소진.
     예전엔 오지적이 감점(−150)과 경직(1.2초)뿐이었다 — 승패를 가르는 것을 아무것도 소모하지
     않는다. 점수는 0에서 바닥을 치고 무재해 기록은 「놓친 경우에만」 줄었으므로, 표(tell)를
     하나도 안 보고 「경직이 풀릴 때마다 가장 앞선 사람을 한 번씩」 부는 것만으로 5웨이브를
     완주할 수 있었다(리뷰 Critical 1 · 실측 4/4판 완주, 무재해 3/3 유지, 사고 0). 설계문서가
     「오지적 벌칙이 중심이다」에서 막겠다고 한 바로 그 전략이다.
     그래서 오지적도 놓침과 같은 자원(무재해 3칸)을 쓰게 한다 — 다만 3회에 1칸이라, 한 번쯤의
     실수로는 안 죽고 「난사」는 곧바로 죽는다. 감점과 경직은 그대로 둔다(더하는 것이지
     바꾸는 것이 아니다). */
  const WRONG_PER_LIFE = 3;
  function wrongCall(){
    S.wrong++; S.wrongTotal++;
    if(S.wrong < WRONG_PER_LIFE){ hud(); return; }
    S.wrong = 0;                                  // 안전모 하나당 3회 — 소진하면 누적을 0으로 되돌린다
    S.lives--; S.wrongLives++; S.streak = 0;
    // 사고(놓침)와 화면에서 갈라 둔다 — 붉은 섬광(accidentFx)은 여기서 쓰지 않는다.
    warnBanner('오지적 ' + WRONG_PER_LIFE + '회 — 무재해 1칸 소진');
    hud();
    if(S.lives <= 0) gameOver('wrong');
  }
  function warnBanner(txt){
    const b = el('dWarn'); if(!b) return;
    b.textContent = txt; b.hidden = false; S.warnT = 2.2;
  }

  /* ---------- Task 4: 웨이브 다섯 · 정비 시간 · 일제 점검 ----------
     이 시점엔 S·spawnWorker·ACT_BUILD·ACT_SAFE·judge·reachedZone·showBasis·hud 가 전부 이미
     있다(모두 위에서 정의됨). RIG 는 손대지 않는다 — trap 은 RIG.fall 을 감싸지 않고 밖에서
     새로 짓고, double 은 ACT_BUILD 를 그대로(두 번) 불러 쓴다. */

  const ACTS_ALL = window.HAZARD_ACTS || [];
  const ACT_BY_ID = {}; ACTS_ALL.forEach(a=> ACT_BY_ID[a.id] = a);

  const WAVES = [
    {n:1, sec:45, every:2.6, safeRatio:0.00, acts:a=> a.wave<=1},
    {n:2, sec:45, every:2.2, safeRatio:0.40, acts:a=> a.wave<=2},
    {n:3, sec:45, every:1.9, safeRatio:0.40, acts:a=> a.wave<=3},
    {n:4, sec:45, every:1.6, safeRatio:0.45, acts:a=> a.wave<=4, double:true},
    {n:5, sec:45, every:1.3, safeRatio:0.45, acts:a=> a.wave<=5, trap:true},
  ];

  // 정비 시간 문항 — build_safety.py 의 KW 표(주제키→정규식)를 그대로 옮겨 law_bank.json 을
  // 미리 걸러 둔 것이다. 12 주제 전부 1건 이상 걸렸다(fall·carry 가 가장 적어 2건). 이 페이지는
  // law_bank.json 을 런타임에 안 읽는다 — 자립형 페이지라 fetch 가 없고, 869건 전체를 넣는

  const MAINT_QUIZ = {"fall":[{"t":"추락에 의한 위험 방지를 위하여 설치하는 안전방망의 경우 작업면으로부터 망의 설치지점까지의 수직거리가 최대 몇 미터를 초과하지 않도록 설치하는가?","c":["5m","7m","8m","10m"],"a":4,"pt":"<strong>추락방호망<\/strong><br><strong>10 [m]는 「이 정도 높이에서 떨어져도 방망이 받아 낼 수 있다」<\/strong>는 한계다 — <strong>더 높으면 방망 자체가 찢어지거나 바닥에 닿는다<\/strong>. <strong>「10 · 3 · 12% · 60」<\/strong> 네 숫자로 붙든다.<p><strong>◈ 암기<\/strong> <u>수직거리 10 [m] 이하<\/u>.<\/p>","src":"2022년 1회 104번 · 원본 2011.08.21","tm":1},{"t":"추락방호망(안전방망) 설치 시 작업면으로부터 망의 설치지점까지의 수직거리 기준은?","c":["5m를 초과하지 아니할 것","10m를 초과하지 아니할 것","15m를 초과하지 아니할 것","17m를 초과하지 아니할 것"],"a":2,"pt":"<strong>추락방호망<\/strong><br><strong>숫자가 「10 · 3 · 12% · 60」<\/strong>이다. <strong>10 [m]라는 값이 「이 정도 높이에서 떨어져도 방망이 받아 낼 수 있다」<\/strong>는 한계다.<p><strong>◈ 암기<\/strong> <u>수직거리 10 [m] 이하<\/u>.<\/p><p><strong>⚠ 주의사항<\/strong> 추락방호망 규정은 <u>2021.5.28 개정<\/u>으로 안전보건기준규칙 <u>제42조<\/u>로 옮겨 실렸다.<\/p>","src":"2023년 4회 103번 · 원본 2013.03.10","tm":1}],"rail":[{"t":"근로자의 추락 등의 위험을 방지하기 위한 안전난간의 설치기준으로 옳지 않은 것은?","c":["상부 난간대와 중간 난간대는 난간 길이 전체에 걸쳐 바닥면등과 평행을 유지할 것","발끝막이판은 바닥면등으로부터 20cm이상의 높이를 유지할 것","난간대는 지름 2.7cm 이상의 금속제 파이프나 그 이상의 강도가 있는 재료일 것","안전난간은 구조적으로 가장 취약한 지점에서 가장 취약한 방향으로 작용하는 100kg 이상의 하중에 견딜 수 있는 튼튼한 구조일 것"],"a":2,"pt":"<strong>안전보건규칙 제13조 — 안전난간의 구조 및 설치요건<\/strong><br><strong>상부 난간대는 90 [cm] 이상<\/strong>이며 <strong>상한은 없다<\/strong>. 120 [cm]는 <strong>중간 난간대를 몇 개 둘 것인가<\/strong>를 가르는 분기점일 뿐이다.<p><strong>◈ 암기<\/strong> <u>난간 90 이상, 폭목 10 이상, 지름 2.7, 하중 100<\/u>.<\/p><p><strong>⚖ 근거 법령<\/strong> <span class=\"eff\">산업안전보건기준에 관한 규칙 시행 2026. 3. 2.<\/span><\/p><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C13%EC%A1%B0\" target=\"_blank\">제13조(안전난간의 구조 및 설치요건)<\/a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.<\/span><\/div><div class=t>사업주는 근로자의 추락 등의 위험을 방지하기 위하여 안전난간을 설치하는 경우 다음 각 호의 기준에 맞는 구조로 설치해야 한다. &lt;개정 2015.12.31, 2023.11.14&gt;<br> 1. 상부 난간대, 중간 난간대, 발끝막이판 및 난간기둥으로 구성할 것. 다만, 중간 난간대, 발끝막이판 및 난간기둥은 이와 비슷한 구조와 성능을 가진 것으로 대체할 수 있다.<br>▶  2. <strong>상부 난간대는<\/strong> 바닥면ㆍ발판 또는 경사로의 표면(이하 \"바닥면등\"이라 한다)으로부터 90센티미터 이상 지점에 설치하고, 상부 난간대를 120센티미터 이하에 설치하는 경우에는 중간 난간대는 상부 난간대와 바닥면등의 중간에 설치해야 하며, 120센티미터 이상 지점에 설치하는 경우에는 <strong>중간 난간대를<\/strong> 2단 이상으로 균등하게 설치하고 난간의 상하 간격은 60센티미터 이하가 되도록 할 것. 다만, 난간기둥 간의 간격이 25센티미터 이하인 경우에는 <strong>중간 난간대를<\/strong> 설치하지 않을 수 있다.<br>▶  3. 발끝막이판은 바닥면등으로부터 10센티미터 이상의 <strong>높이를 유지할 것<\/strong>. 다만, 물체가 떨어지거나 날아올 위험이 없거나 그 위험을 방지할 수 있는 망을 설치하는 등 필요한 예방 조치를 한 장소는 제외한다.<br>▶  4. 난간기둥은 상부 난간대와 <strong>중간 난간대를<\/strong> 견고하게 떠받칠 수 있도록 적정한 간격을 유지할 것<br> 5. 상부 난간대와 중간 난간대는 난간 길이 전체에 걸쳐 바닥면등과 평행을 유지할 것<br> 6. 난간대는 지름 2.7센티미터 이상의 금속제 파이프나 그 이상의 강도가 있는 재료일 것<br> 7. 안전난간은 구조적으로 가장 취약한 지점에서 가장 취약한 방향으로 작용하는 100킬로그램 이상의 하중에 견딜 수 있는 튼튼한 구조일 것<\/div><\/div>","src":"2026년 4회 112번 · 원본 2016.03.06","tm":3},{"t":"안전난간의 구조 및 설치요건에 대한 기준으로 옳지 않은 것은?","c":["상부난간대는 바닥면ㆍ발판 또는 경사로의 표면으로부터 90cm 이상 지점에 설치할 것","발끝막이판은 바닥면 등으로부터 10cm 이상의 높이를 유지할 것","난간대는 지름 1.5cm 이상의 금속제파이프나 그 이상의 강도를 가진 재료일 것","안전난간은 구조적으로 가장 취약한 지점에서 가장 취약한 방향으로 작용하는 100kg 이상의 하중에 견딜 수 있는 튼튼한 구조일 것"],"a":3,"pt":"<strong>안전난간의 구조<\/strong><br><strong>「90 ~ 120 · 60 · 10 · 2.7 · 100」<\/strong> 다섯 숫자다 — <strong>2.7 [cm]는 손으로 쥘 만한 굵기<\/strong>라 1.5 [cm] 로는 잡기도 어렵고 휘어진다.<p><strong>◈ 암기<\/strong> <u>난간대는 지름 2.7 [cm] 이상<\/u>.<\/p>","src":"2022년 4회 113번 · 원본 2012.03.04","tm":1},{"t":"근로자의 추락 등의 위험을 방지하기 위한 안전난간의 설치요건에서 상부난간대를 120cm 이상 지점에 설치하는 경우 중간난간대를 최소 몇 단 이상 균등하게 설치하여야 하는가?","c":["2단","3단","4단","5단"],"a":1,"pt":"<strong>안전보건규칙 제13조 — 안전난간의 구조<\/strong><br>핵심은 <strong>난간대 사이 간격을 60 [cm] 이하로 유지<\/strong> 하는 것이다. 상부 난간대가 높아질수록 그 사이를 메울 중간 난간대가 더 필요해진다.<p><strong>◈ 암기<\/strong> <u>120 [cm] 넘으면 2단 이상<\/u>.<\/p><p><strong>⚖ 근거 법령<\/strong> <span class=\"eff\">산업안전보건기준에 관한 규칙 시행 2026. 3. 2.<\/span><\/p><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C13%EC%A1%B0\" target=\"_blank\">제13조(안전난간의 구조 및 설치요건)<\/a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.<\/span><\/div><div class=t>사업주는 근로자의 추락 등의 위험을 방지하기 위하여 안전난간을 설치하는 경우 다음 각 호의 기준에 맞는 구조로 설치해야 한다. &lt;개정 2015.12.31, 2023.11.14&gt;<br> 1. 상부 난간대, 중간 난간대, 발끝막이판 및 난간기둥으로 구성할 것. 다만, 중간 난간대, 발끝막이판 및 난간기둥은 이와 비슷한 구조와 성능을 가진 것으로 대체할 수 있다.<br>▶  2. 상부 난간대는 바닥면ㆍ발판 또는 경사로의 표면(이하 \"바닥면등\"이라 한다)으로부터 90센티미터 이상 지점에 설치하고, 상부 난간대를 120센티미터 이하에 설치하는 경우에는 중간 난간대는 상부 난간대와 바닥면등의 중간에 설치해야 하며, 120센티미터 이상 지점에 설치하는 경우에는 <strong>중간 난간대를 2단 이상<\/strong>으로 균등하게 설치하고 난간의 상하 간격은 60센티미터 이하가 되도록 할 것. 다만, 난간기둥 간의 간격이 25센티미터 이하인 경우에는 중간 난간대를 설치하지 않을 수 있다.<br> 3. 발끝막이판은 바닥면등으로부터 10센티미터 이상의 높이를 유지할 것. 다만, 물체가 떨어지거나 날아올 위험이 없거나 그 위험을 방지할 수 있는 망을 설치하는 등 필요한 예방 조치를 한 장소는 제외한다.<br> 4. 난간기둥은 상부 난간대와 중간 난간대를 견고하게 떠받칠 수 있도록 적정한 간격을 유지할 것<br> 5. 상부 난간대와 중간 난간대는 난간 길이 전체에 걸쳐 바닥면등과 평행을 유지할 것<br> 6. 난간대는 지름 2.7센티미터 이상의 금속제 파이프나 그 이상의 강도가 있는 재료일 것<br> 7. 안전난간은 구조적으로 가장 취약한 지점에서 가장 취약한 방향으로 작용하는 100킬로그램 이상의 하중에 견딜 수 있는 튼튼한 구조일 것<\/div><\/div>","src":"2025년 2회 112번 · 원본 2020.09.26","tm":1}],"ladder":[{"t":"사다리식 통로 등을 설치하는 경우 고정식 사다리식 통로의 기울기는 최대 몇 도 이하로 하여야 하는가?","c":["60도","75도","80도","90도"],"a":4,"pt":"<strong>안전보건규칙 제24조 — 사다리식 통로의 구조<\/strong><br>고정식은 <strong>벽에 붙여 수직으로 세우는<\/strong> 것이라 90° 까지 허용한다. 대신 <strong>높이 7 [m] 이상이면 등받이울이나 개인용 추락 방지 시스템<\/strong>을 갖춰야 한다.<p><strong>◈ 암기<\/strong> <u>일반 75°, 고정식 90°<\/u>.<\/p><p><strong>⚠ 주의사항<\/strong> 높이 7 [m] 이상 고정식 사다리의 추락 방지는 옛 조문이 「2.5 [m] 지점부터 등받이울」이었으나, <u>2024. 6. 28. 개정<\/u>으로 <u>등받이울<\/u> 또는 <u>개인용 추락 방지 시스템 설치 후 전신안전대 사용<\/u> 중 하나를 고를 수 있게 됐다.<\/p><p><strong>⚖ 근거 법령<\/strong> <span class=\"eff\">산업안전보건기준에 관한 규칙 시행 2026. 3. 2.<\/span><\/p><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C24%EC%A1%B0\" target=\"_blank\">제24조(사다리식 통로 등의 구조)<\/a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.<\/span><\/div><div class=t>▶ ① 사업주는 사다리식 통로 등을 설치하는 경우 다음 각 호의 사항을 준수하여야 한다. &lt;개정 <strong>2024.6.<\/strong>28&gt;<br> 1. 견고한 구조로 할 것<br> 2. 심한 손상ㆍ부식 등이 없는 재료를 사용할 것<br> 3. 발판의 간격은 일정하게 할 것<br> 4. 발판과 벽과의 사이는 15센티미터 이상의 간격을 유지할 것<br> 5. 폭은 30센티미터 이상으로 할 것<br> 6. 사다리가 넘어지거나 미끄러지는 것을 방지하기 위한 조치를 할 것<br> 7. 사다리의 상단은 걸쳐놓은 지점으로부터 60센티미터 이상 올라가도록 할 것<br> 8. 사다리식 통로의 길이가 10미터 이상인 경우에는 5미터 이내마다 계단참을 설치할 것<br> 9. 사다리식 통로의 기울기는 75도 이하로 할 것. 다만, 고정식 사다리식 통로의 기울기는 90도 이하로 하고, 그 높이가 7미터 이상인 경우에는 다음 각 목의 구분에 따른 조치를 할 것<br>▶  가. <strong>등받이울<\/strong>이 있어도 근로자 이동에 지장이 없는 경우: 바닥으로부터 높이가 2.5미터 되는 지점부터 <strong>등받이울<\/strong>을 설치할 것<br>▶  나. <strong>등받이울<\/strong>이 있으면 근로자가 이동이 곤란한 경우: 한국산업표준에서 정하는 기준에 적합한 <strong>개인용 추락 방지 시스템<\/strong>을 설치하고 근로자로 하여금 한국산업표준에서 정하는 기준에 적합한 전신안전대를 사용하도록 할 것<br> 10. 접이식 사다리 기둥은 사용 시 접혀지거나 펼쳐지지 않도록 철물 등을 사용하여 견고하게 조치할 것<br>② 잠함(潛函) 내 사다리식 통로와 건조ㆍ수리 중인 선박의 구명줄이 설치된 사다리식 통로(건조ㆍ수리작업을 위하여 임시로 설치한 사다리식 통로는 제외한다)에 대해서는 제1항제5호부터 제10호까지의 규정을 적용하지 아니한다.<\/div><\/div>","src":"2025년 1회 111번 · 원본 2019.03.03","tm":2},{"t":"산업안전보건법령에 따라 사다리식 통로를 설치하는 경우 준수해야 할 기준으로 틀린 것은?","c":["사다리식 통로의 기울기는 60°이하로 할 것","발판과 벽과의 사이는 15cm 이상의 간격을 유지할 것","사다리의 상단은 걸쳐놓은 지점으로부터 60cm 이상 올라가도록 할 것","사다리식 통로의 길이가 10m 이상인 경우에는 5m 이내마다 계단참을 설치할 것"],"a":1,"pt":"<strong>사다리식 통로의 기준<\/strong><br><strong>사다리는 가파르게 세우는 것<\/strong>이다 — <strong>75°가 기본, 고정식 수직사다리는 90°<\/strong>다. <strong>60°는 오히려 계단에 가까운 각<\/strong>이다.<p><strong>◈ 암기<\/strong> <u>사다리식 통로 기울기는 75° 이하<\/u>.<\/p>","src":"2021년 2회 46번 · 원본 2019.08.04","tm":1},{"t":"사다리식 통로에 대한 설치기준으로 틀린 것은?","c":["발판의 간격을 일정하게 할 것","발판과 벽과의 사이는 15cm 이상의 간격을 유지할 것","사다리식 통로의 길이가 10m 이상인 때에는 3m 이내마다 계단참을 설치할 것","사다리의 상단은 걸쳐놓은 지점으로부터 60cm 이상 올라가도록 할 것"],"a":3,"pt":"<strong>안전보건규칙 제24조 — 사다리식 통로 등의 구조<\/strong><br>숫자를 묶어 둔다 — <strong>벽에서 15 · 폭 30 · 위로 60 · 길이 10/계단참 5 · 기울기 75°<\/strong>. <strong>「10/5」는 사다리식 통로, 「15/10」은 수직갱, 「8/7」은 비계다리<\/strong>로 셋을 갈라 잡는다.<p><strong>◈ 암기<\/strong> <u>사다리식 통로는 10 [m] 이상이면 5 [m] 마다<\/u>.<\/p><p><strong>⚖ 근거 법령<\/strong> <span class=\"eff\">산업안전보건기준에 관한 규칙 시행 2026. 3. 2.<\/span><\/p><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C24%EC%A1%B0\" target=\"_blank\">제24조(사다리식 통로 등의 구조)<\/a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.<\/span><\/div><div class=t>① 사업주는 사다리식 통로 등을 설치하는 경우 다음 각 호의 사항을 준수하여야 한다. &lt;개정 2024.6.28&gt;<br> 1. 견고한 구조로 할 것<br> 2. 심한 손상ㆍ부식 등이 없는 재료를 사용할 것<br> 3. 발판의 간격은 일정하게 할 것<br> 4. 발판과 벽과의 사이는 15센티미터 이상의 간격을 유지할 것<br> 5. 폭은 30센티미터 이상으로 할 것<br> 6. 사다리가 넘어지거나 미끄러지는 것을 방지하기 위한 조치를 할 것<br> 7. 사다리의 상단은 걸쳐놓은 지점으로부터 60센티미터 이상 올라가도록 할 것<br>▶  8. 사다리식 통로의 길이가 10미터 이상인 경우에는 5미터 <strong>이내마다 계단참을 설치할 것<\/strong><br> 9. 사다리식 통로의 기울기는 75도 이하로 할 것. 다만, 고정식 사다리식 통로의 기울기는 90도 이하로 하고, 그 높이가 7미터 이상인 경우에는 다음 각 목의 구분에 따른 조치를 할 것<br> 가. 등받이울이 있어도 근로자 이동에 지장이 없는 경우: 바닥으로부터 높이가 2.5미터 되는 지점부터 등받이울을 설치할 것<br> 나. 등받이울이 있으면 근로자가 이동이 곤란한 경우: 한국산업표준에서 정하는 기준에 적합한 개인용 추락 방지 시스템을 설치하고 근로자로 하여금 한국산업표준에서 정하는 기준에 적합한 전신안전대를 사용하도록 할 것<br> 10. 접이식 사다리 기둥은 사용 시 접혀지거나 펼쳐지지 않도록 철물 등을 사용하여 견고하게 조치할 것<br>▶ ② 잠함(潛函) 내 사다리식 통로와 건조ㆍ수리 중인 선박의 구명줄이 설치된 사다리식 통로(건조ㆍ수리작업을 위하여 임시로 설치한 <strong>사다리식 통로는<\/strong> 제외한다)에 대해서는 제1항제5호부터 제10호까지의 규정을 적용하지 아니한다.<\/div><\/div>","src":"2023년 2회 102번 · 원본 2014.08.17","tm":1}],"ramp":[{"t":"가설통로의 설치 기준으로 옳지 않은 것은?","c":["추락할 위험이 있는 장소에는 안전난간을 설치할 것","경사가 10° 를 초과하는 경우에는 미끄러지지 아니하는 구조로 할 것","경사는 30° 이하로 할 것","건설공사에 사용하는 높이 8m 이상인 비계다리에는 7m 이내마다 계단참을 설치할 것"],"a":2,"pt":"<strong>안전보건규칙 제23조 — 가설통로의 구조<\/strong><br>숫자 다섯을 묶어 둔다 — <strong>30 · 15 · 15 · 10 · 8 · 7<\/strong>. <strong>「경사 30 이하, 15 넘으면 미끄럼 방지」<\/strong> 두 값이 짝이고, <strong>「수직갱 15/10, 비계다리 8/7」<\/strong>이 또 한 짝이다.<p><strong>◈ 암기<\/strong> <u>30 이하, 15 넘으면 미끄럼 방지<\/u>.<\/p><p><strong>⚖ 근거 법령<\/strong> <span class=\"eff\">산업안전보건기준에 관한 규칙 시행 2026. 3. 2.<\/span><\/p><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85% 것은?","c":["7","6","5","4"],"a":1,"pt":"<strong>가설통로의 설치기준<\/strong><br><strong>숫자가 「30 · 15 · 15-10 · 8-7」<\/strong>로 이어진다 — <strong>수직갱은 「15 이상이면 10마다」, 비계다리는 「8 이상이면 7마다」<\/strong>로 두 짝이 헷갈리기 쉽다.<p><strong>◈ 암기<\/strong> <u>비계다리는 8 [m] 이상이면 7 [m] 이내마다<\/u>.<\/p>","src":"2022년 3회 101번 · 원본 2019.04.27","tm":1}],"plank":[{"t":"비계의 높이가 2m 이상인 작업장소에 설치하는 작업발판의 설치기준으로 옳지 않은 것은? (단, 달비계, 달대비계 및 말비계는 제외)","c":["작업발판의 폭은 40cm 이상으로 한다.","작업발판재료는 뒤집히거나 떨어지지 않도록 하나 이상의 지지물에 연결하거나 고정시킨다.","발판재료 간의 틈은 3cm 이하로 한다.","작업발판의 지지물은 하중에 의하여 파괴될 우려가 없는 것을 사용한다."],"a":2,"pt":"<strong>안전보건규칙 제56조 — 작업발판의 구조<\/strong><br><strong>「하나 이상」과 「둘 이상」<\/strong>을 바꿔 놓는 것이 단골 함정이다. <strong>뒤집힘을 막으려면 두 점 이상<\/strong> 이어야 한다는 것이 물리적 이유다.<p><strong>◈ 암기<\/strong> <u>지지물은 2개 이상<\/u>.<\/p><p><strong>⚖ 근거 법령<\/strong> <span class=\"eff\">산업안전보건기준에 관한 규칙 시행 2026. 3. 2.<\/span><\/p><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C56%EC%A1%B0\" target=\"_blank\">제56조(작업발판의 구조)<\/a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.<\/span><\/div><div class=t>사업주는 비계(달비계, 달대비계 및 말비계는 제외한다)의 높이가 2미터 이상인 작업장소에 다음 각 호의 기준에 맞는 작업발판을 설치하여야 한다. &lt;개정 2012.5.31, 2017.12.28&gt;<br> 1. 발판재료는 작업할 때의 하중을 견딜 수 있도록 견고한 것으로 할 것<br> 2. 작업발판의 폭은 40센티미터 이상으로 하고, 발판재료 간의 틈은 3센티미터 이하로 할 것. 다만, 외줄비계의 경우에는 고용노동부장관이 별도로 정하는 기준에 따른다.<br> 3. 제2호에도 불구하고 선박 및 보트 건조작업의 경우 선박블록 또는 엔진실 등의 좁은 작업공간에 작업발판을 설치하기 위하여 필요하면 작업발판의 폭을 30센티미터 이상으로 할 수 있고, 걸침비계의 경우 강관기둥 때문에 발판재료 간의 틈을 3센티미터 이하로 유지하기 곤란하면 5센티미터 이하로 할 수 있다. 이 경우 그 틈 사이로 물체 등이 떨어질 우려가 있는 곳에는 출입금지 등의 조치를 하여야 한다.<br> 4. 추락의 위험이 있는 장소에는 안전난간을 설치할 것. 다만, 작업의 성질상 안전난간을 설치하는 것이 곤란한 경우, 작업의 필요상 임시로 안전난간을 해체할 때에 추락방호망을 설치하거나 근로자로 하여금 안전대를 사용하도록 하는 등 추락위험 방지 조치를 한 경우에는 그러하지 아니하다.<br> 5. 작업발판의 지지물은 하중에 의하여 파괴될 우려가 없는 것을 사용할 것<br>▶  6. <strong>작업발판재료는 뒤집히거나 떨어지지 않도록<\/strong> <strong>둘 이상의 지지물<\/strong>에 연결하거나 고정시킬 것<br> 7. 작업발판을 작업에 따라 이동시킬 경우에는 위험 방지에 필요한 조치를 할 것<\/div><\/div>","src":"2025년 1회 113번 · 원본 2013.06.02","tm":3},{"t":"달비계를 설치할 때 작업발판의 폭은 최소 얼마 이상으로 하여야 하는가?","c":["30cm","40cm","50cm","60cm"],"a":2,"pt":"<strong>달비계의 구조<\/strong><br><strong>작업발판의 폭 40 [cm]는 비계 일반과 같은 값<\/strong>이다 — <strong>다만 달비계는 「틈이 없도록」<\/strong>이라는 조건이 더 붙는다. <strong>비계 조립·해체 때의 20 [cm] 와는 다른 자리<\/strong>다.<p><strong>◈ 암기<\/strong> <u>달비계 작업발판은 40 [cm] 이상<\/u>.<\/p>","src":"2022년 2회 113번 · 원본 2012.08.26","tm":2},{"t":"비계의 높이가 2m 이상인 작업장소에 작업발판을 설치할 경우 준수하여야 할 기준으로 옳지 않은 것은?","c":["작업발판의 폭은 30cm 이상으로 한다.","발판재료간의 틈은 3cm 이하로 한다.","추락의 위험성이 있는 장소에는 안전난간을 설치한다.","발판재료는 뒤집히거나 떨어지지 않도록 2개 이상의 지지물에 연결하거나 고정시킨다."],"a":1,"pt":"<strong>안전보건규칙 제56조 — 작업발판의 구조<\/strong><br>사람이 두 발로 서서 몸을 돌릴 수 있어야 하므로 <strong>40 [cm]<\/strong>이 나온다. 달비계는 매달린 구조라 예외로 20 [cm]다.<p><strong>◈ 암기<\/strong> <u>폭 40, 틈 3<\/u> — 달비계만 20.<\/p><p><strong>⚖ 근거 법령<\/strong> <span class=\"eff\">산업안전보건기준에 관한 규칙 시행 2026. 3. 2.<\/span><\/p><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C56%EC%A1%B0\" target=\"_blank\">제56조(작업발판의 구조)<\/a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.<\/span><\/div><div class=t>사업주는 비계(달비계, 달대비계 및 말비계는 제외한다)의 높이가 2미터 이상인 작업장소에 다음 각 호의 기준에 맞는 작업발판을 설치하여야 한다. &lt;개정 2012.5.31, 2017.12.28&gt;<br> 1. 발판재료는 작업할 때의 하중을 견딜 수 있도록 견고한 것으로 할 것<br>▶  2. <strong>작업발판의 폭은<\/strong> 40센티미터 이상으로 하고, 발판재료 간의 틈은 3센티미터 이하로 할 것. 다만, 외줄비계의 경우에는 고용노동부장관이 별도로 정하는 기준에 따른다.<br> 3. 제2호에도 불구하고 선박 및 보트 건조작업의 경우 선박블록 또는 엔진실 등의 좁은 작업공간에 작업발판을 설치하기 위하여 필요하면 작업발판의 폭을 30센티미터 이상으로 할 수 있고, 걸침비계의 경우 강관기둥 때문에 발판재료 간의 틈을 3센티미터 이하로 유지하기 곤란하면 5센티미터 이하로 할 수 있다. 이 경우 그 틈 사이로 물체 등이 떨어질 우려가 있는 곳에는 출입금지 등의 조치를 하여야 한다.<br> 4. 추락의 위험이 있는 장소에는 안전난간을 설치할 것. 다만, 작업의 성질상 안전난간을 설치하는 것이 곤란한 경우, 작업의 필요상 임시로 안전난간을 해체할 때에 추락방호망을 설치하거나 근로자로 하여금 안전대를 사용하도록 하는 등 추락위험 방지 조치를 한 경우에는 그러하지 아니하다.<br> 5. 작업발판의 지지물은 하중에 의하여 파괴될 우려가 없는 것을 사용할 것<br> 6. 작업발판재료는 뒤집히거나 떨
