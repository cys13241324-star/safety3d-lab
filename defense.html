rong> 현행 기준은 띠장간격 2m 이하, 비계기둥 간격은 띠장 방향 1.85m 이하ㆍ장선 방향 1.5m 이하다. 이 문항은 개정 전 기준으로 출제되어 ①이 정답으로 처리되었다.<\/p>","src":"2021년 1회 102번 · 원본 2017.08.26","tm":1}],"carry":[{"t":"인력운반 작업에 대한 안전 준수사항으로 가장 거리가 먼 것은?","c":["보조기구를 효과적으로 사용한다.","물건을 들어올릴 때는 팔과 무릎을 이용하며 척추는 곧게 한다.","긴 물건은 뒤쪽으로 높이고 원통인 물건은 굴려서 운반한다.","무거운 물건은 공동작업으로 실시한다."],"a":3,"pt":"<strong>인력운반의 안전<\/strong><br><strong>「앞쪽을 높게」<\/strong>는 여러 문항에 되풀이 나온다 — <strong>뒤로 높이면 앞이 내려가 앞사람의 발을 찌른다<\/strong>.<p><strong>◈ 암기<\/strong> <u>긴 물건은 앞쪽을 높게, 원통은 굴리지 않는다<\/u>.<\/p>","src":"2021년 3회 115번 · 원본 2015.05.31","tm":1},{"t":"인력으로 화물을 인양할 때의 몸의 자세와 관련하여 준수하여야 할 사항으로 옳지 않은 것은?","c":["한쪽 발은 들어올리는 물체를 향하여 안전하게 고정시키고 다른 발은 그 뒤에 안전하게 고정시킬 것","등은 항상 직립한 상태와 90도 각도를 유지하여 가능한 한 지면과 수평이 되도록 할 것","팔은 몸에 밀착시키고 끌어당기는 자세를 취하며 가능한 한 수평거리를 짧게 할 것","손가락으로만 인양물을 잡아서는 아니 되며 손바닥으로 인양물 전체를 잡을 것"],"a":2,"pt":"<strong>인력 운반 시의 자세<\/strong><br>허리에 걸리는 힘은 <strong>물체와 몸 사이의 수평거리<\/strong>에 비례한다. 그래서 <strong>몸에 바짝 붙여 들라<\/strong>는 원칙이 나온다.<p><strong>◈ 암기<\/strong> <u>등은 펴고 무릎을 굽힌다<\/u> — 반대로 적으면 오답.<\/p>","src":"2026년 2회 118번 · 원본 2021.08.14","tm":1}],"noise":[{"t":"국내 규정상 1일 노출회수가 100일 때 최대 음압수준이 몇 dB(A)를 초과하는 충격소음에 노출되어서는 아니 되는가?","c":["110","120","130","140"],"a":4,"pt":"<strong>안전보건규칙 제512조 — 충격소음작업<\/strong><br><strong>소리가 10 [dB] 세질 때마다 허용 횟수가 1/10<\/strong>로 준다 — <strong>120/1만 · 130/1천 · 140/1백<\/strong>. 이 규칙으로 잡으면 세 값이 한꺼번에 외워진다.<p><strong>◈ 암기<\/strong> <u>120/1만 · 130/1천 · 140/1백<\/u>.<\/p><p><strong>⚖ 근거 법령<\/strong> <span class=\"eff\">산업안전보건기준에 관한 규칙 시행 2026. 3. 2.<\/span><\/p><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C512%EC%A1%B0\" target=\"_blank\">제512조(정의)<\/a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.<\/span><\/div><div class=t>이 장에서 사용하는 용어의 뜻은 다음과 같다. &lt;개정 2024.6.28&gt;<br> 1. \"소음작업\"이란 1일 8시간 작업을 기준으로 85데시벨 이상의 소음이 발생하는 작업을 말한다.<br> 2. \"강렬한 소음작업\"이란 다음 각목의 어느 하나에 해당하는 작업을 말한다.<br> 가. 90데시벨 이상의 소음이 1일 8시간 이상 발생하는 작업<br> 나. 95데시벨 이상의 소음이 1일 4시간 이상 발생하는 작업<br> 다. 100데시벨 이상의 소음이 1일 2시간 이상 발생하는 작업<br> 라. 105데시벨 이상의 소음이 1일 1시간 이상 발생하는 작업<br> 마. 110데시벨 이상의 소음이 1일 30분 이상 발생하는 작업<br> 바. 115데시벨 이상의 소음이 1일 15분 이상 발생하는 작업<br> 3. \"충격소음작업\"이란 소음이 1초 이상의 간격으로 발생하는 작업으로서 다음 각 목의 어느 하나에 해당하는 작업을 말한다.<br> 가. 120데시벨을 초과하는 소음이 1일 1만회 이상 발생하는 작업<br> 나. 130데시벨을 초과하는 소음이 1일 1천회 이상 발생하는 작업<br> 다. 140데시벨을 초과하는 소음이 1일 1백회 이상 발생하는 작업<br> 4. \"진동작업\"이란 다음 각 목의 어느 하나에 해당하는 기계ㆍ기구를 사용하는 작업을 말한다.<br> 가. 착암기(鑿巖機)<br> 나. 동력을 이용한 해머<br> 다. 체인톱<br> 라. 엔진 커터(engine cutter)<br> 마. 동력을 이용한 연삭기<br> 바. 임팩트 렌치(impact wrench)<br> 사. 그 밖에 진동으로 인하여 건강장해를 유발할 수 있는 기계ㆍ기구<br> 5. \"청력보존 프로그램\"이란 다음 각 목의 사항이 포함된 소음성 난청을 예방ㆍ관리하기 위한 종합적인 계획을 말한다.<br> 가. 소음노출 평가<br> 나. 소음노출에 대한 공학적 대책<br> 다. 청력보호구의 지급과 착용<br> 라. 소음의 유해성 및 예방 관련 교육<br> 마. 정기적 청력검사<br> 바. 청력보존 프로그램 수립 및 시행 관련 기록ㆍ관리체계<br> 사. 그 밖에 소음성 난청 예방ㆍ관리에 필요한 사항<\/div><\/div>","src":"2024년 3회 36번 · 원본 2016.05.08","tm":1},{"t":"산업안전보건기준에 관한 규칙상 '강렬한 소음 작업'에 해당하는 기준은?","c":["85데시벨 이상의 소음이 1일 4시간 이상 발생하는 작업","85데시벨 이상의 소음이 1일 8시간 이상 발생하는 작업","90데시벨 이상의 소음이 1일 4시간 이상 발생하는 작업","90데시벨 이상의 소음이 1일 8시간 이상 발생하는 작업"],"a":4,"pt":"<strong>안전보건규칙 제512조 — 강렬한 소음작업<\/strong><br><strong>90 [dB] · 8시간<\/strong>에서 시작해 <strong>5 [dB] 마다 시간이 절반<\/strong>이다. <strong>충격소음작업<\/strong>은 따로 정한다 — <strong>120 [dB] 초과 1만회 · 130 [dB] 초과 1천회 · 140 [dB] 초과 100회 이상<\/strong>.<p><strong>◈ 암기<\/strong> <u>90에 8시간, 5 오르면 반으로<\/u>.<\/p><p><strong>⚖ 근거 법령<\/strong> <span class=\"eff\">산업안전보건기준에 관한 규칙 시행 2026. 3. 2.<\/span><\/p><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C512%EC%A1%B0\" target=\"_blank\">제512조(정의)<\/a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.<\/span><\/div><div class=t>이 장에서 사용하는 용어의 뜻은 다음과 같다. &lt;개정 2024.6.28&gt;<br>▶  1. \"소음작업\"이란 1일 <strong>8시간<\/strong> 작업을 기준으로 85데시벨 이상의 소음이 발생하는 작업을 말한다.<br> 2. \"강렬한 소음작업\"이란 다음 각목의 어느 하나에 해당하는 작업을 말한다.<br>▶  가. <strong>90데시벨 이상의 소음이 1일 8시간 이상 발생하는 작업<\/strong><br> 나. 95데시벨 이상의 소음이 1일 4시간 이상 발생하는 작업<br> 다. 100데시벨 이상의 소음이 1일 2시간 이상 발생하는 작업<br> 라. 105데시벨 이상의 소음이 1일 1시간 이상 발생하는 작업<br> 마. 110데시벨 이상의 소음이 1일 30분 이상 발생하는 작업<br> 바. 115데시벨 이상의 소음이 1일 15분 이상 발생하는 작업<br>▶  3. \"<strong>충격소음작업<\/strong>\"이란 소음이 1초 이상의 간격으로 발생하는 작업으로서 다음 각 목의 어느 하나에 해당하는 작업을 말한다.<br> 가. 120데시벨을 초과하는 소음이 1일 1만회 이상 발생하는 작업<br> 나. 130데시벨을 초과하는 소음이 1일 1천회 이상 발생하는 작업<br> 다. 140데시벨을 초과하는 소음이 1일 1백회 이상 발생하는 작업<br> 4. \"진동작업\"이란 다음 각 목의 어느 하나에 해당하는 기계ㆍ기구를 사용하는 작업을 말한다.<br> 가. 착암기(鑿巖機)<br> 나. 동력을 이용한 해머<br> 다. 체인톱<br> 라. 엔진 커터(engine cutter)<br> 마. 동력을 이용한 연삭기<br> 바. 임팩트 렌치(impact wrench)<br> 사. 그 밖에 진동으로 인하여 건강장해를 유발할 수 있는 기계ㆍ기구<br> 5. \"청력보존 프로그램\"이란 다음 각 목의 사항이 포함된 소음성 난청을 예방ㆍ관리하기 위한 종합적인 계획을 말한다.<br> 가. 소음노출 평가<br> 나. 소음노출에 대한 공학적 대책<br> 다. 청력보호구의 지급과 착용<br> 라. 소음의 유해성 및 예방 관련 교육<br> 마. 정기적 청력검사<br> 바. 청력보존 프로그램 수립 및 시행 관련 기록ㆍ관리체계<br> 사. 그 밖에 소음성 난청 예방ㆍ관리에 필요한 사항<\/div><\/div>","src":"2025년 1회 24번 · 원본 2020.08.22","tm":1},{"t":"초음파 소음(ultrasonic noise)에 대한 설명으로 잘못된 것은?","c":["전형적으로 20000 Hz 이상이다.","가청영역 위의 주파수를 갖는 소음이다.","소음의 3dB 증가하면 허용기간은 반감한다.","20000 Hz 이상에서 노출 제한은 110 dB이다."],"a":3,"pt":"<strong>초음파 소음<\/strong><br><strong>5 [dB] 마다 절반<\/strong>이라는 규칙은 <strong>가청 소음<\/strong>의 것이다. 보기는 이 숫자만 3으로 바꿔 놓았다.<p><strong>◈ 암기<\/strong> <u>5 [dB] 마다 절반<\/u> — 3이 아니다.<\/p>","src":"2025년 4회 39번 · 원본 2017.08.26","tm":1}],"approach":[{"t":"다음 중 활선근접 작업시의 안전조치로 적절하지 않은 것 은?","c":["근로자가 절연용 방호구의 설치·해체작업을 하는 경우에 는 절연용 보호구를 착용하거나 활선작업용 기구 및 장 치를 사용하도록 하여야 한다.","저압인 경우에는 해당 전기작업자가 절연용 보호구를 착 용하되, 충전전로에 접촉할 우려가 없는 경우에는 절연 용 방호구를 설치하지 아니할 수 있다.","유자격자가 아닌 근로자가 근로자의 몸 또는 긴 도전성 물체가 방호되지 않은 충전전로에서 대지전압이 50kV이 하인 경우에는 400cm 이내로 접근할 수 없도록 하여야 한다.","고압 및 특별고압의 전로에서 전기작업을 하는 근로자에 게 활선작업용 기구 및 장치를 사용하여야 한다."],"a":3,"pt":"<strong>안전보건규칙 제321조 — 충전전로에서의 전기작업<\/strong><br><strong>절연용 보호구는 사람이 입는 것<\/strong>(안전모·장갑·장화), <strong>절연용 방호구는 충전부에 씌우는 것<\/strong>(절연관·절연시트)이다.<p><strong>◈ 암기<\/strong> 유자격자가 아니면 <u>50 [kV] 이하는 300 [cm]<\/u>, 넘으면 <u>10 [kV] 마다 10 [cm]<\/u> 더.<\/p><p><strong>⚖ 근거 법령<\/strong> <span class=\"eff\">산업안전보건기준에 관한 규칙 시행 2026. 3. 2.<\/span><\/p><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C321%EC%A1%B0\" target=\"_blank\">제321조(충전전로에서의 전기작업)<\/a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.<\/span><\/div><div class=t>① 사업주는 근로자가 충전전로를 취급하거나 그 인근에서 작업하는 경우에는 다음 각 호의 조치를 하여야 한다.<br> 1. 충전전로를 정전시키는 경우에는 제319조에 따른 조치를 할 것<br> 2. 충전전로를 방호, 차폐하거나 절연 등의 조치를 하는 경우에는 근로자의 신체가 전로와 직접 접촉하거나 도전재료, 공구 또는 기기를 통하여 간접 접촉되지 않도록 할 것<br> 3. 충전전로를 취급하는 근로자에게 그 작업에 적합한 절연용 보호구를 착용시킬 것<br> 4. 충전전로에 근접한 장소에서 전기작업을 하는 경우에는 해당 전압에 적합한 절연용 방호구를 설치할 것. 다만, 저압인 경우에는 해당 전기작업자가 절연용 보호구를 착용하되, 충전전로에 접촉할 우려가 없는 경우에는 절연용 방호구를 설치하지 아니할 수 있다.<br> 5. 고압 및 특별고압의 전로에서 전기작업을 하는 근로자에게 활선작업용 기구 및 장치를 사용하도록 할 것<br> 6. 근로자가 절연용 방호구의 설치ㆍ해체작업을 하는 경우에는 절연용 보호구를 착용하거나 활선작업용 기구 및 장치를 사용하도록 할 것<br>▶  7. 유자격자가 아닌 근로자가 충전전로 인근의 높은 곳에서 작업할 때에 근로자의 몸 또는 긴 도전성 물체가 방호되지 않은 충전전로에서 대지전압이 50킬로볼트 이하인 경우에는 300센티미터 이내로, 대지전압이 50킬로볼트를 넘는 경우에는 10킬로볼트당 10센티미터씩 더한 거리 이내로 각각 접근할 수 없도록 할 것<br> 8. 유자격자가 충전전로 인근에서 작업하는 경우에는 다음 각 목의 경우를 제외하고는 노출 충전부에 다음 표에 제시된 접근한계거리 이내로 접근하거나 절연 손잡이가 없는 도전체에 접근할 수 없도록 할 것<br> 가. 근로자가 노출 충전부로부터 절연된 경우 또는 해당 전압에 적합한 절연장갑을 착용한 경우<br> 나. 노출 충전부가 다른 전위를 갖는 도전체 또는 근로자와 절연된 경우<br> 다. 근로자가 다른 전위를 갖는 모든 도전체로부터 절연된 경우<br>&lt;img src=\"http://www.law.go.kr/flDownload.do?flSeq=23019731\" alt=\"img23019731\" &gt;<br>┌──────────┬────────┐<br>│충전전로의 선간전압 │충전전로에 대한 │<br>│(단위: 킬로볼트) │접근 한계거리 │<br>│ │(단위: 센티미터)│<br>├──────────┼────────┤<br>│0.3 이하 │접촉금지 │<br>│0.3 초과 0.75 이하 │30 │<br>│0.75 초과 2 이하 │45 │<br>│2 초과 15 이하 │60 │<br>│15 초과 37 이하 │90 │<br>│37 초과 88 이하 │110 │<br>│88 초과 121 이하 │130 │<br>│121 초과 145 이하 │150 │<br>│145 초과 169 이하 │170 │<br>│169 초과 242 이하 │230 │<br>│242 초과 362 이하 │380 │<br>│362 초과 550 이하 │550 │<br>│550 초과 800 이하 │790 │<br>└──────────┴────────┘<br>&lt;/img&gt;<br>② 사업주는 절연이 되지 않은 충전부나 그 인근에 근로자가 접근하는 것을 막거나 제한할 필요가 있는 경우에는 울타리를 설치하고 근로자가 쉽게 알아볼 수 있도록 하여야 한다. 다만, 전기와 접촉할 위험이 있는 경우에는 도전성이 있는 금속제 울타리를 사용하거나, 제1항의 표에 정한 접근 한계거리 이내에 설치해서는 아니 된다. &lt;개정 2019.10.15&gt;<br>③ 사업주는 제2항의 조치가 곤란한 경우에는 근로자를 감전위험에서 보호하기 위하여 사전에 위험을 경고하는 감시인을 배치하여야 한다.<\/div><\/div>","src":"2026년 1회 74번 · 원본 2012.05.20","tm":2},{"t":"고압선로의 활선근접작업시 작업자가 전선로로부터 어느 정도의 거리를 유지하였을 경우 안전하다고 보고 별도의 방호조치나 보호조치를 생략할 수 있는가?","c":["머리위 거리가 30cm 이상","발아래 거리가 40cm 이상","몸옆 수평거리가 50cm 이상","심장으로부터 거리가 50cm 이상"],"a":1,"pt":"<strong>활선근접작업의 접근한계거리<\/strong><br><strong>「머리 30 · 발아래 60 · 옆 30」<\/strong>이다 — <strong>발쪽이 가장 멀어야<\/strong> 한다. <strong>몸이 기울거나 미끄러질 여지가 아래쪽에 크기<\/strong> 때문이다.<p><strong>◈ 암기<\/strong> <u>머리 위 30cm, 발아래 60cm, 몸 옆 30cm<\/u>.<\/p>","src":"2021년 3회 73번 · 원본 2013.03.10","tm":1},{"t":"산업안전보건법상 가공전선의 충전전로에 접근된 장소에서 시설물의 건설, 해체, 점검, 수리 또는 이동식 크레인, 콘크리트 펌프카, 항타기, 항발기 등의 작업시 감전 위험방지 조치 사항으로 옳지 않은 것은?","c":["해당 충전전로 이설","절연용 보호구 착용","절연용 방호구 설치","감시인을 두고 작업을 감시토록 조치"],"a":2,"pt":"<strong>충전전로 인근 작업의 조치<\/strong><br><strong>「보호구」는 사람이 쓰고, 「방호구」는 전선에 씌운다<\/strong> — <strong>크레인 붐이 전선에 닿는 사고는 사람이 장갑을 껴도 막을 수 없다<\/strong>.<p><strong>◈ 암기<\/strong> <u>전선에는 방호구, 사람에게는 보호구<\/u>.<\/p>","src":"2021년 1회 63번 · 원본 2011.06.12","tm":1}],"forklift":[{"t":"화물중량이 200kgf, 지게차의 중량이 400kgf, 앞바퀴에서 화물의 무게중심까지의 최단거리가 1m일 때 지게차의 무게중심까지 최단거리는 최소 몇 m를 초과해야하는가?","c":["0.2m","0.5m","1m","2m"],"a":2,"pt":"<strong>지게차의 안정조건<\/strong><br><strong>앞바퀴가 받침점(fulcrum)<\/strong>이다. 화물은 앞쪽에서 누르고 차체는 뒤쪽에서 버틴다. <strong>뒤쪽 모멘트가 더 커야<\/strong> 앞으로 넘어지지 않는다.<p><strong>◈ 암기<\/strong> $M_{1} &lt; M_{2}$ — <u>화물 모멘트가 더 작아야 한다<\/u>.<\/p>","src":"2025년 3회 57번 · 원본 2013.03.10","tm":3},{"t":"지게차의 안정을 유지하기 위한 안정도 기준으로 틀린 것은?","c":["5톤 미만의 부하 상태에서 하역작업시의 전후안정도는 4% 이내이어야 한다.","부하 상태에서 하역작업시의 좌우 안정도는 10% 이내이어야 한다.","무부하 상태에서 주행시의 좌우 안정도는 (15 + 1.1×V)% 이내이어야 한다.(단, V는 구내 최고속도[km/h])","부하 상태에서 주행시 전후 안정도는 18%이내이어야 한다."],"a":2,"pt":"<strong>지게차의 안정도<\/strong><br><strong>하역은 작고(4 · 6) 주행은 크다(18 · 15+1.1V)<\/strong>. 짐을 들고 있을 때 무게중심이 높아 훨씬 위험하기 때문이다.<p><strong>◈ 암기<\/strong> <u>4 · 6 · 18 · (15+1.1V)<\/u>.<\/p>","src":"2025년 4회 57번 · 원본 2011.06.12","tm":2},{"t":"다음 중 지게차의 작업 상태별 안정도에 관한 설명으로 틀 린 것은? (단, V는 최고속도(km/h)이다.)","c":["기준 부하상태의 하역작업 시의 전후 안정도는 20%이 내이다.","기준 부하상태의 하역작업 시의 좌우 안정도는 6% 이내 이다.","기준 무부하상태에서 주행 시의 전후 안정도는 18%이 내이다.","기준 무부하상태의 주행 시의 좌우 안정도는 (15 + 1.1V)% 이내이다."],"a":1,"pt":"<strong>지게차의 작업 상태별 안정도<\/strong><br>안전보건규칙 제3편, 「지게차 안정도 기준」. 네 값 — <u>하역 전후 4 [%] · 하역 좌우 6 [%] · 주행 전후 18 [%] · 주행 좌우 (15 + 1.1V) [%]<\/u>. <u>하역은 작고 주행은 크다<\/u>는 방향만 알면 된다.<p><strong>◈ 암기<\/strong> <u>하역 4·6, 주행 18·(15+1.1V)<\/u> — 하역은 작고 주행은 크다.<\/p>","src":"2026년 1회 57번 · 원본 2015.08.16","tm":2}],"grinder":[{"t":"회전 중인 연삭숫돌이 근로자에게 위험을 미칠 우려가 있을 시 덮개를 설치하여야 할 연삭숫돌의 최소 지름은?","c":["지름이 5cm 이상인 것","지름이 10cm 이상인 것","지름이 15cm 이상인 것","지름이 20cm 이상인 것"],"a":1,"pt":"<strong>안전보건규칙 제122조 — 연삭기 덮개<\/strong><br>연삭기의 숫자 묶음 — <strong>덮개는 지름 5 [cm] 이상 · 플랜지는 숫돌 지름의 1/3 이상 · 작업 전 1분, 교체 후 3분 시운전 · 워크레스트와 숫돌 사이 3 [mm] 이내 · 조정편과 숫돌 사이 5 [mm] 이내<\/strong>.<p><strong>◈ 암기<\/strong> <u>5 [cm] 이상이면 덮개<\/u>.<\/p><p><strong>⚖ 근거 법령<\/strong> <span class=\"eff\">산업안전보건기준에 관한 규칙 시행 2026. 3. 2.<\/span><\/p><div class=lawart><div class=h><a href=\"https://www.law.go.kr/법령/%EC%82%B0%EC%97%85%EC%95%88%EC%A0%84%EB%B3%B4%EA%B1%B4%EA%B8%B0%EC%A4%80%EC%97%90%EA%B4%80%ED%95%9C%EA%B7%9C%EC%B9%99/%EC%A0%9C122%EC%A1%B0\" target=\"_blank\">제122조(연삭숫돌의 덮개 등)<\/a><span class=eff>산업안전보건기준에 관한 규칙 · 시행 2026. 3. 2.<\/span><\/div><div class=t>▶ ① 사업주는 회전 중인 연삭숫돌(지름이 <strong>5센티미터<\/strong> 이상인 것으로 한정한다)이 근로자에게 위험을 미칠 우려가 있는 경우에 그 부위에 덮개를 설치하여야 한다.<br>② 사업주는 연삭숫돌을 사용하는 작업의 경우 작업을 시작하기 전에는 1분 이상, 연삭숫돌을 교체한 후에는 3분 이상 시험운전을 하고 해당 기계에 이상이 있는지를 확인하여야 한다.<br>③ 제2항에 따른 시험운전에 사용하는 연삭숫돌은 작업시작 전에 결함이 있는지를 확인한 후 사용하여야 한다.<br>④ 사업주는 연삭숫돌의 최고 사용회전속도를 초과하여 사용하도록 해서는 아니 된다.<br>⑤ 사업주는 측면을 사용하는 것을 목적으로 하지 않는 연삭숫돌을 사용하는 경우 측면을 사용하도록 해서는 아니 된다.<\/div><\/div>","src":"2025년 4회 41번 · 원본 2016.05.08","tm":2},{"t":"연삭기 작업 시 작업자가 안심하고 작업을 할 수 있는 상태는?","c":["탁상용 연삭기에서 숫돌과 작업 받침대의 간격이 5mm이다.","덮개 재료의 인장강도는 224MPa이다.","작업 시작 전 1분 정도 시운전을 실시하여 해당 기계의 이상 여부를 확인하였다.","숫돌 교체 후 2분 정도 시운전을 실시하여 해당 기계의 이상 여부를 확인하였다."],"a":3,"pt":"<strong>연삭기의 안전기준<\/strong><br><strong>「받침대 3mm, 조정편 5mm, 시운전 1분과 3분, 인장강도 274.5MPa」<\/strong>다 — <strong>네 보기가 모두 그 값을 조금씩 어긋나게 놓았고 하나만 제자리<\/strong>다.<p><strong>◈ 암기<\/strong> <u>작업 전 1분, 교체 후 3분<\/u>.<\/p>","src":"2021년 3회 42번 · 원본 2011.03.20","tm":1},{"t":"다음 중 상부를 사용할 것을 목적으로 하는 탁상용 연삭기 덮개의 노출 각도로 옳은 것은?","c":["180° 이상","120° 이내","60° 이내","15° 이내"],"a":3,"pt":"<strong>연삭기 덮개의 노출각도<\/strong><br><strong>작업점이 위에 있으면 좁게(60°), 옆이나 넓은 면을 쓰면 넓게(150 ~ 180°)<\/strong> 연다. <strong>일반 탁상용 125°<\/strong>와 <strong>상부 전용 60°<\/strong>를 갈라 둔다.<p><strong>◈ 암기<\/strong> <u>상부 사용 탁상용은 60° 이내<\/u>.<\/p>","src":"2022년 2회 42번 · 원본 2014.08.17","tm":1}],"confined":[{"t":"산업안전보건법상 방독마스크 사용이 가능한 공기 중 최소 산소농도 기준은 몇 % 이상인가?","c":["14%","16%","18%","20%"],"a":3,"pt":"<strong>방독마스크의 사용 조건<\/strong><br><strong>방독마스크는 공기 속 유해가스만 걸러 낼 뿐 산소를 만들지 못한다<\/strong>. <strong>산소가 모자란 곳에서 쓰면 오히려 질식<\/strong>한다. <strong>산소결핍의 경계가 18 [%]<\/strong>다.<p><strong>◈ 암기<\/strong> <u>산소 18 [%] 이상에서만 방독마스크<\/u>.<\/p>","src":"2023년 2회 6번 · 원본 2017.05.07","tm":1},{"t":"산소결핍이라 함은 공기 중 산소농도가 몇 퍼센트(%) 미만일 때를 의미하는가?","c":["20%","18%","15%","10%"],"a":2,"pt":"<strong>산소결핍과 적정공기<\/strong><br><strong>적정공기 네 값 「18 ~ 23.5% · 1.5% · 10 [ppm] · 30 [ppm]」<\/strong>을 한 덩어리로 잡아 둔다. <strong>산소는 위쪽 한계(23.5%)도 있다<\/strong> — 너무 많으면 불이 잘 붙는다.<p><strong>◈ 암기<\/strong> <u>산소결핍은 18% 미만<\/u>.<\/p>","src":"2023년 4회 116번 · 원본 2017.03.05","tm":1},{"t":"방진마스크의 사용 조건 중 산소농도의 최소기준으로 옳은 것은?","c":["16%","18%","21%","23.5%"],"a":2,"pt":"<strong>방진마스크·방독마스크의 사용 한계<\/strong><br>밀폐공간 <strong>적정공기<\/strong>는 산소 <strong>18 [%] 이상 23.5 [%] 미만<\/strong>, 탄산가스 1.5 [%] 미만, 일산화탄소 30 [ppm] 미만, 황화수소 10 [ppm] 미만이다.<p><strong>◈ 암기<\/strong> <u>산소가 없으면 거르는 마스크는 무용지물<\/u> — 18 [%] 미만이면 송기마스크.<\/p>","src":"2026년 2회 6번 · 원본 2020.06.06","tm":1}]};

  // double(4웨이브) 에 쓸 안전 조합. fall·scaffold 는 RIG 에서 w.body(피벗)·팔·다리·w.tick 을
  // 전혀 안 건드리는 표라(로프/자재만 g 에 얹는다) 다른 어떤 표와 묶어도 pivot 축이 겹치거나
  // 같은 팔을 두 표가 같이 돌리는 일이 없다. approach+forklift 도 각각 팔 하나(arms[1].x)·
  // tick 하나만 건드려 서로 안 겹친다. rail+approach(둘 다 arms[1].x) 나 ladder+plank(pivot
  // 축 높이가 0.35 vs 0 으로 달라 pivotAll 이 console.error 를 낸다) 같은 조합은 여기 없다.
  const DOUBLE_ANCHORS = ['fall', 'scaffold'];
  function doublePairsFor(pool){
    const ids = pool.map(a=> a.id), pairs = [];
    DOUBLE_ANCHORS.forEach(anchor=>{
      if(ids.indexOf(anchor) < 0) return;
      ids.forEach(id=>{ if(id !== anchor) pairs.push([anchor, id]); });
    });
    if(ids.indexOf('approach') >= 0 && ids.indexOf('forklift') >= 0) pairs.push(['approach', 'forklift']);
    return pairs;
  }
  // 한 사람에 ACT_BUILD 를 두 번 건다 — spawnWorker(act1,false) 가 act1 표를 붙이고 나면,
  // 그 위에 act2 의 RIG 를 그대로 한 번 더 부른다. RIG 자체는 안 바꾼다.
  function spawnDouble(act1, act2){
    const w = spawnWorker(act1, false);
    ACT_BUILD[act2.id](w);
    w.act2 = act2;
    return w;
  }

  // trap(5웨이브) — fall 의 변형. RIG.fall(unsafe) 을 그대로 쓰면 바닥까지 끄는 표준 자세가
  // 같이 나와 「멀리서는 정상처럼 보인다」가 안 된다(그러려면 RIG 를 고쳐야 하는데 그건 이
  // 과제 범위 밖이다). 그래서 spawnWorker(null) 로 소품 없는 사람을 받아 밖에서 직접 짓는다.
  // 로프는 안전 쪽처럼 벨트에서 위로 올라가 멀리서는 실루엣이 비슷하지만, 구명줄 케이블까지
  // 닿지 못하고 중간에서 되돌아와 자기 벨트에 걸린다 — 가까이 와야 그 되돌아옴이 보인다.
  function buildTrap(w){
    const g = w.g;
    tube(0.05, 2.5, steelMat, g, -1.25, 1.25, -0.55);
    tube(0.05, 2.5, steelMat, g,  1.25, 1.25, -0.55);
    link(P3(-1.25, 2.42, -0.55), P3(1.25, 2.42, -0.55), 0.04, steelMat, g);
    // 1차로 로프를 몸 뒤쪽(z 음수)에 두고 짧게 접었더니 8m 에서 몸통에 완전히 가려 아무것도
    // 안 보였다(스크린샷으로 확인하고 고쳤다). 그래서 (1) 로프를 몸 앞쪽(z 양수)에 두고
    // (2) 안전 쪽 고리 높이(2.30)에 거의 닿을 만큼 올려 멀리서 실루엣을 거의 같게 만들고
    // (3) 접어 내려오는 두 번째 가닥을 첫 가닥과 가깝게(같은 높이·조금만 옆으로) 둬서,
    // 멀리서는 겹쳐 한 줄로 보이고 가까이서만 두 가닥(=되돌아옴)이 갈린다.
    const belt = P3(0.18, 0.72, 0.16);
    const near = P3(0.15, 2.22, 0.10);                 // 안전 쪽(2.30) 바로 밑까지 올라간다
    const back = P3(0.30, 0.75, 0.24);                 // 케이블에 안 걸리고 옆으로 접혀 자기 벨트로 되돌아온다
    link(belt, near, 0.034, lanyMat, g);
    link(near, back, 0.03, lanyMat, g);
    const hook = new THREE.Mesh(new THREE.TorusGeometry(0.08, 0.026, 8, 16), steelMat);
    hook.position.copy(back); hook.rotation.z = Math.PI/2; g.add(hook);
  }
  // fix round 1: ACT_BY_ID.fall 을 그대로 물리면(공유 객체) tell 이 fall 의 "고리가 바닥에
  // 끌린다" 로 나온다 — trap 의 실제 표는 그게 아니라 "고리가 자기 벨트에 걸려 있다" 다.
  // id·topic·law·name 은 fall 과 완전히 같아야(같은 위반이니) 얕은 복사로 tell 한 필드만
  // 바꾼다. HAZARD_ACTS 원본(ACT_BY_ID.fall)은 손대지 않는다 — lawcheck.py 는 원본만 본다.
  const TRAP_ACT = Object.assign({}, ACT_BY_ID.fall, { tell: '고리가 자기 벨트에 걸려 있다' });
  /* fix round 2(C3) — 「가까운 스폰」. 예전 함정은 spawnWorker 가 준 x(±2~5)를 그대로 둔 채
     z 만 앞으로 당겼다(스폰 거리 8 m · z −3~−1). 390×800 세로 화면에서 z=−2 의 가로 반폭은
     2.0 m 뿐이라 x 가 2~5 면 사람이 프레임 밖에 서 있다 — 실측(400회, 페이지 자신의
     stepWorkers·camera) 결과 80.5 % 가 사고구역에 닿을 때까지 한 번도 전신이 안 보였고 전신
     노출 시간 중앙값이 0초였다. 데스크톱(가로 화면)은 반폭이 6.7 m 라 안 드러난다.
     그러면 함정은 「표를 가까이서 보고 가리는 것」이 아니라 「가운데에서 갑자기 나타나는 것」이
     된다 — 표가 아닌 새 신호이고, 이 게임의 첫째 기준(표를 안 보고 이기는 길이 있으면 실패)
     위반이다.
     그래서 (1) 스폰 거리를 11~13 m 로 물려 사고구역까지 8~10 m(≈7~11초)를 걷게 하고 — 일반
     작업자(18~22 m · ≈16초)보다는 여전히 확실히 빠르다 — (2) x 를 그 거리에서 화면에 들어오는
     폭 안에서 다시 뽑는다. 폭은 고정 상수가 아니라 실제 카메라(fov·aspect)로 매번 잰다:
     세로 화면이면 좁게, 가로 화면이면 넓게 저절로 맞는다. */
  const BODY_HALF = 0.45;              // 사람 몸의 반폭(측정 0.37) + 걸을 때 팔이 벌어지는 여유
  function frameHalfWidthAt(z){
    camera.updateMatrixWorld();
    // 카메라는 위아래로만 기울어 있다(요·롤 없음) — 월드 x 축이 카메라 x 축과 나란하므로
    // 그 깊이의 가로 반폭은 tan(fov/2)·aspect·(카메라 앞 거리)다. 앞 거리는 카메라 공간에서 잰다.
    const p = P3(0, 0.9, z).applyMatrix4(camera.matrixWorldInverse);
    return Math.tan(camera.fov * Math.PI / 360) * camera.aspect * Math.max(0.1, -p.z);
  }
  function nearSpawn(w){
    const d = 11 + Math.random()*2;               // 카메라에서 11~13 m
    const z = 6 - d;
    const lim = Math.max(0.5, frameHalfWidthAt(z) - BODY_HALF);
    const side = w.g.position.x < 0 ? -1 : 1;     // 어느 쪽에서 오는지는 그대로 둔다
    // 화면 반폭의 35~90 % 자리에 세운다 — 일반 작업자가 스폰 순간 화면에서 차지하는 자리와
    // 같은 범위다. 늘 한가운데 두면 「가운데 = 함정」이라는 새 신호가 그대로 생긴다.
    w.g.position.set(side * lim * (0.35 + Math.random()*0.55), 0, z);
    return w;
  }
  function spawnTrapWorker(){
    const w = spawnWorker(null);
    w.act = TRAP_ACT; w.look = 'fall'; w.trap = true;
    buildTrap(w);
    return nearSpawn(w);
  }

  // ---------- 웨이브 진행 ----------
  const WV = { row: null, T: 0, spawnT: 0, baitOut: false, seen: null };
  S.sweeps = 3; S.cleared = false;                 // 일제 점검 3회 · 5웨이브 완주 여부
  S.waveStats = {};                                // fix round 1: 웨이브별 스폰·도달 실측(§검증 참고)
  function wstat(n){
    if(!S.waveStats[n]) S.waveStats[n] = { spawned: 0, arrived: 0, baitSpawned: 0, baitArrived: 0 };
    return S.waveStats[n];
  }

  // fix round 1 — 스폰 지점(z −12~−16)에서 사고구역(z>3)까지는 15~19 사이 거리를 속도
  // 0.9~1.2 로 걷는다. 가장 느린 경우(거리 19 ÷ 속도 0.9) = 21.1초. 이 값보다 짧게 남았을 때
  // 강제 미끼를 내면 그 미끼가 "스폰은 됐지만 사고구역엔 못 닿고" 다음 웨이브 전환에 지워지는
  // 사고가 났다(리뷰 Critical). 이걸 고치는 손은 둘이다 — (1) 마감을 이 값보다 넉넉히 앞당기고
  // (2) startWave 가 더 이상 진행 중인 작업자를 지우지 않는다(clearWorkers 자동 호출 제거,
  // 아래). 어느 한쪽만으론 부족하다 — (1)만 하면 그래도 아슬아슬하고, (2)만 하면 강제 미끼가
  // 다음 웨이브까지 늦게 넘어가 "그 웨이브의 미끼"로 잡히지 않을 수 있다.
  const MAX_TRAVEL_S = 22;   // 21.1초 + 여유

  function doSpawn(row){
    const pool = ACTS_ALL.filter(row.acts);
    if(!pool.length) return;
    const remaining = row.sec - WV.T;
    // 강제 미끼 마감을 "최악 이동시간 + 스폰 간격 한 틱" 만큼 남았을 때로 당겼다(이전엔
    // every*1.4 = 1.8~3.6초뿐이라 미끼가 나와도 사고구역까지 갈 시간이 없었다).
    const lastCall = remaining <= MAX_TRAVEL_S + row.every;
    let kind;
    // !WV.baitOut 은 "아직 하나도 안 나왔다면" 을 뜻하는 최저선 가드다 — bait 판정 전체를
    // 가두면(첫 미끼가 나온 뒤로는 다시 못 나오면) safeRatio 가 그 뒤로 뜻이 없어진다.
    // 그래서 확률 판정은 매번 살아 있고, "이번이 마지막 기회인데 아직 하나도 없었다" 일 때만 강제한다.
    if((!WV.baitOut && lastCall) || Math.random() < row.safeRatio) kind = 'bait';
    else if(Math.random() < 0.12) kind = 'passer';           // 행인 — 미끼와는 별개(선택 사항)
    else if(row.trap && pool.some(a=> a.id === 'fall') && Math.random() < 0.35) kind = 'trap';
    else if(row.double && Math.random() < 0.35) kind = 'double';
    else kind = 'hazard';

    const st = wstat(row.n); st.spawned++;
    let w = null;
    if(kind === 'bait'){
      const act = pool[(Math.random()*pool.length)|0];
      w = spawnWorker(act, true); WV.baitOut = true; st.baitSpawned++;
    }else if(kind === 'passer'){
      w = spawnWorker(null);
    }else if(kind === 'trap'){
      w = spawnTrapWorker(); WV.seen.add('fall');
    }else if(kind === 'double'){
      const pairs = doublePairsFor(pool);
      if(pairs.length){
        const [id1, id2] = pairs[(Math.random()*pairs.length)|0];
        w = spawnDouble(ACT_BY_ID[id1], ACT_BY_ID[id2]);
        WV.seen.add(id1); WV.seen.add(id2);
      }
    }
    if(!w){                              // double 인데 조합이 없었거나 위에서 안 만들어진 나머지
      const act = pool[(Math.random()*pool.length)|0];
      w = spawnWorker(act, false); WV.seen.add(act.id);
    }
    // fix round 2(C3) — 웨이브 5에서 함정만 가까이 나오면 「가까이서 나타나면 함정」이 표를
    // 대신하는 신호가 된다(첫째 기준 위반). 같은 웨이브의 일반 위험·미끼·행인도 같은 비율로
    // 가까이 내보내 거리로는 못 가리게 한다 — 가리려면 표(고리가 어디에 걸렸는가)를 봐야 한다.
    if(row.trap && !w.trap && Math.random() < 0.3) nearSpawn(w);
    w.spawnWave = row.n;                 // reachedZone 이 "어느 웨이브가 스폰했는지" 로 도달을 센다
  }

  function stepWave(dt){
    if(!WV.row) return;
    WV.T += dt; WV.spawnT += dt;
    if(WV.spawnT >= WV.row.every){ WV.spawnT = 0; doSpawn(WV.row); }
    if(WV.T >= WV.row.sec) endWave();
  }

  // fix round 1 — startWave 는 더 이상 진행 중인 작업자를 지우지 않는다. 예전엔 여기서
  // clearWorkers() 를 불러 이전 웨이브에서 아직 걷고 있던(특히 강제 미끼처럼 웨이브 막판에
  // 나온) 사람들을 통째로 지웠다 — 스폰된 사람의 25~45% 가 사고구역(z>3)에 닿기도 전에
  // 삭제되는 구조적 결함이었다(리뷰 Critical·Important, 같은 뿌리). stepWorkers 는 웨이브를
  // 모르고 S.workers 전체를 계속 걷게 하므로, 지우지만 않으면 늦게 나온 사람도 다음 웨이브
  // 시간을 빌려 결국 사고구역까지 걷는다 — 스폰된 사람은 하나도 버려지지 않는다.
  // (직접 지워야 할 일이 생기면 clearWorkers() 는 남겨 뒀고 __dbg.clearWorkers 로 부를 수 있다.)
  function startWave(n){
    const row = WAVES[n - 1]; if(!row) return;
    S.wave = n; WV.row = row; WV.T = 0; WV.spawnT = 0; WV.baitOut = false; WV.seen = new Set();
    S.running = true;
    hideMaintCard();
    doSpawn(row); WV.spawnT = 0;      // 웨이브 시작과 동시에 한 명은 바로 나온다
    updateSweepBtn();
    hud();
  }
  function clearWorkers(){            // 이제 자동으로는 안 불린다 — 디버그/테스트 전용으로 남겨 둔다
    S.workers.slice().forEach(w=>{ scene.remove(w.g); });
    S.workers.length = 0;
  }

  function finishAllWaves(){
    S.running = false; S.over = true; S.cleared = true;
    el('hint').textContent = '5웨이브 완료 — 근무 종료';
    showEndScreen();
  }

  // fix round 3(I7) — 게임 오버 뒤에는 웨이브가 더 돌지 않는다.
  // 예전엔 frame() 이 `if(S.running){ stepWorkers(dt); stepWave(dt); }` 로 두 함수를 한 블록에
  // 묶어 불렀다. stepWorkers 안에서 마지막 목숨이 떨어져 gameOver() 가 S.running=false 를 해도
  // 같은 블록의 stepWave(dt) 는 그대로 실행된다 — 45초 만료가 그 프레임에 겹치면 endWave →
  // showMaintCard 가 종료 화면 뒤에 정비 카드를 띄우고, 문항이 없으면 advanceWave → startWave 가
  // S.running 을 다시 true 로 만든다. 웨이브 5에서 그러면 finishAllWaves 가 헤드라인을
  // 「사고 발생 — 게임 오버」에서 「근무 종료 — 5웨이브 완주」로 덮어써 결과가 뒤집힌다.
  // 가드는 endWave 하나에만 둔다. 처음엔 advanceWave 에도 같은 줄을 넣었는데, 그러면 검사11이
  // endWave 의 가드를 지워도 통과해 버렸다(실측: 무너뜨림 D 가 34/34 통과) — 정비 문항이 없어
  // advanceWave 로 흐르는 경우를 advanceWave 쪽 가드가 대신 막아, 결함이 화면에 아무 자국도
  // 남기지 않았기 때문이다. 「실패할 수 없는 검사」는 이 리포에서 반복된 실패다. advanceWave 는
  // endWave(정비 카드) 를 거쳐야만 닿는 자리라 그 가드는 어차피 도달 불가능한 죽은 줄이었고,
  // 지우고 나니 endWave 의 가드를 지웠을 때 두 갈래(정비 카드가 뜬다 / 완주로 덮인다)가 모두
  // 화면에 드러나 검사11이 실제로 실패한다.
  function advanceWave(){
    hideMaintCard();
    const next = S.wave + 1;
    if(next > WAVES.length){ finishAllWaves(); return; }
    startWave(next);
  }

  function endWave(){
    if(S.over) return;               // 이미 끝난 판이면 웨이브를 마무리하지 않는다(정비 카드·다음 웨이브 없음)
    S.running = false;
    showMaintCard();
  }

  // ---------- 정비 시간 카드 ----------
  function pickMaintCard(){
    const ids = Array.from(WV.seen || []);
    for(let i = ids.length - 1; i > 0; i--){ const j = (Math.random()*(i+1))|0; const t = ids[i]; ids[i] = ids[j]; ids[j] = t; }
    for(const id of ids){
      const pool = MAINT_QUIZ[id];
      if(pool && pool.length) return pool[(Math.random()*pool.length)|0];
    }
    return null;                                   // 문항이 없으면 null — 호출부가 카드를 안 띄운다
  }
  let maintAnswered = false;
  function showMaintCard(){
    const q = pickMaintCard();
    if(!q){ advanceWave(); return; }                // 문항이 없으면 카드를 안 띄우고 바로 다음 웨이브
    maintAnswered = false;
    el('mSrc').textContent = q.src + (q.tm > 1 ? ' · ' + q.tm + '회 출제' : '');
    el('mStem').textContent = q.t;
    const ol = el('mChoices'); ol.className = 'mChoices'; ol.innerHTML = '';
    q.c.forEach((c, i)=>{
      const li = document.createElement('li');
      const b = document.createElement('b'); b.textContent = '①②③④⑤'[i];
      const s = document.createElement('span'); s.textContent = c;
      li.appendChild(b); li.appendChild(s);
      li.addEventListener('click', ()=> pickChoice(q, i + 1, ol));
      ol.appendChild(li);
    });
    const pt = el('mPoint'); pt.hidden = true; pt.innerHTML = '';
    el('dMaint').hidden = false;
  }
  function pickChoice(q, picked, ol){
    if(maintAnswered) return; maintAnswered = true;
    ol.classList.add('answered');
    Array.from(ol.children).forEach((li, i)=>{
      if(i + 1 === q.a) li.classList.add('ok');
      else if(i + 1 === picked) li.classList.add('bad');
    });
    if(q.pt){ const pt = el('mPoint'); pt.innerHTML = q.pt; pt.hidden = false; }
  }
  function hideMaintCard(){ const d = el('dMaint'); if(d) d.hidden = true; }
  const btnNextWave = el('btnNextWave'); if(btnNextWave) btnNextWave.addEventListener('click', advanceWave);

  // ---------- 일제 점검(3회): 불안전 작업자에만 EdgesGeometry 테두리를 3초 씌운다 ----------
  // skinMat·pantsMat 같은 몸 재질은 작업자끼리 공유한다(Task 3 의 fadeOut 주석과 같은 이유) —
  // 그 재질의 emissive 를 건드리면 미끼·행인까지 같이 빛난다. 그래서 mesh.material 은 그대로
  // 두고, geometry 로 EdgesGeometry 를 새로 만들어 자식으로 얹는다(재질은 이 용도로만 쓰는
  // 새 재질 하나를 모든 테두리가 같이 쓴다 — 몸 재질과 무관하니 공유해도 안전하다).
  // Task 6: 원래 EdgesGeometry(o.geometry) 를 문턱각 없이(기본 1°) 부르면 몸통·팔다리 원기둥의
  // 16각 근사 옆면 하나하나가 전부 선이 되어(팔다리 8개 원기둥 × 세로선 10~16개) 사람 전체가
  // 빽빽한 노란 철사 뭉치가 된다 — 「누가」는 튀지만 그 아래 표(로프가 늘어졌는지, 몸이
  // 기울었는지)가 그 뭉치에 묻혀 안 보인다(390px 재측정으로 확인, 스크린샷 t6_sweep_*).
  // 문턱각을 40°로 올리면 원기둥 옆면처럼 인접면 각차가 작은(360/16=22.5°) 선은 빠지고,
  // 상자 모서리·모자 챙 같은 실루엣 급전환 선만 남는다 — 같은 라이브러리 호출로 밀도만 뺀다.
  // 눈·입처럼 실루엣에 안 쓰이는 자잘한 부품은 통째로 건너뛴다(반경 0.03 미만).
  // 색도 로프(lanyMat 0xF2D24A)·난간(RAIL_Y 0xE3B54D)과 겹치던 앰버 대신, 12종 표 어디에도
  // 안 쓰는 흰빛 하늘색으로 바꿔 표 색과 안 섞이게 했다.
  const sweepLineMat = new THREE.LineBasicMaterial({color: col(0xCFEBFF), transparent: true, opacity: .7, depthTest: false});
  const SWEEP_EDGE_THRESHOLD = 40;
  function sweepHighlight(w, ms){
    const added = [];
    w.body.traverse(o=>{
      if(o.isMesh && o.geometry){
        // boundingSphere 는 spawnWorker 가 몸을 지을 때 이미 한 번 계산해 뒀다(리뷰 Minor) —
        // 혹시 그 경로를 안 거친 메시가 섞여도 조용히 죽지 않도록 없으면 여기서도 한 번 잰다.
        if(!o.geometry.boundingSphere) o.geometry.computeBoundingSphere();
        if(o.geometry.boundingSphere && o.geometry.boundingSphere.radius < 0.03) return;   // 눈·입 등 잔부품 제외
        const ln = new THREE.LineSegments(new THREE.EdgesGeometry(o.geometry, SWEEP_EDGE_THRESHOLD), sweepLineMat);
        ln.renderOrder = 999; o.add(ln); added.push([o, ln]);
      }
    });
    setTimeout(()=>{ added.forEach(([o, ln])=>{ o.remove(ln); ln.geometry.dispose(); }); }, ms);
  }
  function sweepCheck(){
    if(S.sweeps <= 0 || !S.running) return;
    S.sweeps--;
    S.workers.forEach(w=>{ if(w.act && !w.stopped && !w.done) sweepHighlight(w, 3000); });   // 미끼(w.act=null)는 제외된다
    updateSweepBtn();
  }
  function updateSweepBtn(){
    // Task 5: 남은 횟수는 이제 HUD(#hudSweepN)가 보여준다 — 버튼은 동작 이름만 낸다.
    const b = el('btnSweep'); if(!b) return;
    b.textContent = '일제 점검';
    b.disabled = S.sweeps <= 0;
  }
  const btnSweep = el('btnSweep'); if(btnSweep) btnSweep.addEventListener('click', sweepCheck);

  // Task 7 검사기가 __dbg.wave(n) 으로 특정 웨이브로 건너뛴다.
  function wave(n){ startWave(n); }

  // Task 5: 무재해 기록 3칸 — 안전모 아이콘. 하트(♥)를 지우고 다시 만들었다.
  const HELMET_SVG = '<svg viewBox="0 0 22 16" aria-hidden="true"><path d="M11 1.4c-4.1 0-7.5 3-8 6.9h16C18.5 4.4 15.1 1.4 11 1.4z"/><rect x="1.2" y="8.3" width="19.6" height="2.7" rx="1.35"/></svg>';
  // Task 3·5 브리프가 인터페이스로 쓰는 이름은 hud() 다 — judge(w) 예제가 마지막 줄에서 hud() 를 부른다.
  function hud(){
    const lives = el('hudLives');
    lives.innerHTML = '';
    for(let i=0;i<3;i++) lives.insertAdjacentHTML('beforeend', '<span class="life' + (i < S.lives ? ' on' : '') + '">' + HELMET_SVG + '</span>');
    el('hudScoreN').textContent = S.score.toLocaleString('ko-KR');
    el('hudWaveN').textContent = S.wave;
    el('hudSweepN').textContent = S.sweeps;
    // fix round 3(C1): 오지적 누적 — 「잘못 분 것도 놓친 것만큼 나쁘다」를 규칙으로 보여준다
    el('hudWrongN').textContent = S.wrong;
    const wr = el('hudWrong'); if(wr) wr.classList.toggle('near', S.wrong >= WRONG_PER_LIFE - 1);
  }

  /* ---------- Task 5: 종료 화면 ---------- */
  // S.missed 를 act.id 로 묶는다. trap(5웨이브 함정)은 fall 을 얕은 복사해 tell 만 바꾼
  // 별도 객체(TRAP_ACT)라 id·name·law·fix 는 fall 과 완전히 같다 — 이름·해결·조문·링크는
  // 그룹 대표 act 것을 그대로 써도 안전하다(전부 같은 값). tell 은 다를 수 있어(trap 이 자기
  // 문구를 갖는다) 대표 하나만 보여주면 병합된 인스턴스 일부와 어긋난다 — 그래서 그룹은 유지한
  // 채 등장한 distinct tell 을 전부 모은다(fix round 1: 리뷰가 지적한 "그룹은 유지, tell 은 모아
  // 보여준다"를 따름).
  function groupMissed(){
    const order = [], byId = {};
    S.missed.forEach(act=>{
      if(!byId[act.id]){ byId[act.id] = { act, count: 0, tells: [] }; order.push(act.id); }
      const g = byId[act.id];
      g.count++;
      if(act.tell && g.tells.indexOf(act.tell) < 0) g.tells.push(act.tell);   // 등장 순서 유지한 distinct
    });
    return order.map(id=> byId[id]);
  }
  function renderMissed(){
    const box = el('eMissed'); box.innerHTML = '';
    const groups = groupMissed();
    if(!groups.length){
      const p = document.createElement('p'); p.className = 'eMissedEmpty';
      p.textContent = '놓친 행동이 없습니다.';
      box.appendChild(p);
      return;
    }
    groups.forEach(({act, count, tells})=>{
      const card = document.createElement('div'); card.className = 'eGroup';
      const head = document.createElement('div'); head.className = 'eGroupHead';
      const name = document.createElement('span'); name.className = 'eGroupName'; name.textContent = act.name;
      const cnt = document.createElement('span'); cnt.className = 'eGroupCount mono'; cnt.textContent = '×' + count;
      head.appendChild(name); head.appendChild(cnt); card.appendChild(head);

      // 이렇게 보였습니다 — 놓친 표(tell). trap 처럼 이 그룹에 서로 다른 tell 이 섞여 있으면
      // 전부 나열한다(하나만 골라 보여주면 병합된 나머지 인스턴스의 실제 모습과 어긋난다).
      if(tells.length){
        const spot = document.createElement('p'); spot.className = 'eGroupTell';
        spot.textContent = '이렇게 보였습니다 — ' + tells.join(' · ');
        card.appendChild(spot);
      }

      const fix = document.createElement('p'); fix.className = 'eGroupFix';
      fix.textContent = '이렇게 했어야 합니다 — ' + act.fix;
      card.appendChild(fix);

      // 조문은 자르지 않는다(confined 는 셋) — details/summary 로 접어서 보여준다.
      const det = document.createElement('details'); det.className = 'eGroupLaw';
      const sum = document.createElement('summary'); sum.textContent = '근거 조문';
      const lawP = document.createElement('p'); lawP.textContent = act.law;
      det.appendChild(sum); det.appendChild(lawP);
      card.appendChild(det);

      const link = document.createElement('a'); link.className = 'eGroupLink';
      link.href = 'lab.html?v=09091036#topic=' + act.topic;   // id 가 곧 3D 실습장 주제 키 — lab.html?v=09091036 은 변형별 실습장 경로(build_defense.py VARIANTS)
      link.target = '_blank'; link.rel = 'noopener';
      link.textContent = '실습장에서 보기';
      card.appendChild(link);

      box.appendChild(card);
    });
  }
  function showEndScreen(){
    // fix round 3(C1): 오지적으로 끝난 판은 「사고 발생」이 아니다 — 사고는 한 건도 없을 수 있다.
    // 끝나는 방식은 놓쳐서 끝난 것과 똑같고(무재해 0 = 종료), 헤드라인만 왜 끝났는지를 말한다.
    el('eHead').textContent = S.cleared ? '근무 종료 — 5웨이브 완주'
                            : (S.overCause === 'wrong' ? '오지적 누적 — 게임 오버' : '사고 발생 — 게임 오버');
    el('eScore').textContent = S.score.toLocaleString('ko-KR');
    const ok = S.judgeOk, n = S.judgeN, pct = n ? Math.round(ok / n * 100) : 0;
    el('eAcc').textContent = pct + '%';
    el('eAccSub').textContent = '맞은 지적 ' + ok + ' / 전체 지적 ' + n;
    // fix round 3(C1): 오지적 총 횟수 — 이것으로 무재해를 몇 칸 잃었는지까지 같이 낸다.
    el('eWrongSub').textContent = '오지적 ' + S.wrongTotal + '회'
      + (S.wrongLives ? ' — 무재해 ' + S.wrongLives + '칸 소진' : '')
      + (S.wrong ? ' (다음 칸까지 ' + S.wrong + '/' + WRONG_PER_LIFE + ')' : '');
    el('eWave').textContent = (S.cleared ? 5 : S.wave) + ' / 5';
    renderMissed();
    el('dEnd').hidden = false;
  }
  const btnAgain = el('btnAgain'); if(btnAgain) btnAgain.addEventListener('click', ()=> location.reload());

  /* ---------- 리사이즈 · 시작 · 루프 ---------- */
  function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); layoutWhistle(); }
  addEventListener('resize', resize); resize();

  ensureWhistle();
  updateSweepBtn();
  // HUD 의 「오지적 n/3」에서 분모는 WRONG_PER_LIFE 다. 예전엔 마크업에 3이 글자로 박혀 있어
  // 상수를 바꾸면 화면만 옛 숫자를 말했다 — 규칙이 바뀌면 표시도 따라오게 상수에서 찍는다.
  { const wm = el('hudWrongMax'); if(wm) wm.textContent = '/' + WRONG_PER_LIFE; }
  startWave(1);                    // Task 4: 웨이브 1로 시작한다(Step 3 의 행인 하나는 여기서 대체됨)
  hud();

  // Task 7 검사기가 쓰는 다섯 키(S·ACTS·spawn·judge·wave)는 그대로 두고 뒤에만 더한다.
  window.__dbg = { S, ACTS: window.HAZARD_ACTS, spawn: spawnWorker, judge, wave,
                   build: ACT_BUILD, safe: ACT_SAFE,
                   act: id=> (window.HAZARD_ACTS || []).find(a=> a.id === id),
                   startWave, endWave, sweep: sweepCheck, stepWave, stepWorkers, buildTrap, clearWorkers,
                   // fix round 2(C3): 함정 작업자가 화면 안에 들어오는지를 「페이지 자신의 카메라로」
                   // 재려면 검사기에 camera 와 spawnTrapWorker 가 있어야 한다. 카메라를 검사기가
                   // 새로 만들어 재면 fov·aspect·위치를 베껴 쓰는 셈이라(사본끼리 비교) 규격이
                   // 바뀌어도 못 잡는다 — 실제 렌더에 쓰는 그 객체를 그대로 내준다.
                   // HUD 분모가 상수를 읽는지 검사기가 확인하려면 상수 자체가 있어야 한다
                   // (DOM 만 보면 글자로 박아 둔 3 과 상수에서 찍은 3 을 못 가른다).
                   camera, spawnTrap: spawnTrapWorker, WRONG_PER_LIFE };   // Task 4 가 뒤에 더한 것들(stepWave·stepWorkers·buildTrap·clearWorkers 는 검증용)

  let last = performance.now();
  function frame(now){
    const dt = Math.min(0.05, (now - last)/1000); last = now;
    // fix round 3(I7): stepWorkers 안에서 마지막 목숨이 떨어지면 그 프레임의 stepWave 는 돌지
    // 않는다 — 45초 만료가 겹쳐 종료 화면 뒤에서 웨이브가 되살아나던 자리다(endWave 주석 참고).
    if(S.running){ S.t += dt; stepWorkers(dt); if(S.running) stepWave(dt); }
    if(S.stun > 0){ S.stun -= dt; if(S.stun <= 0){ S.stun = 0; lockUi(false); } }
    if(S.warnT > 0){ S.warnT -= dt; if(S.warnT <= 0){ S.warnT = 0; const b = el('dWarn'); if(b) b.hidden = true; } }
    if(S.basisT > 0){ S.basisT -= dt; if(S.basisT <= 0){ S.basisT = 0; const b = el('dBasis'); if(b) b.hidden = true; } }
    stepWhistleFx(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
