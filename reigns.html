<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A1018">
<title>안전관리자의 하루</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Gothic+A1:wght@700;800&display=swap">
<style>
:root{
  --bg:#0A1018; --panel:#0F1622; --panel2:#182234; --card:#141E2E;
  --line:#33425C; --line-soft:#1E2938;
  --text:#E8EEF8; --muted:#8C99B0; --dim:#6E7C95;
  --safe:#5CC08A; --pace:#7FA6E0; --coin:#E3B54D; --gov:#B58FE0;
  --bad:#F07056; --ok:#5CC08A; --warn:#E3B54D;
  --sans:"IBM Plex Sans KR","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",Consolas,monospace;
  --display:"Gothic A1","IBM Plex Sans KR",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box} [hidden]{display:none!important}
html,body{height:100%}
/* iOS Safari 에서 height:100% 는 툴바가 없는 큰 뷰포트로 계산된다. 툴바가 떠 있으면
   화면 아래가 그 뒤로 들어가는데 body 가 overflow:hidden 이라 끌어올릴 수도 없다.
   dvh 는 지금 실제로 보이는 높이를 따라간다. */
@supports (height:100dvh){ html,body{height:100dvh} }
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  background-image:radial-gradient(120% 70% at 50% -10%, #16233A 0%, #0A1018 62%)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

#app{height:100%;display:flex;flex-direction:column;align-items:center;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  gap:14px;max-width:560px;margin:0 auto}
@supports (height:100dvh){ #app{height:100dvh} }

/* ---------- 게이지 ---------- */
#hud{width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;flex:none}

/* ---------- 계기판 — 관리비 잔액과 오늘의 위험 확률 ----------
   미조치 위반이 쌓이면 그것이 오늘 하루에 얼마의 확률로 터지는지 숫자로 뜬다.
   감추지 않는다. 얼마를 걸고 있는지 알아야 거는 것이 도박이 아니라 판단이 된다.
   색만으로 뜻을 지지 않도록 단계마다 글리프와 말이 함께 바뀐다. */
#gear{width:100%;margin-top:15px;padding:9px 12px 10px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line-soft);flex:none}
#gear .fund{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding-bottom:8px;
  margin-bottom:9px;border-bottom:1px solid var(--line-soft)}
#gear .fund .k{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);
  white-space:nowrap}
#gear .fund .v{font-size:15.5px;font-weight:700;color:var(--text);margin-left:auto;
  white-space:nowrap}
#gear .fund .v u{text-decoration:none;font-size:10.5px;font-weight:500;color:var(--muted);margin-left:3px}
#gear .fund .fdlt{font-family:var(--mono);font-size:11.5px;color:var(--bad);opacity:0;
  transform:translateY(3px);transition:.28s;white-space:nowrap}
#gear .fund .fdlt.on{opacity:1;transform:none}
#gear .fund .note{font-size:10.5px;color:var(--dim);width:100%;order:3;margin-top:5px}
#gear.low .fund .v{color:var(--warn)}
#gear.out .fund .v{color:var(--bad)}
#gear .mrow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
#gear .m{--c:var(--ok)}
#gear .m.b1{--c:var(--warn)}
#gear .m.b2{--c:#EC835A}
#gear .m.b3{--c:var(--bad)}
#gear .m .lb{display:flex;justify-content:space-between;align-items:baseline;gap:5px;margin-bottom:4px}
#gear .m .n{font-size:10.5px;color:var(--muted);white-space:nowrap}
#gear .m .p{font-size:13.5px;font-weight:700;color:var(--text)}
#gear .m .tk{height:5px;border-radius:3px;background:rgba(255,255,255,.08);
  background:color-mix(in srgb, var(--c) 24%, transparent);overflow:hidden}
#gear .m .fl{height:100%;border-radius:3px;width:0;background:var(--c);
  transition:width .5s cubic-bezier(.2,.8,.3,1), background .5s ease}
#gear .m .st{margin-top:4px;font-size:10px;color:var(--muted);white-space:nowrap}
#gear .m .st b{color:var(--c);font-weight:700}
.lack{color:var(--warn);font-weight:600}

/* ---------- 눈에 보이는 것 ----------
   사고가 났는데 화면이 조용하면 숫자만 바뀐 것처럼 보인다. 흔들고 번쩍이는 것은
   장식이 아니라 「지금 뭔가 일어났다」를 몸으로 알리는 장치다.
   움직임을 줄이도록 설정한 사람에게는 전부 꺼진다(맨 위 prefers-reduced-motion). */
#flash{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:0;background:transparent}
#flash.hit{animation:fxHit .5s ease-out}
#flash.fatal{animation:fxFatal 1.1s ease-out}
#flash.tw{animation:fxTw .45s ease-out}
@keyframes fxHit{0%{opacity:0;background:rgba(240,112,86,.42)}100%{opacity:0;background:rgba(240,112,86,0)}}
@keyframes fxFatal{0%{opacity:1;background:rgba(240,112,86,.75)}35%{opacity:1;background:rgba(240,112,86,.5)}
  100%{opacity:0;background:rgba(240,112,86,0)}}
@keyframes fxTw{0%{opacity:0;background:rgba(227,181,77,.34)}100%{opacity:0;background:rgba(227,181,77,0)}}
#app.shake{animation:fxShake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes fxShake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.g.low .track{animation:fxPulse 1.5s ease-in-out infinite}
@keyframes fxPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,112,86,0)}
  50%{box-shadow:0 0 0 3px rgba(240,112,86,.22)}}
#card.amb{border-color:var(--warn);box-shadow:0 0 0 1px rgba(227,181,77,.45),0 18px 40px rgba(0,0,0,.5)}
#card.amb .subj{color:var(--warn);font-weight:700;letter-spacing:.14em}
#chapBanner{position:fixed;left:0;right:0;top:calc(50% - 60px);z-index:46;pointer-events:none;
  text-align:center;opacity:0;transform:translateY(10px)}
#chapBanner.on{animation:fxBan 2.4s ease-out}
#chapBanner b{display:block;font-family:var(--display);font-weight:800;font-size:34px;
  letter-spacing:-.02em;color:var(--text);text-shadow:0 4px 24px rgba(0,0,0,.8)}
#chapBanner span{display:block;margin-top:8px;font-size:13.5px;color:var(--muted);
  text-shadow:0 2px 12px rgba(0,0,0,.9);padding:0 24px}
@keyframes fxBan{0%{opacity:0;transform:translateY(14px)}15%{opacity:1;transform:none}
  75%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-10px)}}

/* ---------- 판정 기록 ----------
   무엇을 지켰고 무엇을 넘겼는지 그 자리에서 쌓인다. 판이 끝나야 보이는 목록은
   늦다 — 지금 몇 건을 넘겼는지 알아야 다음 카드에서 다르게 고른다. */
#log{position:fixed;right:0;top:0;bottom:0;width:min(320px,86vw);z-index:36;
  background:var(--panel);border-left:1px solid var(--line);
  padding:calc(56px + env(safe-area-inset-top,0px)) 0 calc(12px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.3,1);box-shadow:-14px 0 40px rgba(0,0,0,.45)}
#log.on{transform:none;visibility:visible}
#log .lh{display:flex;align-items:baseline;gap:8px;padding:0 14px 10px;
  border-bottom:1px solid var(--line-soft);flex:none}
#log .lh b{font-family:var(--display);font-weight:800;font-size:14px}
#log .lh .sum{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
#log .lh .x{margin-left:auto;border:1px solid var(--line);background:var(--panel2);
  color:var(--muted);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
#log ul{margin:0;padding:10px 14px;list-style:none;overflow-y:auto;flex:1;
  display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
#log li{padding-left:10px;border-left:2px solid var(--line);font-size:12.5px;line-height:1.5}
#log li.ok{border-left-color:var(--ok)} #log li.no{border-left-color:var(--bad)}
#log li .t{display:flex;gap:6px;align-items:baseline}
#log li .m{font-family:var(--mono);font-size:10.5px;color:var(--dim);flex:none;font-weight:700}
#log li.ok .m{color:var(--ok)} #log li.no .m{color:var(--bad)}
#log li .n{color:var(--text);font-weight:600}
#log li .v{color:var(--warn);font-family:var(--mono);font-size:11.5px}
#log li .l{color:var(--dim);font-family:var(--mono);font-size:10.5px;margin-top:3px}
#log li .v2{color:var(--muted);font-size:11.5px}
#log li.nu{border-left-color:var(--line)}
#log li .dl{display:flex;flex-wrap:wrap;gap:3px 4px;margin-top:4px}
#log li .dl span{font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;
  background:var(--panel2);border:1px solid var(--line-soft);white-space:nowrap}
#log li .dl .u{color:var(--ok)} #log li .dl .d{color:var(--bad)}
#log li .dl b{color:var(--warn);margin-left:2px}
#log .empty{margin:0;padding:16px 14px;font-size:12px;color:var(--dim);line-height:1.6}
@media (min-width:1160px){
  #log{transform:none;visibility:visible;box-shadow:none}
  #log .lh .x{display:none}
  #bLog{display:none}
  /* 패널이 자리를 차지하므로 판을 그만큼 왼쪽으로 민다 */
  body{padding-right:320px}
}
.again{color:var(--ok);font-weight:600}
@media (max-width:430px){
  #gear .mrow{gap:8px}
  #gear .m .n{font-size:9.5px}
}
.g{display:flex;flex-direction:column;gap:5px;position:relative}
.g .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;letter-spacing:.02em;color:var(--muted)}
.g .lb b{font-family:var(--mono);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--dim)}
.g .track{height:7px;border-radius:4px;background:var(--line-soft);overflow:hidden;position:relative}
.g .fill{height:100%;width:60%;border-radius:4px;transition:width .45s cubic-bezier(.2,.8,.3,1),background .3s}
.g[data-k="0"] .fill{background:var(--safe)} .g[data-k="1"] .fill{background:var(--pace)}
.g[data-k="2"] .fill{background:var(--coin)} .g[data-k="3"] .fill{background:var(--gov)}
.g.low .fill{background:var(--bad)!important} .g.low .lb{color:var(--bad)}
.g.low .track{box-shadow:0 0 0 1px rgba(240,112,86,.5)}
/* 트랙은 fill 의 둥근 모서리 때문에 overflow:hidden 이라, 그 안에 두면 잘린다.
   밖으로 꺼내 트랙 바로 아래에 알약으로 띄운다. */
.g .dlt{position:absolute;right:0;top:calc(100% + 3px);z-index:3;pointer-events:none;
  font-family:var(--mono);font-size:12px;font-weight:600;padding:1px 6px;border-radius:5px;
  background:var(--panel);border:1px solid var(--line-soft);box-shadow:0 2px 8px rgba(0,0,0,.5);
  opacity:0;transform:translateY(-3px);transition:.28s;white-space:nowrap}
.g .dlt em{font-style:normal;font-size:10.5px;margin-left:2px;color:var(--warn);font-weight:700}
.g .dlt.on{opacity:1;transform:none}
.g .dlt.up{color:var(--ok)} .g .dlt.dn{color:var(--bad)}

/* ---------- 날짜 줄 ---------- */
#meta i{font-style:normal;font-family:var(--mono);font-size:10.5px;
  letter-spacing:.06em;color:var(--warn);margin-left:5px}
#meta{width:100%;display:flex;justify-content:space-between;align-items:center;flex:none;
  font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.04em}
#meta .site{color:var(--muted);flex:1;text-align:right}
#meta .fresh{border:1px solid var(--line-soft);background:none;color:var(--dim);font-family:var(--mono);
  font-size:11px;letter-spacing:.04em;padding:3px 8px;border-radius:5px;cursor:pointer;margin-left:10px}
#meta .fresh:hover{border-color:var(--warn);color:var(--warn)}

/* ---------- 카드 ---------- */
#board{flex:1;width:100%;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
#card{position:absolute;width:100%;max-width:400px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:20px 20px 22px;
  box-shadow:0 18px 40px rgba(0,0,0,.45);cursor:grab;user-select:none;-webkit-user-select:none;
  touch-action:pan-y;will-change:transform}
#card.drag{cursor:grabbing;transition:none}

/* ---------- 좁고 낮은 화면 ----------
   카드가 position:absolute 라 내용만큼 자라고, 그러면 아래 선택 버튼을 덮어 버린다.
   반대로 만든다 — 통(#board)이 카드 높이를 정하고 본문이 그 안에서 스크롤한다.
   ux.md ④-1 의 처방이다. */
#card{max-height:100%;display:flex;flex-direction:column;overflow:hidden}
#card .art, #card .subj, #card .who, #card .topic{flex:none}
#card .say{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain}
#card.settle{transition:transform .32s cubic-bezier(.2,.8,.3,1),opacity .3s ease-out}
#card.fly{transition:transform .28s ease-in,opacity .28s ease-in;opacity:0}
#card .subj{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
#card .who{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;margin:6px 0 12px;
  display:flex;align-items:center;gap:9px}
#card .who i{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
#card .say{font-size:16.5px;line-height:1.66;text-wrap:pretty}
#card .topic{margin-top:16px;padding-top:13px;border-top:1px solid var(--line-soft);
  font-size:12.5px;color:var(--muted)}
#card .topic b{color:var(--text);font-weight:600}

/* 기울일 때 뜨는 선택 라벨 */
.pick{position:absolute;top:18px;padding:5px 11px;border-radius:6px;font-size:12.5px;font-weight:600;
  border:1.5px solid;opacity:0;transition:opacity .12s;pointer-events:none}
.pick.l{left:16px;color:var(--pace);border-color:var(--pace);background:rgba(127,166,224,.12)}
.pick.r{right:16px;color:var(--coin);border-color:var(--coin);background:rgba(227,181,77,.12)}

/* ---------- 선택 버튼 ---------- */
#choices{width:100%;max-width:400px;display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.ch{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px 13px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s}
.ch:hover{border-color:var(--warn);background:#1E2A3F}
.ch .kb{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--dim)}
.ch .tx{font-size:13.5px;line-height:1.42;font-weight:500}
#swipeHint{width:100%;max-width:400px;text-align:center;font-size:11.5px;color:var(--dim);flex:none}

/* ---------- 판정 시트 ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);
  border-top:1px solid var(--line);border-radius:16px 16px 0 0;
  padding:18px 20px calc(22px + env(safe-area-inset-bottom, 0px));
  max-width:560px;margin:0 auto;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.3,1);
  box-shadow:0 -14px 40px rgba(0,0,0,.5)}
#sheet{visibility:hidden}
#sheet.on{transform:none;visibility:visible}
#sheet .verdict{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:800;
  font-size:15px;letter-spacing:-.01em;padding:5px 12px;border-radius:6px;border:1px solid}
#sheet .verdict.ok{color:var(--ok);border-color:rgba(92,192,138,.5);background:rgba(92,192,138,.12)}
#sheet .verdict.no{color:var(--bad);border-color:rgba(240,112,86,.5);background:rgba(240,112,86,.12)}
#sheet .out{margin:12px 0 0;font-size:14.5px;line-height:1.6}
#sheet .twist{margin-top:10px;padding:8px 11px;border-radius:8px;font-size:12.5px;
  background:rgba(227,181,77,.12);border-left:2px solid var(--warn);color:var(--text)}
#sheet .delta{margin-top:10px;display:flex;flex-wrap:wrap;gap:5px 7px}
#sheet .delta span{font-family:var(--mono);font-size:11.5px;padding:3px 7px;border-radius:6px;
  background:var(--panel2);border:1px solid var(--line-soft)}
#sheet .delta .up{color:var(--ok)} #sheet .delta .dn{color:var(--bad)}
#sheet .delta .z{color:var(--dim)}
#sheet .std{margin-top:14px;padding:12px 14px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line-soft)}
#sheet .std .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim);display:block;margin-bottom:5px}
#sheet .std .v{font-size:14px;line-height:1.55}
/* 값이 여럿인 표에서 그 카드가 실제로 물은 값만 살리고 나머지는 뒤로 물린다.
   한 판에 한 값씩 붙고, 반복하면 표 전체가 채워진다. */
#sheet .std .v em{font-style:normal;color:var(--warn);font-family:var(--mono);font-weight:500}
#sheet .std .v em.off{color:var(--dim);font-weight:400}
#sheet .std .v em.hit{color:var(--warn);font-weight:700;background:rgba(227,181,77,.16);
  box-shadow:inset 0 -1px 0 rgba(227,181,77,.55);padding:1px 5px;border-radius:4px}
#sheet .law{margin-top:9px;font-size:12px;color:var(--muted);font-family:var(--mono);line-height:1.5}
#sheet .go{margin-top:16px;width:100%;border:0;border-radius:9px;padding:13px;background:var(--warn);
  color:#1A1200;font-weight:700;font-size:14.5px;cursor:pointer;font-family:var(--display)}
#sheet .go:hover{filter:brightness(1.07)}

/* ---------- 종료 화면 ---------- */
#over{position:fixed;inset:0;z-index:40;background:rgba(6,10,17,.94);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .35s}
#over{visibility:hidden}
#over.on{opacity:1;pointer-events:auto;visibility:visible}
#over .box{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:26px 24px}
#over .tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--bad)}
#over h2{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;margin:8px 0 10px;text-wrap:balance}
#over h2.win{color:var(--ok)}
#over p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.65}
#over .stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0 0}
#over .stat{background:var(--panel2);border:1px solid var(--line-soft);border-radius:9px;padding:10px 12px}
#over .stat .k{font-size:11px;color:var(--dim)}
#over .stat .v{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
#over .stat .v small{font-family:var(--sans);font-weight:500;font-size:11.5px;color:var(--muted);
  margin-left:6px;letter-spacing:0}
#over #oLesson{margin:10px 0 0;padding:10px 12px;border-left:2px solid var(--warn);
  background:rgba(227,181,77,.07);border-radius:0 8px 8px 0;font-size:13px;line-height:1.6;color:var(--text)}
#over .viol{margin-top:16px}
#over .viol ul{max-height:min(34dvh,260px);overflow-y:auto;padding-right:4px;
  overscroll-behavior:contain}
#over #oTally{margin:10px 0 0;font-size:12px;line-height:1.6;color:var(--dim)}
#over .box{max-height:calc(100dvh - 90px);overflow-y:auto}
#over .viol .h{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--dim);margin-bottom:7px}
#over .viol ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;
  max-height:150px;overflow-y:auto}
#over .viol li{font-size:12.5px;color:var(--muted);padding-left:11px;border-left:2px solid var(--bad);line-height:1.45}
#over .viol li b{color:var(--text);font-weight:600}
#over .viol li em{font-style:normal;font-family:var(--mono);color:var(--muted)}
#over .viol li em.off{color:var(--dim)}
#over .viol li em.hit{color:var(--warn);font-weight:700}
#over .again{margin-top:20px;width:100%;border:0;border-radius:9px;padding:13px;background:var(--warn);
  color:#1A1200;font-weight:700;font-size:15px;cursor:pointer;font-family:var(--display)}

/* ---------- 배경 장면 ---------- */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#scene svg{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .9s ease}
#scene svg.on{opacity:.5}
#app{position:relative;z-index:1}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- 카드 그림 ---------- */
#card .art{height:132px;margin:-20px -20px 14px;border-bottom:1px solid var(--line-soft);
  background:linear-gradient(180deg,#0D1420 0%,#131D2C 100%);border-radius:15px 15px 0 0;overflow:hidden;position:relative}
#card .art svg{display:block;width:100%;height:100%}
#card .art .cap{position:absolute;left:12px;bottom:8px;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;color:var(--dim)}
#card.hit .art{background:linear-gradient(180deg,#201214 0%,#1A1620 100%)}
/* 그림이 바뀔 때 치수선을 그어 보인다. 카드마다 innerHTML 을 갈아 끼우니
   애니메이션은 저절로 처음부터 다시 돈다. */
/* 정지 상태(dashoffset 0 · opacity 1)가 이미 맞는 그림이다. 애니메이션은
   그 상태에서 시작점만 되감아 준다 — 애니메이션이 빠져도 그림은 온전하다. */
@keyframes dimDraw{from{stroke-dashoffset:var(--dl)}}
@keyframes dimIn{from{opacity:0}}
@keyframes sparkPulse{0%,100%{opacity:1}50%{opacity:.35}}
#cArt .dl{animation:dimDraw .52s .14s cubic-bezier(.25,.9,.35,1) backwards}
#cArt .dk{animation:dimIn .18s .08s backwards}
#cArt .dt{animation:dimIn .3s .5s backwards}
#cArt .spk{animation:sparkPulse 1.6s .6s ease-in-out infinite}
@keyframes artIn{from{opacity:0;transform:translateY(5px)}}
#cArt svg{animation:artIn .34s cubic-bezier(.2,.85,.3,1) backwards}
@media (prefers-reduced-motion:reduce){
  #cArt .dl,#cArt .dk,#cArt .dt,#cArt .spk,#cArt svg{animation:none}}

/* ---------- 현상 보고 ---------- */
#card.rep .say{min-height:0}
.rp{display:flex;flex-direction:column;gap:9px}
.rp .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding-bottom:8px;border-bottom:1px dashed var(--line-soft);font-size:13.5px}
.rp .row .k{color:var(--muted)}
.rp .row .v{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.rp .row .v .up{color:var(--ok)} .rp .row .v .dn{color:var(--bad)} .rp .row .v .z{color:var(--dim)}
.rp .risk{margin-top:2px}
.rp .risk .h{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--bad);margin-bottom:6px}
.rp .risk ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.rp .risk li{font-size:12.5px;color:var(--muted);padding-left:10px;border-left:2px solid var(--bad);line-height:1.4}
.rp .risk li b{color:var(--text);font-weight:600}
.rp .clean{font-size:13px;color:var(--ok);padding-left:10px;border-left:2px solid var(--ok)}

@media (max-width:420px){
  #card .say{font-size:15.5px}
  #card{padding:17px 17px 19px}
  #card .art{height:112px;margin:-17px -17px 12px}
  .g .lb{font-size:10.5px}
}
/* ---------- 사이트 상단 바 (학습실 공통) ---------- */
#top{position:fixed;left:0;right:0;top:0;z-index:25;display:flex;align-items:center;gap:10px;
  padding:8px 14px;background:rgba(15,22,34,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
#top .crumb{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:-.01em;
  display:flex;gap:7px;align-items:center;white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
#top .crumb a{color:var(--muted);text-decoration:none} #top .crumb a:hover{color:var(--text)}
#top .crumb .sep{color:var(--dim);font-weight:400}
#top .sp{flex:1}
#top .b{font:inherit;font-size:13px;padding:5px 11px;border-radius:6px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
#top .b:hover{border-color:var(--warn)}
#top .b{white-space:nowrap}          /* 쪼개지면 바가 세 줄이 되고 게이지가 그 뒤로 숨는다 */
@media (max-width:430px){
  #top{padding:7px 10px;gap:8px}
  #top .b{font-size:12px;padding:5px 8px}
  #top .crumb{font-size:14px}
}
#app{padding-top:56px;height:100%}
@supports (height:100dvh){ #app{height:100dvh} }
@media (max-width:420px){#top .crumb .m-hide{display:none}}
@media (max-width:430px){#top .crumb .m-hide,#top .crumb .s-hide,#top .crumb .sep{display:none}}

/* ---------- 화면이 낮을 때 (SE 1세대 같은 568px 급) ----------
   순서가 중요하다. 위의 max-width 블록들보다 뒤에 있어야 이긴다.
   줄일 수 있는 것은 그림과 계기판뿐이므로 그 둘부터 줄인다. */
@media (max-height:700px){
  #app{gap:10px;padding-top:52px}

  .g .lb{font-size:10px} .g .track{height:6px}

}

}

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };

  /* ===== 장면 그림 =====
     320×132 판 위에 규정이 걸린 자리를 그리고, 노란 치수선에 그 규정의 수치를 적는다. */
  var ST = '#5A6B87', DM = '#33425C', HI = '#E3B54D', BD = '#F07056', SK = '#F1C9A5';
  /* DM 은 흐린 선을 위한 색이라 글자로 쓰면 대비가 1.71:1 밖에 안 나온다.
     글자에는 같은 계열의 밝은 단계를 따로 둔다 — 5.06:1. */
  var TC = '#7A8CA8';

  /* 발밑 그림자 — 이것 하나로 사람이 바닥에 붙는다. 없으면 다 떠 보인다. */
  var SH = '<ellipse cx="0" cy="1" rx="7.5" ry="2.1" fill="rgba(4,8,14,.55)"/>';
  var SHW = '<ellipse cx="9" cy="1" rx="13" ry="2.4" fill="rgba(4,8,14,.55)"/>';

  function W(x, y, s, c){            // 안전모 쓴 근로자
    s = s || 1; c = c || '#8FB3E6';
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' + SH +
      '<path d="M-4.6-23a4.6 4.4 0 0 1 9.2 0z" fill="' + HI + '"/>' +
      '<path d="M-5.8-23h11.6" stroke="' + HI + '" stroke-width="1.6" stroke-linecap="round"/>' +
      '<circle cx="0" cy="-18" r="3" fill="' + SK + '"/>' +
      '<path d="M0-14v9M0-11l-5.5 4M0-11l5.5 4M0-5l-4.5 6M0-5l4.5 6" stroke="' + c +
      '" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>';
  }
  /* 자세 — 서 있는 것 말고도 필요하다.
     lift 드는 사람 · bend 굽힌 사람 · sit 주저앉은 사람 · down 쓰러진 사람 ·
     reach 손을 뻗은 사람. 안전모와 머리는 W 와 같은 규격을 쓴다. */
  function HAT(y, c){
    return '<path d="M-4.6' + y + 'a4.6 4.4 0 0 1 9.2 0z" fill="' + (c || HI) + '"/>' +
      '<path d="M-5.8' + y + 'h11.6" stroke="' + (c || HI) + '" stroke-width="1.6" stroke-linecap="round"/>';
  }
  function P(x, y, s, pose, c){
    s = s || 1; c = c || '#8FB3E6';
    var body, head;
    if(pose === 'lift'){
      /* 무릎을 굽히고 등을 편 채 드는 자세 — 손은 무릎 높이에서 짐을 받친다 */
      body = '<path d="M0-17v9M0-15l-5.5 9M0-15l5.5 9M0-8l-5 4l-1.5 4M0-8l5 4l1.5 4" stroke="' + c + '"';
      head = '<circle cx="0" cy="-21" r="3" fill="' + SK + '"/>' + HAT('-26');
    } else if(pose === 'bend'){
      body = '<path d="M0-13l4 7M4-6l-5 3M4-6l5 2M4-6l-2 6M4-6l4 6" stroke="' + c + '"';
      head = '<circle cx="2" cy="-16" r="3" fill="' + SK + '"/>' +
             '<g transform="translate(2,3)">' + HAT('-22') + '</g>';
    } else if(pose === 'sit'){
      /* 바닥에 주저앉은 자세 — 엉덩이가 땅에 닿고 다리는 앞으로 */
      body = '<path d="M-2-13l2 13M0 0l10 0M0 0l-1-5M-1-11l-6 6M-1-11l6 4" stroke="' + c + '"';
      head = '<circle cx="-3" cy="-16" r="3" fill="' + SK + '"/>' +
             '<g transform="translate(-3,3)">' + HAT('-22') + '</g>';
    } else if(pose === 'down'){
      /* 쓰러진 자세 — 몸이 눕고 안전모는 머리에 붙어 있다 */
      body = '<path d="M0-1h17M4-1l-4-5M9-1l4-5M13-1l4 4" stroke="' + c + '"';
      head = '<circle cx="21" cy="-4" r="3" fill="' + SK + '"/>' +
             '<g transform="translate(24,-4) rotate(78)">' + HAT('-4') + '</g>';
    } else if(pose === 'reach'){
      body = '<path d="M0-14v9M0-11l-6-4M0-11l6 3M0-5l-4.5 6M0-5l4.5 6" stroke="' + c + '"';
      head = '<circle cx="0" cy="-18" r="3" fill="' + SK + '"/>' + HAT('-23');
    } else {
      body = '<path d="M0-14v9M0-11l-5.5 4M0-11l5.5 4M0-5l-4.5 6M0-5l4.5 6" stroke="' + c + '"';
      head = '<circle cx="0" cy="-18" r="3" fill="' + SK + '"/>' + HAT('-23');
    }
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
      (pose === 'down' ? SHW : SH) + head + body +
      ' stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>';
  }
  /* 치수선은 세 조각으로 나눠 낸다 — 보조선(dk)이 먼저 들어오고,
     재는 선(dl)이 그어지고, 숫자(dt)가 마지막에 앉는다. 카드가 무엇을
     재는지 눈이 순서대로 따라가게 하려는 것이다. 애니메이션은 CSS 쪽. */
  function DTX(x, y, t, anchor){
    return '<text class="dt" x="' + x + '" y="' + y + '" text-anchor="' + anchor +
      '" font-size="10.5" fill="' + HI + '" font-family="monospace">' + t + '</text>';
  }
  function DL(d, len){               // 재는 선 — 정지 상태가 이미 다 그어진 선이다
    return '<path class="dl" style="--dl:' + len + '" d="' + d + '" stroke="' + HI +
      '" stroke-width="1.1" fill="none" stroke-dasharray="' + len + '" stroke-dashoffset="0"/>';
  }
  function Dh(x1, x2, y, t){         // 가로 치수
    var len = Math.abs(x2 - x1);
    return '<path class="dk" d="M' + x1 + ' ' + (y-4) + 'v8M' + x2 + ' ' + (y-4) + 'v8" stroke="' + HI +
      '" stroke-width="1.1" fill="none"/>' +
      DL('M' + x1 + ' ' + y + 'H' + x2, len) + DTX((x1+x2)/2, y-8, t, 'middle');
  }
  function Dv(y1, y2, x, t, left){   // 세로 치수
    var len = Math.abs(y2 - y1);
    return '<path class="dk" d="M' + (x-4) + ' ' + y1 + 'h8M' + (x-4) + ' ' + y2 + 'h8" stroke="' + HI +
      '" stroke-width="1.1" fill="none"/>' +
      DL('M' + x + ' ' + y1 + 'V' + y2, len) + DTX(left ? x-7 : x+7, (y1+y2)/2+4, t, left ? 'end' : 'start');
  }
  function L(d, c, w, dash){         // 선
    return '<path d="' + d + '" stroke="' + (c||ST) + '" stroke-width="' + (w||1.4) + '" fill="none"' +
      (dash ? ' stroke-dasharray="' + dash + '"' : '') + ' stroke-linecap="round"/>';
  }
  function R(x, y, w, h, f, c){      // 사각
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + (f||'#1E293C') +
      '" stroke="' + (c||ST) + '" stroke-width="1.2"/>';
  }
  function TX(x, y, t, c, sz){
    return '<text x="' + x + '" y="' + y + '" font-size="' + (sz||10.5) + '" fill="' + (c||TC) +
      '" font-family="monospace">' + t + '</text>';
  }
  function C(cx, cy, r, f, c){       // 원
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + (f || 'none') +
      '" stroke="' + (c || ST) + '" stroke-width="1.3"/>';
  }
  function PG(pts, f, c){            // 다각형
    return '<polygon points="' + pts + '" fill="' + (f || 'none') + '" stroke="' + (c || ST) +
      '" stroke-width="1.3" stroke-linejoin="round"/>';
  }
  function ARR(x1, y1, x2, y2, c, w){   // 화살표
    var a = Math.atan2(y2 - y1, x2 - x1), h = 4.5;
    return L('M' + x1 + ' ' + y1 + 'L' + x2 + ' ' + y2, c || HI, w || 1.4) +
      L('M' + x2 + ' ' + y2 + 'L' + (x2 - h * Math.cos(a - 0.45)) + ' ' + (y2 - h * Math.sin(a - 0.45)) +
        'M' + x2 + ' ' + y2 + 'L' + (x2 - h * Math.cos(a + 0.45)) + ' ' + (y2 - h * Math.sin(a + 0.45)),
        c || HI, w || 1.4);
  }
  function ANG(cx, cy, r, a1, a2, t){   // 각도 호와 이름표
    var p = function(a){ return (cx + r * Math.cos(a * Math.PI / 180)) + ' ' +
                                (cy + r * Math.sin(a * Math.PI / 180)); };
    var mid = (a1 + a2) / 2;
    return '<path d="M' + p(a1) + 'A' + r + ' ' + r + ' 0 0 1 ' + p(a2) + '" stroke="' + HI +
      '" stroke-width="1.2" fill="none"/>' +
      TX(cx + (r + 7) * Math.cos(mid * Math.PI / 180) - 8,
         cy + (r + 7) * Math.sin(mid * Math.PI / 180) + 4, t, HI);
  }
  function WARN(x, y, s){            // 경고 삼각형
    s = s || 1;
    return '<g transform="translate(' + x + ',' + y + ') scale(' + s + ')">' +
      PG('0,-9 9,7 -9,7', 'none', BD) + L('M0-4v6', BD, 1.6) + C(0, 5, .7, BD, BD) + '</g>';
  }

  {s:'현장', w:'차동수 소장', law:'', t:'산업안전보건관리비를 다른 항목으로 돌려 쓰자고 합니다.', f:'',
   a:{l:'거절한다', d:[6,-3,-5,6], ok:1, o:'안전관리비는 목적이 정해진 돈입니다. 그대로 두었습니다.'},
   b:{l:'일부만 돌린다', d:[-9,5,9,-8], ok:0, o:'보호구 발주가 밀렸습니다. 장부에는 남아 있습니다.'}},

  {s:'현장', w:'한지우 대리', law:'', t:'오늘 처음 온 사람이 안전교육 없이 바로 투입됐습니다.', f:'',
   a:{l:'교육부터 시킨다', d:[8,-4,-3,5], ok:1, o:'현장의 위험은 지도에 없습니다. 두 시간을 들여 걸어 보였습니다.'},
   b:{l:'선배가 붙어 준다', d:[-10,5,3,-5], ok:0, o:'선배도 자기 일이 있습니다. 오후에는 혼자 있었습니다.'}},

  {s:'현장', w:'한지우 대리', law:'', t:'위험한 곳을 봤을 때 말할 데가 없다고 합니다.', f:'',
   a:{l:'신고 창구를 만든다', d:[7,-2,-3,6], ok:1, o:'첫 주에 열한 건이 올라왔습니다. 그중 셋은 몰랐던 것입니다.'},
   b:{l:'반장에게 말하면 된다', d:[-6,3,1,-4], ok:0, o:'반장에게 말하면 일이 늦어집니다. 그래서 아무도 말하지 않습니다.'}}
  ];

  /* ===== 상태 ===== */
  var st, curExtra = '', cardEl = $('card');

  /* ===== 이어하기 =====
     한 판이 60일이라 새로고침 한 번에 판이 날아가면 종료 화면까지 가는 사람이 없다.
     날이 넘어갈 때마다 저장하고, 끝나면 지운다. 놓친 조문은 판을 넘어 쌓아 둔다. */
  var RUN = 'reigns_run_v1', MISS = 'reigns_miss_v1', BRIEFED = 'reigns_briefed_v1';

  function save(){
    if(!st || st.dead) return;
    try{
      localStorage.setItem(RUN, JSON.stringify({
        v:2, g:st.g, day:st.day, tags:st.tags, seeds:st.seeds, viol:st.viol,
        money:st.money, illegal:st.illegal, hurt:st.hurt, near:st.near,
        rolls:st.rolls, pSum:st.pSum, pFat:st.pFat,
        forced:st.forced, hidden:st.hidden, stop:st.stop, log:st.log,
        chap:st.chap, subj:st.subj, amb:st.amb, ambNo:st.ambNo, busted:st.busted,
        okCount:st.okCount, lastReport:st.lastReport, snap:st.snap,
        pOk:st.pOk, pNo:st.pNo, reports:st.reports, cur:st.cur, nextReport:st.nextReport,
        recent:st.recent, lastSubj:st.lastSubj, runSubj:st.runSubj,
        deck:DECK.filter(function(c){ return c.used; }).map(function(c){ return c.k; }),
        flav:FLAVOR.map(function(c){ return c.used ? 1 : 0; })
      }));
    }catch(e){}
  }
  function wipe(){ try{ localStorage.removeItem(RUN); }catch(e){} }
  function loadRun(){
    try{
      var r = JSON.parse(localStorage.getItem(RUN) || 'null');
      return (r && r.v === 2 && r.day >= 1 && r.day <= 60 && r.g && r.g.length === 4 && r.cur) ? r : null;
    }catch(e){ return null; }
  }
  function noteMiss(list){          // 판을 넘어 쌓이는 「놓친 규정」
    try{
      var m = JSON.parse(localStorage.getItem(MISS) || '{}');
      list.forEach(function(v){ m[v.law] = (m[v.law] || 0) + 1; });
      localStorage.setItem(MISS, JSON.stringify(m));
      return Object.keys(m).length;
    }catch(e){ return 0; }
  }

  function reset(resume){
    locked = false;
    loadWeak();
    st = {g:[62,58,60,60], day:1, tags:{}, seeds:[], viol:[], okCount:0, cur:null, dead:false,
          lastReport:0, snap:[62,58,60,60], pOk:0, pNo:0, reports:0,
          recent:[], lastSubj:'', runSubj:0, nextReport:5,
          money:FUND0, illegal:0, hurt:0, near:0, fatal:'', spent:0, need:0,
          rolls:0, pSum:0, pFat:0, forced:0, hidden:0, stop:0, log:[],
          chap:0, subj:{}, amb:0, ambNo:0, busted:0, briefed:0};
    DECK.forEach(function(c){ c.used = false; });
    FLAVOR.forEach(function(c){ c.used = false; });
    CHAPTER_CARDS.forEach(function(c){ c.used = false; });
    AMBUSH.forEach(function(c){ c.used = false; });

    if(resume && !resume.g) resume = null;          // 이벤트 객체 등이 넘어온 경우
    if(resume){
      st.g = resume.g.slice(); st.day = resume.day; st.tags = resume.tags || {};
      st.seeds = resume.seeds || []; st.viol = resume.viol || []; st.okCount = resume.okCount || 0;
      st.lastReport = resume.lastReport || 0; st.snap = (resume.snap || resume.g).slice();
      st.pOk = resume.pOk || 0; st.pNo = resume.pNo || 0; st.reports = resume.reports || 0;
      st.nextReport = resume.nextReport || (st.day + 5);
      st.money = typeof resume.money === 'number' ? resume.money : FUND0;
      st.illegal = resume.illegal || 0; st.hurt = resume.hurt || 0; st.near = resume.near || 0;
      st.rolls = resume.rolls || 0; st.pSum = resume.pSum || 0; st.pFat = resume.pFat || 0;
      st.forced = resume.forced || 0; st.hidden = resume.hidden || 0; st.stop = resume.stop || 0;
      st.log = resume.log || []; st.chap = resume.chap || 0; st.subj = resume.subj || {};
      st.amb = resume.amb || 0; st.ambNo = resume.ambNo || 0; st.busted = resume.busted || 0;
      st.recent = resume.recent || []; st.lastSubj = resume.lastSubj || ''; st.runSubj = resume.runSubj || 0;
      var on = {}; (resume.deck || []).forEach(function(k){ on[k] = 1; });
      DECK.forEach(function(c){ c.used = !!on[c.k]; });
      (resume.flav || []).forEach(function(u, i){ if(FLAVOR[i]) FLAVOR[i].used = !!u; });
    } else wipe();

    $('over').classList.remove('on');
    renderHud(true);
    renderLog();
    if(resume) show(resume.cur); else next();
  }

  /* ===== 게이지 그리기 ===== */
  /* ===== 위험과 돈 =========================================================
     규정을 지키면 안전을 사지만 관리비가 나간다. 어기면 돈과 일정을 벌지만
     위험이 쌓인다. 쌓인 위험은 사라지지 않고 매일 굴려진다 — 화면에 떠 있는
     그 확률 그대로다. 어느 쪽도 공짜가 아니어야 줄타기가 된다. */

  var FUND0 = 3400;          // 착공 시 계상된 안전보건관리비 (만원)
  var FUND_IN = 370;         // 기성(본사 보고)마다 들어오는 돈
  var FIX_COST = 150;        // 위험 한 건을 실제로 시정하는 데 드는 돈
  /* 60일을 전부 규정대로 가면 약 9,900만원이 든다. 들어오는 돈은 3,800 + 12회 x 400
     = 8,600만원뿐이다. 15 % 가 모자라므로 다 지키려 들면 후반에 반드시 마른다.
     모자란 만큼은 위험이 작은 카드에서 덜어 내야 한다 — 그것이 이 판이 가르치는 일이다. */

  var K_ACC = 70;            // 재해 확률의 완만함. 클수록 천천히 오른다
  var K_TOX = 45;            // 중독은 건수가 적은 대신 가파르다
  var FAT_CAP = 0.35;        // 재해가 났을 때 사람이 죽는 비율의 천장
  var FAT_HI = 0.45;         // 안전손실 14 이상인 규정을 어겼을 때의 치명도
  var FAT_LO = 0.12;         // 그 밖

  // 중독·질식으로 가는 계열. 나머지는 재해로 간다.
  var TOXTAG = {confined:1, confined2:1, gasweld:1, staticflow:1, staticflow2:1,
                chemdist:1, exgap:1, exgap2:1, caisson:1, msds:1, permit:1,
                gasdig:1, airvol:1, alarmset:1, rescuedrill:1,
                co2ext:1, dustclean:1, ventspec:1};

  function mny(v){
    var t = String(Math.max(0, Math.round(v))), o = '', c = 0;
    for(var i = t.length - 1; i >= 0; i--){
      o = t.charAt(i) + o;
      if(++c % 3 === 0 && i > 0) o = ',' + o;
    }
    return o;
  }

  /* 그 카드를 규정대로 조치하는 데 드는 돈. 위반했을 때 안전이 크게 깎이는
     카드일수록 위험하고, 위험한 것을 막는 데는 돈이 더 든다. */
  function costOf(c){
    if(!c) return 0;
    if(typeof c.cost === 'number') return c.cost;      // 아차사고 카드는 원래 카드의 값을 쓴다
    if(!c.law || c.report || !c.b) return 0;
    return Math.round((60 + 12 * Math.abs(c.b.d[0])) / 10) * 10;
  }

  /* 미조치 위반이 만들어 내는 오늘 하루의 확률.
     a 재해 · t 중독/질식 · f 그중 사람이 죽는 경우(중대재해) */
  function riskNow(){
    var acc = 0, tox = 0, fat = 0;
    for(var i = 0; i < st.seeds.length; i++){
      var sd = st.seeds[i], w = sd.w || 2;
      if(sd.fam === 'tox') tox += w; else acc += w;
      fat += sd.fat || 0;
    }
    var pA = 1 - Math.exp(-acc / K_ACC);
    var pT = 1 - Math.exp(-tox / K_TOX);
    var any = pA + pT - pA * pT;
    var ratio = (acc + tox) > 0 ? Math.min(FAT_CAP, fat / (acc + tox)) : 0;
    return {a:pA, t:pT, f:any * ratio, any:any, ratio:ratio};
  }

  var RK = [{k:'a', n:'재해 발생', cap:0.45}, {k:'t', n:'중독·질식', cap:0.30},
            {k:'f', n:'중대재해', cap:0.22}];
  var BAND_G = ['·', '\u25B8', '\u25B2', '\u26A0'];
  var BAND_T = ['낮음', '주의', '높음', '심각'];

  function renderGear(init){
    if(init){
      $('gear').innerHTML =
        '<div class="fund"><span class="k">안전보건관리비</span>' +
        '<span class="v" id="fv">0<u>만원</u></span>' +
        '<span class="fdlt" id="fd"></span>' +
        '<span class="note" id="fn"></span></div>' +
        '<div class="mrow">' + RK.map(function(r, i){
          return '<div class="m b0" id="rk' + i + '">' +
            '<div class="lb"><span class="n">' + r.n + '</span>' +
            '<span class="p" id="rp' + i + '">0 %</span></div>' +
            '<div class="tk"><div class="fl" id="rf' + i + '"></div></div>' +
            '<div class="st"><b id="rg' + i + '">·</b> <span id="rs' + i + '">낮음</span></div>' +
          '</div>';
        }).join('') + '</div>';
    }
    var r = riskNow(), i;
    for(i = 0; i < RK.length; i++){
      var p = r[RK[i].k];
      var band = p < 0.03 ? 0 : (p < 0.10 ? 1 : (p < 0.20 ? 2 : 3));
      $('rp' + i).textContent = (p * 100).toFixed(p < 0.10 ? 1 : 0) + ' %';
      $('rf' + i).style.width = Math.min(100, p / RK[i].cap * 100) + '%';
      $('rk' + i).className = 'm b' + band;
      $('rg' + i).textContent = BAND_G[band];
      $('rs' + i).textContent = BAND_T[band];
    }
    $('fv').innerHTML = mny(st.money) + '<u>만원</u>';
    var need = costOf(st.cur);
    $('gear').className = st.money <= 0 ? 'out' : (st.money < 600 ? 'low' : '');
    $('fn').textContent = need > (st.money || 0)
      ? '오늘 조치에 ' + mny(need) + '만원이 듭니다 — 잔액으로는 모자랍니다'
      : (st.seeds.length
          ? '미조치 ' + st.seeds.length + '건. 본사 보고에서 한 건당 ' + FIX_COST + '만원으로 시정합니다'
          : '미조치 위험 없음. 기성마다 ' + mny(FUND_IN) + '만원이 들어옵니다');
  }

  /* 오늘 터질 위반 하나를 고른다. 위험이 크고 오래 묵은 것부터. */
  function pickSeed(){
    var best = 0, bw = -1;
    for(var i = 0; i < st.seeds.length; i++){
      var sd = st.seeds[i];
      var w = (sd.w || 2) * (1 + Math.min(6, st.day - sd.day) * 0.2) * (0.55 + Math.random() * 0.9);
      if(w > bw){ bw = w; best = i; }
    }
    return best;
  }

  function renderHud(init){
    if(init){
      $('hud').innerHTML = G.map(function(g, i){
        return '<div class="g" data-k="' + i + '">' +
          '<div class="lb"><span>' + g.n + '</span><b id="gv' + i + '">0</b></div>' +
          '<div class="track"><div class="fill" id="gf' + i + '"></div></div>' +
          '<span class="dlt" id="gd' + i + '"></span>' +
        '</div>';
      }).join('');
    }
    st.g.forEach(function(v, i){
      $('gf' + i).style.width = Math.max(0, Math.min(100, v)) + '%';
      var g = $('gf' + i).parentNode.parentNode;
      g.classList.toggle('low', v <= 22);
      $('gv' + i).textContent = (v <= 22 ? '⚠ ' : '') + Math.round(v);
    });
    $('mDay').innerHTML = st.day + '일차 <i>' + chapOf(st.day).name + '</i>';
    renderGear(init);
  }

  /* 무엇이 얼마나 변했는지는 고른 직후에 보여야 한다. 다음 카드가 오기 전에
     사라지면 아무것도 못 읽는다. 그래서 2.2초를 잡아 둔다. */
  function flashDelta(d, tw, spent){
    d.forEach(function(v, i){
      var e = $('gd' + i);
      if(!v){ e.className = 'dlt'; e.innerHTML = ''; return; }
      e.innerHTML = (v > 0 ? '+' : '') + v + (tw && tw.i === i ? '<em>×2</em>' : '');
      e.className = 'dlt on ' + (v > 0 ? 'up' : 'dn');
      setTimeout(function(){ e.className = 'dlt ' + (v > 0 ? 'up' : 'dn'); }, 2200);
    });
    var f = $('fd');
    if(f){
      if(!spent){ f.className = 'fdlt'; f.textContent = ''; }
      else {
        f.textContent = '−' + mny(spent) + '만';
        f.className = 'fdlt on';
        setTimeout(function(){ f.className = 'fdlt'; }, 2200);
      }
    }
  }

  /* ===== 그날의 변수 ======================================================
     현장은 계획대로만 굴러가지 않는다. 낮은 확률로 한 수치가 두 배로 움직인다.
     준수 쪽에서는 이미 오르던 것이 더 오르고, 위반 쪽에서는 이미 깎이던 것이
     더 깎인다 — 방향을 뒤집지는 않는다. 도박이 아니라 날씨 같은 것이어야 한다. */
  var TWIST_P = 0.12;
  var TWIST = [
    {ok:'옆 조에서도 같은 자리를 따라 고쳤습니다', no:'하필 그날 비가 내렸습니다'},
    {ok:'앞 공정이 하루 일찍 끝나 있었습니다',     no:'결국 뜯고 다시 했습니다'},
    {ok:'옆 현장에서 자재를 빌려 왔습니다',        no:'그 자리에서 과태료가 나왔습니다'},
    {ok:'최윤 감독관이 마침 그 자리에 있었습니다', no:'본사 안전감사와 겹쳤습니다'}
  ];
  function rollTwist(d, ok){
    if(Math.random() >= TWIST_P) return null;
    var cand = [], i;
    for(i = 0; i < 4; i++) if(ok ? d[i] > 0 : d[i] < 0) cand.push(i);
    if(!cand.length) return null;
    var k = cand[Math.floor(Math.random() * cand.length)];
    d[k] = d[k] * 2;
    return {i:k, t:(ok ? TWIST[k].ok : TWIST[k].no), g:G[k].n};
  }

  /* ===== 씨앗은 반드시 돌아온다 =====
     전용 사고 카드는 10장뿐이므로, 나머지 위반은 같은 장면 위에서
     불시점검이나 아차사고로 되돌려 준다. 넘긴 것은 하나도 그냥 사라지지 않는다. */
  /* ===== 놓친 규정은 다시 온다 =================================================
     noteMiss() 가 판을 넘어 「넘긴 조문」을 쌓아 두고 있었는데 세기만 하고 쓰지는
     않았다. 그 기록을 덱 뽑기에 먹인다. 지난 현장에서 놓친 조문일수록 자주 온다.
     덱이 65장이 된 뒤로 이게 없으면 약한 주제를 영영 안 만날 수도 있다. */
  var WEAK = {};
  function loadWeak(){
    try{
      var m = JSON.parse(localStorage.getItem(MISS) || '{}');
      WEAK = {};
      for(var k in m) if(m.hasOwnProperty(k)) WEAK[k] = m[k];
    }catch(e){ WEAK = {}; }
  }
  function weightOf(c){
    var w = WEAK[c.law] || 0;
    var base = 1 + Math.min(3, w) * 1.6;  // 세 번 이상 놓쳤으면 5.8배까지
    var ch = chapOf(st.day);
    var inPool = ch.pool === '*' || ch.pool.indexOf(c.k) >= 0;
    return base * subjWeight(c) * (inPool ? 1.35 : 1);
  }
  function pickWeighted(pool){
    var tot = 0, i;
    for(i = 0; i < pool.length; i++) tot += weightOf(pool[i]);
    var r = Math.random() * tot;
    for(i = 0; i < pool.length; i++){
      r -= weightOf(pool[i]);
      if(r <= 0) return pool[i];
    }
    return pool[pool.length - 1];
  }

  /* 그 카드가 물은 값만 뽑는다 — 기록에는 표 전체가 아니라 그 값이 남아야 한다 */
  function hitVals(c){
    var ems = [], out = [], i;
    String(c.f || '').replace(/<em>(.*?)<\/em>/g, function(_, v){ ems.push(v); return ''; });
    if(!ems.length) return '';
    var h = (c.hit && c.hit.length) ? c.hit : [0];
    for(i = 0; i < h.length; i++) if(ems[h[i]]) out.push(ems[h[i]]);
    return out.join(' · ');
  }

  var GSHORT = ['안전', '공정', '공사비', '감독'];

  function pushLog(c, ok, d, spent, twist){
    /* 규정 카드는 충족·미달로 세고, 보고와 현장 카드는 세지 않되 기록에는 남긴다 —
       그 둘도 게이지를 크게 흔들기 때문에 빠지면 기록이 앞뒤가 안 맞는다. */
    var kind = c.law ? 'law' : (c.report ? 'rep' : (c.amb ? 'amb' : 'site'));
    var name = c.law ? (c.f ? c.f.split(' · ')[0].replace(/<[^>]+>/g, '') : c.s)
             : (c.report ? '본사 보고' : (c.amb ? (c.t || '').split('.')[0] : (c.w || c.s)));
    st.log.push({d:st.day, ok:ok ? 1 : 0, k:kind, n:name,
                 v:(c.law ? hitVals(c) : ''), l:(c.law || ''),
                 g:(d || [0, 0, 0, 0]).slice(), m:(spent || 0),
                 tw:(twist ? twist.i : -1)});

  /* ===== 현상 보고 (5일마다) ===== */

  function buildReport(){
    var risks = st.seeds.map(function(s){ return {n:NM[s.tag] || s.tag, d:st.day - s.day}; });
    var diff = st.g.map(function(v, i){ return Math.round(v - st.snap[i]); });
    st.reports++;
    st.money += FUND_IN;          // 기성에 따라 안전보건관리비가 들어온다
    return {
      s:'보고', w:'한지우 대리', art:'report', law:'', f:'',
      t:'', report:{ok:st.pOk, no:st.pNo, diff:diff, risks:risks, day:st.day,
                    fund:FUND_IN, money:st.money},
      a:{l:'미조치 위험까지 그대로 올린다', d:[6,-3,-6,9], ok:1, fix:1,
         o:'숨기지 않은 보고서에는 조치 예산이 붙습니다.'},
      b:{l:'진행 위주로 정리해 올린다', d:[-5,8,5,-7], ok:0,
         o:'표는 깔끔해졌습니다. 현장에 남은 것은 그대로입니다.'}
    };
  }

  function reportHtml(r){
    var names = ['안전', '공정', '공사비', '감독'];
    var dl = r.diff.map(function(v, i){
      var c = v > 0 ? 'up' : (v < 0 ? 'dn' : 'z');
      return '<span class="' + c + '">' + names[i] + ' ' + (v > 0 ? '+' : '') + v + '</span>';
    }).join(' · ');
    var risk = r.risks.length
      ? '<div class="risk"><div class="h">미조치 위험 ' + r.risks.length + '건</div><ul>' +
        r.risks.slice(0, 4).map(function(x){ return '<li><b>' + x.n + '</b> · ' + x.d + '일째</li>'; }).join('') +
        (r.risks.length > 4 ? '<li>그 밖 ' + (r.risks.length - 4) + '건</li>' : '') + '</ul></div>'
      : '<div class="clean">미조치 위험 없음. 지난 닷새는 깨끗합니다.</div>';
    return '<div class="rp">' +
      '<div class="row"><span class="k">지난 닷새 판정</span><span class="v">충족 ' + r.ok + ' · 미달 ' + r.no + '</span></div>' +
      '<div class="row"><span class="k">기성 · 관리비</span><span class="v"><span class="up">+' +
        mny(r.fund) + '만</span> · 잔액 ' + mny(r.money) + '만원</span></div>' +
      '<div class="row"><span class="k">게이지 증감</span><span class="v">' + dl + '</span></div>' +
      risk + '</div>';
  }

  /* ===== 카드 뽑기 ===== */
  function next(){
    if(st.dead) return;
    if(st.day > 60){ finish(true); return; }

    var pick = null;
    var chap = chapOf(st.day);

    // 처음 여는 사람에게만 한 장. 게이지도 확률도 안 움직인다.
    if(st.day === 1 && !st.briefed){
      st.briefed = 1;
      try{ if(!localStorage.getItem(BRIEFED)){ localStorage.setItem(BRIEFED, '1'); pick = BRIEF; } }
      catch(e){}
    }

    // 국면이 바뀌는 날 첫 카드는 그 장을 여는 카드다
    if(chap.n !== st.chap){
      st.chap = chap.n;
      var cc = CHAPTER_CARDS.filter(function(c){ return c.chapter === chap.n; })[0];
      if(cc && !cc.used){ pick = cc; }
      if(st.day > 1) banner(chap);
    }

    // 닷새마다 본사 보고가 먼저 온다
    if(!pick && st.day >= st.nextReport && st.lastReport !== st.day){
      st.lastReport = st.day;
      st.nextReport = st.day + 4 + Math.floor(Math.random() * 3);   // 4~6일
      pick = buildReport();
    }

    // 예고 없이 들어오는 것 — 닷새 지나서부터, 하루 9 %
    if(!pick && st.day > 4 && Math.random() < 0.075){
      var amb = AMBUSH.filter(function(c){ return !c.used; });
      if(amb.length) pick = amb[Math.floor(Math.random() * amb.length)];
    }

    /* 오늘의 위험을 굴린다. 계기판에 떠 있던 그 확률 그대로다.
       터지면 그 위반은 소비되고, 그중 일부는 사람이 죽는 자리로 간다. */
    if(!pick && st.seeds.length){
      var rk = riskNow();
      st.rolls++; st.pSum += rk.any; st.pFat += rk.f;      // 얼마를 걸었는지 적어 둔다
      if(Math.random() < rk.any * chap.fo){
        var si = pickSeed(), seed = st.seeds[si];
        if(!seed.hits){
          /* 그 위반의 첫 발화 — 아차사고. 씨앗은 남고 확률도 그대로다. */
          seed.hits = 1;
          st.near++;
          pick = nearMiss(seed);
        }
        if(!pick){
          st.seeds.splice(si, 1);
          st.hurt++;
          if(Math.random() < rk.ratio){
            fx('fatal', 1200); shake();
            st.fatal = NM[seed.tag] || seed.tag;
            st.deadBy = 0;
            finish(false);
            return;
          }
          pick = FALLOUT.filter(function(c){ return c.req === seed.tag; })[0] || genericFallout(seed.tag);
        }
      }
    }
    if(!pick && Math.random() < 0.16){
      var fl = FLAVOR.filter(function(c){ return !c.used; });
      if(fl.length) pick = fl[Math.floor(Math.random() * fl.length)];
    }
    if(!pick){
      var pool = DECK.filter(function(c){ return !c.used; });
      if(!pool.length){
        DECK.forEach(function(c){ c.used = false; });
        pool = DECK.filter(function(c){ return st.recent.indexOf(c.k) < 0; });
        if(!pool.length) pool = DECK.slice();
      }
      // 최근에 나온 주제는 피한다
      var fresh = pool.filter(function(c){ return st.recent.indexOf(c.k) < 0; });
      if(fresh.length) pool = fresh;
      // 같은 과목이 세 번 연달아 오지 않게 한다
      if(st.runSubj >= 2){
        var other = pool.filter(function(c){ return c.s !== st.lastSubj; });
        if(other.length) pool = other;
      }
      pick = pickWeighted(pool);
    }
    pick.used = true;
    if(pick.k){
      st.recent.push(pick.k);
      if(st.recent.length > 7) st.recent.shift();
    }
    if(pick.s === st.lastSubj) st.runSubj++; else { st.lastSubj = pick.s; st.runSubj = 1; }
    if(pick.law) st.subj[pick.s] = (st.subj[pick.s] || 0) + 1;
    show(pick);
  }

  function fx(cls, ms){
    var e = $('flash');
    e.className = '';
    void e.offsetWidth;              // 애니메이션을 다시 태우려면 한 번 끊어야 한다
    e.className = cls;
    setTimeout(function(){ e.className = ''; }, ms || 1200);
  }
  function shake(){
    var e = $('app');
    e.classList.remove('shake');
    void e.offsetWidth;
    e.classList.add('shake');
    setTimeout(function(){ e.classList.remove('shake'); }, 500);
  }
  function banner(ch){
    var b = $('chapBanner');
    $('cbT').textContent = ch.n + '장 · ' + ch.name;
    $('cbS').textContent = ch.lead;
    b.className = '';
    void b.offsetWidth;
    b.className = 'on';
    setTimeout(function(){ b.className = ''; }, 2500);
  }

  function show(pick){
    st.cur = pick;
    locked = false;
    if(pick.s === '사고'){ fx('hit', 600); shake(); }
    else if(pick.s === '아차사고' || pick.amb){ fx('hit', 600); }

    $('cArt').innerHTML = artFor(pick);
    setScene(BGK[pick.s] || 'mgmt');

    $('cSubj').textContent = pick.report ? pick.report.day + '일차 현상 보고' : pick.s;
    $('cWho').textContent = pick.w;
    if(pick.report){
      $('cSay').innerHTML = reportHtml(pick.report);
      $('cTopic').textContent = '보고에 적힌 것만 조치 예산이 붙습니다. 적지 않은 위험은 현장에 그대로 남습니다.';
    } else {
      $('cSay').textContent = pick.t;
      $('cTopic').innerHTML = pick.law ? '<b>' + pick.law.split(' ')[0] + '</b> ' + pick.law.split(' ').slice(1).join(' ') : '법으로 정해진 사항이 아닙니다. 판단은 당신 몫입니다.';
      /* 어느 쪽이 준수인지는 말하지 않는다. 다만 오늘 조치할 돈이 없다는 것은 미리 알려 준다. */
      if(costOf(pick) > st.money){
        $('cTopic').innerHTML += ' <span class="lack">· 관리비 부족 — 오늘 조치하려면 공사비 전용(위법)</span>';
      }
      /* 왜 또 왔는지는 말해 준다. 어느 쪽이 준수인지는 여전히 말하지 않는다. */
      var wk = WEAK[pick.law] || 0;
      if(wk) $('cTopic').innerHTML += ' <span class="again">· 지난 현장에서 ' +
        (wk > 1 ? wk + '번 ' : '') + '놓친 조문입니다</span>';
    }
    // 준수 선택이 늘 왼쪽이면 카드를 안 읽고 게이지만 봐도 이긴다. 매번 섞는다.
    st.flip = Math.random() < 0.5;
    var LC = st.flip ? pick.b : pick.a, RC = st.flip ? pick.a : pick.b;
    $('chLt').textContent = LC.l;
    $('chRt').textContent = RC.l;
    $('pickL').textContent = LC.l;
    $('pickR').textContent = RC.l;
    // tools/harness.js 가 읽는 시험용 표시. 게임 진행에는 쓰이지 않는다.
    cardEl.dataset.ok = st.flip ? 'r' : 'l';                    // 준수가 선 쪽
    cardEl.dataset.sev = pick.b ? Math.abs(pick.b.d[0]) : 0;    // 어겼을 때의 위험도
    cardEl.dataset.cost = costOf(pick);                          // 지키는 데 드는 돈
    cardEl.dataset.fund = st.money;                              // 관리비 잔액
    cardEl.dataset.need = st.need;                               // 여기까지 필요했던 총액
    cardEl.dataset.ill = st.illegal;                             // 전용 횟수
    $('mSite').textContent = pick.s === '사고' ? '사고 대응' : pick.s;
    if(pick.s === '아차사고') $('mSite').textContent = '아차사고';
    if(pick.amb) $('mSite').textContent = '기습';

    say(st.day + '일차. ' + pick.w + '. ' + (pick.report ? '현상 보고입니다.' : pick.t) +
        ' 왼쪽 ' + pick.a.l + '. 오른쪽 ' + pick.b.l + '.');
    var extra = (pick.report ? ' rep' : '') +
                (pick.s === '사고' || pick.s === '아차사고' ? ' hit' : '') +
                (pick.amb ? ' amb' : '');
    curExtra = extra;
    cardEl.className = '';
    cardEl.style.transform = 'translateY(14px) scale(.97)';
    cardEl.style.opacity = '0';
    requestAnimationFrame(function(){
      cardEl.className = 'settle' + extra;
      cardEl.style.transform = '';
      cardEl.style.opacity = '1';
    });
  }

  /* ===== 선택 =====
     준수 카드는 시트 없이 넘어가므로, 시트의 존재만으로 막히던 재입력이
     이제는 막히지 않는다. 카드가 날아가는 동안은 잠근다. */
  var locked = false;
  function choose(side){
    var c = st.cur;
    if(!c || locked) return;
    var ch = side < 0 ? (st.flip ? c.b : c.a) : (st.flip ? c.a : c.b);
    locked = true;

    cardEl.className = 'fly' + curExtra;
    cardEl.style.transform = 'translateX(' + (side * 520) + 'px) rotate(' + (side * 22) + 'deg)';

    /* 규정대로 하려면 돈이 든다. 관리비가 마르면 공사비를 끌어다 쓸 수밖에 없고,
       그것은 목적 외 사용 — 위법이다. 감독기관이 가장 먼저 안다. */
    var d = ch.d.slice(), spent = 0, diverted = false;
    if(ch.ok && !c.report){
      spent = costOf(c);
      if(spent){
        st.need += spent;
        if(st.money >= spent){ st.money -= spent; st.spent += spent; }
        else {
          /* 목적 외 사용은 한 번이면 넘어가도 되풀이하면 적발된다.
             실제로도 시정명령과 과태료가 따라붙는 자리다. 그래서 값이 점점 커진다. */
          diverted = true; spent = st.money; st.spent += spent; st.money = 0; st.illegal++;
          d[3] -= 5 + Math.min(16, 3 * st.illegal); d[2] -= 3;
          st.busted = st.illegal >= 6;      // 여섯 번째부터는 적발이다
        }
      }
    }

    /* 본사 보고에서 사실대로 올리면 조치 예산이 붙는다.
       다만 돈이 없으면 정직해도 고치지 못한다. 그것이 이 판의 조임쇠다. */
    /* 기습 카드는 선택지에 값이 붙는다 — 조치에는 돈이 들고, 넘기면 위험이 심긴다. */
    if(ch.cost){
      var extra2 = Math.min(st.money, ch.cost);
      st.money -= extra2; st.spent += extra2; st.need += ch.cost; spent += extra2;
      if(extra2 < ch.cost){ d[3] -= 5; st.illegal++; diverted = true; }
    }
    if(ch.seed && SRC[ch.seed]){
      var sv = Math.abs(SRC[ch.seed].b.d[0]), sw = sv / 4;
      st.seeds.push({tag:ch.seed, day:st.day, w:sw,
                     fam:(TOXTAG[ch.seed] ? 'tox' : 'acc'),
                     fat:sw * (sv >= 14 ? FAT_HI : FAT_LO), hits:0});
      st.tags[ch.seed] = true;
    }

    if(ch.fixTag){
      for(var fi = 0; fi < st.seeds.length; fi++){
        if(st.seeds[fi].tag === ch.fixTag){ st.seeds.splice(fi, 1); break; }
      }
    }
    /* 아차사고를 보고도 넘겼다면 그 위험은 이제 「몰랐던 것」이 아니다.
       알고 방치한 것은 가중 사유다. 확률이 실제로 올라간다. */
    if(c.s === '아차사고' && !ch.ok){
      for(var ni = 0; ni < st.seeds.length; ni++){
        var sd = st.seeds[ni];
        if(sd.tag === c.art){ sd.w *= 1.45; sd.fat *= 1.45; break; }
      }
    }

    var fixed = 0;
    if(c.report && ch.fix){
      while(st.seeds.length && st.money >= FIX_COST && fixed < 3){
        st.money -= FIX_COST;
        st.seeds.splice(pickSeed(), 1);
        fixed++;
      }
    }

    /* 국면마다 걸리는 압력이 다르다. 착공기는 예산, 골조기는 공정,
       마감기는 안전, 준공기는 감독이 크게 움직인다. */
    var chap = chapOf(st.day), mi;
    for(mi = 0; mi < 4; mi++) if(chap.mul[mi] !== 1) d[mi] = Math.round(d[mi] * chap.mul[mi]);
    var twist = c.report ? null : rollTwist(d, ch.ok);
    if(twist) fx('tw', 500);
    d.forEach(function(v, i){ st.g[i] = Math.max(0, Math.min(100, st.g[i] + v)); });
    flashDelta(d, twist, spent);

    if(ch.ok) st.okCount++;
    /* 어긴 것은 위험 점수로 쌓인다. 그 카드에서 안전이 얼마나 깎이는지가 곧 위험도다.
       vdt 5 부터 confined 18 까지, 어느 규정이 얼마나 위험한지가 확률에 그대로 실린다. */
    if(ch.tag){
      var sev = Math.abs(ch.d[0]);
      st.tags[ch.tag] = true;
      var w = sev / 4;
      st.seeds.push({tag:ch.tag, day:st.day, w:w,
                     fam:(TOXTAG[ch.tag] ? 'tox' : 'acc'),
                     fat:w * (sev >= 14 ? FAT_HI : FAT_LO),
                     hits:(c.s === '사고' ? 1 : 0)});   // 사고를 겪고도 넘겼으면 경고는 이미 끝났다
    }
    if(!ch.ok && c.law){ st.viol.push({law:c.law, f:c.f, hit:c.hit, k:c.w}); }
    pushLog(c, ch.ok, d, spent, twist);
    /* 엔딩이 읽는 세 가지 — 사고 앞에서 강행했는가, 보고를 다듬었는가, 스스로 멈췄는가 */
    if(c.s === '사고' && !ch.ok) st.forced++;
    if(c.amb){ st.amb++; if(!ch.ok) st.ambNo++; }
    if(c.report && !ch.ok) st.hidden++;
    if(ch.stop) st.stop++;

    if(c.report){ st.pOk = 0; st.pNo = 0; st.snap = st.g.slice(); }
    else if(ch.ok) st.pOk++; else st.pNo++;

    renderHud();

    /* ===== 기준을 지켰으면 아무것도 띄우지 않는다 =====
       이 게임은 암기가 목적이지만, 매 카드마다 설명창이 뜨면 게임이 아니라
       문제집이 된다. 배우는 자리는 팝업이 아니라 선택의 결과여야 한다.
       그래서 시트는 틀렸을 때만 올린다. 다만 사고 카드와 본사 보고는
       드물고(판당 각 5회 안팎) 판을 가르는 자리라 그대로 둔다. */
    var quiet = ch.ok && !c.report && c.s !== '사고' && c.s !== '아차사고' && !diverted;
    if(quiet){
      say('기준 충족. ' + ch.o + (twist ? ' ' + twist.t : ''));
      hint(twist ? '⚡ ' + twist.t + ' — ' + twist.g + ' 변화가 두 배입니다' : ch.o, 2400);
      setTimeout(advance, 620);
      return;
    }

    $('sV').className = 'verdict ' + (ch.ok && !diverted ? 'ok' : 'no');
    $('sV').textContent = diverted ? '⚠ 공사비 전용 (목적 외 사용)'
      : (ch.ok ? '✓ ' : '✕ ') + (c.report ? (ch.ok ? '사실대로 보고' : '다듬어 보고')
      : (c.law ? (ch.ok ? '기준 충족' : '기준 미달') : (ch.ok ? '무리 없음' : '무리한 결정')));
    $('sTwist').textContent = twist ? '⚡ ' + twist.t + ' — ' + twist.g + ' 변화가 두 배' : '';
    $('sTwist').hidden = !twist;
    $('sDelta').innerHTML = ['안전', '공정', '공사비', '감독'].map(function(nm, i){
      var v = d[i];
      return '<span class="' + (v > 0 ? 'up' : (v < 0 ? 'dn' : 'z')) + '">' + nm + ' '
        + (v > 0 ? '+' : '') + v + (twist && twist.i === i ? ' ×2' : '') + '</span>';
    }).join('') + (spent ? '<span class="dn">관리비 −' + mny(spent) + '만</span>' : '');
    $('sOut').textContent = ch.o
      + (diverted ? ' 관리비가 비어 공사비를 끌어 썼습니다. 안전보건관리비는 목적이 정해진 돈입니다.' : '')
      + (fixed ? ' 조치 예산이 붙어 ' + fixed + '건을 그 자리에서 시정했습니다.' : '')
      + (c.report && ch.fix && !fixed && st.seeds.length
          ? ' 정직하게 올렸지만 시정할 돈이 없습니다. 위험은 그대로 남았습니다.' : '');
    $('sStd').innerHTML = markHit(c) || (c.report
      ? '보고는 <em>닷새</em>마다 옵니다. 올린 위험만 조치 예산이 붙고, 남긴 위험은 사고 카드로 돌아옵니다.'
      : '이 결정에 걸린 수치 기준은 없습니다. 남는 것은 사람과 일정입니다.');
    $('sLaw').textContent = c.law || '';
    $('sLaw').hidden = !c.law;
    $('sheet').classList.add('on');
    $('sheet').setAttribute('aria-hidden', 'false');
    say($('sV').textContent + '. ' + ch.o + ' 기준: ' + hitSay(c) + (c.law ? '. 근거 ' + c.law : ''));
    setTimeout(function(){ try{ $('sGo').focus(); }catch(e){} }, 60);

    var d = st.g.findIndex(function(v){ return v <= 0; });
    $('sGo').textContent = d >= 0 ? '결과를 본다' : '다음 날';
  }

  /* 시트를 닫고 하루를 넘긴다. 시트를 띄우지 않은 카드도 이리로 온다. */
  function advance(){
    $('sheet').classList.remove('on');
    $('sheet').setAttribute('aria-hidden', 'true');
    var d = st.g.findIndex(function(v){ return v <= 0; });
    if(d >= 0){ st.deadBy = d; finish(false); return; }
    if(st.busted){ st.deadBy = 3; finish(false); return; }
    st.day++;
    /* 하루가 넘어갈 때 그 장의 자연 증감과, 준공기의 누적 위반 감시가 걸린다 */
    var ch2 = chapOf(st.day), k;
    for(k = 0; k < 4; k++) if(ch2.drift[k]) st.g[k] = Math.max(0, Math.min(100, st.g[k] + ch2.drift[k]));
    if(ch2.audit && st.viol.length){
      st.g[3] = Math.max(0, st.g[3] - ch2.audit * st.viol.length);
    }
    renderHud();
    setTimeout(function(){ next(); save(); try{ $('card').focus(); }catch(e){} }, 180);
  }

  // 준수 카드는 시트를 건너뛰고 스스로 넘어가므로, 여기서 한 번 더 넘기면 하루가 사라진다.
  $('sGo').addEventListener('click', function(){
    if($('sheet').classList.contains('on')) advance();
  });

     같은 죽음이라도 무엇을 넘겨서 그렇게 됐는지가 다르다. 마지막 화면이
     그것을 짚어 주지 않으면 판이 끝나도 배운 것이 남지 않는다.

  function has(g, n){
    var c = 0, a = GRP[g];
    for(var i = 0; i < a.length; i++) if(st.tags[a[i]]) c++;
    return c >= (n || 1);
  }

  function ending(won){
    var g = st.g, V = st.viol.length, R = st.seeds.length, i;
    if(!won){
      if(st.day <= 14) return E.early;
      if(st.busted) return E.busted;
      if(g[3] <= 0 && st.ambNo >= 2) return E.ambush;
      if(st.fatal || g[0] <= 0){
        if(st.forced >= 1)  return E.songchi;
        if(has('buried', 1)) return E.buried;
        if(has('shock', 2))  return E.shock;
        return E.small;
      }
      if(g[1] <= 0) return E.replaced;
      if(g[2] <= 0) return E.ledger;
      if(g[3] <= 0) return st.hidden >= 2 ? E.hidden : E.stopOrder;
      return E.small;
    }
    var lo = g[0];
    for(i = 1; i < 4; i++) if(g[i] < lo) lo = g[i];
    if(V === 0 && R === 0 && st.forced === 0 && st.near === 0 && st.hurt === 0 &&
       st.money > 0 && lo >= 55) return E.master;
    if(V === 0 && R === 0 && st.forced === 0 && lo >= 50) return E.clean;
    if(st.illegal >= 5) return E.diverted;
    if(st.near >= 12) return E.warned;
    if(R >= 5) return E.handover;
    if(g[1] >= 85 && V >= 6) return E.onTime;
    if(g[0] <= 30 || (st.stop === 0 && has('mgmt', 3))) return E.worn;
    return E.record;
  }

  /* 미달 한 건(-25)이 충족 두 건 반(+25)을 지운다. 오래 버티는 것보다 제대로 아는 것이
     점수를 지배하게 만든 배치다. systems.md ⑤ 그대로. */
  function scoreOf(won){
    var g = st.g;
    return Math.round(
      10 * st.okCount - 25 * st.viol.length + 8 * Math.min(60, st.day) +
      2 * g[0] + (g[1] + g[2] + g[3]) / 3 - 15 * st.seeds.length + (won ? 400 : 0));
  }
  var RANKS = [[1200, 'S', '무재해 준공'], [900, 'A', '선임 안전관리자'],
               [550, 'B', '안전관리자'], [250, 'C', '안전관리 보조원'],
               [-1e9, 'D', '현장 부적격']];
  function rankOf(v){
    for(var i = 0; i < RANKS.length; i++) if(v >= RANKS[i][0]) return RANKS[i];
    return RANKS[RANKS.length - 1];
  }

  function finish(won){
    st.dead = true;
    var box = $('over');
    var end = ending(won);
    $('oTag').textContent = end.h;
    $('oTag').style.color = won ? 'var(--ok)' : 'var(--bad)';
    $('oTitle').textContent = end.t;
    $('oTitle').className = won ? 'win' : '';
    $('oDesc').textContent = end.d
      + (st.fatal ? ' 「' + st.fatal + '」을(를) 넘긴 자리였습니다 — 확률은 계기판에 떠 있었습니다.' : '');
    $('oLesson').textContent = end.l;
    $('oTally').textContent = '';      // 결산 숫자는 아래 줄에 따로 쌓는다
    wipe();
    $('oDays').textContent = st.day;
    $('oOk').textContent = st.okCount + ' / ' + st.viol.length;
    var sc = scoreOf(won), rk = rankOf(sc);
    $('oScore').textContent = sc;
    $('oRank').textContent = rk[1];
    $('oRank').title = rk[2];
    $('oRankName').textContent = rk[2];

    var seen = {}, list = [];
    st.viol.forEach(function(v){ if(!seen[v.law]){ seen[v.law] = 1; list.push(v); } });
    $('oList').innerHTML = list.length
      ? list.map(function(v){ return '<li><b>' + v.law + '</b><br>' + markHit(v) + '</li>'; }).join('')
      : '<li style="border-color:var(--ok)">넘긴 기준이 없습니다.</li>';

    $('oTally').textContent += '아차사고 ' + st.near + '건 · 재해 ' + st.hurt + '건'
      + (st.fatal ? ' · 중대재해 1건' : '') + ' · 관리비 잔액 ' + mny(st.money) + '만원'
      + (st.illegal ? ' · 공사비 전용 ' + st.illegal + '회(위법)' : '') + '.'
      + (st.near > st.hurt ? ' 아차사고가 재해보다 많았습니다 — 경고는 늘 먼저 옵니다.' : '');
    /* 확률을 감추지 않았으니 결과도 감추지 않는다. 기댓값과 실제를 나란히 둔다 —
       「운이 나빴다」와 「많이 걸었다」를 스스로 가릴 수 있어야 한다. */
    if(st.rolls){
      var avg = st.pSum / st.rolls, exp = st.pSum, act = st.near + st.hurt;
      $('oTally').textContent += ' 하루 평균 ' + (avg * 100).toFixed(1) + ' % 를 '
        + st.rolls + '번 걸었습니다 — 기댓값 ' + exp.toFixed(1) + '건, 실제 ' + act + '건'
        + (act > exp + 1.5 ? ' (운이 나빴습니다).'
           : (act < exp - 1.5 ? ' (운이 좋았습니다).' : '.'));
    }
    var total = noteMiss(list);
    if(total) $('oTally').textContent += ' 이 자리에서 넘긴 조문은 모두 ' + total + '개입니다.';
    loadWeak();          // 이번 판에서 놓친 것이 다음 판부터 자주 온다
    box.classList.add('on');
  }
  $('oAgain').addEventListener('click', function(){ reset(); });
  function toggleLog(open){
    var e = $('log');
    var on = open === undefined ? !e.classList.contains('on') : open;
    e.classList.toggle('on', on);
    e.setAttribute('aria-hidden', on ? 'false' : 'true');
  }
  $('bLog').addEventListener('click', function(){ toggleLog(); });
  $('logX').addEventListener('click', function(){ toggleLog(false); });
  $('bFresh').addEventListener('click', function(){ wipe(); reset(); hint('새 현장에 부임했습니다'); });

  var HINT0 = '카드를 좌우로 밀거나 방향키로 결정합니다';
  function hint(t, ms){
    var e = $('swipeHint');
    e.textContent = t;
    clearTimeout(hint.t);
    hint.t = setTimeout(function(){ e.textContent = HINT0; }, ms || 4200);
  }

  /* ===== 드래그 ===== */
  var dragging = false, x0 = 0, y0 = 0, dx = 0, dy = 0, axis = 0;
  cardEl.addEventListener('pointerdown', function(e){
    if(st.dead || $('sheet').classList.contains('on')) return;
    dragging = true; x0 = e.clientX; y0 = e.clientY; dx = 0; dy = 0; axis = 0;
    cardEl.className = 'drag' + curExtra;
    cardEl.setPointerCapture(e.pointerId);
  });
  cardEl.addEventListener('pointermove', function(e){
    if(!dragging) return;
    dx = e.clientX - x0; dy = e.clientY - y0;
    // 어느 축으로 미는지 한 번 정해지면 그 축을 지킨다
    if(!axis && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) axis = Math.abs(dx) > Math.abs(dy) * 1.2 ? 1 : -1;
    if(axis < 0){ dx = 0; return; }
    cardEl.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx * 0.05) + 'deg)';
    $('pickL').style.opacity = dx < -30 ? Math.min(1, (-dx - 30) / 50) : 0;
    $('pickR').style.opacity = dx > 30 ? Math.min(1, (dx - 30) / 50) : 0;
  });
  function release(){
    if(!dragging) return;
    dragging = false;
    $('pickL').style.opacity = 0; $('pickR').style.opacity = 0;
    if(Math.abs(dx) > 92){ choose(dx < 0 ? -1 : 1); }
    else { cardEl.className = 'settle' + curExtra; cardEl.style.transform = ''; }
  }
  cardEl.addEventListener('pointerup', release);
  cardEl.addEventListener('pointercancel', release);

  $('chL').addEventListener('click', function(){ if(!$('sheet').classList.contains('on')) choose(-1); });
  $('chR').addEventListener('click', function(){ if(!$('sheet').classList.contains('on')) choose(1); });
  addEventListener('keydown', function(e){
    if(st.dead) return;
    var open = $('sheet').classList.contains('on');
    if(e.key === 'ArrowLeft' && !open) choose(-1);
    else if(e.key === 'ArrowRight' && !open) choose(1);
    else if((e.key === 'Enter' || e.key === ' ') && open){ e.preventDefault(); $('sGo').click(); }
  });

  var bR = document.getElementById('bReset'); if(bR) bR.addEventListener('click', function(){ wipe(); reset(); });
  var saved = loadRun();
  try{
    reset(saved);
    if(saved) hint('이어서 ' + saved.day + '일차부터 — 처음부터 하려면 「새 현장」');
  }catch(e){ wipe(); reset(); }
})();
</script>
</body>
</html>
